  .pcard .pos, .pcard .mbar { font: 400 12.5px var(--ui); }
  .pcard .ph .wm, .pcard .prank { font-family: var(--head); font-weight: 900; font-style: normal; }
  .pcard .bbadge { border-radius: 0; font-family: var(--head); }
  .team-h h2 { font: 900 30px/1 var(--head); letter-spacing: -.5px; }
  .team-h .team-sub { font: 400 14px var(--book); letter-spacing: .5px; }
  .group-h { font: 400 14px var(--book); letter-spacing: 2.5px; color: var(--ink); border-top: 5px solid var(--rule); padding-top: 8px; margin: 22px 0 12px; }
  .tpick { border-radius: 0; font: 900 11px var(--head); }
  .tpick.on { box-shadow: inset 0 0 0 2px var(--red); }
  .phead, .xhead, .banner { border-radius: 0; box-shadow: none; }
  .phead h1, .xhead h1, .banner h1 { font: 900 50px/.95 var(--head); letter-spacing: -1px; font-style: normal; }
  .phead .stats, .xhead .stats { border-radius: 0; }
  .phead .stats b, .xhead .stats b, .stat b, .phead .big { font-family: var(--head); font-weight: 900; }
  .phead .stats span, .xhead .stats span, .stat span { font: 400 11px var(--book); letter-spacing: 1.2px; }
  .phead .info { font: 400 15px var(--book); letter-spacing: .3px; }
  .mention .ttl { font: 900 19px/1.1 var(--head); letter-spacing: -.3px; }
  .mention img { border-radius: 0; }
  .mention .ctx { border-radius: 0; background: #fbf3f3; font: 400 14.5px/1.5 var(--body); }
  .mention .snip { border-radius: 0; font: italic 400 14px/1.5 var(--body); background: var(--gray-lt); }
  .count-badge { border-radius: 0; font-family: var(--head); }
  mark { background: var(--yellow); border-radius: 0; }
  .xsay .who { font: 900 14px var(--head); }
  .xsay p { font: 400 16px/1.5 var(--body); }
  .xsay blockquote { font: 400 21px/1.25 var(--book); }
  .xsay .src { font: 400 12px var(--ui); letter-spacing: .3px; }
  .xsay .verdict, .segment .verdict { border-radius: 0; background: var(--gray-lt); }
  .bnums > div { border-radius: 0; background: var(--gray-lt); }
  .bnums b { font-family: var(--head); font-weight: 900; }
  .bnums span, .branks { font-family: var(--book); }

  /* Experts */
  .xhero { border-radius: 0; background: var(--red); padding: 18px 24px 0; }
  .xhero h1 { font: 400 clamp(64px, 11vw, 132px)/.86 var(--book); font-style: normal; letter-spacing: -2px; }
  .xhero p { color: rgba(255,255,255,.92); font: 400 16px var(--body); }
  .xhero .kicker { color: #fff !important; }
  .xhero-faces { padding-bottom: 14px; }
  .xhero-faces .face { box-shadow: 0 0 0 3px var(--red); }
  .xhero::after { content: ''; display: block; height: 26px; margin: 0 -24px; background: repeating-linear-gradient(135deg, #fff 0 2px, transparent 2px 9px); opacity: .9; }
  .xhead { background: var(--gray-box); }
  .xcard { border-radius: 0; box-shadow: none; border-top: 3px solid var(--rule); }
  .xcard::after { display: none; }
  .xcard:hover { transform: none; box-shadow: none; }
  .xcard:hover .xname { color: var(--red); }
  .xname { font: 900 25px/1 var(--head); letter-spacing: -.4px; }
  .xshow { border-radius: 0; font: 400 12px var(--ui); letter-spacing: .3px; }
  .xstats { font: 400 13px var(--ui); }
  .xstats b { font-family: var(--head); font-weight: 900; }
  .xbubble { border-radius: 0; background: var(--gray-box); }
  .xbubble p { font: 400 16px/1.4 var(--body); }
  .xbubble.empty { background: var(--gray-lt); }
  .xmini a { font: 900 16px var(--head); }

  /* ─── Page d'un épisode / article ─── */
  .story { padding: 26px 34px 34px; border-top: 3px solid var(--rule); }
  .story > .kicker { font: 400 30px/1 var(--book); letter-spacing: -.2px; text-transform: uppercase; color: var(--red) !important; }
  .story h1 { font: 900 clamp(36px, 5vw, 64px)/.98 var(--head); letter-spacing: -1.4px; margin: 8px 0 12px; }
  .story .dek { font: 400 21px/1.35 var(--book); color: var(--ink-2); }
  .byline { font: 400 13px var(--ui); letter-spacing: .3px; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--line); }
  .tone { border-radius: 0; font-family: var(--head); background: var(--yellow); color: var(--ink); }
  .player-embed { border-radius: 0; }
  .player-embed .play span { border-radius: 0; background: var(--red); }
  .player-embed .read { border-radius: 0; font-family: var(--head); }
  .story p { font: 400 17px/1.62 var(--body); text-align: justify; hyphens: auto; }
  .story .dek { font-weight: 400; }
  .story .player-embed + p { font-weight: 700; }
  .story h2 { font: 900 26px/1 var(--head); letter-spacing: -.3px; margin: 34px 0 12px; padding-top: 10px; border-top: 5px solid var(--rule); }
  .segment { border-left: 0; padding: 0; margin: 0 0 20px; }
  .segment h3 { font: 400 13.5px/1.2 var(--book); text-transform: uppercase; letter-spacing: 3px; background: var(--gray-lt); padding: 6px 10px 5px; margin: 0 0 10px; border-top: 3px solid var(--rule); }
  .segment h3 .segnum { width: auto; height: auto; border-radius: 0; background: transparent; color: var(--red); font: 900 14px var(--head); margin-right: 8px; letter-spacing: 0; }
  .segment p { font: 400 16px/1.58 var(--body); }
  .keypoints li { font: 400 16px/1.5 var(--body); border-top: 1px solid var(--line); }
  .keypoints li::before { border-radius: 0; background: var(--red); font-family: var(--head); }
  .pull { border-radius: 0; background: var(--gray-box); font: 400 26px/1.2 var(--book); }
  .pull::before { color: var(--yellow); font-family: var(--head); }
  .pull cite { font: 900 13px var(--head); letter-spacing: .5px; text-transform: uppercase; color: var(--yellow); opacity: 1; }
  .opinions li { font: 400 16px/1.5 var(--body); border-top: 1px solid var(--line); }
  .opinions li b { font: 900 13px var(--head); }
  .quote { border-radius: 0; background: var(--yellow); border-left: 0; border-top: 3px solid var(--rule); }
  .quote blockquote { font: 400 20px/1.25 var(--book); }
  .quote figcaption { font: italic 400 13px var(--body); color: var(--ink-2); }
  .lexique dt { font: 900 19px/1.15 var(--head); color: var(--red); }
  .lexique dd { font: 400 15px/1.5 var(--body); }
  .plist .who { font: 900 15px var(--head); }
  .plist .who::before { content: '› '; color: var(--red); }
  .plist .ctx { font: 400 14px/1.45 var(--body); }
  .chip { border-radius: 0; font: 900 13px var(--head); }
  .plink { border-bottom: 1px solid rgba(227,22,30,.45); }
  .expr .ex { font: 400 30px/1.05 var(--book); color: var(--red); text-transform: uppercase; }
  .banner::after { display: none; }
  .banner { padding: 22px 26px 0; }
  .banner::before { content: ''; order: 9; }
  .banner .hatch { display: block; height: 22px; margin: 16px -26px 0; background: repeating-linear-gradient(135deg, rgba(255,255,255,.9) 0 2px, transparent 2px 9px); }

  @media (max-width: 1100px) {
    .sband { grid-template-columns: minmax(0,1fr); }
    .standings { margin-top: 14px; }
    .boxrow { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
  @media (max-width: 820px) {
    .dateline { display: none; }
    .sband-teasers, .lead2, .lp-cols { grid-template-columns: minmax(0,1fr); }
    .lp-text { column-count: 1; }
    .story2 { grid-template-columns: minmax(0,1fr); }
    .boxrow { grid-template-columns: minmax(0,1fr); }
    .lp-story { padding: 16px; }
    .crystal-title, .crystal-title i { font-size: 38px; }
    .story { padding: 18px; }
    .story p, .lp-text p { text-align: left; }
  }

  /* ═════════════════════ V2 : plus de couleur, texte plus noir, page d'épisode façon « LE CANADIEN » ═════════════════════ */
  :root { --ink-2: #161616; --blue: #1b75bc; --gold: #fdb913; --tan: #f5e6a6; --gray-mid: #6d6e71; --gray-dk: #58595b; --gray-pale: #dcdcdd; }
  body { color: var(--text); -webkit-font-smoothing: auto; }
  .sband-red, .gbox, .teaser, .take-id, .ep-band, .ep-box, .ep-pull, .ep-web, .xhero, .phead, .xhead, .banner, .btn, .nav, .standings-h { -webkit-font-smoothing: antialiased; }
  p, li, dd, .ctx, .snip { color: inherit; }
  .muted { color: var(--muted); }
  /* Encadrés de la une aux couleurs du journal */
  .gbox { background: var(--gray-mid); }
  .gbox.lt, .gbox.num { background: var(--gray-pale); color: var(--text); }
  .gbox.num .g-num { color: var(--red); font-size: 76px; }
  .gbox .g-sub { color: var(--gold); }
  .gbox:last-child { background: var(--gray-dk); }
  .plist .who::before, .xsay .who::before { color: var(--blue); }
  .plink { border-bottom-color: rgba(27,117,188,.55); }
  .plink:hover { color: var(--blue); }
  .src:hover, .headlines a:hover .ht { color: var(--blue); }
  .kicker.blue, .story2 .kicker { color: var(--blue); }

  /* Apparition au défilement */
  .rv { opacity: 0; transform: translateY(26px); transition: opacity .7s cubic-bezier(.2,.7,.2,1), transform .7s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * 70ms); }
  .rv.l { transform: translateX(-34px); }
  .rv.z { transform: scale(.94); }
  .rv.in { opacity: 1; transform: none; }
  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }
  /* Barre de lecture */
  #readbar { position: fixed; left: 0; top: 0; height: 4px; width: 0; background: linear-gradient(90deg, var(--red), var(--gold)); z-index: 200; transition: width .1s linear; }
  body:not(.reading) #readbar { display: none; }

  /* ─── Page d'un épisode ─── */
  .ep-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font: 400 13px var(--book); letter-spacing: 3px; text-transform: uppercase; border-bottom: 1px solid var(--rule); padding: 0 0 4px; }
  .ep-top b { font: 900 13px var(--head); letter-spacing: 1px; }
  .ep-band { background: var(--c, var(--red)); color: #fff; margin: 6px 0 12px; padding: 4px 18px 0; text-align: right; position: relative; overflow: hidden; }
  .ep-band a { font: 400 clamp(34px, 5vw, 58px)/1.05 var(--book); text-transform: uppercase; letter-spacing: -.5px; display: inline-block; }
  .ep-band a:hover { text-decoration: underline; text-decoration-thickness: 2px; }
  .ep-band::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 38%; background: repeating-linear-gradient(135deg, rgba(255,255,255,.28) 0 2px, transparent 2px 10px); }
  .ep-boxes { display: grid; grid-template-columns: .9fr 1.1fr 1.1fr 1.3fr; gap: 8px; margin-bottom: 18px; }
  .ep-box { padding: 12px 16px 14px; min-width: 0; color: #fff; background: var(--gray-mid); }
  .ep-box.pale { background: var(--gray-pale); color: var(--text); }
  .ep-box.dk { background: var(--gray-dk); }
  .ep-box h4 { margin: 0; font: 900 21px/1 var(--head); text-transform: uppercase; letter-spacing: -.2px; }
  .ep-box .sub { font: 900 15px var(--head); color: var(--gold); text-transform: uppercase; margin: 5px 0 4px; }
  .ep-box .sub::before { content: '› '; }
  .ep-box p { margin: 0; font: 400 15px/1.35 var(--book); }
  .ep-box .by { display: block; text-align: right; font: 400 13px var(--book); margin-top: 6px; opacity: .9; }
  .ep-box .big { float: left; font: 900 96px/.78 var(--head); color: var(--red); letter-spacing: -4px; margin: 6px 14px 0 0; font-variant-numeric: tabular-nums; }
  .ep-box .score { display: grid; grid-template-columns: auto auto; justify-content: start; align-items: center; gap: 0 12px; margin-top: 8px; }
  .ep-box .score b { font: 900 44px/1 var(--head); text-align: right; }
  .ep-box .score span { font: 400 13px/1.1 var(--book); letter-spacing: 1px; text-transform: uppercase; }
  .ep-box .score hr { grid-column: 1 / -1; border: 0; border-top: 2px solid var(--text); margin: 4px 0; width: 100%; }

  .ep-grid { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 24px; align-items: start; }
  .ep-main { min-width: 0; }
  .ep-photo { margin: 0 0 6px; position: relative; display: block; background: #111; }
  .ep-photo img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; }
  .ep-photo .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .ep-photo .play span { width: 84px; height: 84px; background: var(--red); display: grid; place-items: center; transition: transform .2s; }
  .ep-photo:hover .play span { transform: scale(1.08); }
  .ep-photo .read { position: absolute; left: 0; bottom: 0; background: var(--red); color: #fff; font: 900 15px var(--head); padding: 10px 14px 9px; text-transform: uppercase; }
  .ep-cap { display: flex; flex-direction: column; margin-bottom: 14px; }
  .ep-cap small { align-self: flex-end; font: 400 11px var(--book); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
  .ep-cap b { font: 700 15px/1.35 var(--body); }
  .ep-h1 { font: 900 clamp(40px, 6vw, 84px)/.96 var(--head); letter-spacing: -2px; margin: 4px 0 14px; }
  .ep-byline { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; margin-bottom: 14px; font: 900 14px var(--head); text-transform: uppercase; letter-spacing: .6px; }
  .ep-byline .faces { margin-right: -4px; }
  .ep-byline .meta { font: 400 12.5px var(--book); letter-spacing: .5px; text-transform: none; color: var(--muted); }
  .ep-byline .tone { font-size: 11.5px; }
  .ep-cols { column-count: 3; column-gap: 22px; column-rule: 1px solid var(--line); margin-bottom: 8px; }
  .ep-cols p { margin: 0 0 12px; font: 400 16.5px/1.52 var(--body); text-align: justify; hyphens: auto; color: var(--text); }
  .ep-cols p:first-child { font-weight: 700; }
  .ep-cols .dl { font: 900 14px var(--head); color: var(--red); text-transform: uppercase; letter-spacing: .5px; }

  /* Titres de section de l'épisode */
  .ep-h2 { display: flex; align-items: baseline; gap: 12px; margin: 44px 0 16px; padding-top: 10px; border-top: 6px solid var(--rule); font: 900 34px/1 var(--head); text-transform: uppercase; letter-spacing: -.6px; }
  .ep-h2 i { font: 400 34px var(--book); font-style: normal; letter-spacing: -.3px; }
  .ep-h2 .n { margin-left: auto; font: 400 14px var(--book); letter-spacing: 2px; color: var(--muted); }
  .ep-h2.red { border-top-color: var(--red); } .ep-h2.red b { color: var(--red); font-weight: 900; }
  .ep-h2.blue { border-top-color: var(--blue); } .ep-h2.blue b { color: var(--blue); font-weight: 900; }
  .ep-h2.gold { border-top-color: var(--gold); }

  /* Points clés → « Les faits saillants » */
  .fs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; }
  .fs-item { display: grid; grid-template-columns: 58px minmax(0,1fr); gap: 12px; padding: 14px 0; border-top: 1px solid var(--line); align-items: start; }
  .fs-item .no { font: 900 50px/.85 var(--head); color: var(--red); letter-spacing: -2px; text-align: right; }
  .fs-item:nth-child(4n+2) .no, .fs-item:nth-child(4n+3) .no { color: var(--blue); }
  .fs-item p { margin: 0; font: 400 16.5px/1.45 var(--body); }

  /* Grande citation */
  .ep-pull { margin: 40px 0 8px; background: var(--red); color: #fff; padding: 30px 36px 26px 110px; position: relative; overflow: hidden; }
  .ep-pull::before { content: '«'; position: absolute; left: 22px; top: 6px; font: 900 130px/1 var(--head); color: var(--gold); }
  .ep-pull::after { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 22%; background: repeating-linear-gradient(135deg, rgba(255,255,255,.2) 0 2px, transparent 2px 10px); }
  .ep-pull blockquote { margin: 0; font: 400 clamp(26px, 3.4vw, 40px)/1.12 var(--book); position: relative; z-index: 1; }
  .ep-pull cite { display: block; margin-top: 12px; font: 900 15px var(--head); font-style: normal; text-transform: uppercase; letter-spacing: .6px; color: var(--gold); position: relative; z-index: 1; }

  /* Le déroulement : ligne du temps */
  .tl { position: relative; padding-left: 64px; }
  .tl::before { content: ''; position: absolute; left: 22px; top: 8px; bottom: 8px; width: 4px; background: linear-gradient(var(--red), var(--gold) 50%, var(--blue)); }
  .tl-item { position: relative; margin: 0 0 30px; }
  .tl-item .dot { position: absolute; left: -64px; top: -2px; width: 48px; height: 48px; background: var(--red); color: #fff; display: grid; place-items: center; font: 900 24px var(--head); box-shadow: 0 0 0 5px var(--bg); }
  .tl-item:nth-child(3n+2) .dot { background: var(--blue); }
  .tl-item:nth-child(3n) .dot { background: var(--block); }
  .tl-item .bar { background: var(--tan); font: 900 13.5px var(--head); letter-spacing: 3px; text-transform: uppercase; padding: 8px 12px 6px; margin-bottom: 4px; }
  .tl-item h3 { font: 900 30px/1.02 var(--head); letter-spacing: -.6px; margin: 10px 0 10px; }
  .tl-item p { margin: 0 0 12px; font: 400 17px/1.6 var(--body); max-width: 78ch; }
  .tl-item .verdict { display: grid; grid-template-columns: auto minmax(0,1fr); gap: 12px; align-items: start; background: var(--card); border-left: 6px solid var(--gold); padding: 12px 16px; font: 400 16px/1.45 var(--body); box-shadow: 0 1px 0 var(--line); }
  .tl-item .verdict b { font: 900 12px var(--head); letter-spacing: 1.5px; color: #fff; background: var(--block); padding: 5px 7px 4px; text-transform: uppercase; }
  .tl-item .who-was { font: 400 13px var(--book); letter-spacing: .5px; color: var(--muted); margin-bottom: 6px; }

  /* Opinions → portraits (noir et blanc → couleur) */
  .ops { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px 16px; }
  .op-card { background: var(--card); display: flex; flex-direction: column; border-top: 0; }
  .op-card .ph { height: 170px; display: flex; background: #e6e4df; overflow: hidden; }
  .op-card .ph .faces { width: 100%; display: flex; }
  .op-card .ph .face { flex: 1; width: auto; height: 170px; border-radius: 0; box-shadow: none; filter: grayscale(1); transition: filter .8s .3s, transform .6s; }
  .op-card .ph .face + .face { margin-left: 0; border-left: 2px solid #fff; }
  .op-card .ph .face b { font-size: 44px; }
  .op-card.in .ph .face { filter: none; }
  .op-card:hover .ph .face { transform: scale(1.04); }
  .op-card .nm { background: var(--red); color: #fff; font: 400 18px/1 var(--book); text-transform: uppercase; padding: 7px 12px 6px; letter-spacing: .3px; }
  .op-card:nth-child(3n+2) .nm { background: var(--blue); }
  .op-card:nth-child(3n) .nm { background: var(--block); }
  .op-card .nm a:hover { text-decoration: underline; }
  .op-card p { margin: 0; padding: 12px 14px 16px; font: 400 17px/1.45 var(--body); }

  /* Répliques → « Dans le vestiaire » */
  .vq { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 26px; }
  .vq-item { padding: 14px 0 16px; border-top: 1px solid var(--line); }
  .vq-item .who { font: 900 15px var(--head); text-transform: uppercase; color: var(--blue); letter-spacing: .3px; }
  .vq-item .who::before { content: '› '; }
  .vq-item .who span { font: 400 14px var(--book); color: var(--text); letter-spacing: 1px; }
  .vq-item blockquote { margin: 6px 0 6px; font: 400 23px/1.2 var(--book); }
  .vq-item .ctx { font: italic 400 14.5px/1.45 var(--body); color: var(--text-2); }
  .vq-item .tag { margin-left: 6px; }

  /* Lexique → « Les statistiques » */
  .stats-t { width: 100%; border-collapse: collapse; background: var(--card); }
  .stats-t caption { caption-side: top; text-align: left; background: var(--gray-dk); color: #fff; font: 400 24px/1 var(--book); text-transform: uppercase; padding: 9px 12px 7px; letter-spacing: .3px; }
  .stats-t caption b { font: 900 24px var(--head); }
  .stats-t th { font: 900 11.5px var(--head); letter-spacing: .8px; text-transform: uppercase; text-align: left; padding: 6px 12px; border-bottom: 2px solid var(--rule); }
  .stats-t td { padding: 9px 12px; border-bottom: 1px solid var(--row-line); vertical-align: top; font: 400 15.5px/1.45 var(--body); }
  .stats-t tr:nth-child(even) td { background: var(--row-alt); }
  .stats-t td.ex { font: 900 18px/1.15 var(--head); color: var(--red); width: 34%; }
  .stats-t td.num { text-align: right; font: 900 16px var(--head); font-variant-numeric: tabular-nums; }
  .stats-t td.nm { font: 900 14.5px var(--head); text-transform: uppercase; }
  .stats-t td.nm small { display: block; font: 400 12px var(--book); text-transform: none; color: var(--muted); }
  .stats-t tr.tot td { background: var(--tan) !important; font-family: var(--head); font-weight: 900; border-top: 2px solid var(--rule); }
  .stats-t .mbar { display: block; height: 4px; background: var(--line); margin-top: 5px; }
  .stats-t .mbar i { display: block; height: 100%; background: var(--red); width: 0; transition: width 1s .2s cubic-bezier(.2,.7,.2,1); }
  .stats-t.in .mbar i { width: var(--w); }

  /* Boîte bleue « Sur YouTube » */
  .ep-web { display: grid; grid-template-columns: 70px minmax(0,1fr); gap: 0; background: var(--blue); color: #fff; margin: 34px 0 0; }
  .ep-web .hd { grid-column: 1 / -1; background: #135f99; font: 400 22px var(--book); text-transform: uppercase; padding: 7px 14px 5px; letter-spacing: .3px; }
  .ep-web .ic { display: grid; place-items: center; font-size: 38px; padding: 10px 0; }
  .ep-web .bd { padding: 12px 16px 16px 4px; }
  .ep-web .bd b { display: block; font: 900 17px var(--head); text-transform: uppercase; }
  .ep-web .bd p { margin: 4px 0 10px; font: 400 15px var(--book); }
  .ep-web .btns { display: flex; gap: 8px; flex-wrap: wrap; }
  .ep-web .btn { background: var(--card); color: var(--blue); }
  .ep-web .btn:hover { background: var(--gold); color: var(--text); }
  .ep-web .btn.ghost { background: transparent; color: #fff; border-color: #fff; }

  /* Colonne de droite */
  .ep-aside > * + * { margin-top: 20px; }
  .side-h { font: 400 30px/1 var(--book); text-transform: uppercase; border-top: 3px solid var(--rule); border-bottom: 3px solid var(--rule); padding: 8px 0 5px; margin-bottom: 4px; letter-spacing: -.3px; }
  .side-h b { font: 900 30px var(--head); color: var(--red); }
  .vest-list { list-style: none; margin: 0; padding: 0; }
  .vest-list li { padding: 10px 0 12px; border-bottom: 1px solid var(--rule); }
  .vest-list .hd { font: 900 16px var(--head); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
  .vest-list .hd a { color: var(--blue); }
  .vest-list .hd a:hover { text-decoration: underline; }
  .vest-list .hd::before { content: '›'; color: var(--blue); font-size: 20px; line-height: 0; }
  .vest-list .hd span { font: 400 14px var(--book); letter-spacing: .8px; color: var(--text); }
  .vest-list .jersey { width: 30px; height: 30px; font-size: 12px; margin-left: auto; order: 3; }
  .vest-list p { margin: 4px 0 0; font: 400 15px/1.42 var(--book); color: var(--text); }
  .also { list-style: none; margin: 0; padding: 0; }
  .also li { border-bottom: 1px solid var(--line); }
  .also a { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 10px; padding: 10px 0; align-items: start; }
  .also img { width: 96px; aspect-ratio: 16/9; object-fit: cover; }
  .also b { font: 900 15px/1.1 var(--head); }
  .also a:hover b { color: var(--red); }
  .also small { display: block; font: 400 12px var(--book); color: var(--muted); margin-top: 3px; }
  .ep-note { margin-top: 18px; font: italic 400 14px var(--body); color: var(--muted); }

  @media (max-width: 1100px) {
    .ep-grid { grid-template-columns: minmax(0,1fr); }
    .ep-boxes { grid-template-columns: repeat(2, minmax(0,1fr)); }
    .ep-cols { column-count: 2; }
  }
  @media (max-width: 820px) {
    .ep-cols { column-count: 1; }
    .ep-cols p, .tl-item p { text-align: left; }
    .ep-boxes, .fs, .vq { grid-template-columns: minmax(0,1fr); }
    .ep-pull { padding: 70px 20px 22px; }
    .tl { padding-left: 50px; } .tl-item .dot { left: -50px; width: 38px; height: 38px; font-size: 19px; } .tl::before { left: 17px; }
    .ep-h2, .ep-h2 i { font-size: 26px; }
    .ep-top span:last-child { display: none; }
  }

  /* ═════════════════════ V3 : tracking Meridien, LaPresse Book pour certains textes, boule de cristal en couleur ═════════════════════ */
  /* Texte à lire en Meridien : tracking -10 (-0,01 em) */
  body, .ep-cols p, .lp-text p, .tl-item p, .story p, .segment p, .story2 p, .xsay p, .mention .ctx, .mention .snip,
  .blist .snip, .stats-t td, .vq-item .ctx, .teaser p, .opinions li, .keypoints li, .ep-cap b, .headlines a, .showlist a,
  .ep-note, .crystal-sub, .buzz-h .sub, .card-h small, .tl-item .verdict, .xhero p, .notice, .empty, .lp-photo figcaption { letter-spacing: -0.01em; }

  /* LaPresse Book : faits saillants, opinions sous l'expert, boule de cristal, vestiaire du CH */
  .fs-item .plink, .op-card .plink, .bubble .plink, .vcardp .plink { font-family: var(--head); font-weight: 900; }
  .fs-item p { font: 400 18px/1.38 var(--book); color: var(--text); letter-spacing: 0; }
  .op-card p { font: 400 18px/1.38 var(--book); color: var(--text); letter-spacing: 0; }
  .bubble p, .takes.one .bubble p { font: 400 18px/1.36 var(--book); color: var(--text); letter-spacing: 0; }
  .vcardp .ctx { font: 400 15.5px/1.4 var(--book); color: var(--text); letter-spacing: 0; }
  .vcardp .op { font: 400 14.5px/1.38 var(--book); color: var(--text); letter-spacing: 0; }
  .vest .vcardp:first-child .ctx { font-size: 17px; }

  /* Boule de cristal : en couleur (portraits en couleur, barres aux couleurs des émissions) */
  .crystal { border-top-color: var(--red); background: var(--card); }
  .crystal-title i { color: var(--red); }
  .cnav { background: var(--red); color: #fff; }
  .cnav:hover:not(:disabled) { background: var(--block); }
  .cnav:disabled { background: #f0c9cb; opacity: 1; }
  .crystal-count { color: var(--red); font-family: var(--head); font-weight: 900; }
  .take-who .faces { filter: none; background: color-mix(in srgb, var(--c) 22%, #fff); }
  .take-who .face.lg { background: color-mix(in srgb, var(--c) 30%, #fff); }
  .take-id { background: var(--c, var(--ink)); }
  .take .show { opacity: .95; }
  .take { border-bottom: 4px solid var(--c, var(--red)); }
  .bubble { border-bottom: 0; padding: 12px 4px 8px; }
  .take .src { padding: 0 4px 10px; color: var(--c, var(--muted)); filter: brightness(.75); }
  .take .src:hover { color: var(--red); filter: none; }
  .crystal-dots button { background: #f0c9cb; }

  /* Experts : plus de rectangle gris, style journal (barre « ANALYSE » + texte LaPresse) */
  .xbubble, .xbubble.empty { background: transparent; color: var(--text); padding: 0; margin-top: 2px; border-top: 1px solid var(--rule); }
  .xbubble::before, .xbubble.empty::before { display: none; }
  .xbubble::after { content: none; }
  .xbubble .lbl { color: var(--text); display: block; background: var(--tan); font: 900 11.5px var(--head); letter-spacing: 2.5px; text-transform: uppercase; padding: 6px 10px 5px; margin: 10px 0 8px; }
  .xbubble p { font: 400 18px/1.36 var(--book); color: var(--text); letter-spacing: 0; margin: 0 0 8px; }
  .xbubble span.when { display: block; font: 900 12px var(--head); letter-spacing: .4px; text-transform: uppercase; color: var(--blue); }
  .xbubble.empty p { font: italic 400 15px var(--body); color: var(--muted); margin-top: 10px; }
  .xcard { border-top: 4px solid var(--c, var(--rule)); }

  .standings-h { flex-wrap: wrap; row-gap: 2px; }
  .standings-h b { white-space: nowrap; }
  .standings-h small { flex-basis: 100%; }
  .bpanel .card-h { flex-wrap: wrap; row-gap: 8px; }
  .vcardp .op { background: transparent; border-top: 1px solid var(--rule); padding: 8px 0 0; }

  /* ═════════════════════ V4 ═════════════════════ */
  :root { --text: #0d0d0d; --text-2: #3a3a3a; --block: #141414; --row-alt: #fdf4cf; --row-line: #efe4b5; }
  /* Pages joueur : les pastilles ne chevauchent plus le texte */
  .xsay li { grid-template-columns: 64px minmax(0, 1fr); gap: 16px; }
  .xsay li > .faces { width: 64px; display: flex; }
  .xsay li > .faces .face.lg { width: 64px; height: 64px; }
  .xsay li > .faces .face + .face { display: none; }
  /* Ce qu'ils ont dit : cadrage des photos */
  .take-who .face img { object-position: 10% 50%; }
  /* Répliques (page d'épisode) */
  .vq-item .ctx { font: italic 400 17px/1.25 var(--body); color: var(--text-2); }
  .vq-item blockquote { margin: 6px 0 6px; font: 400 28px/1.2 var(--book); }
  /* Faits saillants : texte plus grand, chiffres alignés sur la 1re ligne */
  .fs-item { grid-template-columns: 64px minmax(0, 1fr); gap: 14px; align-items: baseline; padding: 16px 0 18px; }
  .fs-item .no { font: 900 58px/1 var(--head); letter-spacing: -2px; }
  .fs-item p { font: 400 22px/1.38 var(--book); color: var(--text); letter-spacing: 0; }

  /* Bouton de thème */
  .theme-btn { display: inline-flex; align-items: center; gap: 7px; margin-left: 10px; height: 36px; padding: 0 12px; border: 1.5px solid var(--rule); background: var(--card); color: var(--ink); font: 900 13px var(--head); text-transform: uppercase; letter-spacing: .4px; }
  .theme-btn:hover { background: var(--ink); color: var(--bg); }
  .theme-btn .sun { display: none; }
  :root[data-theme="dark"] .theme-btn .sun { display: block; }
  :root[data-theme="dark"] .theme-btn .moon { display: none; }

  /* ─── Thème sombre ─── */
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #121212; --card: #1c1c1c; --ink: #f1efea; --ink-2: #e6e4df; --text: #ebe8e2; --text-2: #c9c6bf; --muted: #a09d97;
    --line: #34332f; --rule: #e9e6e0; --block: #2e2e2e; --gray-lt: #292927; --gray-pale: #2a2a28; --gray-mid: #464749; --gray-dk: #37383a; --gray-box: #464749;
    --tan: #564818; --row-alt: #26231a; --row-line: #3a3524; --nav: #000;
  }
  :root[data-theme="dark"] body { background: var(--bg); color: var(--text); }
  :root[data-theme="dark"] img { opacity: .94; }
  :root[data-theme="dark"] .standings, :root[data-theme="dark"] .standings th, :root[data-theme="dark"] .standings td,
  :root[data-theme="dark"] .standings a, :root[data-theme="dark"] .standings .foot, :root[data-theme="dark"] .tone,
  :root[data-theme="dark"] .tag.art, :root[data-theme="dark"] .quote, :root[data-theme="dark"] mark { color: #141414; }
  :root[data-theme="dark"] .standings .seg { background: #fff; border-color: #141414; }
  :root[data-theme="dark"] .standings .seg button { color: #141414; }
  :root[data-theme="dark"] .standings .seg button.on { background: #141414; color: #fff; }
  :root[data-theme="dark"] .seg button.on { background: var(--ink); color: #141414; }
  :root[data-theme="dark"] .btn.ghost { background: transparent; color: var(--ink); border-color: var(--ink); }
  :root[data-theme="dark"] .mention .ctx { background: #2a1c1c; }
  :root[data-theme="dark"] .cnav:disabled, :root[data-theme="dark"] .crystal-dots button { background: #4a2a2c; }
  :root[data-theme="dark"] .tl-item .dot { box-shadow: 0 0 0 5px var(--bg); }
  :root[data-theme="dark"] .face { box-shadow: 0 0 0 2px var(--card), 0 3px 10px rgba(0,0,0,.4); }
  :root[data-theme="dark"] .plink { border-bottom-color: rgba(120,180,240,.6); }
  :root[data-theme="dark"] .vest-list .hd a, :root[data-theme="dark"] .vq-item .who, :root[data-theme="dark"] .xbubble span.when,
  :root[data-theme="dark"] .story2 .kicker, :root[data-theme="dark"] .kicker.blue, :root[data-theme="dark"] .ep-h2.blue b { color: #5aa7e6; }
  :root[data-theme="dark"] .search-results { background: var(--card); }
  :root[data-theme="dark"] .sr-item:hover, :root[data-theme="dark"] .score:hover, :root[data-theme="dark"] .showlist a:hover { background: #262624; }
  :root[data-theme="dark"] .pcard.other .ph { background: linear-gradient(160deg, #1f1f1f 0%, #2c2c2c 55%, #444 55.3%, #555 100%); }
  :root[data-theme="dark"] .lp-logo .url { color: #ff5a5f; }
  :root[data-theme="dark"] .tpick { background: var(--card); }
  :root[data-theme="dark"] .tlogo { background: #f3f1ec; border-radius: 50%; padding: 2px; }

  /* ═════════════════════ V5 : une plus dense, « Le tour des émissions », « Ce qu'ils ont dit » en chroniqueurs ═════════════════════ */
  /* Colonne gauche du bandeau : rouge + teasers + encadrés, étirés à la hauteur de l'encadré jaune */
  .sband > div:first-child { display: flex; flex-direction: column; gap: 8px; }
  .sband-teasers { margin-top: 0; flex: 1; gap: 8px; }
  .sband .boxrow { margin: 0; gap: 8px; }
  .teaser { background: var(--blue); min-height: 0; padding: 18px 22px 20px; }
  .teaser + .teaser { background: #3b3c3e; }
  .teaser .t-h { opacity: 1; font-size: 14px; }
  .teaser .t-y { color: #ffe28a; font-size: 30px; }
  .teaser p { color: #fff; font-size: 16px; }
  .teaser blockquote { font-size: 26px; }
  .gbox { padding: 14px 16px 16px; }
  .gbox p { font-size: 14.5px; }
  .gbox:not(.lt):not(.num) { background: #4b4c4e; }
  .gbox:last-child { background: #333436; }
  :root[data-theme="dark"] .teaser + .teaser { background: #2d2e30; }

  /* Le tour des émissions (inspiré de « LE TOUR DU GLOBE ») */
  .tour { margin: 6px 0 26px; border-bottom: 10px solid #b9b9b9; padding-bottom: 20px; }
  .tour-h { background: var(--red); color: #fff; font: 400 clamp(32px, 4vw, 50px)/1 var(--book); text-transform: uppercase; letter-spacing: -.5px; padding: 8px 14px 4px; border-bottom: 5px solid #b9b9b9; margin-bottom: 22px; }
  .tour-cols { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); }
  .tour-col { display: flex; flex-direction: column; padding: 0 16px; border-left: 1px solid var(--rule); min-width: 0; }
  .tour-col:first-child { border-left: 0; padding-left: 0; }
  .tour-col:last-child { padding-right: 0; }
  .tour-col img { width: 100%; aspect-ratio: 16/9.3; object-fit: cover; background: #222; }
  .tour-col small { align-self: flex-end; font: 400 12px var(--book); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); margin: 5px 0 8px; }
  .tour-col h3 { margin: 0 0 12px; font: 900 27px/1.02 var(--head); letter-spacing: -.6px; }
  .tour-col h3 span { color: var(--red); }
  .tour-col:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
  .tour-col p { margin: 0; font: 400 16.5px/1.38 var(--book); color: var(--text); letter-spacing: 0; }
  .tour-col p em { font-style: normal; color: var(--muted); }

  /* Ce qu'ils ont dit : colonnes de chroniqueurs */
  .crystal { padding: 26px 30px 26px; border-top: 6px solid var(--rule); }
  .crystal-h { padding: 0; margin-bottom: 20px; align-items: flex-end; }
  .crystal-title { color: var(--ink); font: 900 clamp(40px, 5vw, 60px)/.95 var(--head); letter-spacing: -1.4px; }
  .crystal-kick { font: 400 clamp(20px, 2.4vw, 28px)/1.1 var(--book); color: var(--red); text-transform: uppercase; margin-top: 6px; letter-spacing: -.2px; }
  .takes.cols { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; padding: 0; border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .col-op { position: relative; display: flex; flex-direction: column; padding: 18px 18px 0; min-height: 360px; border-left: 1px solid var(--rule); border-top: 1px solid var(--line); overflow: hidden; }
  .takes.cols .col-op:nth-child(4n+1) { border-left: 0; padding-left: 4px; }
  .takes.cols .col-op:nth-child(-n+4) { border-top: 0; }
  .co-name { font: 900 25px/1 var(--head); text-transform: uppercase; color: var(--red); letter-spacing: -.3px; }
  a.co-name:hover { text-decoration: underline; }
  .co-txt { margin: 8px 0 8px; font: 900 19px/1.14 var(--head); text-transform: uppercase; color: var(--ink); letter-spacing: -.2px; position: relative; z-index: 1; }
  .co-txt .plink { border-bottom: 0; color: var(--c); filter: brightness(.8); }
  .co-src { font: 400 16px/1.1 var(--book); text-transform: uppercase; color: var(--ink); position: relative; z-index: 1; }
  .co-src:hover { color: var(--red); }
  .co-face { margin-top: auto; align-self: flex-end; width: 150px; height: 150px; position: relative; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); }
  .co-face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 10% 50%; }
  .co-face b { font: 900 44px var(--head); color: var(--c); }
  .co-face img + b { display: none; }
  .takes.cols.flip .col-op { animation: takeIn .45s cubic-bezier(.2,.8,.2,1) both; }
  .takes.cols.flip .col-op:nth-child(2) { animation-delay: .04s; } .takes.cols.flip .col-op:nth-child(3) { animation-delay: .08s; } .takes.cols.flip .col-op:nth-child(4) { animation-delay: .12s; }

  @media (max-width: 1100px) { .tour-cols, .takes.cols { grid-template-columns: repeat(2, minmax(0,1fr)); } .takes.cols .col-op:nth-child(odd) { border-left: 0; } .takes.cols .col-op:nth-child(-n+4) { border-top: 1px solid var(--line); } .tour-col:nth-child(3) { border-left: 0; padding-left: 0; } .tour-col { margin-bottom: 20px; } }
  @media (max-width: 820px) { .tour-cols, .takes.cols { grid-template-columns: minmax(0,1fr); } .tour-col, .col-op { border-left: 0 !important; padding-left: 0 !important; } .crystal { padding: 18px 14px; } }
  .sband .gbox .g-h { font-size: 17px; }
  .sband .gbox .g-num { font-size: 56px; }

  /* ═════════════════════ V6 : textes complets, encadré jaune ajusté, « Ce qu'ils ont dit » retravaillé ═════════════════════ */
  .standings table tr[hidden] { display: none; }
  .standings .foot { margin-top: auto; }
  /* Rangées de même hauteur */
  .takes.cols { grid-auto-rows: 1fr; }
  .col-op { min-height: 440px; padding: 20px 20px 0; }
  .co-name { align-self: flex-start; background: color-mix(in srgb, var(--c) 86%, #000); color: #fff; font: 900 18px/1 var(--head); letter-spacing: 0; padding: 6px 9px 4px; }
  a.co-name:hover { text-decoration: none; background: var(--red); }
  .co-txt { margin: 12px 0 10px; font-size: 18px; line-height: 1.16; }
  .co-src { font-size: 15px; }
  /* Portraits PNG sans fond, plus grands (tête qui prend de la place) */
  .co-face { background: transparent; width: 78%; max-width: 250px; height: auto; aspect-ratio: 1 / 1.05; margin-right: -20px; overflow: hidden; }
  .co-face img { object-fit: cover; object-position: 10% 50%; transform: scale(1.18); transform-origin: 50% 100%; }
  .co-face b { font-size: 60px; }

  /* ═════════════════════ V7 : pages Experts au style du site ═════════════════════ */
  .cutout { position: relative; display: grid; place-items: center; overflow: hidden; }
  .cutout img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 10% 50%; }
  .cutout b { font: 900 38px var(--head); color: var(--c, var(--red)); }
  .cutout img + b { display: none; }
  /* Rangée de visages sous le bandeau */
  .xfaces { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; margin: -6px 0 6px; scrollbar-width: thin; }
  .xfaces a { flex: 0 0 auto; width: 86px; text-align: center; }
  .xfaces .cutout { width: 86px; height: 86px; border-bottom: 4px solid var(--c); background: var(--card); }
  .xfaces .cutout img { transform: scale(1.15); transform-origin: 50% 100%; }
  .xfaces span { display: block; font: 900 12.5px var(--head); text-transform: uppercase; margin-top: 4px; }
  .xfaces a:hover span { color: var(--red); }
  /* Grille des experts : colonnes de chroniqueurs */
  .xgrid2 { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); background: var(--card); border-top: 6px solid var(--rule); border-bottom: 1px solid var(--rule); padding: 0 24px; }
  .xcol { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 6px; padding: 20px 18px 0; border-left: 1px solid var(--rule); border-top: 1px solid var(--line); min-height: 400px; overflow: hidden; }
  .xgrid2 .xcol:nth-child(4n+1) { border-left: 0; padding-left: 0; }
  .xgrid2 .xcol:nth-child(-n+4) { border-top: 0; }
  .xc-name { background: color-mix(in srgb, var(--c) 86%, #000); color: #fff; font: 900 18px/1 var(--head); text-transform: uppercase; padding: 6px 9px 4px; }
  .xcol:hover .xc-name { background: var(--red); }
  .xc-role { font: 400 14px/1.2 var(--book); text-transform: uppercase; letter-spacing: 1px; color: var(--ink); }
  .xc-shows { display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .xc-shows i { font: 900 12px var(--head); font-style: normal; text-transform: uppercase; color: var(--ink); }
  .xc-shows i::before { content: ''; display: inline-block; width: 8px; height: 8px; background: var(--sc); margin-right: 5px; }
  .xc-stats { display: flex; gap: 14px; margin: 6px 0 2px; font: 400 12px var(--book); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }
  .xc-stats b { display: block; font: 900 30px/1 var(--head); color: var(--ink); letter-spacing: -.5px; }
  .xc-bar { align-self: stretch; background: var(--tan); color: var(--text); font: 900 11px var(--head); letter-spacing: 2px; text-transform: uppercase; padding: 6px 9px 5px; margin-top: 6px; }
  .xc-bar.mute { background: var(--gray-lt); color: var(--muted); }
  .xc-op { font: 400 18px/1.3 var(--book); color: var(--text); position: relative; z-index: 1; }
  .xc-face { margin-top: auto; align-self: flex-end; width: 72%; max-width: 230px; aspect-ratio: 1 / 1.05; margin-right: -18px; }
  .xc-face img { transform: scale(1.18); transform-origin: 50% 100%; }
  .xc-face b { font-size: 56px; }
  .xcol.quiet .xc-face { opacity: .55; }
  /* Fiche d'un expert */
  .xhead2 { position: relative; display: grid; grid-template-columns: 260px minmax(0,1fr); align-items: end; gap: 26px; background: var(--c); color: #fff; margin: 6px 0 12px; padding: 22px 28px 0; overflow: hidden; min-height: 250px; }
  .xhead2::before { content: ''; position: absolute; right: 0; top: 0; bottom: 0; width: 40%; background: repeating-linear-gradient(135deg, rgba(255,255,255,.22) 0 2px, transparent 2px 10px); }
  .xhead2::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 40%; background: linear-gradient(transparent, rgba(0,0,0,.28)); pointer-events: none; }
  .xh-face { width: 260px; height: 250px; align-self: end; z-index: 1; }
  .xh-face img { transform: scale(1.12); transform-origin: 50% 100%; }
  .xh-face b { color: #fff; font-size: 90px; }
  .xh-id { position: relative; z-index: 2; padding-bottom: 26px; }
  .xh-role { font: 400 16px var(--book); letter-spacing: 3px; text-transform: uppercase; }
  .xhead2 h1 { margin: 6px 0 12px; font: 900 clamp(44px, 6.5vw, 88px)/.92 var(--head); letter-spacing: -2px; text-transform: uppercase; }
  .xh-shows { display: flex; flex-wrap: wrap; gap: 8px; }
  .xh-shows a { background: #fff; color: #141414; font: 900 13px var(--head); text-transform: uppercase; padding: 6px 10px 5px; border-left: 6px solid var(--sc); }
  .xh-shows a:hover { background: var(--yellow); }
  .xops { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 26px; }
  .xop { border-top: 1px solid var(--rule); padding: 14px 0 18px; }
  .xop-bar { background: var(--tan); font: 900 11px var(--head); letter-spacing: 2px; text-transform: uppercase; padding: 6px 9px 5px; display: flex; justify-content: space-between; gap: 8px; color: var(--text); }
  .xop-bar span { color: color-mix(in srgb, var(--c) 80%, #000); }
  :root[data-theme="dark"] .xop-bar span { color: #fff; }
  .xop .bubble { padding: 10px 0 6px; }
  .xop-src { font: 900 12px var(--head); text-transform: uppercase; letter-spacing: .3px; color: var(--blue); }
  .xop-src:hover { color: var(--red); }
  .xlist { list-style: none; margin: 0; padding: 0; }
  .xlist li { border-bottom: 1px solid var(--line); }
  .xlist a { display: grid; grid-template-columns: 56px minmax(0,1fr); gap: 12px; align-items: center; padding: 8px 0; }
  .xlist .cutout.mini { width: 56px; height: 56px; border-bottom: 3px solid var(--c); }
  .xlist .cutout.mini img { transform: scale(1.15); transform-origin: 50% 100%; }
  .xlist .cutout.mini b { font-size: 18px; }
  .xlist b { font: 900 16px var(--head); display: block; }
  .xlist small { font: 400 12px var(--book); color: var(--muted); }
  .xlist a:hover b { color: var(--red); }
  /* Demandé : « Ses opinions » et répliques */
  .bubble p, .takes.one .bubble p { font: 400 20px/1.36 var(--book); color: var(--text); letter-spacing: 0; }
  .qcard figcaption { font: 400 16px var(--body); font-style: italic; }
  .qcard { background: var(--card); }
  .qcard .src { color: var(--blue); }
  @media (max-width: 1100px) { .xgrid2 { grid-template-columns: repeat(2, minmax(0,1fr)); } .xgrid2 .xcol:nth-child(odd) { border-left: 0; padding-left: 0; } .xgrid2 .xcol:nth-child(-n+4) { border-top: 1px solid var(--line); } .xgrid2 .xcol:nth-child(-n+2) { border-top: 0; } }
  @media (max-width: 820px) { .xgrid2 { grid-template-columns: minmax(0,1fr); padding: 0 14px; } .xcol { border-left: 0 !important; padding-left: 0 !important; } .xhead2 { grid-template-columns: minmax(0,1fr); } .xh-face { width: 180px; height: 170px; } .xops { grid-template-columns: minmax(0,1fr); } }

  /* ═════════════════════ V8 ═════════════════════ */
  /* Portraits PNG : jamais coupés (le haut de la tête reste en haut de l'image) */
  .co-face { width: 92%; max-width: 280px; aspect-ratio: 1 / 1; margin-right: -20px; overflow: visible; }
  .co-face img, .xc-face img, .xh-face img, .xfaces .cutout img, .xlist .cutout.mini img { object-fit: contain; object-position: 50% 100%; transform: none; }

  .xh-face { width: 290px; height: 290px; margin-top: -8px; }
  .xhead2 { grid-template-columns: 290px minmax(0,1fr); min-height: 290px; padding-top: 18px; }

  /* Faits saillants : chiffre aligné sur le haut de la 1re ligne, colonne fixe */

  .fs-item .no { display: block; font: 900 60px/1 var(--head); letter-spacing: -2px; text-align: right; margin-top: -4px; height: 52px; }
  .fs-item p { margin: 0; }

  /* Dans le vestiaire (épisode) : noms complets, sans pastille */
  .vest-list .hd { font: 900 18px/1.1 var(--head); text-transform: none; }
  .vest-list .tm { font: 400 12.5px var(--book); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 3px; }
  .vest-list p { margin-top: 6px; font-size: 16px; }

  /* Sections poids médiatique de la une */
  .pm-sec { margin: 34px 0 30px; }
  .pm-h { display: flex; align-items: flex-end; gap: 12px 18px; flex-wrap: wrap; border-top: 6px solid var(--rule); padding-top: 10px; margin-bottom: 18px; }
  .pm-h h2 { margin: 0; font: 900 clamp(30px, 3.6vw, 46px)/.95 var(--head); text-transform: uppercase; letter-spacing: -.8px; }
  .pm-h h2 i { font: 400 1em var(--book); font-style: normal; letter-spacing: -.4px; }
  .pm-h h2 b { color: var(--red); font-weight: 900; }
  .pm-sub { font: 400 15px var(--body); font-style: italic; color: var(--muted); margin-bottom: 4px; }
  .pm-h .seg { margin-left: auto; }
  .pm-empty { font: italic 400 16px var(--body); color: var(--muted); }
  .hs { position: relative; overflow: hidden; display: grid; place-items: center; }
  .hs img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; object-position: 50% 100%; }
  .hs b { font: 900 40px var(--head); color: rgba(255,255,255,.85); }
  .hs img + b { display: none; }
  .pm-rk { font: 900 64px/.85 var(--head); letter-spacing: -3px; color: var(--red); }
  .pm-kick { font: 400 13px var(--book); letter-spacing: 1.5px; text-transform: uppercase; color: var(--muted); }
  .pm-stat { display: flex; align-items: baseline; gap: 8px; }
  .pm-stat b { font: 900 46px/1 var(--head); letter-spacing: -1.5px; }
  .pm-stat span { font: 400 13px var(--book); text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
  .pm-ctx { margin: 0; font: 400 18px/1.36 var(--book); color: var(--text); }
  .pm-op { margin-top: 2px; }
  .pm-bar { display: block; background: var(--tan); font: 900 11px var(--head); letter-spacing: 1.8px; text-transform: uppercase; padding: 6px 9px 5px; color: var(--text); }
  .pm-op p { margin: 8px 0 0; font: italic 400 16px/1.45 var(--body); color: var(--text); }
  .pm-ctx .plink, .pm-op .plink, .lnh-ctx .plink { border-bottom: 0; font-weight: 700; }
  /* n° 1 en vedette */
  .pm-lead { display: grid; grid-template-columns: 340px minmax(0,1fr); background: var(--card); border-top: 3px solid var(--rule); margin-bottom: 0; }
  .pm-lead-ph { position: relative; background: linear-gradient(160deg, var(--ch-blue) 0 58%, var(--ch-red) 58.3%); min-height: 300px; }
  .pm-lead.rocket .pm-lead-ph { background: linear-gradient(160deg, #0b2a1a 0 58%, var(--rocket) 58.3%); }
  .pm-lead-ph .hs { position: absolute; inset: 20px 0 0 0; }
  .pm-lead-ph .pm-rk { position: absolute; left: 16px; top: 14px; z-index: 1; color: #fff; font-size: 96px; }
  .pm-lead-bd { padding: 22px 28px 26px; display: flex; flex-direction: column; gap: 12px; }
  .pm-lead h3 { margin: 0; font: 900 clamp(40px, 5vw, 66px)/.92 var(--head); letter-spacing: -1.6px; text-transform: uppercase; }
  .pm-lead:hover h3 { color: var(--red); }
  .pm-row { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px 0; }
  .pm-lead .pm-stat b { font-size: 64px; color: var(--red); }

  .pm-lead .pm-ctx { font-size: 21px; }
  /* 4 colonnes */
  .pm-cols { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); background: var(--card); border-top: 1px solid var(--rule); border-bottom: 1px solid var(--rule); }
  .pm-col { display: flex; flex-direction: column; gap: 8px; padding: 16px 18px 20px; border-left: 1px solid var(--rule); min-width: 0; }
  .pm-col:first-child { border-left: 0; }
  .pm-col-top { display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 3px solid var(--ch-red); margin-bottom: 4px; }

  /* Classement LNH */
  .lnh { list-style: none; margin: 0; padding: 0 24px; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0 30px; background: var(--card); border-top: 3px solid var(--rule); }

  .hs.sm { width: 76px; height: 76px; background: var(--gray-lt); border-bottom: 3px solid var(--rule); }

  .lnh-nm { font: 900 21px/1.05 var(--head); text-transform: uppercase; letter-spacing: -.3px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

  .lnh-tm { display: flex; align-items: center; gap: 6px; font: 400 12.5px var(--book); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); }

  .lnh-ctx { font: 400 16px/1.38 var(--book); color: var(--text); }

  .lnh-pts { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .lnh-pts b { font: 900 32px/1 var(--head); letter-spacing: -1px; }
  @media (max-width: 1100px) { .pm-cols { grid-template-columns: repeat(2, minmax(0,1fr)); } .pm-col:nth-child(3) { border-left: 0; } .pm-col:nth-child(n+3) { border-top: 1px solid var(--rule); } .lnh { grid-template-columns: minmax(0,1fr); } }
  @media (max-width: 820px) { .pm-lead { grid-template-columns: minmax(0,1fr); } .pm-lead-ph { min-height: 260px; } .pm-cols { grid-template-columns: minmax(0,1fr); } .pm-col { border-left: 0 !important; border-top: 1px solid var(--rule); } .lnh { padding: 0 14px; } .lnh a { grid-template-columns: 30px 60px minmax(0,1fr) auto; } .hs.sm { width: 60px; height: 60px; } }

  /* ═════════════════════ V9 : pages Joueurs au gabarit des experts ═════════════════════ */
  .co-txt { text-transform: none; }
  .pcol .pc-top { display: flex; align-items: center; gap: 10px; }
  .pc-rk { font: 900 38px/.8 var(--head); color: var(--red); letter-spacing: -1.5px; }
  .pcol .xc-stats { align-items: flex-end; }
  .pc-tr { align-self: center; }
  .pc-op { font: italic 400 15px/1.42 var(--body); color: var(--text); position: relative; z-index: 1; }
  .pc-op b { font: 900 12px var(--head); font-style: normal; text-transform: uppercase; letter-spacing: .3px; }
  .pcol .xc-op b, .pc-op .plink { font-family: var(--head); font-weight: 900; }

  .pcol .xc-face { border-bottom: 0; }
  .pminis { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 0 20px; background: var(--card); padding: 4px 18px; border-top: 3px solid var(--rule); margin-bottom: 10px; }
  .pmini { display: grid; grid-template-columns: 52px minmax(0,1fr); gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .pmini .hs.sm { width: 52px; height: 52px; border-bottom: 3px solid var(--c); }
  .pmini .hs.sm b { font-size: 16px; }
  .pmini b { display: block; font: 900 15.5px/1.1 var(--head); }
  .pmini small { font: 400 12px var(--book); color: var(--muted); }
  .pmini:hover b { color: var(--red); }
  .pmini-h { font: 900 13px var(--head); text-transform: uppercase; letter-spacing: 1px; margin: 12px 0 4px; }

  /* Fiche joueur */
  .phead2 .xh-face { width: 300px; height: 290px; }
  .phead2 .xh-face b { font-size: 110px; color: rgba(255,255,255,.9); }
  .phead2 .xh-role { display: flex; align-items: center; gap: 10px; }

  .xop-bar a:hover { text-decoration: underline; }

  .snip-item { border-top: 1px solid var(--rule); padding: 14px 0 18px; }

  #bpanel .bnums > div { background: var(--card); }
  .xlist .hs.mini { width: 56px; height: 56px; border-bottom: 3px solid var(--c); background: var(--gray-lt); }

  @media (max-width: 820px) { .snips { grid-template-columns: minmax(0,1fr); } .phead2 .xh-face { width: 200px; height: 190px; } }

  /* ═════════════════════ V10 : page d'épisode — opinions façon « Ce qu'ils ont dit », répliques à droite ═════════════════════ */
  .ep-said { margin: 40px 0 10px; padding: 22px 24px 22px; }
  .ep-said .crystal-title { font-size: clamp(34px, 4vw, 48px); }
  .ep-said .takes.cols { grid-template-columns: repeat(3, minmax(0,1fr)); grid-auto-rows: 1fr; }
  .ep-said .col-op { min-height: 360px; border-top: 1px solid var(--line); border-left: 1px solid var(--rule); padding-left: 18px; }
  .ep-said .takes.cols .col-op:nth-child(4n+1) { border-left: 1px solid var(--rule); padding-left: 18px; }
  .ep-said .takes.cols .col-op:nth-child(-n+4) { border-top: 1px solid var(--line); }

  .ep-said .co-face { width: 88%; max-width: 230px; }
  .side-q { list-style: none; margin: 0; padding: 0; }
  .side-q li { padding: 12px 0 14px; border-bottom: 1px solid var(--rule); }
  .side-q .who { font: 900 15px var(--head); text-transform: uppercase; color: var(--blue); letter-spacing: .3px; }
  .side-q .who::before { content: '› '; }
  .side-q blockquote { margin: 6px 0 6px; font: 400 21px/1.22 var(--book); color: var(--text); }
  .side-q .ctx { font: italic 400 15px/1.35 var(--body); color: var(--text-2); }
  :root[data-theme="dark"] .side-q .who { color: #5aa7e6; }
  @media (max-width: 1100px) { .ep-said .takes.cols { grid-template-columns: repeat(2, minmax(0,1fr)); } .ep-said .takes.cols .col-op:nth-child(3n+1) { border-left: 1px solid var(--rule); padding-left: 18px; } .ep-said .takes.cols .col-op:nth-child(odd) { border-left: 0; padding-left: 4px; } .ep-said .takes.cols .col-op:nth-child(3) { border-top: 1px solid var(--line); } }
  @media (max-width: 820px) { .ep-said .takes.cols { grid-template-columns: minmax(0,1fr); } .ep-said .col-op { border-left: 0 !important; padding-left: 0 !important; border-top: 1px solid var(--line) !important; } .ep-said { padding: 16px 14px; } }

  /* ═════════════════════ V11 : colonnes Experts / Joueurs — photo en haut, filet dessous (comme le vestiaire de la une) ═════════════════════ */
  .col-top { align-self: stretch; display: flex; align-items: flex-end; justify-content: space-between; border-bottom: 3px solid var(--c, var(--ch-red)); margin-bottom: 8px; }
  .col-top .col-face { width: 140px; height: 140px; background: transparent; border: 0; }
  .col-top .col-face img { object-fit: contain; object-position: 50% 100%; transform: none; }
  .col-top .col-face b { font: 900 48px var(--head); color: var(--c); }
  .col-top .pc-rk { font: 900 72px/.85 var(--head); letter-spacing: -3px; color: var(--red); padding-bottom: 6px; }
  .xc-cnt { display: flex; flex-direction: column; }
  .xc-cnt small { font: 400 12px var(--book); letter-spacing: 1px; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
  .xcol, .pcol { padding-top: 16px; min-height: 0; }
  .pcol .xc-stats { margin-top: 2px; }
  .xcol.quiet .col-face { opacity: .55; }

  /* ═════════════════════ V12 : bandeau de la une — colonne Experts / colonne Joueurs ═════════════════════ */
  .tslot { display: contents; }
  .teaser.tx { display: grid; grid-template-columns: minmax(0,1fr) 150px; gap: 14px; padding-bottom: 0; }
  .teaser.tx .tx-bd { padding-bottom: 18px; min-width: 0; }
  .teaser.tx .t-y { font-size: 30px; margin-top: 4px; }
  .teaser.tx blockquote { font-size: 21px; margin-top: 8px; }
  .teaser.tx b { font-family: var(--head); font-weight: 900; }
  .teaser .tx-face { align-self: end; width: 150px; height: 150px; }
  .teaser .tx-face b { font-size: 48px; color: rgba(255,255,255,.85); }
  .teaser.pl { background: #3b3c3e; }
  .tx-pts { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin: 6px 0 8px; }
  .tx-pts b { font: 900 54px/1 var(--head); color: #ffe28a; letter-spacing: -2px; }
  .tx-pts span { font: 400 13px var(--book); text-transform: uppercase; letter-spacing: .8px; opacity: .9; }
  .tx-pts .trend.up { color: #6ee89a; } .tx-pts .trend.down { color: #ff9a92; }
  .teaser.tx p { font-size: 16px; }
  .gx-row { display: grid; grid-template-columns: minmax(0,1fr) auto; gap: 10px; align-items: end; }
  .gbox.lt .gx-row { grid-template-columns: auto minmax(0,1fr); align-items: center; }
  .gbox .tx-face { width: 84px; height: 84px; }
  .gbox .tx-face.sm { width: 78px; height: 78px; margin-bottom: -14px; }
  .gbox .tx-face b { font-size: 26px; color: var(--muted); }

  .gx-faces { display: flex; gap: 4px; margin-top: 8px; flex-wrap: wrap; }
  .gx-faces .tx-face { width: 46px; height: 46px; border-bottom: 2px solid #fff; }
  .gx-faces .tx-face b { font-size: 15px; color: #fff; }
  .gbox.num .trend { font-size: 13px; }
  .gbox.lt .g-sub, .gbox.num .g-sub { color: var(--red); }
  .gbox.gx .tx-face.sm { width: 96px; height: 96px; }
</style>
</head>
