<title>TubeWatch Hockey</title>
<script>
  try { const t = localStorage.getItem('tw-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
  /* ───── Fontes (dossier tubewatch/fonts) ─────
     LaPresse Black / Book : titres. Ces fichiers sont des sous-ensembles (extraits d'un PDF) : il leur manque
     des lettres (j k q z ç ê…) et leur espace est vide. Les caractères absents sont complétés automatiquement
     par Kumbh Sans (fonts/kumbh, licence OFL), ajustée à la même taille. Meridien : texte à lire. */
  @font-face { font-family: 'LP Black'; src: url('fonts/LaPresse-Black.ttf') format('truetype'); font-weight: 500 900; font-display: swap;
    unicode-range: U+0021-007E, U+00A1-00FF, U+0131, U+0152-0153, U+02C6, U+2013-2014, U+2018-201E, U+2026, U+2039-203A; }
  @font-face { font-family: 'LP Book'; src: url('fonts/LaPresse-Book.ttf') format('truetype'); font-weight: 100 500; font-display: swap;
    unicode-range: U+0021-007E, U+00A1-00FF, U+0131, U+0152-0153, U+02C6, U+2013-2014, U+2018-201E, U+2026, U+2039-203A; }
  @font-face { font-family: 'LP Black Fill'; src: url('fonts/kumbh/kumbh-sans-latin-800-normal.woff2') format('woff2'); font-weight: 500 900; size-adjust: 90%; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'LP Black Fill'; src: url('fonts/kumbh/kumbh-sans-latin-ext-800-normal.woff2') format('woff2'); font-weight: 500 900; size-adjust: 90%; font-display: swap; unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'LP Book Fill'; src: url('fonts/kumbh/kumbh-sans-latin-400-normal.woff2') format('woff2'); font-weight: 100 500; size-adjust: 90%; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'LP Book Fill'; src: url('fonts/kumbh/kumbh-sans-latin-ext-400-normal.woff2') format('woff2'); font-weight: 100 500; size-adjust: 90%; font-display: swap; unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Book.woff') format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Book%20Italic.woff') format('woff'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Medium.woff') format('woff'); font-weight: 500 600; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Medium%20Italic.woff') format('woff'); font-weight: 500 600; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Bold.woff') format('woff'); font-weight: 700 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Bold%20Italic.woff') format('woff'); font-weight: 700 900; font-style: italic; font-display: swap; }

  /* ───── Jeux de polices de remplacement (libres, OFL, auto-hébergées comme Kumbh) ─────
     Choix dans l'admin (Réglages → Polices) → config/settings.json → build-ui.js écrit <html data-fontset="…">.
     « original » (valeur par défaut) = LP Black/Book + Meridien ci-dessus, inchangés. */
  @font-face { font-family: 'Archivo Black'; src: url('fonts/combo1/archivo-black-900.woff2') format('woff2'); font-weight: 500 900; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('fonts/combo1/inter-400.woff2') format('woff2'); font-weight: 100 500; font-display: swap; }
  @font-face { font-family: 'Inter'; src: url('fonts/combo1/inter-700.woff2') format('woff2'); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: 'Source Serif 4'; src: url('fonts/combo1/source-serif-4-400.woff2') format('woff2'); font-weight: 100 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Source Serif 4'; src: url('fonts/combo1/source-serif-4-400-italic.woff2') format('woff2'); font-weight: 100 500; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Source Serif 4'; src: url('fonts/combo1/source-serif-4-700.woff2') format('woff2'); font-weight: 600 900; font-style: normal; font-display: swap; }

  @font-face { font-family: 'Big Shoulders'; src: url('fonts/combo2/big-shoulders-900.woff2') format('woff2'); font-weight: 500 900; font-display: swap; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('fonts/combo2/ibm-plex-sans-400.woff2') format('woff2'); font-weight: 100 500; font-display: swap; }
  @font-face { font-family: 'IBM Plex Sans'; src: url('fonts/combo2/ibm-plex-sans-700.woff2') format('woff2'); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: 'Lora'; src: url('fonts/combo2/lora-400.woff2') format('woff2'); font-weight: 100 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Lora'; src: url('fonts/combo2/lora-400-italic.woff2') format('woff2'); font-weight: 100 500; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Lora'; src: url('fonts/combo2/lora-700.woff2') format('woff2'); font-weight: 600 900; font-style: normal; font-display: swap; }

  @font-face { font-family: 'Libre Franklin'; src: url('fonts/combo3/libre-franklin-400.woff2') format('woff2'); font-weight: 100 500; font-display: swap; }
  @font-face { font-family: 'Libre Franklin'; src: url('fonts/combo3/libre-franklin-700.woff2') format('woff2'); font-weight: 600 800; font-display: swap; }
  @font-face { font-family: 'Libre Franklin'; src: url('fonts/combo3/libre-franklin-900.woff2') format('woff2'); font-weight: 900; font-display: swap; }
  @font-face { font-family: 'Public Sans'; src: url('fonts/combo3/public-sans-400.woff2') format('woff2'); font-weight: 100 500; font-display: swap; }
  @font-face { font-family: 'Public Sans'; src: url('fonts/combo3/public-sans-700.woff2') format('woff2'); font-weight: 600 900; font-display: swap; }
  @font-face { font-family: 'Newsreader'; src: url('fonts/combo3/newsreader-400.woff2') format('woff2'); font-weight: 100 500; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Newsreader'; src: url('fonts/combo3/newsreader-400-italic.woff2') format('woff2'); font-weight: 100 500; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Newsreader'; src: url('fonts/combo3/newsreader-700.woff2') format('woff2'); font-weight: 600 900; font-style: normal; font-display: swap; }

  :root {
    --red: #e3161e;          /* rouge La Presse */
    --red-dark: #b50f16;
    --green: #1f5fbf;          /* bleu « positif » (lisible pour les daltoniens, ex-vert #1a8a3a) (jauges, hausses, verdicts) */
    --ink: #141414;
    --ink-2: #2e2e2e;
    --muted: #6b6b6b;
    --line: #d9d6cf;
    --rule: #141414;
    --bg: #f3f1ec;           /* papier journal */
    --card: #ffffff;
    --gray-box: #5c5d5f;     /* encadrés « Le jeu du match » */
    --gray-lt: #e4e3df;
    --gray-bar: #8e8e8e;     /* barre « Sommaire » */
    --yellow: #ffe28a;       /* classement LNH /// EST */
    --yellow-line: #e9c552;
    --nav: #141414;
    --nav-2: #2a2a2a;
    --ch-red: #af1e2d;
    --ch-blue: #192168;
    --rocket: #00843d;
    --radius: 0px;
    --shadow: none;
    --head: 'LP Black', 'LP Black Fill', 'Arial Black', sans-serif;
    --book: 'LP Book', 'LP Book Fill', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Meridien', 'Iowan Old Style', Georgia, serif;
    --ui: 'LP Book', 'LP Book Fill', 'Helvetica Neue', Arial, sans-serif;
    /* texte à lire posé sur une carte BLANCHE (le serif --body reste pour le fond papier #f3f1ec) */
    --prose-white: var(--body);
    --serif: 'Meridien', 'Iowan Old Style', Georgia, serif;
  }
  /* jeux de remplacement : mêmes rôles (--head titres noirs, --book interface, --body texte à lire), polices libres */
  :root[data-fontset="combo1"] { --head: 'Archivo Black', 'Arial Black', sans-serif; --book: 'Inter', 'Helvetica Neue', Arial, sans-serif; --body: 'Source Serif 4', Georgia, serif; --ui: 'Inter', 'Helvetica Neue', Arial, sans-serif; --prose-white: 'Inter', 'Helvetica Neue', Arial, sans-serif; --serif: 'Source Serif 4', Georgia, serif; }
  :root[data-fontset="combo2"] { --head: 'Big Shoulders', 'Arial Narrow', sans-serif; --book: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; --body: 'Lora', Georgia, serif; --ui: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; --prose-white: 'IBM Plex Sans', 'Helvetica Neue', Arial, sans-serif; --serif: 'Lora', Georgia, serif; }
  :root[data-fontset="combo3"] { --head: 'Libre Franklin', 'Arial Black', sans-serif; --book: 'Public Sans', 'Helvetica Neue', Arial, sans-serif; --body: 'Newsreader', Georgia, serif; --ui: 'Public Sans', 'Helvetica Neue', Arial, sans-serif; --prose-white: 'Libre Franklin', 'Helvetica Neue', Arial, sans-serif; --serif: 'Newsreader', Georgia, serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 16px/1.6 var(--body); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
  /* lecture : pas de mot seul en dernière ligne d'un paragraphe, titres équilibrés */
  p, blockquote, li, figcaption, .xc-op, .pz-t { text-wrap: pretty; }
  h1, h2, h3, h4 { text-wrap: pretty; } /* pleine largeur, sans mot seul sur la dernière ligne (balance rendait les titres étroits) */
  .chr-h1, .mpg-h1, .mpl-h1 { text-wrap: balance; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button { font: inherit; cursor: pointer; }

  /* ───── Header ───── */
  .topbar { background: var(--nav); color: #fff; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .topbar-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 22px; padding: 0 16px; height: 56px; }
  .logo { font: italic 800 28px/1 var(--head); letter-spacing: -.5px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  .logo .tw { color: var(--red); }
  .logo .hk { color: #fff; }
  .logo .dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; margin-left: 4px; transform: translateY(6px); }
  .nav { display: flex; gap: 2px; height: 100%; }
  .nav a { white-space: nowrap; display: flex; align-items: center; padding: 0 14px; font: 700 16px/1 var(--head); text-transform: uppercase; letter-spacing: .4px; color: #d8d8d8; border-bottom: 3px solid transparent; }
  .nav a:hover { color: #fff; background: var(--nav-2); }
  .nav a.active { color: #fff; border-bottom-color: var(--red); }
  .search { margin-left: auto; position: relative; }
  .search input { width: 260px; background: #2c2d2e; border: 1px solid #3a3b3c; color: #fff; border-radius: 20px; padding: 8px 14px 8px 34px; font-size: 14px; outline: none; }
  .search input:focus { border-color: #777; background: #333; }
  .search svg { position: absolute; left: 11px; top: 9px; opacity: .6; }
  .search-results { position: absolute; right: 0; top: 44px; width: 380px; background: var(--card); color: var(--ink); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.25); max-height: 70vh; overflow: auto; display: none; --body: var(--prose-white);}
  .search-results.open { display: block; }
  .sr-group { font: 700 11px var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 10px 14px 4px; }
  .sr-item { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
  .sr-item:hover { background: #f6f6f6; }
  .sr-item img { flex: 0 0 64px; width: 64px; aspect-ratio: 16/9; object-fit: cover; background: #e5e5e5; border-radius: 3px; }
  .sr-item .t { font-size: 12.5px; font-weight: 500; line-height: 1.3; }
  .sr-item .s { font-size: 12.5px; color: var(--muted); }

  /* ───── Scoreboard strip ───── */
  .scorestrip { background: var(--card); border-bottom: 1px solid var(--line); --body: var(--prose-white);}
  .scorestrip-wrap { max-width: 1280px; margin: 0 auto; display: flex; align-items: stretch; position: relative; }
  .scorestrip-inner { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; scroll-snap-type: x proximity; }
  .score { scroll-snap-align: start; }
  .sarrow { flex: 0 0 36px; border: 0; background: var(--card); border-left: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); --body: var(--prose-white);}
  .sarrow:hover { background: #f2f2f2; }
  .sarrow:disabled { color: #ccc; cursor: default; background: var(--card); --body: var(--prose-white);}
  .sarrow svg { width: 16px; height: 16px; }
  .strip-all { flex: 0 0 auto; border: 0; border-left: 1px solid var(--line); background: var(--card); font: 700 12.5px var(--head); text-transform: uppercase; letter-spacing: .4px; padding: 0 14px; color: var(--red); --body: var(--prose-white);}
  .strip-all:hover { background: #fff5f5; }
    .strip-panel.open { display: grid; }
  .strip-panel .score { border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
  .scorestrip-inner::-webkit-scrollbar { display: none; }
  .score { flex: 0 0 auto; min-width: 176px; padding: 8px 14px; border-right: 1px solid var(--line); display: block; }
  .score:hover { background: #f7f7f7; }
  .score .lbl { display: flex; align-items: center; gap: 6px; font: 700 12.5px/1.15 var(--head); text-transform: uppercase; white-space: nowrap; }
  .score .sw { width: 4px; height: 14px; border-radius: 1px; }
  .score .nums { display: flex; gap: 12px; margin-top: 4px; font-size: 11px; color: var(--muted); }
  .score .nums b { color: var(--ink); font: 700 16px var(--head); margin-right: 2px; }
  .score-head { flex: 0 0 auto; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; font: 800 11px/1.15 var(--head); text-transform: uppercase; color: var(--red); letter-spacing: .5px; border-right: 1px solid var(--line); }

  /* ───── Layout ───── */
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
    .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; --body: var(--prose-white);}
      .card-h.red { border-top: 4px solid var(--red); }
  .card + .card { margin-top: 18px; }
    .kicker[style*="color:"] { filter: brightness(.78) saturate(1.1); }
  .kicker { font: 700 11px/1.15 var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--red); }
  .muted { color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1 var(--head); text-transform: uppercase; letter-spacing: .5px; padding: 4px 6px; border-radius: 3px; background: #efefef; color: var(--ink-2); }
  .tag.ai { background: var(--red); color: #fff; }
  .tag.st { background: #e7eefc; color: #1f4fbf; }
  .tag.none { background: #f3f3f3; color: #999; }

  /* Headlines list */
  .headlines { list-style: none; margin: 0; padding: 0 16px 8px; }
  .headlines li { border-top: 1px solid var(--line); }
  .headlines li:first-child { border-top: 0; }
  .headlines a { display: block; padding: 10px 0; font-weight: 500; font-size: 14px; line-height: 1.3; }
  .headlines a:hover .ht { text-decoration: underline; }
  .headlines .hs { display: block; font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* Hero */
  .hero { position: relative; display: block; }
  .hero .img { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; }
  .hero .img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
  .hero:hover .img img { transform: scale(1.02); }
  .hero .img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85)); }
  .hero .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 24px; color: #fff; z-index: 2; }
  .hero .over .kicker { color: #fff; background: var(--red); display: inline-block; padding: 4px 8px; border-radius: 2px; }
  .hero h1 { font: 800 44px/1.02 var(--head); margin: 10px 0 6px; letter-spacing: -.3px; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .hero .sub { font-size: 14px; opacity: .9; }
          
  /* Feed */
  .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .vcard { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; --body: var(--prose-white);}
  .vcard:hover { box-shadow: 0 6px 18px rgba(0,0,0,.14); transform: translateY(-2px); }
  .vcard .thumb { position: relative; aspect-ratio: 16/9; background: #222; }
  .vcard .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .vcard .thumb .tags { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px; }
  .vcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .vcard .ttl { font: 700 18px/1.15 var(--head); }
  .vcard .meta { margin-top: auto; font-size: 11px; color: var(--muted); }
  .section-title { font: 800 22px/1 var(--head); text-transform: uppercase; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ''; width: 5px; height: 20px; background: var(--red); }
    .spot .pcard .ph { aspect-ratio: 1 / 1; }
  .spot .pcard .ph .wm { font-size: 44px; }
  .spot .pcard .nm { font-size: 16px; }

  /* Leaderboard */
  .leader { list-style: none; margin: 0; padding: 0 16px 12px; }
  .leader li { display: grid; grid-template-columns: 22px 40px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .leader li:first-child { border-top: 0; }
  .leader .rk { font: 800 14px var(--head); color: var(--muted); text-align: center; }
  .leader .nm { font: 700 16px/1.15 var(--head); }
  .leader .nm small { display: block; font: 400 11px/1.45 var(--body); color: var(--muted); }
  .leader .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 4px; overflow: hidden; }
  .leader .bar i { display: block; height: 100%; background: var(--red); }
  .leader .val { font: 800 18px var(--head); text-align: right; }
  .leader .val small { display: block; font: 500 11px var(--body); color: var(--muted); text-transform: uppercase; }
  .jersey { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 16px var(--head); color: #fff; background: radial-gradient(circle at 50% 30%, #d8354a, var(--ch-red) 70%); flex: 0 0 auto; position: relative; overflow: hidden; }
  .jersey.rocket { background: radial-gradient(circle at 50% 30%, #3479dc, var(--rocket) 70%); }
  .jersey.other { background: radial-gradient(circle at 50% 30%, #999, #666 70%); }
  .jersey img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; background: linear-gradient(180deg, #e9ebee, #cfd3d8); }
  .jersey.has-img { box-shadow: 0 0 0 2px var(--ch-red); }
  .jersey.has-img.rocket { box-shadow: 0 0 0 2px var(--rocket); }
  .jersey.has-img.other { box-shadow: 0 0 0 2px #888; }

  .showlist a { display: flex; align-items: center; gap: 10px; padding: 8px 16px; border-top: 1px solid var(--line); font-weight: 500; font-size: 14px; }
  .showlist a:hover { background: #f7f7f7; }
  .showlist .sw { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .showlist .n { margin-left: auto; font: 700 12.5px var(--head); color: var(--muted); }

  /* ───── Show page ───── */
  .banner { border-radius: var(--radius); color: #fff; padding: 26px 28px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .banner::after { content: ''; position: absolute; right: -60px; top: -60px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,.07); }
  .banner h1 { font: 800 36px/1 var(--head); margin: 6px 0 12px; text-transform: uppercase; letter-spacing: -.3px; }
  .banner .kicker { color: rgba(255,255,255,.85); }
  .banner a.ext { font-size: 12.5px; text-decoration: underline; opacity: .9; }
  .statrow { display: flex; gap: 28px; margin-top: 16px; flex-wrap: wrap; }
  .stat b { display: block; font: 800 28px/1 var(--head); }

  /* ═════════════════════ THÈME « LA PRESSE » (version papier, touche moderne) ═════════════════════ */
  body { font: 16px/1.6 var(--body); font-feature-settings: normal; background: var(--bg); }

  .nav a.active { color: var(--red); border-bottom-color: var(--red); }
  .search input { background: var(--card); border: 1px solid var(--rule); color: var(--ink); border-radius: 0; font: 400 16px var(--book); --body: var(--prose-white);}
  .search input:focus { background: var(--card); border-color: var(--red); --body: var(--prose-white);}
  .search svg { stroke: var(--ink); }
  .search-results { border-radius: 0; border: 1px solid var(--rule); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .sr-group { font: 900 12.5px var(--head); letter-spacing: 1.2px; color: var(--red); }
  .sr-item .t { font: 500 14px var(--body); }
  .sr-item .s, .sr-item img { font-family: var(--ui); border-radius: 0; }

  /* Bandeau des émissions (comme la bande de résultats) */
  .scorestrip { background: var(--bg); border-bottom: 1px solid var(--line); }
  .score, .score-head, .sarrow, .strip-all { background: transparent; }
  .score .lbl { font: 900 12.5px/1.15 var(--head); letter-spacing: .2px; }

  .strip-all { font: 900 12.5px var(--head); }

  /* Bandeau du haut : derniers médias (cartes défilantes) */
  .scorestrip-inner { gap: 12px; padding: 12px 12px 14px; align-items: stretch; }
  .scorestrip .score-head { flex: 0 0 auto; align-self: center; padding: 0 4px 0 2px; font: 400 12.5px/1.3 var(--book); letter-spacing: 1.5px; text-transform: uppercase; color: var(--red); }
  .mcard { flex: 0 0 236px; scroll-snap-align: start; border-radius: 0; box-shadow: none; border: 1px solid var(--line); }
  .mcard:hover { transform: none; box-shadow: 0 4px 12px rgba(0,0,0,.10); }
  .mcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 4px; flex: 1; }
  .mcard .kicker { font: 400 11px/1.15 var(--book); letter-spacing: 1.2px; text-transform: uppercase; }
  .mcard .ttl { font: 900 16px/1.15 var(--head); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mcard .meta { margin-top: auto; font: 400 12.5px var(--book); color: var(--muted); }
  .mcard .thumb .tags .tag { font-size: 11px; }
  /* Vignette toujours au même format (16:9), peu importe l'image (TVA Sports : images carrées) */
  .mcard .thumb { aspect-ratio: 16/9; height: auto; min-height: 0; overflow: hidden; flex: none; }
  .mcard .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .mcard .thumb .tags { z-index: 1; }
  /* Articles : effet Ken Burns (zoom et glissement lents, comme un écran de chargement) */
  @keyframes kb1 { from { transform: scale(1.04) translate(-2%, 2%); } to { transform: scale(1.28) translate(3%, -4%); } }
  @keyframes kb2 { from { transform: scale(1.26) translate(3%, 3%); } to { transform: scale(1.04) translate(-3%, -2%); } }
  @keyframes kb3 { from { transform: scale(1.06) translate(3%, -3%); } to { transform: scale(1.3) translate(-4%, 3%); } }
  .mcard.art .thumb img { animation: kb1 16s ease-in-out infinite alternate; will-change: transform; transform-origin: 50% 40%; }
  .mcard.art:nth-child(3n) .thumb img { animation-name: kb2; animation-duration: 19s; }
  .mcard.art:nth-child(3n+1) .thumb img { animation-name: kb3; animation-duration: 17s; }
  .mcard.art:nth-child(2n) .thumb img { animation-delay: -6s; }
  .mcard.art:hover .thumb img { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .mcard.art .thumb img { animation: none; } }
  .scorestrip .sarrow { flex: 0 0 40px; }
  .scorestrip .strip-all { display: grid; place-items: center; text-align: center; line-height: 1.15; }
  @media (max-width: 700px) { .mcard { flex-basis: 200px; } .scorestrip .score-head { display: none; } .scorestrip .strip-all { display: none; } }

  /* Manchettes (IA, 4 éditions par jour) — au-dessus du bandeau des derniers médias */

  /* ═════════════════════ V2 : plus de couleur, texte plus noir, page d'épisode façon « LE CANADIEN » ═════════════════════ */
  :root { --ink-2: #161616; --blue: #1b75bc; --gold: #fdb913; --tan: #f5e6a6; --gray-mid: #6d6e71; --gray-dk: #58595b; --gray-pale: #dcdcdd; }

  .rv.z { transform: scale(.94); }

  @media (prefers-reduced-motion: reduce) { .rv { opacity: 1; transform: none; transition: none; } }
  /* Barre de lecture */

  /* ═════════════════════ V3 : tracking Meridien, LaPresse Book pour certains textes, boule de cristal en couleur ═════════════════════ */

  .fs-item .plink, .op-card .plink, .bubble .plink, .vcardp .plink { font-family: var(--head); font-weight: 900; }

    .take .show { opacity: .95; }

  .take .src:hover { color: var(--red); filter: none; }
  
  /* Experts : plus de rectangle gris, style journal (barre « ANALYSE » + texte LaPresse) */

  .xbubble::before, .xbubble.empty::before { display: none; }

  .standings-h { flex-wrap: wrap; row-gap: 2px; }

  /* ═════════════════════ V4 ═════════════════════ */
  :root { --text: #0d0d0d; --text-2: #3a3a3a; --block: #141414; --row-alt: #fdf4cf; --row-line: #efe4b5; }

  /* Répliques (page d'épisode) */
  .vq-item .ctx { font: italic 400 18px/1.3 var(--body); color: var(--text-2); }

  /* Faits saillants : texte plus grand, chiffres alignés sur la 1re ligne */

  /* Bouton de thème */
  .theme-btn { display: inline-flex; align-items: center; gap: 8px; margin-left: 10px; height: 36px; padding: 0 12px; border: 1.5px solid var(--rule); background: var(--card); color: var(--ink); font: 900 12.5px var(--head); text-transform: uppercase; letter-spacing: .4px; --body: var(--prose-white);}

  /* ═════════════════════ V5 : une plus dense, « Le tour des émissions », « Ce qu'ils ont dit » en chroniqueurs ═════════════════════ */
  /* Colonne gauche du bandeau : rouge + teasers + encadrés, étirés à la hauteur de l'encadré jaune */
  .sband > div:first-child { display: flex; flex-direction: column; gap: 8px; }

      .gbox:not(.lt):not(.num) { background: #4b4c4e; }

  /* Le tour des émissions (inspiré de « LE TOUR DU GLOBE ») */

                    .tour-col:hover h3 { text-decoration: underline; text-decoration-thickness: 2px; text-underline-offset: 3px; }
    
  /* Ce qu'ils ont dit : colonnes de chroniqueurs */

  a.co-name:hover { text-decoration: underline; }
  .co-txt { margin: 8px 0 8px; font: 900 18px/1.15 var(--head); text-transform: uppercase; color: var(--ink); letter-spacing: -.2px; position: relative; z-index: 1; }
  .co-txt .plink { border-bottom: 0; color: var(--c); filter: brightness(.8); }

  @media (max-width: 1100px) { .tour-cols, .takes.cols { grid-template-columns: repeat(2, minmax(0,1fr)); } .takes.cols .col-op:nth-child(odd) { border-left: 0; } .takes.cols .col-op:nth-child(-n+4) { border-top: 1px solid var(--line); } }

  /* Ken Burns : photo TVA Sports entière, cadre toujours rempli, balayage + zoom / dézoom lent */
  .mhc-hero .mhc-hi .kb { position: absolute; inset: 0; overflow: hidden; }
  .mhc-hero .mhc-hi .kb img.kb-fg, .mhc-hero .mhc-hi:hover .kb img.kb-fg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; transform-origin: 50% 25%; transition: none; transform: scale(1.05); will-change: transform, object-position; }
  /* chaque segment a son propre ease-in-out : arrêt doux, repos 5,5 s, redémarrage doux */

  .mhc-hero .mhc-hi .kb.go.kb-b .kb-fg { animation: kenburns-b 57s ease-in-out -20s infinite; }
  .mhc-hero .mhc-hi:hover .kb.go .kb-fg { animation-play-state: paused; }
  /* A : haut (repos) → milieu (repos) → bas (repos) → retour en haut */
  @keyframes kenburns-a {
    0%, 10.5% { object-position: var(--kbP0); transform: scale(1.14); }
    27.6%, 38.1% { object-position: var(--kbPm); transform: scale(1.07); }
    55.2%, 65.7% { object-position: var(--kbP1); transform: scale(1); }
    100% { object-position: var(--kbP0); transform: scale(1.14); }
  }
  /* B : haut (repos) → bas d'un trait (repos) → milieu (repos) → retour en haut */
  @keyframes kenburns-b {
    0%, 9.6% { object-position: var(--kbP0); transform: scale(1.14); }
    41.2%, 50.9% { object-position: var(--kbP1); transform: scale(1); }
    66.7%, 76.3% { object-position: var(--kbPm); transform: scale(1.07); }
    100% { object-position: var(--kbP0); transform: scale(1.14); }
  }

     3) PROSE sur fond blanc → serif (--body). Les titres, étiquettes et chiffres restent en sans.

  /* ═════ Surfaces au lieu des lignes (fiches joueur, expert, staff; pages Joueurs et Experts) ═════
     3 niveaux de fond : le papier (--bg), la carte (--surf-1), la carte en vedette teintée (--surf-tint, selon --k).
     Les groupes se lisent par l'espace et le fond; une seule ligne forte reste : le petit trait rouge des titres. */
  :root { --surf-1: #ffffff; --surf-2: #efece6; --surf-r: 6px; --gap-s: 8px; --gap-m: 14px; --gap-l: 28px; }
  :root[data-theme="dark"] { --surf-1: #1d1d1f; --surf-2: #262628; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --surf-1: #1d1d1f; --surf-2: #262628; } }
  :root body .ds-card, :root body .hxs-card, :root body .hx-fam, :root body .vx-card, :root body .mv-big > div { border: 0; border-radius: var(--surf-r); background: var(--surf-1); }
  :root body .ds-vrow, :root body .hx-pal li, :root body .hx-like li, :root body .mv-l li, :root body .vx-card li, :root body .hxr li { border: 0; }
  :root body .hx-pal li, :root body .vx-card li:not(.top) { padding: 6px 0; }
  :root body .vx-card { background: color-mix(in srgb, var(--k) 7%, var(--surf-1)); }
  :root body .ds-bas { border: 0; border-radius: var(--surf-r); background: color-mix(in srgb, var(--k) 6%, var(--surf-1)); }
  :root body .ds-kpis { border: 0; gap: var(--gap-s); }
  :root body .ds-kpi, :root body .ds-kpi + .ds-kpi { border: 0; padding: 12px 14px; background: var(--surf-1); border-radius: var(--surf-r); }
  :root body .ds-glace > div { background: var(--surf-2); border-radius: 4px; }
  /* titres : plus de grosses barres noires, un court trait rouge à la place */
  :root body .ep-grid .ep-h2, :root body .hx .ep-h2 { border-top: 0; padding-top: 0; margin-top: 40px; position: relative; }
  :root body .ep-grid .ep-h2::before, :root body .hx .ep-h2::before { content: ''; position: absolute; left: 0; top: -12px; width: 44px; height: 4px; background: var(--red); }
  :root body .ep-aside .side-h { border: 0; padding: 0; margin: 0 0 8px; font-size: 22px; }
  :root body .ep-aside > div, :root body .ds-aside > div { margin-bottom: var(--gap-l); }
  :root body .ep-aside .vest-list li, :root body .ep-aside .also li, :root body .ep-aside .xlist li { border: 0; }
  :root body .ep-aside .also li + li, :root body .ep-aside .xlist li + li, :root body .ep-aside .vest-list li + li { margin-top: 4px; }
  /* tableau des voix : rangées en alternance au lieu de traits */
  :root body .xt td { border-bottom: 0; } :root body .xt th { border-bottom: 2px solid var(--ink); }
  :root body .xt tbody tr:nth-child(even) td { background: var(--surf-2); } :root body .xt tbody tr:nth-child(even) td.nm { background: var(--surf-2); }
  :root body .xtb-b { box-shadow: none; background: var(--surf-2); }
  /* citations en bulles, avec le portrait de la voix */

  .db-track { position: relative; height: 22px; background: var(--surf-2); border-radius: 11px; }

  .fvm { display: grid; grid-template-columns: minmax(0, 1.5fr) repeat(3, minmax(0, 1fr)); gap: var(--gap-l); margin: 18px 0 26px; padding: 18px 24px 22px; background: var(--surf-1, var(--card)); border-top: 4px solid var(--red); --body: var(--prose-white); }

  .mt { max-width: 72ch; margin: 8px auto 40px; padding: 8px 24px 24px; background: var(--surf-1, var(--card)); }

  :root body .sband-sub { margin-top: 6px; } /* la cédille de « Ça » ne touche plus le sous-titre */

  :root[data-theme="dark"] body .co-txt .plink, :root[data-theme="dark"] body .chb-card.staff .chb-kick { color: color-mix(in srgb, var(--c) 40%, #fff); }
  /* gris et bleu de texte sur les fonds teintés (manchette du vestiaire, bulles, bascules) */

<a class="skip" href="#app" id="skipLink">Aller au contenu</a>
<div class="dateline-bar"><div class="dateline-inner">
  <a class="lp-logo" href="#/"><span class="pill">TUBEWATCH</span><span class="url">hockey · Canadien</span></a>
  <span class="dateline" id="dateline"></span>
  <p class="deck">Ce que les experts disent du CH à la radio, en balado et dans les journaux, écouté et résumé aux 30&nbsp;minutes. <a href="#/methode">Comment ça marche&nbsp;→</a></p>
</div></div>
<header class="topbar">
  <div class="topbar-inner">
    <nav class="nav">
      <a href="#/" data-nav="home">À la une</a>
      <a href="#/manchettes" data-nav="manchettes">Manchettes</a>
      <a href="#/shows" data-nav="shows">Médias</a>
      <a href="#/experts" data-nav="experts">Experts</a>
      <a href="#/players" data-nav="players">Joueurs</a>
      <a href="#/match" data-nav="match">Match</a>
      <a href="#/stats" data-nav="stats">Stats</a>
    </nav>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Rechercher un épisode, un joueur, un expert…" autocomplete="off">
      <div class="search-results" id="sr"></div>
    </div>
    <button class="theme-btn" id="themeBtn" type="button" aria-label="Thème sombre" title="Thème sombre / clair"><svg class="moon" viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="sun" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M2 12h2.5M19.5 12H22M4.9 4.9l1.8 1.8M17.3 17.3l1.8 1.8M4.9 19.1l1.8-1.8M17.3 6.7l1.8-1.8"/></svg><span>Sombre</span></button>
  </div>
</header>
<div class="scorestrip">
  <div class="scorestrip-wrap">
    <button class="sarrow" id="sPrev" aria-label="Précédent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m15 18-6-6 6-6"/></svg></button>
    <div class="scorestrip-inner" id="strip"></div>
    <button class="sarrow" id="sNext" aria-label="Suivant"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m9 18 6-6-6-6"/></svg></button>
    <a class="strip-all" id="sAll" href="#/shows">Tous les<br>médias</a>
  </div>
</div>
<div id="readbar"></div>
<main id="app" tabindex="-1"></main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>

<script>
  // Fraîcheur des données. data.js (gros) peut rester en cache dans le navigateur ou chez GitHub Pages (~10 min) :
  // on lit d'abord version.json (minuscule, jamais en cache grâce au ?t=) et on demande data.js?v=<version>.
  // Même version → data.js vient du cache (rapide); nouvelle version → nouvelle adresse, donc toujours le bon fichier.
  // Ouvert en double-cliquant le fichier (file://) : pas de version.json lisible, on charge data.js tel quel.
  (function () { var v = '';
    try { var x = new XMLHttpRequest(); x.open('GET', 'version.json?t=' + Date.now(), false); x.send(); if (x.status === 200) v = JSON.parse(x.responseText).v || ''; } catch (e) {}
    window.TW_VERSION = v;
    document.write('<script src="data.js' + (v ? '?v=' + encodeURIComponent(v) : '') + '"><\/script>'); })();
</script>
<script>
(() => {
  const D = window.TUBEWATCH_DATA;
  const app = document.getElementById('app');

  if (!D) {
    app.innerHTML = `<div class="notice"><h2 style="margin-top:0;font-family:var(--head)">Aucune donnée</h2>
      <p>Le fichier <code>ui/data.js</code> est introuvable. Dans le dossier <b>tubewatch</b>, lance :</p>
      <p><code>npm run ui</code></p>
      <p class="muted">Il est aussi régénéré automatiquement après chaque vérification de <code>npm start</code>.</p></div>`;
    return;
  }

  // ─────────── Données dérivées ───────────
  const chByKey = Object.fromEntries(D.channels.map(c => [c.key, c]));
  const vidKey = (k, id) => k + '/' + id;
  const vidByKey = Object.fromEntries(D.videos.map(v => [vidKey(v.key, v.videoId), v]));
  // Opinions d'un élément : celles du résumé IA, puis celles relevées par les manchettes (sources sans résumé)
  const opsOf = v => [...(v?.summary?.opinions || []), ...(v?.lite?.opinions || [])];
  const playerById = Object.fromEntries(D.players.map(p => [p.id, p]));
  const mentionsByVideo = {};
  for (const p of D.players) for (const m of p.mentions) {
    (mentionsByVideo[vidKey(m.key, m.videoId)] ||= []).push({ p, m });
  }
  const maxMentions = Math.max(1, ...D.players.map(p => p.videoCount));

  // ─────────── Détails chargés à la demande (data-details.js) ───────────
  // data.js ne contient que ce que l'accueil et les listes affichent. Le déroulement sujet par sujet, les joueurs
  // du résumé, les extraits des transcriptions et le JSON Discord arrivent ensuite (en arrière-plan, ou dès
  // qu'on ouvre un épisode, un joueur ou un expert). Un <script> plutôt que fetch : ça marche aussi en file://.
  let detailsReady = !!D.noDetails, detailsP = null;
  var MOPS = null; // opinions relevées dans les sources des manchettes (data-details.js → mops), pour la page d'une manchette
  function mergeDetails() {
    const X = window.TUBEWATCH_DETAILS;
    if (!X) return false;
    for (const [k, o] of Object.entries(X.v || {})) {
      const v = vidByKey[k]; if (!v) continue;
      if (o.discord) v.discord = o.discord;
      if (v.summary) for (const f of ['sujets', 'joueurs_mentionnes', 'note_transcription']) if (o[f] != null) v.summary[f] = o[f];
    }
    for (const [id, ms] of Object.entries(X.p || {})) {
      const p = playerById[id]; if (!p) continue;
      for (const [i, sn] of Object.entries(ms)) if (p.mentions[i]) p.mentions[i].snippets = sn;
    }
    if (X.mops) MOPS = X.mops;
    delete window.TUBEWATCH_DETAILS;
    return true;
  }
  const loadDetails = () => detailsP ||= new Promise(res => {
    if (window.TUBEWATCH_DETAILS) { mergeDetails(); detailsReady = true; return res(true); }
    const sc = document.createElement('script');
    sc.src = 'data-details.js?v=' + encodeURIComponent(D.generatedAt || '');
    sc.onload = () => { mergeDetails(); detailsReady = true; res(true); };
    sc.onerror = () => { detailsReady = true; res(false); }; // pas de détails : on affiche quand même
    document.head.appendChild(sc);
  });

  // ─────────── Utilitaires ───────────
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const thumb = (id, q = 'mqdefault') => `https://i.ytimg.com/vi/${id}/${q}.jpg`;
  const isArt = v => v.type === 'article';
  const artPlaceholder = v => 'data:image/svg+xml;utf8,' + encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180"><rect width="320" height="180" fill="${(chByKey[v.key] || {}).color || '#333'}"/><text x="160" y="112" font-size="72" text-anchor="middle">📰</text></svg>`);
  // Shorts : vignette verticale (oardefault) — recadrée au centre dans les cartes
  const vthumb = (v, q) => isArt(v) ? (v.image || artPlaceholder(v)) : v.short ? `https://i.ytimg.com/vi/${v.videoId}/oardefault.jpg` : thumb(v.videoId, q);
  const fmtDate = iso => iso ? new Date(/^\d{4}-\d{2}-\d{2}$/.test(iso) ? `${iso}T12:00:00` : iso).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short', year: 'numeric' }) : '—';
  const fmtAgo = iso => {
    if (!iso) return '';
    const m = Math.round((Date.now() - new Date(iso)) / 60000);
    if (m < 60) return `il y a ${m} min`;
    const h = Math.round(m / 60); if (h < 24) return `il y a ${h} h`;
    const d = Math.round(h / 24); return d < 30 ? `il y a ${d} j` : fmtDate(iso);
  };
  const TEAMS = D.teams || [];
  const teamByAb = Object.fromEntries(TEAMS.map(t => [t.abbrev, t]));
  const teamClass = p => p.teamAbbrev === (D.focusTeam || 'MTL') ? '' : p.teamAbbrev === 'LAV' ? 'rocket' : 'other';
  const teamLogo = (ab, cls = 'tlogo') => { const t = teamByAb[ab]; return t?.logo ? `<img class="${cls}" src="${esc(t.logo)}" alt="${esc(ab)}" loading="lazy">` : `<span class="${cls} tlogo-txt">${esc(ab || '')}</span>`; };
  // Taille en pieds/pouces et poids en livres (API LNH : pouces/livres; sinon conversion depuis cm/kg)
  const heightFt = p => { const i = p.heightIn || (p.heightCm ? Math.round(p.heightCm / 2.54) : 0); return i ? `${Math.floor(i / 12)}′${i % 12}″` : null; };
  const weightLb = p => { const l = p.weightLb || (p.weightKg ? Math.round(p.weightKg * 2.2046) : 0); return l ? `${l} lb` : null; };
  const ageOf = d => { if (!d) return null; const b = new Date(d), n = new Date(); let a = n.getFullYear() - b.getFullYear(); if (n < new Date(n.getFullYear(), b.getMonth(), b.getDate())) a--; return a; };
  // Photo du joueur (headshot) avec repli sur le numéro si l'image ne charge pas
  const imgFallback = `onerror="this.parentNode.classList.remove('has-img');this.remove()"`;
  const jersey = p => `<span class="jersey ${teamClass(p)} ${p.image ? 'has-img' : ''}">${esc(p.number || initials(p.name))}${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="" ${imgFallback}>` : ''}</span>`;
  const initials = n => n.split(' ').map(x => x[0]).join('').slice(0, 2).toUpperCase();
  const epHref = v => `#/ep/${encodeURIComponent(v.key)}/${v.videoId}`;
  const showHref = k => `#/show/${encodeURIComponent(k)}`;
  const plHref = p => `#/player/${p.id}`;
  const tagsFor = v => (isArt(v) ? `<span class="tag art">${v.kind === 'balado' ? '🎧 Balado' : '📰 Article'}</span>` : v.live ? '<span class="tag live">● Live</span>' : v.short ? '<span class="tag vid">▮ Short</span>' : '<span class="tag vid">▶ Vidéo</span>') + (v.summary ? '<span class="tag ai">Résumé IA</span>' : '') + (v.hasSubtitles && !isArt(v) ? '<span class="tag st">Sous-titres</span>' : '');
  // Plus de texte tronqué (…) : on affiche tout, les blocs s'agrandissent au besoin
  const cutText = (t) => String(t || '').replace(/\s+/g, ' ').trim();
  const displayTitle = v => v.summary?.titre_court || v.title;

  function highlight(text, p) {
    let out = esc(text);
    const terms = [...new Set([...(p.aliases || []), ...norm(p.name).split(' ')])].filter(t => t.length >= 3).sort((a, b) => b.length - a.length);
    if (!terms.length) return out;
    // surligne en comparant sur une version sans accents
    const plain = norm(out);
    const marks = [];
    for (const t of terms) {
      const re = new RegExp(`\\b${t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\b`, 'g');
      let m; while ((m = re.exec(plain))) marks.push([m.index, m.index + t.length]);
    }
    marks.sort((a, b) => a[0] - b[0]);
    let res = '', last = 0;
    for (const [a, b] of marks) { if (a < last) continue; res += out.slice(last, a) + '<mark>' + out.slice(a, b) + '</mark>'; last = b; }
    return res + out.slice(last);
  }

  // Partager : lien propre vers une petite page avec aperçu (Open Graph) générée par publish.js (épisodes / articles et chroniques
  // des 14 derniers jours), qui renvoie vers la page du site. Partage natif sur mobile, sinon copie dans le presse-papiers.
  const shareBtn = (path, title) => `<button class="share-btn" data-share="${esc(path)}" data-title="${esc(title || '')}" title="Copier un lien avec aperçu (Discord, réseaux sociaux)"><svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7M16 6l-4-4-4 4M12 2v14"/></svg>Partager</button>`;
  document.addEventListener('click', async e => {
    const b = e.target.closest('.share-btn'); if (!b) return;
    e.preventDefault();
    const base = new URL('.', location.href.split('#')[0]).href; // dossier du site (…/tubewatch/)
    const url = base + b.dataset.share, title = b.dataset.title;
    if (navigator.share && matchMedia('(pointer: coarse)').matches) { try { await navigator.share({ title, url }); return; } catch (err) { if (err?.name === 'AbortError') return; } }
    try { await navigator.clipboard.writeText(url); toast('Lien copié — l’aperçu s’affichera dans Discord'); }
    catch { prompt('Copie ce lien :', url); }
  });
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 1800);
  }

  function vcard(v, useCover = false) {
    const c = chByKey[v.key];
    return `<a class="vcard" href="${epHref(v)}">
      <div class="thumb"><img loading="lazy" src="${esc(useCover === true && c.cover ? c.cover : vthumb(v))}" alt=""><div class="tags">${tagsFor(v)}</div></div>
      <div class="body">
        <div class="kicker" style="color:${esc(c.color)}">${esc(c.label)}</div>
        <div class="ttl">${esc(displayTitle(v))}</div>
        <div class="meta">${v.publishedAt ? 'Publié' : 'Ajouté'} ${fmtAgo(dateOf(v))}</div>
      </div></a>`;
  }

  const themeBtn = document.getElementById('themeBtn');
  const syncTheme = () => { const d = document.documentElement.dataset.theme === 'dark'; themeBtn.querySelector('span').textContent = d ? 'Clair' : 'Sombre'; themeBtn.removeAttribute('aria-pressed'); themeBtn.setAttribute('aria-label', d ? 'Passer au thème clair' : 'Passer au thème sombre'); };
  themeBtn.onclick = () => { const t = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark'; document.documentElement.dataset.theme = t; try { localStorage.setItem('tw-theme', t); } catch {} syncTheme(); };
  syncTheme();
  document.getElementById('dateline').textContent = 'Montréal ' + new Date().toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
  document.getElementById('foot').innerHTML =
    `<p class="ft-who"><b>TubeWatch Hockey</b> est fait par des partisans du CH. Les émissions et les articles appartiennent à leurs auteurs : on les résume et on renvoie toujours à l’original. Stats : MoneyPuck, LNH, DailyFaceoff.</p>
     <p class="ft-meta"><a href="#/methode">Comment ça marche</a> · Mis à jour ${fmtAgo(D.generatedAt)} · ${D.videos.length} épisodes et articles · ${D.players.filter(p => p.videoCount).length} joueurs mentionnés</p>`;

  // ─────────── Vues ───────────
  // Date seule (« 2026-09-27 ») = minuit UTC = la veille au soir à Montréal : on prend plutôt l'heure de détection.
  const dateOf = v => { const p = v.publishedAt; if (p && /^\d{4}-\d{2}-\d{2}$/.test(p)) { const a = v.addedAt && new Date(v.addedAt); return a && a.toLocaleDateString('en-CA') === p ? a : new Date(`${p}T12:00:00`); } return new Date(p || v.addedAt || 0); };
  const sortedVideos = [...D.videos].sort((a, b) => dateOf(b) - dateOf(a));
  const allSortedVideos = sortedVideos; // tous les médias, y compris « poids médiatique seulement »
  const feedVideos = sortedVideos.filter(v => !chByKey[v.key]?.weightOnly);

  // ─────────── Bandeau du haut : les derniers médias (articles, émissions, balados) ───────────
  (() => {
    const strip = document.getElementById('strip');
    const card = v => {
      const c = chByKey[v.key] || { label: v.key, color: '#999' };
      const fb = isArt(v) ? (c.cover || artPlaceholder(v)) : thumb(v.videoId, 'mqdefault');
      return `<a class="vcard mcard ${isArt(v) ? 'art' : ''}" href="${epHref(v)}">
        <div class="thumb"><img loading="lazy" src="${esc(vthumb(v, 'mqdefault'))}" onerror="this.onerror=null;this.src='${esc(fb)}'" alt=""><div class="tags">${tagsFor(v)}</div></div>
        <div class="body"><div class="kicker" style="color:${esc(c.color)}">${esc(c.label)}</div>
          <div class="ttl">${esc(displayTitle(v))}</div>
          <div class="meta">${v.publishedAt ? 'Publié' : 'Ajouté'} ${fmtAgo(dateOf(v))}</div></div></a>`;
    };
    strip.innerHTML = `<div class="score-head">Derniers<br>médias</div>` + sortedVideos.slice(0, 40).map(card).join('');
    const sPrev = document.getElementById('sPrev'), sNext = document.getElementById('sNext');
    const syncArrows = () => {
      sPrev.disabled = strip.scrollLeft <= 2;
      sNext.disabled = strip.scrollLeft + strip.clientWidth >= strip.scrollWidth - 2;
    };
    sPrev.onclick = () => strip.scrollBy({ left: -strip.clientWidth * 0.85 });
    sNext.onclick = () => strip.scrollBy({ left: strip.clientWidth * 0.85 });
    strip.addEventListener('scroll', syncArrows, { passive: true });
    window.addEventListener('resize', syncArrows);
    syncArrows();
  })();
  // Alterne les émissions (le 1er scan ajoute des dizaines d'épisodes d'un coup à la même heure)
  function mixShows(list) {
    const groups = new Map();
    for (const v of list) { if (!groups.has(v.key)) groups.set(v.key, []); groups.get(v.key).push(v); }
    const lanes = [...groups.values()], out = [];
    for (let i = 0; out.length < list.length; i++) for (const l of lanes) if (l[i]) out.push(l[i]);
    return out;
  }
  const frontPage = [...sortedVideos.filter(v => v.summary), ...mixShows(sortedVideos.filter(v => !v.summary && v.hasSubtitles)), ...mixShows(sortedVideos.filter(v => !v.summary && !v.hasSubtitles))];
  const topPlayers = [...D.players].filter(p => p.videoCount).sort((a, b) => b.videoCount - a.videoCount || b.totalMentions - a.totalMentions);

  function leaderboard(n = 10, excludeId = null) {
    const list = topPlayers.filter(p => p.id !== excludeId).slice(0, n);
    if (!list.length) return '<div class="empty">Aucun joueur mentionné pour l’instant.</div>';
    return `<ol class="leader">${list.map((p, i) => `<li>
        <span class="rk">${i + 1}</span>${jersey(p)}
        <a href="${plHref(p)}"><div class="nm">${esc(p.name)}<small>${esc(p.team)}${p.position ? ' · ' + esc(p.position) : ''}</small></div>
          <div class="bar"><i style="width:${Math.round(p.videoCount / maxMentions * 100)}%"></i></div></a>
        <span class="val">${p.videoCount}<small>épisodes</small></span></li>`).join('')}</ol>`;
  }

  // ─────────── Buzz ───────────
  // Chaque joueur a des événements datés [date, poids, émission] (voir build-ui.js) :
  // mention dans la transcription +1 (max 10/épisode), cité par l'IA +5, opinion qui le nomme +4, réplique +3.
  const DAY = 864e5;
  const NOW = Date.now();
  const WINS = [['1j', '1 jour', 1], ['3j', '3 jours', 3], ['7j', '7 jours', 7], ['tout', 'Tout', null]];
  const winDays = w => (WINS.find(x => x[0] === w) || WINS[0])[2];
  // Période du poids médiatique : 1 jour par défaut partout (choix retenu d'une visite à l'autre)
  let buzzWin = '1j';
  try { buzzWin = localStorage.getItem('tw-pm-win') || '1j'; } catch {}
  if (!WINS.some(x => x[0] === buzzWin)) buzzWin = '1j';
  const setWin = w => { buzzWin = w; try { localStorage.setItem('tw-pm-win', w); } catch {} };
  const isCH = p => !!p.focus;                 // Canadien + Rocket
  const sumRange = (p, from, to) => { let s = 0; for (const [t, w] of p.events || []) if (t >= from && t < to) s += w; return s; };
  const buzzOf = (p, w = buzzWin) => { const d = winDays(w); return d ? sumRange(p, NOW - d * DAY, Infinity) : (p.buzzTotal || 0); };
  // Tendance : fenêtre actuelle vs la précédente de même longueur (« Tout » → 7 jours)
  const trendOf = (p, w = buzzWin) => {
    const d = winDays(w) || 7;
    const cur = sumRange(p, NOW - d * DAY, Infinity), prev = sumRange(p, NOW - 2 * d * DAY, NOW - d * DAY);
    if (!cur && !prev) return null;
    if (!prev) return { k: 'new', cur, prev };
    const r = (cur - prev) / prev;
    return { k: r > 0.1 ? 'up' : r < -0.1 ? 'down' : 'flat', r, cur, prev };
  };
  const trendHtml = t => !t ? '' : t.k === 'new' ? '<span class="trend new">Nouveau</span>'
    : `<span class="trend ${t.k}" title="${t.prev} → ${t.cur} (période précédente)">${t.k === 'up' ? '▲' : t.k === 'down' ? '▼' : '='}${t.k === 'flat' ? '' : ' ' + Math.min(999, Math.round(Math.abs(t.r) * 100)) + ' %'}</span>`;
  // Courbe des 14 derniers jours
  const dailyBins = (p, n = 14) => {
    const bins = Array(n).fill(0);
    for (const [t, w] of p.events || []) { const i = n - 1 - Math.floor((NOW - t) / DAY); if (i >= 0 && i < n) bins[i] += w; }
    return bins;
  };
  function sparkline(p, wd = 84, ht = 22, n = 14) {
    const b = dailyBins(p, n), max = Math.max(1, ...b), step = wd / (n - 1);
    const pts = b.map((v, i) => [i * step, ht - 2 - (v / max) * (ht - 4)]);
    const line = pts.map(([x, y]) => `${x.toFixed(1)},${y.toFixed(1)}`).join(' ');
    const [lx, ly] = pts[pts.length - 1];
    return `<svg class="spark" width="${wd}" height="${ht}" viewBox="0 0 ${wd} ${ht}" aria-label="Poids médiatique des ${n} derniers jours"><polygon class="ar" points="0,${ht} ${line} ${wd},${ht}"/><polyline class="ln" points="${line}"/><circle class="dt" cx="${lx}" cy="${ly}" r="2.4"/></svg>`;
  }
  // Classements mémorisés par fenêtre
  const rankCache = {};
  const ranking = (w = buzzWin) => rankCache[w] ||= (() => {
    const all = D.players.filter(p => p.inRoster).map(p => ({ p, s: buzzOf(p, w) })).filter(x => x.s > 0).sort((a, b) => b.s - a.s || a.p.name.localeCompare(b.p.name));
    const pos = new Map(all.map((x, i) => [x.p.id, i + 1]));
    return { all, pos, lnh: all.filter(x => !isCH(x.p)), ch: all.filter(x => isCH(x.p)) };
  })();
  const teamRank = (p, w = buzzWin) => { const l = ranking(w).all.filter(x => x.p.teamAbbrev === p.teamAbbrev); const i = l.findIndex(x => x.p.id === p.id); return i < 0 ? null : [i + 1, l.length]; };
  // Le plus gros « riser » du top (🔥 En feu)
  const hottest = list => { let best = null, g = 0; for (const x of list) { const t = trendOf(x.p); const gain = t ? t.cur - t.prev : 0; if (gain > g && (t.k === 'up' || t.k === 'new')) { g = gain; best = x.p.id; } } return best; };
  const winSeg = (id = 'win') => `<div class="seg win" data-win="${id}">${WINS.map(([k, l]) => `<button data-w="${k}" class="${buzzWin === k ? 'on' : ''}">${l}</button>`).join('')}</div>`;
  const bindWin = (root, onChange) => root.querySelectorAll('.seg.win').forEach(s => s.onclick = e => {
    const b = e.target.closest('button'); if (!b || b.dataset.w === buzzWin) return;
    setWin(b.dataset.w);
    document.querySelectorAll('.seg.win button').forEach(x => x.classList.toggle('on', x.dataset.w === buzzWin));
    onChange();
  });
  const winLabel = () => buzzWin === 'tout' ? 'depuis le début' : winDays(buzzWin) === 1 ? 'ces dernières 24 heures' : `ces ${winDays(buzzWin)} derniers jours`;
  const inWin = (v, w = buzzWin) => { const d = winDays(w); return !d || dateOf(v) >= NOW - d * DAY; };

  // Ce qu'on dit d'un joueur : contextes des résumés, opinions, répliques, sujets (du plus récent au plus ancien)
  const refItems = (p, kind) => (p.refs?.[kind] || []).map(([k, id, i]) => {
    const v = vidByKey[vidKey(k, id)]; const s = v?.summary; if (!v || (!s && kind !== 'op')) return null;
    const item = kind === 'op' ? opsOf(v)[i] : kind === 'q' ? s.citations?.[i] : s.sujets?.[i];
    return item ? { item, v } : null;
  }).filter(Boolean).sort((a, b) => dateOf(b.v) - dateOf(a.v));
  // une phrase (contexte d'un joueur écrit par l'IA, souvent sans point final) : on ajoute le point s'il manque
  const phrase = s => { const t = String(s || '').trim(); return !t || /[.!?…:;»"”)]$/.test(t) ? t : `${t}.`; };
  const latestContext = p => p.mentions.filter(m => m.contexte).map(m => ({ m, v: vidByKey[vidKey(m.key, m.videoId)] })).filter(x => x.v).sort((a, b) => dateOf(b.v) - dateOf(a.v))[0] || null;
  const showsInWin = (p, w = buzzWin) => { const d = winDays(w); return new Set((p.events || []).filter(e => !d || e[0] >= NOW - d * DAY).map(e => e[2])).size; };
  const blurb = p => { const c = latestContext(p); if (c) return phrase(c.m.contexte); const o = refItems(p, 'op')[0]; if (o) return o.item.opinion; const sn = p.mentions.find(m => m.snippets?.length); return sn ? '« ' + sn.snippets[0] + ' »' : ''; };

  // Carte riche (vestiaire du CH / radar)
  function richCard(x, rank) {
    const p = x.p, ctx = latestContext(p), op = refItems(p, 'op')[0], n = showsInWin(p);
    return `<a class="vcardp ${teamClass(p)}" href="${plHref(p)}">
      <div class="top"><span class="rk">${rank}</span>
        ${p.image ? `<img loading="lazy" src="${esc(p.image)}" alt="" onerror="this.remove()">` : ''}<span class="id">${p.number ? `<span class="num">#${esc(p.number)} · ${esc(p.position || '')}</span>` : ''}<span class="nm">${esc(p.name)}</span></span></div>
      <div class="mid"><div class="bscore">${x.s}<small>poids médiatique</small></div>${trendHtml(trendOf(p))}${sparkline(p)}</div>
      <div class="bd">
        ${ctx ? `<div class="ctx">${esc(cutText(phrase(ctx.m.contexte), 150))}</div>` : ''}
        ${op ? `<div class="op">${faces(op.item.people, op.item.qui, 'sm')}<div><b>${esc(whoName(op.item.people, op.item.qui))}</b>${esc(cutText(op.item.opinion, 120))}</div></div>` : ''}
        ${!ctx && !op ? `<div class="ctx muted">${esc(cutText(blurb(p), 150)) || 'Mentionné en ondes.'}</div>` : ''}
        <div class="foot">Sujet de ${n} média${n > 1 ? 's' : ''} · ${winLabel()}</div>
      </div></a>`;
  }
  // Ligne de classement (Buzz LNH / Buzz CH)
  function buzzRow(x, i, max, fireId, compact = false) {
    const p = x.p, t = teamByAb[p.teamAbbrev];
    return `<li><span class="rk">${i + 1}</span>${jersey(p)}
      <a class="who" href="${plHref(p)}"><div class="nm">${esc(p.name)}${!compact && !isCH(p) ? teamLogo(p.teamAbbrev) : ''}${p.id === fireId ? '<span class="fire">🔥 En feu</span>' : ''}</div>
        <div class="meta">${esc(compact ? (p.position || '') : (t?.short || t?.name || p.team || ''))}${p.number ? ' · #' + esc(p.number) : ''}</div>
        ${compact ? '' : `<div class="snip">${esc(cutText(blurb(p), 160))}</div>`}
        <div class="bar"><i style="width:${Math.round(x.s / max * 100)}%"></i></div></a>
      <span class="right"><span class="bscore">${x.s}</span>${trendHtml(trendOf(p))}</span></li>`;
  }
  function buzzList(list, n, compact = false) {
    const top = list.slice(0, n);
    if (!top.length) return `<div class="buzz-empty">Aucun joueur mentionné ${winLabel()}.${buzzWin !== 'tout' ? ' Essaie une période plus longue.' : ''}</div>`;
    const max = Math.max(1, ...top.map(x => x.s)), fire = compact ? null : hottest(top);
    return `<ol class="blist ${compact ? 'compact' : ''}">${top.map((x, i) => buzzRow(x, i, max, fire, compact)).join('')}</ol>`;
  }

  // ─────────── À la une : tirage au hasard parmi les derniers épisodes ───────────
  const shuffle = arr => { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // Met en gras + lien les noms de joueurs connus dans un texte (déjà échappé). hint : noms officiels à préférer (ex. joueurs d'une manchette)
  //  1. noms complets d'abord (accents ignorés : « Slafkovsky » = « Slafkovský »)
  //  2. puis les noms de famille seuls, seulement si on sait de qui il s'agit :
  //     · précédé d'un prénom (« Oliver Kapanen ») → le joueur qui a ce prénom, sinon rien (un autre joueur)
  //     · nom partagé (Kapanen, Xhekaj, Hutson…) → celui déjà nommé au complet plus tôt, sinon celui de l'indice, sinon le seul du CH, sinon rien
  const foldTxt = t => String(t).split('').map(c => { let f = c.normalize('NFD').replace(/\p{M}/gu, ''); if (f.length !== 1) f = c; const l = f.toLowerCase(); return l.length === 1 ? l : f; }).join('');
  const linkable = D.players.filter(p => p.inRoster && (p.focus || p.videoCount)).map(p => { const parts = p.name.split(' '); const last = parts.slice(1).join(' ');
      return { p, full: p.name, last, ffull: foldTxt(p.name), flast: foldTxt(last), ffirst: foldTxt(parts[0]) }; })
    .sort((a, b) => b.full.length - a.full.length);
  const byLast = new Map(); for (const e of linkable) if (e.flast.length >= 4) { if (!byLast.has(e.flast)) byLast.set(e.flast, []); byLast.get(e.flast).push(e); }
  const FIRSTS = new Set(D.players.map(p => foldTxt(p.name.split(' ')[0])).filter(x => x.length >= 2));
  const isL = c => !!c && /[\p{L}\p{N}]/u.test(c);
  // noms de famille jamais reliés seuls : mots courants ou noms propres du hockey (Coupe Stanley, New York, trophée Hart…)
  const LAST_STOP = new Set(['stanley', 'york', 'hart', 'norris', 'point', 'power', 'hall', 'wood', 'stone', 'steel', 'hill', 'rust', 'frost', 'wolf', 'knight', 'graves', 'trudeau', 'bauer'].map(foldTxt));
  // …ni le nom de famille d'un expert des médias (Brunet, Lapierre, Gauthier, Lavoie, Desharnais…) : on ne sait pas de qui on parle
  const EXPERT_LAST = new Set(Object.values(D.people || {}).filter(x => !x.isPlayer && x.nom).map(x => foldTxt(String(x.nom).split(' ').slice(1).join(' '))).filter(x => x.length >= 4));
  function linkPlayers(escaped, hint = []) {
    const src = String(escaped), F = foldTxt(src), hints = new Set((hint || []).map(foldTxt));
    const hits = [], done = new Set();
    const free = (s, e) => !hits.some(h => s < h.e && e > h.s);
    const find = (term, from = 0) => { for (let i = F.indexOf(term, from); i >= 0; i = F.indexOf(term, i + 1)) if (!isL(F[i - 1]) && !isL(F[i + term.length]) && free(i, i + term.length)) return i; return -1; };
    // 1. noms complets
    for (const e of linkable) { if (done.has(e.p.id)) continue; const i = find(e.ffull); if (i >= 0) { hits.push({ s: i, e: i + e.ffull.length, p: e.p }); done.add(e.p.id); } }
    // 2. noms de famille seuls
    for (const [fl, cands] of byLast) {
      for (let i = find(fl); i >= 0; i = find(fl, i + 1)) {
        const before = src.slice(0, i), m = before.match(/([\p{L}][\p{L}'’-]*)\s+$/u);
        const prev = m && /^\p{Lu}/u.test(m[1]) ? foldTxt(m[1]) : null;
        // mot en majuscule juste avant, pas en début de phrase et pas un prénom : nom propre composé (« New York », « Coupe Stanley ») → rien
        const sentenceStart = m && /(^|[.!?:;«"“(]\s*)$/u.test(before.slice(0, before.length - m[0].length));
        let pick = null;
        if (prev && !FIRSTS.has(prev) && !sentenceStart) pick = null;
        else if (FIRSTS.has(fl) && !(prev && FIRSTS.has(prev))) pick = null; // nom qui est aussi un prénom (Cole, Paul, Thomas, Connor…) : trop ambigu seul
        else if (!(prev && FIRSTS.has(prev)) && (LAST_STOP.has(fl) || EXPERT_LAST.has(fl))) pick = null;
        else if (prev && FIRSTS.has(prev)) pick = cands.find(c => c.ffirst === prev) || null; // « Oliver Kapanen », « Arber Xhekaj »
        else if (cands.some(c => done.has(c.p.id))) pick = null; // déjà lié plus haut (nom complet) : on ne relie pas deux fois
        else if (cands.length === 1) pick = cands[0];
        else pick = cands.filter(c => hints.has(c.ffull)).length === 1 ? cands.find(c => hints.has(c.ffull))
          : cands.filter(c => c.p.focus).length === 1 ? cands.find(c => c.p.focus) : null;
        if (pick && !done.has(pick.p.id)) { hits.push({ s: i, e: i + fl.length, p: pick.p }); done.add(pick.p.id); }
        if (pick || prev) break; // une seule fois par nom (le premier passage décide)
      }
    }
    let out = src;
    for (const h of hits.sort((a, b) => b.s - a.s)) out = `${out.slice(0, h.s)}<a class="plink" href="${plHref(h.p)}">${out.slice(h.s, h.e)}</a>${out.slice(h.e)}`;
    return out;
  }

  const hostInitials = n => String(n || '?').replace(/^@/, '').split(/\s+/).map(x => x[0]).join('').slice(0, 2).toUpperCase();
  // Headshots des animateurs/chroniqueurs (summaries/_personnes/personnes.json)
  const PEOPLE = D.people || {};
  const peopleOf = (ids, fallbackName) => {
    const list = (ids || []).map(id => PEOPLE[id] && { id, ...PEOPLE[id] }).filter(Boolean);
    return list.length ? list : [{ id: null, nom: fallbackName || 'Un des animateurs', image: D.defaultPersonImage }];
  };
  const whoName = (ids, raw) => { const l = (ids || []).map(id => PEOPLE[id]?.nom).filter(Boolean); return l.length ? l.join(' & ') : (raw || 'Un des animateurs'); };
  const faceImg = (p, cls = '') => `<span class="face ${cls} ${p.isPlayer ? 'pl' : ''}" title="${esc(p.nom)}">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(hostInitials(p.nom))}</b></span>`;
  const faces = (ids, raw, cls) => `<span class="faces n${Math.min(peopleOf(ids, raw).length, 3)}">${peopleOf(ids, raw).slice(0, 3).map(p => faceImg(p, cls)).join('')}</span>`;

  // Bandeau rouge « SPORTS » (titre de page) + encadré jaune optionnel
  const sband = (title, { sub = '', teasers = '', right = '' } = {}) => `<section class="sband ${right ? '' : 'solo'}">
      <div><div class="sband-red"><div><h1 class="sband-title">${title}</h1>${sub ? `<div class="sband-sub">${sub}</div>` : ''}</div><div class="sband-hatch"></div></div>
        ${teasers ? `<div class="sband-teasers">${teasers}</div>` : ''}</div>
      ${right}</section>`;
  // Image d'une émission (placeholder ui/emissions/…) — utilisée à la une à la place des vignettes
  // Vignette de l'épisode (repli : image de l'émission si la vignette manque)
  const thumbTag = (v, q = 'hqdefault', attrs = '') => {
    const fb = isArt(v) ? (chByKey[v.key]?.cover || artPlaceholder(v)) : thumb(v.videoId, 'hqdefault');
    return `<img src="${esc(vthumb(v, q))}" onerror="this.onerror=null;this.src='${esc(fb)}'" alt="" ${attrs}>`;
  };
  const vcardHome = v => vcard(v);
  // Chroniqueur façon journal : photo + barre rouge au nom
  const bylineBox = v => {
    const s = v.summary || {};
    const name = isArt(v) && v.authors?.length && v.kind !== 'balado' ? v.authors.join(', ') : whoName(v.hosts, (s.animateurs || []).join(', ') || chByKey[v.key].label);
    return `<div class="byl"><div class="ph">${faces((v.hosts || []).slice(0, 3), name, 'lg')}</div><div class="nm">${esc(name)}</div></div>`;
  };
  // Encadré jaune : classement Buzz CH (comme le classement LNH /// EST du journal)
  function standingsHtml(list) {
    const rows = list.slice(0, 60);
    return `<div class="standings-h"><b>POIDS MÉDIATIQUE<i>///</i>LNH</b><small>${esc(winLabel())}</small></div>
      ${rows.length ? `<table class="sortable" data-sid="buzz-lnh"><thead><tr><th></th><th></th><th data-k="med">MÉD.</th><th data-k="pts">PTS</th></tr></thead><tbody>${rows.map((x, i) => `<tr class="${i === 0 ? 'top' : ''} ${i === 2 ? 'cut' : ''}">
        <td class="rk">${i + 1}</td><td class="nm"><a href="${plHref(x.p)}" title="${esc(x.p.teamFull || x.p.team || '')}">${teamLogo(x.p.teamAbbrev, 'tlogo')}${esc(x.p.name)}</a></td><td class="v">${showsInWin(x.p)}</td><td class="v">${x.s}</td></tr>`).join('')}</tbody></table>`
        : `<div class="foot" style="margin-top:10px">Calme plat au vestiaire ${esc(winLabel())}.</div>`}
      <div class="foot">MÉD. – médias qui en parlent · PTS – points de poids médiatique<br>${winSeg()}</div>`;
  }

  // Encadré jaune : on montre autant de joueurs du CH que la hauteur de la colonne de gauche le permet
  function fitStandings() {
    const box = document.getElementById('buzzCh'), left = box?.parentElement?.firstElementChild;
    if (!box || !left || left === box) return;
    const rows = [...box.querySelectorAll('tbody tr')];
    if (!rows.length) return;
    if (getComputedStyle(box.parentElement).gridTemplateColumns.split(' ').length < 2) { rows.forEach(r => r.hidden = false); rows.forEach((r, i) => r.hidden = i >= 12); return; }
    left.style.alignSelf = 'start'; box.style.alignSelf = 'start';
    const target = left.offsetHeight;
    rows.forEach(r => r.hidden = true);
    let n = 0;
    for (const r of rows) { r.hidden = false; if (box.offsetHeight > target && n >= 3) { r.hidden = true; break; } n++; }
    left.style.alignSelf = ''; box.style.alignSelf = '';
  }
  let fitT; window.addEventListener('resize', () => { clearTimeout(fitT); fitT = setTimeout(fitStandings, 120); });

  // ── Dans le vestiaire du CH (une) : n° 1 en vedette + 4 colonnes ──
  const headshot = (p, cls = '') => `<div class="hs ${cls}">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(p.number || initials(p.name))}</b></div>`;
  // Noms de joueurs en gras sans lien (pour du texte déjà dans un lien : pas de liens imbriqués)
  const boldPlayers = (t, hint) => linkPlayers(t, hint).replace(/<a class="plink" href="[^"]*">(.*?)<\/a>/g, '<b>$1</b>');
  function vestHome(list) {
    if (!list.length) return `<p class="pm-empty">Calme plat au vestiaire ${winLabel()}.${buzzWin !== 'tout' ? ' Essaie une période plus longue.' : ''}</p>`;
    const [a, ...rest] = list.slice(0, 9);
    const opOf = p => refItems(p, 'op')[0];
    const ctxOf = p => phrase(latestContext(p)?.m.contexte) || blurb(p);
    const opHtml = o => o ? `<div class="pm-op"><span class="pm-bar">${esc(whoName(o.item.people, o.item.qui))} · ${esc(chByKey[o.v.key].label.replace(/^@/, ''))}</span><p>« ${boldPlayers(esc(o.item.opinion))} »</p></div>` : '';
    const stat = x => `<div class="pm-stat"><b data-count="${x.s}">${x.s}</b><span>points</span>${trendHtml(trendOf(x.p))}</div>`;
    const o1 = opOf(a.p);
    return `<a class="pm-lead ${teamClass(a.p)} rv" href="${plHref(a.p)}">
        <div class="pm-lead-ph"><span class="pm-rk">1</span>${headshot(a.p)}</div>
        <div class="pm-lead-bd">
          <div class="pm-kick">${a.p.number ? `#${esc(a.p.number)} · ` : ''}${esc(a.p.position || '')} · ${esc(a.p.team || '')}</div>
          <h3>${esc(a.p.name)}</h3>
          <div class="pm-row">${stat(a)}<div class="pm-spark">${sparkline(a.p, 220, 44)}<small>14 derniers jours · sujet de ${showsInWin(a.p)} média${showsInWin(a.p) > 1 ? 's' : ''}</small></div></div>
          <p class="pm-ctx">${boldPlayers(esc(ctxOf(a.p)))}</p>
          ${opHtml(o1)}
        </div></a>
      ${rest.length ? `<div class="pm-cols">${rest.map((x, i) => `<a class="pm-col rv" style="--i:${i}" href="${plHref(x.p)}">
          <div class="pm-col-top"><span class="pm-rk">${i + 2}</span>${headshot(x.p)}</div>
          <div class="pm-kick">${x.p.number ? `#${esc(x.p.number)} · ` : ''}${esc(x.p.position || '')}${x.p.team ? ` · ${esc(x.p.team)}` : ''}</div>
          <h4>${esc(x.p.name)}</h4>
          ${stat(x)}
          <p class="pm-ctx">${boldPlayers(esc(ctxOf(x.p)))}</p>
          ${opHtml(opOf(x.p))}</a>`).join('')}</div>` : ''}`;
  }
  // ── Poids médiatique LNH (une) : classement en 2 colonnes ──
  function lnhHome(list, n = 10) {
    const top = list.slice(0, n);
    if (!top.length) return `<p class="pm-empty">Aucun joueur des autres équipes mentionné ${winLabel()}.${buzzWin !== 'tout' ? ' Essaie une période plus longue.' : ''}</p>`;
    const max = Math.max(1, ...top.map(x => x.s)), fire = hottest(top);
    return `<ol class="lnh">${top.map((x, i) => { const t = teamByAb[x.p.teamAbbrev]; return `<li class="rv" style="--i:${i % 2}"><a href="${plHref(x.p)}">
        <span class="lnh-rk">${i + 1}</span>${headshot(x.p, 'sm')}
        <span class="lnh-bd"><span class="lnh-nm">${esc(x.p.name)}${x.p.id === fire ? '<span class="fire">🔥 En feu</span>' : ''}</span>
          <span class="lnh-tm">${teamLogo(x.p.teamAbbrev, 'tlogo sm')}${esc(t?.name || x.p.team || '')}${x.p.position ? ' · ' + esc(x.p.position) : ''}</span>
          <span class="lnh-ctx">${boldPlayers(esc(blurb(x.p)))}</span>
          <span class="lnh-bar"><i style="width:${Math.round(x.s / max * 100)}%"></i></span></span>
        <span class="lnh-pts"><b>${x.s}</b>${trendHtml(trendOf(x.p))}</span></a></li>`; }).join('')}</ol>`;
  }

  // ── Manchettes (manchettes.js : 6 h, 11 h, 16 h, 22 h) ──

  // ─────────── « Nouveau depuis ta visite » : repère gardé seulement dans ce navigateur ───────────
  // La visite précédente reste la même pendant toute la session (onglet ouvert), puis on note l'heure de cette visite-ci.
  const PREV_VISIT = (() => { let prev = null;
    try { const ss = sessionStorage.getItem('tw-prev-visit'); if (ss !== null) prev = +ss || null;
      else { prev = +localStorage.getItem('tw-last-visit') || null; sessionStorage.setItem('tw-prev-visit', String(prev || 0)); }
      localStorage.setItem('tw-last-visit', String(Date.now())); } catch { /* stockage bloqué : pas de pastilles */ }
    return prev; })();
  const isNewSince = ts => !!(PREV_VISIT && ts && +ts > PREV_VISIT);
  const newPill = () => '';
  // Ken Burns (manchettes en vedette, photos TVA Sports) : le cadre est toujours rempli (object-fit: cover).
  // La photo glisse lentement d'un bout à l'autre (haut → bas pour une photo en hauteur, gauche → droite si elle est large)
  // en dézoomant puis rezoomant : on finit par voir toute la photo. Mouvements lents (18 s d'un bout à l'autre) avec des arrêts
  // de 5,5 s en haut, en bas et parfois au milieu. Les 2 vedettes ont des parcours différents et décalés.
  window.kbFit = img => { const f = img.parentElement, W = f.clientWidth, H = f.clientHeight, nw = img.naturalWidth, nh = img.naturalHeight;
    if (!W || !H || !nw || !nh) return;
    const tall = nw / nh < W / H;
    f.style.setProperty('--kbP0', tall ? '50% 0%' : '0% 30%');
    f.style.setProperty('--kbP1', tall ? '50% 100%' : '100% 30%');
    f.style.setProperty('--kbPm', tall ? '50% 50%' : '50% 30%');
    // 2 parcours différents (A : 52,5 s, B : 57 s), le 2e part 20 s plus loin → jamais la même chose en même temps
    const i = [...document.querySelectorAll('.kb-fg')].indexOf(img);
