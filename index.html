<head>

<title>TubeWatch Hockey</title>
<script>
  try { const t = localStorage.getItem('tw-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'); document.documentElement.dataset.theme = t; } catch { document.documentElement.dataset.theme = 'light'; }
</script>
<style>
  /* ───── Fontes (dossier tubewatch/fonts) ─────
     LaPresse Black / Book : titres. Ces fichiers sont des sous-ensembles (extraits d'un PDF) : il leur manque
     des lettres (j k q z ç ê…) et leur espace est vide. Les caractères absents sont complétés automatiquement
     par Kumbh Sans (fonts/kumbh, licence OFL), ajustée à la même taille. Meridien : texte à lire. */
  @font-face { font-family: 'LP Black'; src: url('fonts/LaPresse-Black.ttf') format('truetype'); font-weight: 500 900; font-display: swap;
    unicode-range: U+0021-007E, U+00A1-00FF, U+0131, U+0152-0153, U+02C6, U+2013-2014, U+2018-201E, U+2026, U+2039-203A; }
  @font-face { font-family: 'LP Book'; src: url('fonts/LaPresse-Book.ttf') format('truetype'); font-weight: 100 500; font-display: swap;
    unicode-range: U+0021-007E, U+00A1-00FF, U+0131, U+0152-0153, U+02C6, U+2013-2014, U+2018-201E, U+2026, U+2039-203A; }
  @font-face { font-family: 'LP Black Fill'; src: url('fonts/kumbh/kumbh-sans-latin-800-normal.woff2') format('woff2'); font-weight: 500 900; size-adjust: 90%; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'LP Black Fill'; src: url('fonts/kumbh/kumbh-sans-latin-ext-800-normal.woff2') format('woff2'); font-weight: 500 900; size-adjust: 90%; font-display: swap; unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'LP Book Fill'; src: url('fonts/kumbh/kumbh-sans-latin-400-normal.woff2') format('woff2'); font-weight: 100 500; size-adjust: 90%; font-display: swap; unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+20AC, U+2122, U+2212; }
  @font-face { font-family: 'LP Book Fill'; src: url('fonts/kumbh/kumbh-sans-latin-ext-400-normal.woff2') format('woff2'); font-weight: 100 500; size-adjust: 90%; font-display: swap; unicode-range: U+0100-02AF, U+1E00-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Book.woff') format('woff'); font-weight: 400; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Book%20Italic.woff') format('woff'); font-weight: 400; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Medium.woff') format('woff'); font-weight: 500 600; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Medium%20Italic.woff') format('woff'); font-weight: 500 600; font-style: italic; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Bold.woff') format('woff'); font-weight: 700 900; font-style: normal; font-display: swap; }
  @font-face { font-family: 'Meridien'; src: url('fonts/Meridien%20Bold%20Italic.woff') format('woff'); font-weight: 700 900; font-style: italic; font-display: swap; }
  :root {
    --red: #e3161e;          /* rouge La Presse */
    --red-dark: #b50f16;
    --ink: #141414;
    --ink-2: #2e2e2e;
    --muted: #6b6b6b;
    --line: #d9d6cf;
    --rule: #141414;
    --bg: #f3f1ec;           /* papier journal */
    --card: #ffffff;
    --gray-box: #5c5d5f;     /* encadrés « Le jeu du match » */
    --gray-lt: #e4e3df;
    --gray-bar: #8e8e8e;     /* barre « Sommaire » */
    --yellow: #ffe28a;       /* classement LNH /// EST */
    --yellow-line: #e9c552;
    --nav: #141414;
    --nav-2: #2a2a2a;
    --ch-red: #af1e2d;
    --ch-blue: #192168;
    --rocket: #00843d;
    --radius: 0px;
    --shadow: none;
    --head: 'LP Black', 'LP Black Fill', 'Arial Black', sans-serif;
    --book: 'LP Book', 'LP Book Fill', 'Helvetica Neue', Arial, sans-serif;
    --body: 'Meridien', 'Iowan Old Style', Georgia, serif;
    --ui: 'LP Book', 'LP Book Fill', 'Helvetica Neue', Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased; font-feature-settings: 'cv11', 'ss01'; }
  a { color: inherit; text-decoration: none; }
  img { display: block; max-width: 100%; }
  button { font: inherit; cursor: pointer; }

  /* ───── Header ───── */
  .topbar { background: var(--nav); color: #fff; position: sticky; top: 0; z-index: 50; box-shadow: 0 2px 6px rgba(0,0,0,.35); }
  .topbar-inner { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 22px; padding: 0 16px; height: 56px; }
  .logo { font: italic 800 30px/1 var(--head); letter-spacing: -.5px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
  .logo .tw { color: var(--red); }
  .logo .hk { color: #fff; }
  .logo .dot { width: 8px; height: 8px; background: var(--red); border-radius: 50%; margin-left: 4px; transform: translateY(6px); }
  .nav { display: flex; gap: 2px; height: 100%; }
  .nav a { white-space: nowrap; display: flex; align-items: center; padding: 0 14px; font: 700 16px/1 var(--head); text-transform: uppercase; letter-spacing: .4px; color: #d8d8d8; border-bottom: 3px solid transparent; }
  .nav a:hover { color: #fff; background: var(--nav-2); }
  .nav a.active { color: #fff; border-bottom-color: var(--red); }
  .search { margin-left: auto; position: relative; }
  .search input { width: 260px; background: #2c2d2e; border: 1px solid #3a3b3c; color: #fff; border-radius: 20px; padding: 8px 14px 8px 34px; font-size: 14px; outline: none; }
  .search input:focus { border-color: #777; background: #333; }
  .search svg { position: absolute; left: 11px; top: 9px; opacity: .6; }
  .search-results { position: absolute; right: 0; top: 44px; width: 380px; background: var(--card); color: var(--ink); border-radius: var(--radius); box-shadow: 0 8px 30px rgba(0,0,0,.25); max-height: 70vh; overflow: auto; display: none; }
  .search-results.open { display: block; }
  .sr-group { font: 700 11px var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--muted); padding: 10px 14px 4px; }
  .sr-item { display: flex; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--line); }
  .sr-item:hover { background: #f6f6f6; }
  .sr-item img { flex: 0 0 64px; width: 64px; aspect-ratio: 16/9; object-fit: cover; background: #e5e5e5; border-radius: 3px; }
  .sr-item .t { font-size: 13px; font-weight: 500; line-height: 1.3; }
  .sr-item .s { font-size: 12px; color: var(--muted); }

  /* ───── Scoreboard strip ───── */
  .scorestrip { background: var(--card); border-bottom: 1px solid var(--line); }
  .scorestrip-wrap { max-width: 1280px; margin: 0 auto; display: flex; align-items: stretch; position: relative; }
  .scorestrip-inner { flex: 1; min-width: 0; display: flex; overflow-x: auto; scrollbar-width: none; scroll-behavior: smooth; scroll-snap-type: x proximity; }
  .score { scroll-snap-align: start; }
  .sarrow { flex: 0 0 36px; border: 0; background: var(--card); border-left: 1px solid var(--line); border-right: 1px solid var(--line); display: grid; place-items: center; color: var(--ink); }
  .sarrow:hover { background: #f2f2f2; }
  .sarrow:disabled { color: #ccc; cursor: default; background: var(--card); }
  .sarrow svg { width: 16px; height: 16px; }
  .strip-all { flex: 0 0 auto; border: 0; border-left: 1px solid var(--line); background: var(--card); font: 700 13px var(--head); text-transform: uppercase; letter-spacing: .4px; padding: 0 14px; color: var(--red); }
  .strip-all:hover { background: #fff5f5; }
  .strip-panel { display: none; max-width: 1280px; margin: 0 auto; padding: 12px 16px 16px; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
  .strip-panel.open { display: grid; }
  .strip-panel .score { border: 1px solid var(--line); border-radius: 6px; min-width: 0; }
  .scorestrip-inner::-webkit-scrollbar { display: none; }
  .score { flex: 0 0 auto; min-width: 176px; padding: 8px 14px; border-right: 1px solid var(--line); display: block; }
  .score:hover { background: #f7f7f7; }
  .score .lbl { display: flex; align-items: center; gap: 6px; font: 700 12.5px/1.2 var(--head); text-transform: uppercase; white-space: nowrap; }
  .score .sw { width: 4px; height: 14px; border-radius: 1px; }
  .score .nums { display: flex; gap: 12px; margin-top: 4px; font-size: 11.5px; color: var(--muted); }
  .score .nums b { color: var(--ink); font: 700 15px var(--head); margin-right: 2px; }
  .score-head { flex: 0 0 auto; padding: 8px 14px; display: flex; flex-direction: column; justify-content: center; font: 800 11px/1.2 var(--head); text-transform: uppercase; color: var(--red); letter-spacing: .5px; border-right: 1px solid var(--line); }

  /* ───── Layout ───── */
  main { max-width: 1280px; margin: 0 auto; padding: 18px 16px 60px; }
  .grid-home { display: grid; grid-template-columns: 280px minmax(0, 1fr) 300px; gap: 18px; align-items: start; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; }
  .card-h { font: 800 18px/1 var(--head); text-transform: uppercase; letter-spacing: .2px; padding: 14px 16px 10px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .card-h small { font: 500 12px var(--body); text-transform: none; color: var(--muted); letter-spacing: 0; }
  .card-h.red { border-top: 4px solid var(--red); }
  .card + .card { margin-top: 18px; }
  .pad { padding: 0 16px 16px; }
  .kicker[style*="color:"] { filter: brightness(.78) saturate(1.1); }
  .kicker { font: 700 11.5px/1.2 var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--red); }
  .muted { color: var(--muted); }
  .tag { display: inline-flex; align-items: center; gap: 4px; font: 700 10.5px/1 var(--head); text-transform: uppercase; letter-spacing: .5px; padding: 4px 6px; border-radius: 3px; background: #efefef; color: var(--ink-2); }
  .tag.ai { background: var(--red); color: #fff; }
  .tag.st { background: #e7eefc; color: #1f4fbf; }
  .tag.none { background: #f3f3f3; color: #999; }

  /* Headlines list */
  .headlines { list-style: none; margin: 0; padding: 0 16px 8px; }
  .headlines li { border-top: 1px solid var(--line); }
  .headlines li:first-child { border-top: 0; }
  .headlines a { display: block; padding: 10px 0; font-weight: 500; font-size: 14px; line-height: 1.35; }
  .headlines a:hover .ht { text-decoration: underline; }
  .headlines .hs { display: block; font-size: 11.5px; color: var(--muted); margin-top: 3px; }

  /* Hero */
  .hero { position: relative; display: block; }
  .hero .img { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; }
  .hero .img img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s; }
  .hero:hover .img img { transform: scale(1.02); }
  .hero .img::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 45%, rgba(0,0,0,.85)); }
  .hero .over { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 24px; color: #fff; z-index: 2; }
  .hero .over .kicker { color: #fff; background: var(--red); display: inline-block; padding: 4px 7px; border-radius: 2px; }
  .hero h1 { font: 800 40px/1.02 var(--head); margin: 10px 0 6px; letter-spacing: -.3px; text-shadow: 0 2px 10px rgba(0,0,0,.4); }
  .hero .sub { font-size: 14px; opacity: .9; }
  .hero-body { padding: 18px 24px 22px; }
  .hero-body p { margin: 0 0 12px; font-size: 16px; line-height: 1.6; color: var(--ink-2); }
  .keypoints { margin: 14px 0 0; padding: 0; list-style: none; counter-reset: kp; }
  .keypoints li { counter-increment: kp; position: relative; padding: 9px 0 9px 38px; border-top: 1px solid var(--line); font-size: 14.5px; }
  .keypoints li::before { content: counter(kp); position: absolute; left: 0; top: 8px; width: 26px; height: 26px; display: grid; place-items: center; background: var(--block); color: #fff; font: 800 13px var(--head); border-radius: 50%; }

  /* Feed */
  .feed { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .vcard { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
  .vcard:hover { box-shadow: 0 6px 18px rgba(0,0,0,.14); transform: translateY(-2px); }
  .vcard .thumb { position: relative; aspect-ratio: 16/9; background: #222; }
  .vcard .thumb img { width: 100%; height: 100%; object-fit: cover; }
  .vcard .thumb .tags { position: absolute; left: 8px; bottom: 8px; display: flex; gap: 4px; }
  .vcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
  .vcard .ttl { font: 700 17px/1.2 var(--head); }
  .vcard .meta { margin-top: auto; font-size: 11.5px; color: var(--muted); }
  .section-title { font: 800 20px/1 var(--head); text-transform: uppercase; margin: 26px 0 12px; display: flex; align-items: center; gap: 10px; }
  .section-title::before { content: ''; width: 5px; height: 20px; background: var(--red); }
  .spot { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 12px; }
  .spot .pcard .ph { aspect-ratio: 1 / 1; }
  .spot .pcard .ph .wm { font-size: 48px; }
  .spot .pcard .nm { font-size: 16px; }

  /* Leaderboard */
  .leader { list-style: none; margin: 0; padding: 0 16px 12px; }
  .leader li { display: grid; grid-template-columns: 22px 40px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
  .leader li:first-child { border-top: 0; }
  .leader .rk { font: 800 14px var(--head); color: var(--muted); text-align: center; }
  .leader .nm { font: 700 16px/1.15 var(--head); }
  .leader .nm small { display: block; font: 400 11.5px/1.4 var(--body); color: var(--muted); }
  .leader .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .leader .bar i { display: block; height: 100%; background: var(--red); }
  .leader .val { font: 800 18px var(--head); text-align: right; }
  .leader .val small { display: block; font: 500 10px var(--body); color: var(--muted); text-transform: uppercase; }
  .jersey { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font: 800 16px var(--head); color: #fff; background: radial-gradient(circle at 50% 30%, #d8354a, var(--ch-red) 70%); flex: 0 0 auto; position: relative; overflow: hidden; }
  .jersey.rocket { background: radial-gradient(circle at 50% 30%, #1fa35d, var(--rocket) 70%); }
  .jersey.other { background: radial-gradient(circle at 50% 30%, #999, #666 70%); }
  .jersey img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 12%; background: linear-gradient(180deg, #e9ebee, #cfd3d8); }
  .jersey.has-img { box-shadow: 0 0 0 2px var(--ch-red); }
  .jersey.has-img.rocket { box-shadow: 0 0 0 2px var(--rocket); }
  .jersey.has-img.other { box-shadow: 0 0 0 2px #888; }

  .showlist a { display: flex; align-items: center; gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); font-weight: 500; font-size: 14px; }
  .showlist a:hover { background: #f7f7f7; }
  .showlist .sw { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; }
  .showlist .n { margin-left: auto; font: 700 13px var(--head); color: var(--muted); }

  /* ───── Show page ───── */
  .banner { border-radius: var(--radius); color: #fff; padding: 26px 28px; position: relative; overflow: hidden; box-shadow: var(--shadow); }
  .banner::after { content: ''; position: absolute; right: -60px; top: -60px; width: 280px; height: 280px; border-radius: 50%; background: rgba(255,255,255,.07); }
  .banner h1 { font: 800 38px/1 var(--head); margin: 6px 0 12px; text-transform: uppercase; letter-spacing: -.3px; }
  .banner .kicker { color: rgba(255,255,255,.85); }
  .banner a.ext { font-size: 13px; text-decoration: underline; opacity: .9; }
  .statrow { display: flex; gap: 28px; margin-top: 16px; flex-wrap: wrap; }
  .stat b { display: block; font: 800 30px/1 var(--head); }
  .stat span { font: 700 11px var(--head); text-transform: uppercase; letter-spacing: .5px; opacity: .85; }
  .toolbar { display: flex; gap: 10px; align-items: center; margin: 18px 0 14px; flex-wrap: wrap; }
  .toolbar input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; min-width: 240px; font-size: 14px; background: var(--card); }
  .seg { display: inline-flex; background: var(--card); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
  .seg button { border: 0; background: transparent; padding: 7px 12px; font: 700 12px var(--head); text-transform: uppercase; color: var(--ink-2); }
  .seg button.on { background: var(--block); color: #fff; }

  /* ───── Episode page ───── */
  .grid-story { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 22px; align-items: start; }
  .story { padding: 26px 32px 32px; }
  .story h1 { font: 800 44px/1.04 var(--head); margin: 8px 0 8px; letter-spacing: -.4px; }
  .story .dek { font-size: 17px; color: var(--ink-2); margin: 0 0 16px; }
  .byline { display: flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 10px 0; margin-bottom: 18px; flex-wrap: wrap; }
  .player-embed { position: relative; display: block; aspect-ratio: 16/9; background: #000; border-radius: 4px; overflow: hidden; margin-bottom: 22px; }
  .player-embed img { width: 100%; height: 100%; object-fit: cover; opacity: .85; }
  .player-embed .play { position: absolute; inset: 0; display: grid; place-items: center; }
  .player-embed .play span { width: 74px; height: 74px; border-radius: 50%; background: rgba(204,0,0,.92); display: grid; place-items: center; box-shadow: 0 4px 20px rgba(0,0,0,.4); transition: transform .15s; }
  .player-embed:hover .play span { transform: scale(1.08); }
  .player-embed.is-article img { opacity: 1; }
  .player-embed .read { position: absolute; left: 16px; bottom: 16px; background: rgba(0,0,0,.78); color: #fff; font: 700 14px var(--head); text-transform: uppercase; letter-spacing: .4px; padding: 9px 13px; border-radius: 4px; }
  .player-embed:hover .read { background: var(--red); }
  .tag.art { background: #fff3cd; color: #7a5a00; }
  .story p { font-size: 16.5px; line-height: 1.75; margin: 0 0 16px; }
  .story h2 { font: 800 22px/1.15 var(--head); margin: 28px 0 10px; text-transform: uppercase; }
  .segment { border-left: 4px solid var(--red); padding: 2px 0 2px 16px; margin: 0 0 18px; }
  .segment h3 { font: 700 20px/1.2 var(--head); margin: 0 0 4px; }
  .segment p { font-size: 15.5px; margin: 0; color: var(--ink-2); }
  .pull { margin: 26px 0; padding: 20px 24px; background: var(--block); color: #fff; border-radius: 4px; position: relative; font: italic 700 21px/1.35 var(--head); }
  .pull cite { display: block; margin-top: 8px; font: 600 14px var(--body); font-style: normal; opacity: .75; }
  .segnum { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--red); color: #fff; font: 800 14px var(--head); margin-right: 8px; vertical-align: 2px; }
  .segment p { margin: 0 0 10px; }
  .segment .verdict { font-weight: 600; color: var(--ink); background: #f6f7f8; padding: 8px 12px; border-radius: 4px; }
  .opinions { list-style: none; padding: 0; margin: 0; }
  .opinions li { padding: 10px 0; border-top: 1px solid var(--line); font-size: 15.5px; }
  .opinions li b { display: block; font: 700 13px var(--head); text-transform: uppercase; letter-spacing: .4px; color: var(--red); }
  .quotes { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .quote { margin: 0; background: #fff8e6; border-radius: 6px; padding: 14px 16px; border-left: 4px solid #f2a900; }
  .quote blockquote { margin: 0 0 8px; font: italic 600 18px/1.35 var(--head); }
  .quote figcaption { font-size: 12.5px; color: var(--muted); }
  .lexique { margin: 0; display: grid; gap: 10px; }
  .lexique > div { display: grid; grid-template-columns: minmax(140px, 220px) minmax(0,1fr); gap: 14px; padding: 10px 0; border-top: 1px solid var(--line); }
  .lexique dt { font: 700 18px/1.2 var(--head); color: var(--ch-blue); }
  .lexique dd { margin: 0; font-size: 14.5px; color: var(--ink-2); }
  @media (max-width: 820px) { .lexique > div { grid-template-columns: minmax(0,1fr); gap: 2px; } }
  .pull::before { content: '“'; position: absolute; top: -18px; left: 14px; font: 800 80px/1 Georgia, serif; color: var(--red); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 5px; border: 1px solid var(--line); border-radius: 20px; font-size: 13px; font-weight: 500; background: var(--card); }
  .chip:hover { border-color: var(--ink); }
  .chip .jersey { width: 28px; height: 28px; font-size: 12px; }
  .chip .jersey.has-img { box-shadow: 0 0 0 1.5px var(--ch-red); }
  .plist { list-style: none; margin: 0; padding: 0 16px 12px; }
  .plist li { padding: 10px 0; border-top: 1px solid var(--line); display: flex; gap: 10px; }
  .plist li:first-child { border-top: 0; }
  .plist .who { font-weight: 700; font-size: 14px; }
  .plist .who small { font-weight: 400; color: var(--muted); }
  .plist .ctx { font-size: 13px; color: var(--ink-2); line-height: 1.4; margin-top: 2px; }
  .btn { display: inline-flex; align-items: center; gap: 8px; border: 0; background: var(--red); color: #fff; font: 700 13px var(--head); text-transform: uppercase; letter-spacing: .4px; padding: 10px 14px; border-radius: 4px; }
  .btn:hover { background: var(--red-dark); }
  .btn.ghost { background: var(--card); color: var(--ink); border: 1px solid var(--line); }
  .btn.ghost:hover { border-color: var(--ink); background: var(--card); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .tone { display: inline-block; font: 800 12px var(--head); text-transform: uppercase; padding: 4px 8px; border-radius: 3px; background: #fff3cd; color: #7a5a00; }

  /* ───── Players ───── */
  .team-h { display: flex; align-items: center; gap: 12px; margin: 28px 0 12px; }
  .team-h .logo-dot { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 800 13px var(--head); }
  .team-h h2 { font: 800 24px/1 var(--head); text-transform: uppercase; margin: 0; }
  .group-h { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 14px 0 8px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .pgrid { grid-template-columns: repeat(auto-fill, minmax(168px, 1fr)); gap: 14px; }
  .pcard { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); display: flex; flex-direction: column; position: relative; overflow: hidden; transition: box-shadow .15s, transform .15s; }
  .pcard:hover { box-shadow: 0 10px 24px rgba(0,0,0,.16); transform: translateY(-3px); }
  .pcard .ph { position: relative; aspect-ratio: 1 / 0.92; background: linear-gradient(160deg, var(--ch-blue) 0%, #2a3290 55%, var(--ch-red) 55.3%, #c8283a 100%); overflow: hidden; }
  .pcard.rocket .ph { background: linear-gradient(160deg, #0b2a1a 0%, #134d2e 55%, var(--rocket) 55.3%, #16a353 100%); }
  .pcard.other .ph { background: linear-gradient(160deg, #2b2b2b 0%, var(--text-2) 55%, #5a5a5a 55.3%, #707070 100%); }
  .pcard .ph .wm { position: absolute; right: 8px; top: 2px; font: 800 64px/1 var(--head); color: rgba(255,255,255,.18); letter-spacing: -2px; }
  .pcard .ph img { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); height: 94%; width: auto; max-width: none; transition: transform .25s; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .pcard:hover .ph img { transform: translateX(-50%) scale(1.04); }
  .pcard .ph .ini { position: absolute; inset: 0; display: grid; place-items: center; font: 800 56px/1 var(--head); color: rgba(255,255,255,.9); }
  .pcard .ph .ai { position: absolute; left: 8px; top: 8px; }
  .pcard .info { padding: 10px 12px 12px; }
  .pcard .nm { font: 700 18px/1.1 var(--head); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pcard .nm .n { color: var(--muted); font-weight: 600; margin-right: 4px; }
  .pcard .pos { font-size: 12px; color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pcard .mbar { display: flex; align-items: center; gap: 8px; margin-top: 8px; font: 600 12px var(--body); color: var(--ink-2); }
  .pcard .mbar .b { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .pcard .mbar .b i { display: block; height: 100%; background: var(--red); }
  .pcard.cold .ph { filter: grayscale(.85); opacity: .75; }
  .pcard.cold .info { opacity: .6; }

  .phead { border-radius: var(--radius); color: #fff; padding: 26px 30px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 26px; align-items: center; box-shadow: var(--shadow); background: linear-gradient(120deg, var(--ch-blue) 0%, var(--ch-blue) 55%, var(--ch-red) 55.2%, var(--ch-red) 100%); position: relative; overflow: hidden; }
  .phead.rocket { background: linear-gradient(120deg, #0b2a1a 0%, #0b2a1a 55%, var(--rocket) 55.2%); }
  .phead.other { background: linear-gradient(120deg, #2b2b2b 0%, #2b2b2b 55%, #555 55.2%); }
  .phead .big { font: 800 96px/0.9 var(--head); opacity: .95; min-width: 90px; text-align: center; }
  .phead .shot { position: relative; width: 190px; align-self: end; margin: -26px 0 -26px -10px; height: calc(100% + 52px); min-height: 200px; }
  .phead .shot img { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); height: 100%; max-height: 240px; width: auto; max-width: none; filter: drop-shadow(0 10px 18px rgba(0,0,0,.45)); }
  .phead .wm { position: absolute; left: 150px; top: 50%; transform: translateY(-50%); font: 800 220px/1 var(--head); color: rgba(255,255,255,.08); pointer-events: none; letter-spacing: -6px; }
  .phead > * { position: relative; }
  .phead h1 { font: 800 44px/1 var(--head); margin: 6px 0 8px; text-transform: uppercase; letter-spacing: -.5px; }
  .phead .kicker { color: rgba(255,255,255,.8); }
  .phead .info { font-size: 14px; opacity: .92; }
  .phead .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 10px 26px; background: rgba(0,0,0,.25); padding: 14px 18px; border-radius: 6px; }
  .phead .stats b { display: block; font: 800 28px/1 var(--head); }
  .phead .stats span { font: 700 10.5px var(--head); text-transform: uppercase; letter-spacing: .5px; opacity: .85; }
  .mention { display: grid; grid-template-columns: 168px minmax(0,1fr); gap: 16px; padding: 16px; border-top: 1px solid var(--line); }
  .mention:first-child { border-top: 0; }
  .mention img { border-radius: 4px; width: 168px; aspect-ratio: 16/9; object-fit: cover; }
  .mention .ttl { font: 700 18px/1.2 var(--head); }
  .mention .ctx { margin: 8px 0 0; padding: 10px 12px; background: #fff5f5; border-left: 3px solid var(--red); font-size: 14px; border-radius: 0 4px 4px 0; }
  .mention .snip { margin: 8px 0 0; font-size: 13px; color: var(--ink-2); background: #f6f7f8; padding: 8px 10px; border-radius: 4px; font-style: italic; }
  mark { background: #ffe066; padding: 0 2px; border-radius: 2px; font-style: normal; font-weight: 700; }
  .count-badge { font: 800 12px var(--head); background: var(--block); color: #fff; border-radius: 10px; padding: 2px 8px; }

  .notice { background: var(--card); border-left: 4px solid var(--red); padding: 18px 20px; border-radius: 4px; box-shadow: var(--shadow); }
  .notice code { background: #f1f1f1; padding: 2px 6px; border-radius: 3px; }
  footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px; }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--block); color: #fff; padding: 10px 18px; border-radius: 4px; font-size: 14px; opacity: 0; transition: .2s; pointer-events: none; z-index: 100; }
  .toast.show { opacity: 1; transform: translateX(-50%); }

  /* ───── À la une (lead) ───── */
  .lead-h { display: flex; align-items: center; justify-content: space-between; margin: 0 0 12px; }
  .shuffle { padding: 8px 12px; font-size: 13px; }
  .lead { display: grid; grid-template-columns: minmax(0, 1.75fr) minmax(0, 1fr); gap: 18px; margin-bottom: 18px; align-items: start; }
  .lead.solo { grid-template-columns: minmax(0, 1fr); }
  .lead .hero h1 { font-size: 46px; }
  .accroche { font-weight: 600; color: var(--ink) !important; font-size: 18px !important; }
  .lead-side { display: grid; gap: 18px; }
  .side { display: block; transition: box-shadow .15s, transform .15s; }
  .side:hover { box-shadow: 0 8px 22px rgba(0,0,0,.16); transform: translateY(-2px); }
  .side .img { position: relative; aspect-ratio: 16/9; background: #111; overflow: hidden; }
  .side .img img { width: 100%; height: 100%; object-fit: cover; transition: transform .35s; }
  .side:hover .img img { transform: scale(1.04); }
  .side .img .kicker { position: absolute; left: 12px; bottom: 12px; background: var(--red); color: #fff; padding: 4px 7px; border-radius: 2px; filter: none; }
  .side .bd { padding: 14px 16px 16px; }
  .side h2 { font: 800 24px/1.08 var(--head); margin: 0 0 8px; letter-spacing: -.2px; }
  .side p { margin: 0 0 10px; font-size: 14px; color: var(--ink-2); line-height: 1.5; }
  .side .more { font: 700 13px var(--head); text-transform: uppercase; letter-spacing: .4px; color: var(--red); }
  .plink { font-weight: 700; color: inherit; border-bottom: 1px dotted rgba(204,0,0,.5); }
  .plink:hover { border-bottom-color: var(--red); }
  .st-sub { font: 500 13px var(--body); text-transform: none; color: var(--muted); }
  .src { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font: 700 12.5px var(--head); text-transform: uppercase; letter-spacing: .4px; color: var(--muted); }
  .src:hover { color: var(--ink); }
  .src .sw { width: 8px; height: 8px; border-radius: 2px; }

  /* Mur de répliques */
  .qwall { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .qcard { margin: 0; background: var(--card); border-radius: 8px; box-shadow: var(--shadow); padding: 20px 20px 16px; position: relative; border-top: 4px solid var(--c, var(--red)); overflow: hidden; }
  .qcard::before { content: '“'; position: absolute; right: 12px; top: -14px; font: 800 110px/1 Georgia, serif; color: var(--c, var(--red)); opacity: .14; }
  .qcard blockquote { margin: 0 0 12px; font: italic 700 21px/1.3 var(--head); color: var(--ink); position: relative; }
  .qcard figcaption { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .qcard figcaption b { color: var(--ink); font: 700 14px var(--head); text-transform: uppercase; letter-spacing: .4px; }
  .qcard.big { grid-column: 1 / -1; background: var(--block); color: #fff; border-top: 0; border-left: 6px solid var(--red); padding: 26px 30px 20px; }
  .qcard.big::before { color: var(--red); opacity: .9; font-size: 150px; top: -26px; right: 22px; }
  .qcard.big blockquote { color: #fff; font-size: 30px; line-height: 1.2; max-width: 90%; }
  .qcard.big figcaption, .qcard.big .src { color: rgba(255,255,255,.7); }
  .qcard.big figcaption b { color: #fff; }
  .qcard.big .plink { border-bottom-color: rgba(255,255,255,.4); }

  /* Boule de cristal (bande vedette) */
  .crystal { position: relative; margin: 0 0 22px; padding: 24px 24px 18px; border-radius: 10px; color: #fff; overflow: hidden;
    background: radial-gradient(900px 300px at 85% -10%, rgba(140, 90, 255, .45), transparent 60%), radial-gradient(700px 260px at 0% 110%, rgba(204, 0, 0, .45), transparent 60%), linear-gradient(135deg, #0d0f1f, #1b1440 60%, #12132b); box-shadow: 0 8px 28px rgba(12, 10, 40, .35); }
  .crystal::after { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,255,.35) 1px, transparent 1.5px); background-size: 46px 46px; opacity: .12; pointer-events: none; }
  .crystal > * { position: relative; z-index: 1; }
  .crystal-h { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 16px; flex-wrap: wrap; }
  .crystal-title { font: italic 800 44px/0.95 var(--head); text-transform: uppercase; letter-spacing: -.5px; background: linear-gradient(90deg, #fff, #d9c8ff 60%, #ff9aa8); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .crystal-title .orb { -webkit-text-fill-color: initial; display: inline-block; animation: orb 4s ease-in-out infinite; }
  @keyframes orb { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-4px) rotate(4deg); } }
  .crystal-sub { font-size: 14px; color: rgba(255,255,255,.7); margin-top: 6px; }
  .crystal-nav { display: flex; align-items: center; gap: 8px; }
  .crystal-count { font: 700 14px var(--head); letter-spacing: .5px; color: rgba(255,255,255,.75); margin-right: 6px; text-transform: uppercase; }
  .cnav { width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3); background: rgba(255,255,255,.08); color: #fff; display: grid; place-items: center; transition: background .15s, transform .15s; }
  .cnav:hover:not(:disabled) { background: var(--red); border-color: var(--red); transform: scale(1.06); }
  .cnav:disabled { opacity: .3; cursor: default; }
  .cnav svg { width: 18px; height: 18px; }
  .takes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .takes.flip .take { animation: takeIn .4s cubic-bezier(.2,.8,.2,1) both; }
  .takes.flip .take:nth-child(2) { animation-delay: .03s; } .takes.flip .take:nth-child(3) { animation-delay: .06s; }
  .takes.flip .take:nth-child(4) { animation-delay: .09s; } .takes.flip .take:nth-child(n+5) { animation-delay: .12s; }
  @keyframes takeIn { from { opacity: 0; transform: translateY(10px) scale(.98); } to { opacity: 1; transform: none; } }
  .take { position: relative; display: flex; flex-direction: column; gap: 12px; padding: 16px 18px 14px; border-radius: 14px;
    background: linear-gradient(160deg, rgba(255,255,255,.09), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08); transition: transform .2s, background .2s, border-color .2s; overflow: hidden; }
  .take::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); box-shadow: 0 0 18px var(--c); }
  .take:hover { transform: translateY(-2px); background: linear-gradient(160deg, rgba(255,255,255,.13), rgba(255,255,255,.05)); border-color: color-mix(in srgb, var(--c) 60%, white 10%); }
  .take-who { display: flex; align-items: center; gap: 12px; }
  .take-id { min-width: 0; }
  .take .who { font: 800 19px/1.05 var(--head); text-transform: uppercase; letter-spacing: .3px; color: #fff; }
  .take .show { display: flex; align-items: center; gap: 6px; margin-top: 3px; font: 600 12px var(--body); color: rgba(255,255,255,.6); }
  .take .show .sw { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 8px var(--c); }
  .bubble { position: relative; background: rgba(255,255,255,.95); color: #141527; border-radius: 12px; padding: 12px 15px; margin-left: 4px; }
  .bubble::before { content: ''; position: absolute; top: -8px; left: 26px; border: 8px solid transparent; border-top: 0; border-bottom-color: rgba(255,255,255,.95); }
  .bubble p { margin: 0; font: 600 19px/1.28 var(--head); }
  .bubble .plink { border-bottom-color: rgba(204,0,0,.5); }
  .take .src { margin-top: 0; color: rgba(255,255,255,.55); font-size: 12px; }
  .take .src:hover { color: #fff; }
  .crystal-dots { display: flex; justify-content: center; gap: 6px; margin-top: 16px; }
  .crystal-dots button { width: 8px; height: 8px; border-radius: 4px; border: 0; background: rgba(255,255,255,.3); padding: 0; transition: width .2s, background .2s; }
  .crystal-dots button.on { width: 22px; background: var(--card); }

  /* Visages (headshots des animateurs) */
  .faces { display: inline-flex; flex: 0 0 auto; }
  .faces .face + .face { margin-left: -14px; }
  .face { position: relative; width: 40px; height: 40px; border-radius: 50%; overflow: hidden; flex: 0 0 auto; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 35%, color-mix(in srgb, var(--c, #555) 70%, white 20%), color-mix(in srgb, var(--c, #333) 80%, black 30%));
    box-shadow: 0 0 0 2px #fff, 0 3px 10px rgba(0,0,0,.25); }
  .face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 15%; }
  .face.pl img { transform: translateY(-15%) scale(2); transform-origin: 50% 22%; } /* photos LNH : tête trop petite dans le cercle */
  .switch { display: inline-flex; align-items: center; gap: 10px; font: 700 14px var(--head); text-transform: uppercase; letter-spacing: .4px; cursor: pointer; user-select: none; }
  .switch small { font: 600 12px var(--body); color: var(--muted); text-transform: none; }
  .switch input { position: absolute; opacity: 0; pointer-events: none; }
  .switch .track { width: 42px; height: 24px; border-radius: 12px; background: #cfd3d8; position: relative; transition: background .2s; }
  .switch .knob { position: absolute; top: 3px; left: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.3); transition: transform .2s; }
  .switch input:checked + .track { background: var(--red); }
  .switch input:checked + .track .knob { transform: translateX(18px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--ch-blue); outline-offset: 2px; }
  .face b { font: 800 14px var(--head); color: #fff; }
  .face img + b { display: none; }
  .face.lg { width: 64px; height: 64px; box-shadow: 0 0 0 3px var(--c, #fff), 0 0 22px color-mix(in srgb, var(--c, #fff) 55%, transparent), 0 6px 16px rgba(0,0,0,.4); }
  .faces .face.lg + .face.lg { margin-left: -20px; }
  .face.lg b { font-size: 20px; }
  .face.md { width: 46px; height: 46px; }
  .face.sm { width: 34px; height: 34px; }
  .faces .face.sm + .face.sm { margin-left: -10px; }
  .face.xs { width: 22px; height: 22px; box-shadow: 0 0 0 1.5px #fff; }
  .faces .face.xs + .face.xs { margin-left: -7px; }
  .face.xs b { font-size: 9px; }
  .hosts { display: inline-flex; align-items: center; gap: 6px; }
  .qcard figcaption { flex-direction: row !important; align-items: center; gap: 10px !important; }
  .qcard .qc-txt { display: flex; flex-direction: column; gap: 2px; }
  .opinions li { display: flex; gap: 12px; align-items: flex-start; }
  .opinions li .faces { --c: var(--ch-blue); }
  .lead-note { font: 700 12px var(--head); text-transform: uppercase; letter-spacing: .5px; color: var(--muted); }

  /* Expression du jour */
  .expr .ex { font: 800 30px/1.1 var(--head); color: var(--ch-blue); margin-bottom: 8px; }
  .expr p { margin: 0; font-size: 14px; color: var(--ink-2); }

  /* ───── Experts ───── */
  .xhero { position: relative; overflow: hidden; border-radius: 12px; padding: 28px 28px 22px; color: #fff; margin-bottom: 6px;
    background: radial-gradient(800px 260px at 90% -20%, rgba(140,90,255,.5), transparent 60%), radial-gradient(600px 240px at 0% 120%, rgba(204,0,0,.45), transparent 60%), linear-gradient(135deg, #0d0f1f, #1b1440 60%, #12132b); }
  .xhero h1 { font: italic 800 52px/0.95 var(--head); text-transform: uppercase; margin: 6px 0 8px; letter-spacing: -.5px; }
  .xhero p { margin: 0; max-width: 640px; color: rgba(255,255,255,.75); font-size: 15px; }
  .xhero-faces { display: flex; flex-wrap: wrap; gap: 0; margin-top: 18px; }
  .xhero-faces a { margin-right: -10px; transition: transform .15s; }
  .xhero-faces a:hover { transform: translateY(-4px); z-index: 2; }
  .xhero-faces .face { box-shadow: 0 0 0 3px #1b1440, 0 4px 12px rgba(0,0,0,.4); }
  .xgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 16px; }
  .xcard { position: relative; background: var(--card); border-radius: 12px; box-shadow: var(--shadow); padding: 18px; display: flex; flex-direction: column; gap: 12px; overflow: hidden; transition: transform .15s, box-shadow .15s; border-top: 4px solid var(--c); }
  .xcard::after { content: ''; position: absolute; right: -60px; top: -60px; width: 180px; height: 180px; border-radius: 50%; background: radial-gradient(circle, color-mix(in srgb, var(--c) 22%, transparent), transparent 70%); pointer-events: none; }
  .xcard:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.15); }
  .xcard.quiet { opacity: .72; }
  .xtop { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .xid { min-width: 0; }
  .xname { font: 800 24px/1 var(--head); text-transform: uppercase; letter-spacing: -.2px; }
  .xshows { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
  .xshow { display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px var(--body); color: var(--ink-2); background: #f2f3f5; border-radius: 20px; padding: 3px 9px 3px 7px; }
  .xshow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--sc); }
  .xstats { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); }
  .xstats b { font: 800 17px var(--head); color: var(--ink); margin-right: 2px; }
  .xbubble { position: relative; background: #141527; color: #fff; border-radius: 12px; padding: 12px 14px; margin-top: 4px; }
  .xbubble::before { content: ''; position: absolute; top: -7px; left: 30px; border: 7px solid transparent; border-top: 0; border-bottom-color: #141527; }
  .xbubble p { margin: 0 0 6px; font: 600 17px/1.28 var(--head); }
  .xbubble span { font-size: 11.5px; color: rgba(255,255,255,.55); }
  .xbubble.empty { background: #f2f3f5; color: var(--muted); }
  .xbubble.empty::before { border-bottom-color: #f2f3f5; }
  .xbubble.empty p { font-weight: 500; font-size: 15px; margin: 0; }
  .face.xl { width: 72px; height: 72px; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--c), 0 6px 16px rgba(0,0,0,.2); }
  .face.xl b { font-size: 22px; }
  .face.xxl { width: 150px; height: 150px; box-shadow: 0 0 0 5px rgba(255,255,255,.9), 0 0 40px color-mix(in srgb, var(--c) 70%, transparent), 0 12px 30px rgba(0,0,0,.45); }
  .face.xxl b { font-size: 44px; }
  .xhead { position: relative; overflow: hidden; border-radius: 12px; color: #fff; padding: 28px 30px; display: grid; grid-template-columns: auto minmax(0,1fr) auto; gap: 28px; align-items: center;
    background: radial-gradient(700px 300px at 10% 50%, color-mix(in srgb, var(--c) 55%, transparent), transparent 70%), linear-gradient(135deg, #0d0f1f, #1b1440 70%, #12132b); box-shadow: var(--shadow); }
  .xhead h1 { font: italic 800 52px/0.95 var(--head); text-transform: uppercase; margin: 6px 0 10px; letter-spacing: -.5px; }
  .xhead .kicker { color: rgba(255,255,255,.7); }
  .xhead .xshow { background: rgba(255,255,255,.12); color: #fff; }
  .xhead .stats { display: grid; grid-template-columns: repeat(2, auto); gap: 10px 26px; background: rgba(0,0,0,.28); padding: 14px 18px; border-radius: 8px; }
  .xhead .stats b { display: block; font: 800 26px/1 var(--head); }
  .xhead .stats span { font: 700 10.5px var(--head); text-transform: uppercase; letter-spacing: .5px; opacity: .8; }
  .xcrystal { margin: 0 0 8px; }
  .takes.one { grid-template-columns: minmax(0, 1fr); }
  .xmini { display: flex; flex-direction: column; padding: 0 16px 12px; }
  .xmini a { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-top: 1px solid var(--line); font: 700 15px var(--head); }
  .xmini a:first-child { border-top: 0; }
  .xmini small { margin-left: auto; font: 700 13px var(--head); color: var(--muted); }
  a.take-who:hover .who { text-decoration: underline; text-decoration-color: var(--c); text-underline-offset: 3px; }

  /* ───── Sélecteur d'équipes ───── */
  .tpicker { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 12px; align-items: center; }
  .tpick { display: inline-flex; flex-direction: column; align-items: center; gap: 2px; width: 58px; padding: 6px 2px 5px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); font: 700 10.5px var(--head); color: var(--ink-2); transition: transform .12s, border-color .12s, box-shadow .12s; }
  .tpick:hover { transform: translateY(-2px); border-color: #bbb; }
  .tpick.on { border-color: var(--red); box-shadow: 0 0 0 2px var(--red); color: var(--red); }
  .tsep { width: 1px; height: 40px; background: var(--line); margin: 0 6px; }
  .tlogo { width: 30px; height: 30px; object-fit: contain; }
  .tlogo.sm { width: 24px; height: 24px; }
  .tlogo.md { width: 26px; height: 26px; }
  .tlogo.lg { width: 56px; height: 56px; }
  .tlogo-txt { display: inline-grid; place-items: center; border-radius: 50%; background: var(--rocket); color: #fff; font: 800 11px var(--head); }
  .tlogo.lg.tlogo-txt { font-size: 16px; }
  .team-h .team-sub { font-size: 13px; color: var(--muted); margin-top: 3px; }
  .phead .kicker .tlogo { background: rgba(255,255,255,.9); border-radius: 50%; padding: 2px; }
  .pcard .ph .ph-logo { position: absolute; left: 8px; bottom: 8px; background: rgba(255,255,255,.92); border-radius: 50%; padding: 3px; display: grid; place-items: center; }

  /* ───── Buzz ───── */
  .buzz-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 28px 0 12px; }
  .buzz-h .section-title { margin: 0; }
  .buzz-h .sub { font-size: 13px; color: var(--muted); }
  .seg.win button { padding: 6px 11px; }
  .trend { display: inline-flex; align-items: center; gap: 2px; font: 800 12px/1 var(--head); letter-spacing: .3px; white-space: nowrap; }
  .trend.up { color: #0a8a3a; } .trend.down { color: #c62828; } .trend.flat { color: #9a9a9a; }
  .trend.new { color: #fff; background: #0a8a3a; padding: 3px 5px; border-radius: 3px; font-size: 10.5px; text-transform: uppercase; }
  .spark { display: block; overflow: visible; }
  .spark .ln { fill: none; stroke: var(--red); stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .spark .ar { fill: rgba(204,0,0,.12); stroke: none; }
  .spark .dt { fill: var(--red); }
  .fire { display: inline-flex; align-items: center; gap: 3px; background: linear-gradient(90deg, #ff6a00, #e10000); color: #fff; font: 800 10.5px/1 var(--head); text-transform: uppercase; letter-spacing: .5px; padding: 4px 6px; border-radius: 3px; }
  .bscore { font: 800 22px/1 var(--head); }
  .bscore small { display: block; font: 600 9.5px/1.3 var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }

  /* Le vestiaire du CH */
  .vest { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 14px; }
  .vcardp { background: var(--card); border-radius: 8px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; transition: box-shadow .15s, transform .15s; }
  .vcardp:hover { box-shadow: 0 10px 24px rgba(0,0,0,.16); transform: translateY(-3px); }
  .vcardp .top { position: relative; height: 128px; background: linear-gradient(160deg, var(--ch-blue) 0%, #2a3290 55%, var(--ch-red) 55.3%, #c8283a 100%); overflow: hidden; color: #fff; }
  .vcardp.rocket .top { background: linear-gradient(160deg, #0b2a1a 0%, #134d2e 55%, var(--rocket) 55.3%, #16a353 100%); }
  .vcardp .top img { position: absolute; right: 4px; bottom: 0; height: 118%; width: auto; max-width: none; filter: drop-shadow(0 6px 10px rgba(0,0,0,.35)); }
  .vcardp .top .rk { position: absolute; left: 12px; top: 10px; font: italic 800 34px/1 var(--head); opacity: .95; }
  .vcardp .top .id { position: absolute; left: 12px; bottom: 8px; right: 96px; display: flex; flex-direction: column; gap: 3px; }
  .vcardp .top .num { font: 800 13px var(--head); opacity: .8; }
  .vcardp .top .nm { font: 800 21px/1 var(--head); text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,.4); }
  .vest .vcardp:first-child { grid-column: 1 / -1; }
  .vest .vcardp:first-child .top { height: 170px; }
  .vest .vcardp:first-child .top .nm { font-size: 34px; }
  .vest .vcardp:first-child .top .rk { font-size: 48px; }
  .vcardp .mid { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px 6px; border-bottom: 1px solid var(--line); }
  .vcardp .bd { padding: 8px 12px 12px; font-size: 13px; color: var(--ink-2); display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .vcardp .ctx { line-height: 1.45; }
  .vcardp .op { display: grid; grid-template-columns: 30px minmax(0,1fr); gap: 8px; align-items: start; background: #f6f7f8; border-radius: 6px; padding: 7px 8px; font-size: 12.5px; }
  .vcardp .op b { display: block; font: 700 11px var(--head); text-transform: uppercase; color: var(--red); letter-spacing: .3px; }
  .vcardp .foot { margin-top: auto; font: 700 11.5px var(--head); text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }

  /* Classement buzz (LNH / CH) */
  .blist { list-style: none; margin: 0; padding: 0 16px 10px; }
  .blist li { display: grid; grid-template-columns: 22px 44px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 9px 0; border-top: 1px solid var(--line); }
  .blist li:first-child { border-top: 0; }
  .blist .rk { font: 800 15px var(--head); color: var(--muted); text-align: center; }
  .blist .who { min-width: 0; }
  .blist .nm { font: 700 16.5px/1.15 var(--head); display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .blist .nm .tlogo { width: 18px; height: 18px; }
  .blist .meta { font-size: 11.5px; color: var(--muted); }
  .blist .snip { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; line-height: 1.4; }
  .blist .bar { height: 4px; background: var(--line); border-radius: 2px; margin-top: 5px; overflow: hidden; }
  .blist .bar i { display: block; height: 100%; background: linear-gradient(90deg, #ff6a00, var(--red)); }
  .blist .right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .blist.compact li { grid-template-columns: 20px 36px minmax(0,1fr) auto; padding: 7px 0; }
  .blist.compact .nm { font-size: 15px; }
  .blist .jersey { width: 40px; height: 40px; }
  .blist.compact .jersey { width: 34px; height: 34px; }
  .blist .face.pl { width: 44px; height: 44px; }
  .buzz-empty { padding: 18px 16px; color: var(--muted); font-size: 14px; }

  /* Joueurs : radar, badges */
  .radar { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; margin: 4px 0 8px; }
  .radar .vcardp .top { height: 112px; }
  .pcard .prank { position: absolute; left: 8px; top: 6px; font: italic 800 26px/1 var(--head); color: #fff; text-shadow: 0 2px 6px rgba(0,0,0,.45); }
  .pcard .bbadge { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff; font: 800 12px/1 var(--head); padding: 4px 6px; border-radius: 3px; display: inline-flex; gap: 5px; align-items: center; }
  .pcard .bbadge .trend.up { color: #5ee08b; } .pcard .bbadge .trend.down { color: #ff8a80; }
  .pcard .bbadge .trend.new { background: #0a8a3a; color: #fff; padding: 2px 4px; }
  .subbar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin: 0 0 12px; }
  .subbar .lbl { font: 700 12px var(--head); text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }
  .chipf { border: 1px solid var(--line); background: var(--card); border-radius: 16px; padding: 5px 12px; font: 700 12.5px var(--head); text-transform: uppercase; color: var(--ink-2); }
  .chipf.on { background: var(--block); color: #fff; border-color: var(--ink); }

  /* Fiche joueur : buzz */
  .bpanel .pad { padding: 4px 16px 16px; }
  .bnums { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; text-align: center; margin-bottom: 12px; }
  .bnums > div { background: #f6f7f8; border-radius: 6px; padding: 8px 4px; }
  .bnums b { display: block; font: 800 24px/1 var(--head); }
  .bnums span { font: 600 10px var(--body); text-transform: uppercase; color: var(--muted); letter-spacing: .4px; }
  .branks { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; margin-top: 10px; }
  .branks b { font: 800 18px var(--head); }
  .spark-days { display: flex; justify-content: space-between; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .xsay { list-style: none; margin: 0; padding: 0 16px 8px; }
  .xsay li { display: grid; grid-template-columns: 44px minmax(0,1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--line); }
  .xsay li:first-child { border-top: 0; }
  .xsay .who { font: 700 13px var(--head); text-transform: uppercase; color: var(--red); letter-spacing: .3px; }
  .xsay p { margin: 2px 0 4px; font-size: 15px; }
  .xsay .src { font-size: 12px; color: var(--muted); }
  .xsay .src:hover { color: var(--red); }
  .xsay blockquote { margin: 2px 0 4px; font: 600 17px/1.35 var(--body); }
  .xsay .verdict { font-size: 13.5px; font-weight: 600; background: #f6f7f8; padding: 6px 10px; border-radius: 4px; margin: 4px 0; }
  @media (max-width: 820px) { .radar { grid-template-columns: minmax(0,1fr); } }

  @media (max-width: 1100px) {
    .grid-home { grid-template-columns: minmax(0,1fr) 300px; }
    .grid-home > .col-left { display: none; }
  }
  @media (max-width: 820px) {
    .lead { grid-template-columns: minmax(0,1fr); }
    .lead .hero h1 { font-size: 30px; }
    .qwall { grid-template-columns: minmax(0,1fr); }
    .qcard.big blockquote { font-size: 23px; }
    .take p { font-size: 17px; }
    .takes { grid-template-columns: minmax(0,1fr); }
    .xhead { grid-template-columns: minmax(0,1fr); text-align: left; }
    .face.xxl { width: 110px; height: 110px; }
    .xhead h1, .xhero h1 { font-size: 36px; }
    .face.lg { width: 52px; height: 52px; }
    .bubble p { font-size: 17px; }
    .crystal { padding: 18px 14px 14px; }
    .crystal-title { font-size: 32px; }
    .grid-home, .grid-story { grid-template-columns: minmax(0,1fr); }
    .topbar-inner { flex-wrap: wrap; height: auto; padding: 8px 16px 10px; gap: 6px 14px; }
    .nav { height: 40px; }
    .nav a { padding: 0 8px; font-size: 12.5px; }
    .search { order: 3; width: 100%; margin-left: 0; }
    .search input { width: 100%; }
    .search-results { width: 100%; right: 0; }
    .phead > div { min-width: 0; }
    .phead h1 { overflow-wrap: anywhere; }
    .banner h1 { font-size: 28px; overflow-wrap: anywhere; }
    .hero h1, .story h1 { font-size: 26px; }
    .story { padding: 20px; }
    .phead { grid-template-columns: auto minmax(0,1fr); }
    .phead .stats { grid-column: 1 / -1; }
    .phead .big { font-size: 64px; }
    .phead .shot { width: 110px; min-height: 130px; margin: -26px 0 -8px -10px; }
    .phead .wm { font-size: 140px; left: 60px; }
    .phead h1 { font-size: 30px; }
    .mention { grid-template-columns: minmax(0,1fr); }
    .mention img { width: 100%; }
    .logo { font-size: 20px; }
  }

  /* ═════════════════════ THÈME « LA PRESSE » (version papier, touche moderne) ═════════════════════ */
  body { font: 16px/1.6 var(--body); font-feature-settings: normal; background: var(--bg); }
  ::selection { background: var(--yellow); }
  h1, h2, h3 { font-weight: normal; }

  /* En-tête : ligne de date + barre de navigation */
  .dateline-bar { background: var(--card); border-bottom: 1px solid var(--line); }
  .dateline-inner { max-width: 1280px; margin: 0 auto; padding: 10px 16px 8px; display: flex; align-items: center; gap: 16px; }
  .lp-logo { display: inline-flex; align-items: center; gap: 12px; }
  .lp-logo .pill { background: var(--red); color: #fff; font: 900 17px/1 var(--head); letter-spacing: .6px; padding: 5px 10px 4px; border-radius: 6px; }
  .lp-logo .url { font: 900 15px var(--head); color: var(--red); letter-spacing: .2px; }
  .dateline { font: 400 14px var(--book); letter-spacing: 3.2px; text-transform: uppercase; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .topbar { background: var(--card); color: var(--ink); box-shadow: none; border-bottom: 4px solid var(--rule); }
  .topbar-inner { height: 52px; }
  .nav a { color: var(--ink); font: 900 17px/1 var(--head); letter-spacing: .3px; border-bottom: 4px solid transparent; margin-bottom: -4px; }
  .nav a:hover { color: var(--red); background: transparent; }
  .nav a.active { color: var(--red); border-bottom-color: var(--red); }
  .search input { background: var(--card); border: 1px solid var(--rule); color: var(--ink); border-radius: 0; font: 400 15px var(--book); }
  .search input:focus { background: var(--card); border-color: var(--red); }
  .search svg { stroke: var(--ink); }
  .search-results { border-radius: 0; border: 1px solid var(--rule); box-shadow: 0 10px 30px rgba(0,0,0,.18); }
  .sr-group { font: 900 12px var(--head); letter-spacing: 1.2px; color: var(--red); }
  .sr-item .t { font: 500 14px var(--body); }
  .sr-item .s, .sr-item img { font-family: var(--ui); border-radius: 0; }

  /* Bandeau des émissions (comme la bande de résultats) */
  .scorestrip { background: var(--bg); border-bottom: 1px solid var(--line); }
  .score, .score-head, .sarrow, .strip-all { background: transparent; }
  .score .lbl { font: 900 13px/1.2 var(--head); letter-spacing: .2px; }
  .score .nums { font: 400 12px var(--ui); }
  .score .nums b { font: 900 15px var(--head); }
  .score-head { font: 400 12px/1.2 var(--book); letter-spacing: 1.5px; color: var(--red); }
  .strip-all { font: 900 13px var(--head); }

  /* Bandeau du haut : derniers médias (cartes défilantes) */
  .scorestrip-inner { gap: 12px; padding: 12px 12px 14px; align-items: stretch; }
  .scorestrip .score-head { flex: 0 0 auto; align-self: center; padding: 0 4px 0 2px; font: 400 12px/1.25 var(--book); letter-spacing: 1.5px; text-transform: uppercase; color: var(--red); }
  .mcard { flex: 0 0 236px; scroll-snap-align: start; border-radius: 0; box-shadow: none; border: 1px solid var(--line); }
  .mcard:hover { transform: none; box-shadow: 0 4px 12px rgba(0,0,0,.10); }
  .mcard .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 5px; flex: 1; }
  .mcard .kicker { font: 400 11.5px/1.2 var(--book); letter-spacing: 1.2px; text-transform: uppercase; }
  .mcard .ttl { font: 900 16px/1.15 var(--head); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .mcard .meta { margin-top: auto; font: 400 12.5px var(--book); color: var(--muted); }
  .mcard .thumb .tags .tag { font-size: 10.5px; }
  /* Vignette toujours au même format (16:9), peu importe l'image (TVA Sports : images carrées) */
  .mcard .thumb { aspect-ratio: 16/9; height: auto; min-height: 0; overflow: hidden; flex: none; }
  .mcard .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; }
  .mcard .thumb .tags { z-index: 1; }
  /* Articles : effet Ken Burns (zoom et glissement lents, comme un écran de chargement) */
  @keyframes kb1 { from { transform: scale(1.04) translate(-2%, 2%); } to { transform: scale(1.28) translate(3%, -4%); } }
  @keyframes kb2 { from { transform: scale(1.26) translate(3%, 3%); } to { transform: scale(1.04) translate(-3%, -2%); } }
  @keyframes kb3 { from { transform: scale(1.06) translate(3%, -3%); } to { transform: scale(1.3) translate(-4%, 3%); } }
  .mcard.art .thumb img { animation: kb1 16s ease-in-out infinite alternate; will-change: transform; transform-origin: 50% 40%; }
  .mcard.art:nth-child(3n) .thumb img { animation-name: kb2; animation-duration: 19s; }
  .mcard.art:nth-child(3n+1) .thumb img { animation-name: kb3; animation-duration: 17s; }
  .mcard.art:nth-child(2n) .thumb img { animation-delay: -6s; }
  .mcard.art:hover .thumb img { animation-play-state: paused; }
  @media (prefers-reduced-motion: reduce) { .mcard.art .thumb img { animation: none; } }
  .scorestrip .sarrow { flex: 0 0 40px; }
  .scorestrip .strip-all { display: grid; place-items: center; text-align: center; line-height: 1.15; }
  @media (max-width: 700px) { .mcard { flex-basis: 200px; } .scorestrip .score-head { display: none; } .scorestrip .strip-all { display: none; } }

  /* Manchettes (IA, 4 éditions par jour) — au-dessus du bandeau des derniers médias */
  .manchettes[hidden] { display: none; }
  .manchettes { margin: 0 0 26px; }
  .mh-wrap { max-width: none; margin: 0; padding: 0; }
  .mh-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; background: var(--red); color: #fff; padding: 8px 14px 4px; border-bottom: 5px solid #b9b9b9; }
  .mh-head h2 { margin: 0; font: 400 clamp(32px, 4vw, 50px)/1 var(--book); text-transform: uppercase; letter-spacing: -.5px; }
  .mh-head .mh-ed { font: 900 14px var(--head); text-transform: uppercase; letter-spacing: .5px; }
  .mh-head .mh-note { margin-left: auto; font: 400 12px var(--book); letter-spacing: 1px; text-transform: uppercase; opacity: .9; }
  .mh-grid { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 0; background: var(--card); border: 1px solid var(--line); border-top: 0; }
  .mh-heroes { display: flex; flex-direction: column; border-right: 1px solid var(--line); }
  .mh-lead { padding: 18px 20px 20px; }
  .mh-lead.sec { border-top: 1px solid var(--line); }
  .mh-lead.sec .mh-img { aspect-ratio: 2/1; }
  .mh-lead.sec h3 { font-size: clamp(22px, 2.1vw, 28px); }
  .mh-lead.sec p { font-size: 16px; }
  .mh-item.ch { background: var(--yellow); }
  .mh-item.ch { border-bottom-color: var(--yellow-line); }
  .mh-lead .mh-img { display: block; aspect-ratio: 16/9; overflow: hidden; background: #222; margin-bottom: 14px; }
  .mh-lead .mh-img img { width: 100%; height: 100%; object-fit: cover; }
  .mh-lead h3 { margin: 0 0 8px; font: 900 clamp(26px, 2.6vw, 36px)/1.05 var(--head); letter-spacing: -.5px; }
  .mh-lead p { margin: 0 0 10px; font: 400 17px/1.5 var(--body); }
  .mh-list { display: flex; flex-direction: column; }
  .mh-item { display: grid; grid-template-columns: 112px minmax(0,1fr); gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .mh-item:last-child { border-bottom: 0; }
  .mh-item .mh-img { display: block; aspect-ratio: 16/10; overflow: hidden; background: #222; }
  .mh-item .mh-img img { width: 100%; height: 100%; object-fit: cover; }
  .mh-item h4 { margin: 0 0 4px; font: 900 17px/1.15 var(--head); }
  .mh-item p { margin: 0 0 5px; font: 400 14.5px/1.4 var(--body); }
  .mh-item[hidden] { display: none; }
  .mh-list.fit .mh-item { flex: 1 1 auto; align-content: center; }
  .mh-src { font: 400 12px/1.5 var(--book); color: var(--muted); }
  .mh-src b { font: 900 11px var(--head); text-transform: uppercase; letter-spacing: .5px; color: var(--ink); margin-right: 4px; }
  .mh-src a { color: var(--red); white-space: nowrap; }
  .mh-src a:hover { text-decoration: underline; }
  .mh-src a + a::before { content: '·'; color: var(--muted); margin: 0 5px; }
  @media (max-width: 900px) { .mh-grid { grid-template-columns: minmax(0,1fr); } .mh-heroes { border-right: 0; border-bottom: 1px solid var(--line); } .mh-head .mh-note { margin-left: 0; } }

  /* Une : histoire principale + poids médiatique (encadré jaune) */
  .scorestrip[hidden] { display: none; }
  .topgrid { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 0 18px; margin: 0 0 22px; align-items: start; }
  .topgrid .lp-story { margin-bottom: 0; }
  .topgrid .standings td.nm { max-width: 170px; }
  .standings td.nm .tlogo { display: inline-block; width: 18px; height: 18px; vertical-align: -4px; margin-right: 5px; object-fit: contain; }
  @media (max-width: 980px) { .topgrid { grid-template-columns: minmax(0,1fr); } .topgrid .standings { margin-top: 14px; } }

  /* Grand bandeau rouge « SPORTS » */
  .sband { display: grid; grid-template-columns: minmax(0,1fr) 300px; gap: 0 18px; margin: 0 0 22px; }
  .sband.solo { grid-template-columns: minmax(0,1fr); }
  .sband-red { background: var(--red); color: #fff; position: relative; padding: 18px 24px 0; overflow: hidden; min-height: 150px; display: flex; flex-direction: column; justify-content: space-between; }
  .sband-title { font: 400 clamp(64px, 11vw, 132px)/.86 var(--book); text-transform: uppercase; letter-spacing: -2px; margin: 6px 0 12px; }
  .sband-sub { font: 400 15px var(--book); letter-spacing: 2.5px; text-transform: uppercase; opacity: .92; margin: -4px 0 12px; }
  .sband-hatch { height: 26px; margin: 0 -24px; background: repeating-linear-gradient(135deg, #fff 0 2px, transparent 2px 9px); opacity: .9; }
  .sband-teasers { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 0; margin-top: 8px; }
  .teaser { background: #8c8d90; color: #fff; padding: 16px 20px 18px; display: block; min-height: 138px; }
  .teaser + .teaser { background: var(--gray-box); }
  .teaser .t-h { font: 400 15px var(--book); letter-spacing: 2px; text-transform: uppercase; opacity: .9; }
  .teaser .t-big { font: 400 34px/1 var(--book); text-transform: uppercase; margin: 6px 0 6px; }
  .teaser .t-y { color: var(--yellow); font: 400 26px/1.05 var(--book); text-transform: uppercase; }
  .teaser p { margin: 6px 0 0; font: 400 15px/1.45 var(--body); color: rgba(255,255,255,.92); }
  .teaser blockquote { margin: 6px 0 4px; font: 400 23px/1.15 var(--book); color: #fff; }
  .teaser .t-by { font: 900 12.5px var(--head); letter-spacing: .6px; text-transform: uppercase; color: var(--yellow); }
  .teaser:hover .t-page { text-decoration: underline; }
  .teaser .t-page { font: 900 13px var(--head); text-transform: uppercase; margin-top: 6px; display: inline-block; }

  /* Encadré jaune (classement LNH /// EST) */
  .standings { background: var(--yellow); align-self: stretch; display: flex; flex-direction: column; }
  .standings-h { background: var(--red); color: #fff; padding: 10px 14px 8px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .standings-h b { font: 900 22px/1 var(--head); letter-spacing: -.3px; }
  .standings-h b i { font: 400 22px var(--book); font-style: normal; margin: 0 4px; letter-spacing: -3px; }
  .standings-h small { font: 400 12px var(--book); letter-spacing: 1.5px; text-transform: uppercase; }
  .standings table { width: 100%; border-collapse: collapse; font: 400 16px var(--book); }
  .standings th { font: 900 12px var(--head); text-align: right; padding: 6px 10px 2px; color: var(--ink); }
  .standings td { padding: 4px 10px; border-top: 1px solid var(--yellow-line); white-space: nowrap; }
  .standings td.rk { width: 26px; text-align: right; padding-right: 4px; }
  .standings td.nm { overflow: hidden; text-overflow: ellipsis; max-width: 150px; }
  .standings td.nm a:hover { text-decoration: underline; }
  .standings td.v { text-align: right; border-left: 1px dotted var(--yellow-line); font-variant-numeric: tabular-nums; }
  .standings tr.top td { font-family: var(--head); font-weight: 900; }
  .standings tr.cut td { border-bottom: 2px solid var(--red); }
  .standings .foot { margin-top: auto; padding: 8px 12px 10px; font: 400 11.5px/1.35 var(--book); color: var(--ink-2); }
  .standings .seg { margin-top: 6px; }
  .standings .trend { font-size: 11px; }

  /* Titres de section : « DANS LE VESTIAIRE » */
  .section-title { font: 900 26px/1 var(--head); text-transform: uppercase; letter-spacing: -.2px; margin: 34px 0 14px; padding-top: 10px; border-top: 5px solid var(--rule); gap: 10px; }
  .section-title::before { display: none; }
  .section-title i, .card-h i, .crystal-title i { font: 400 1em var(--book); font-style: normal; letter-spacing: 0; }
  .buzz-h { margin: 34px 0 14px; border-top: 5px solid var(--rule); padding-top: 10px; align-items: flex-end; }
  .buzz-h .section-title { border-top: 0; padding-top: 0; }
  .buzz-h .sub, .lead-note { font: 400 14px var(--body); font-style: italic; color: var(--muted); text-transform: none; letter-spacing: 0; }

  /* Cartes → encadrés de journal */
  .card { background: var(--card); border-radius: 0; box-shadow: none; border-top: 3px solid var(--rule); }
  .card-h { font: 900 21px/1 var(--head); letter-spacing: -.1px; padding: 12px 16px 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
  .card-h small { font: 400 13px var(--body); font-style: italic; }
  .card-h.red { border-top: 0; }
  .card-h.red::first-letter { }
  .card:has(> .card-h.red) { border-top-color: var(--red); }
  .kicker, .kicker[style*="color:"] { font: 400 13px/1.2 var(--book); letter-spacing: 1.4px; filter: none; }
  .tag { font: 900 10.5px/1 var(--head); letter-spacing: .6px; border-radius: 0; padding: 4px 6px 3px; }
  .tag.st { background: var(--block); color: #fff; }
  .tag.art { background: var(--yellow); color: var(--ink); }
  .tag.vid { background: var(--ink); color: #fff; }
  .tag.live { background: var(--red); color: #fff; }
  .btn { border-radius: 0; font: 900 14px var(--head); letter-spacing: .4px; padding: 11px 16px 10px; }
  .btn.ghost { border: 2px solid var(--rule); }
  .seg { border-radius: 0; border: 1.5px solid var(--rule); }
  .seg button { font: 900 12.5px var(--head); letter-spacing: .3px; padding: 7px 11px 6px; }
  .seg button.on { background: var(--block); }
  .toolbar input { border-radius: 0; border: 1.5px solid var(--rule); font: 400 15px var(--book); }
  .chipf { border-radius: 0; font: 900 12.5px var(--head); }
  .switch { font: 900 14px var(--head); }
  .muted { color: var(--muted); }
  .empty { font-style: italic; }
  .notice { border-radius: 0; box-shadow: none; border: 1px solid var(--line); border-left: 5px solid var(--red); }
  footer { font: 400 12.5px var(--book); letter-spacing: .3px; border-top: 5px solid var(--rule); max-width: 1248px; margin: 0 auto; }

  /* Manchettes → « SOMMAIRE » */
  .card.sommaire { border-top: 0; }
  .sommaire .card-h { background: var(--gray-bar); color: #fff; font: 400 24px/1 var(--book); letter-spacing: .5px; justify-content: center; padding: 8px 12px 6px; border: 0; }
  .headlines li { border-top: 1px solid var(--line); }
  .headlines a { font: 700 15.5px/1.3 var(--body); }
  .headlines .hs { font: 400 12px var(--ui); letter-spacing: .3px; }

  /* ─── À la une : grand titre papier ─── */
  .lp-story { background: var(--card); padding: 22px 26px 26px; border-top: 3px solid var(--rule); margin-bottom: 22px; }
  .lp-kick { font: 400 34px/1 var(--book); text-transform: uppercase; letter-spacing: -.3px; }
  .lp-kick .r { color: var(--red); font-family: var(--head); font-weight: 900; }
  .lp-kick .when { font: 400 14px var(--book); letter-spacing: 2px; color: var(--muted); margin-left: 10px; }
  .lp-h1 { font: 900 clamp(38px, 5.4vw, 74px)/.98 var(--head); letter-spacing: -1.6px; margin: 8px 0 20px; }
  .lp-h1 a:hover { color: var(--red); }
  .lp-cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  .lp-text { column-count: 2; column-gap: 20px; column-rule: 1px solid var(--line); }
  .lp-text > * { break-inside: avoid-column; }
  .lp-text p { margin: 0 0 10px; font: 400 15.5px/1.5 var(--body); text-align: justify; hyphens: auto; }
  .lp-text p.lede { font-weight: 700; }
  .lp-text .keypoints li { font: 400 14.5px/1.45 var(--body); }
  .lp-text .chips { margin: 10px 0; }
  .lp-photo { margin: 0; }
  .lp-photo img { width: 100%; aspect-ratio: 16/9; object-fit: cover; display: block; background: #222; }
  .lp-photo figcaption { font: 700 13px/1.4 var(--body); margin-top: 6px; }
  .lp-photo figcaption span { display: block; font: 400 11px var(--book); letter-spacing: .8px; text-transform: uppercase; color: var(--muted); text-align: right; margin-bottom: 2px; }
  /* Chroniqueur : photo + barre rouge au nom */
  .byl { display: block; margin: 0 0 12px; break-inside: avoid; }
  .byl .ph { display: flex; align-items: flex-end; gap: 0; height: 104px; background: #e9e7e2; overflow: hidden; }
  .byl .ph .face { width: 100%; height: 104px; border-radius: 0; box-shadow: none; background: #d9d6cf; }
  .byl .ph .face img { object-position: 50% 20%; }
  .byl .ph .faces { width: 100%; }
  .byl .ph .faces .face + .face { margin-left: 0; border-left: 2px solid #fff; }
  .byl .nm { background: var(--red); color: #fff; font: 400 14px/1 var(--book); letter-spacing: .6px; text-transform: uppercase; padding: 5px 8px 4px; }
  .byl.black .nm { background: var(--block); }

  /* Encadrés gris : LE POINTAGE / LE JEU / LE CHIFFRE / LE HÉROS */
  .boxrow { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 10px; margin: 0 0 22px; }
  .gbox { background: var(--gray-box); color: #fff; padding: 12px 16px 14px; display: block; min-width: 0; }
  .gbox.lt { background: var(--gray-lt); color: var(--ink); }
  .gbox .g-h { font: 900 20px/1 var(--head); text-transform: uppercase; letter-spacing: -.1px; }
  .gbox .g-sub { font: 900 14px var(--head); margin: 4px 0 4px; text-transform: uppercase; }
  .gbox .g-sub::before { content: '› '; }
  .gbox p { margin: 0; font: 400 13.5px/1.4 var(--book); }
  .gbox .g-num { float: left; font: 900 58px/.8 var(--head); margin: 4px 10px 0 0; letter-spacing: -2px; }
  .gbox .score2 { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 4px 14px; margin-top: 6px; }
  .gbox .score2 b { font: 900 38px/1 var(--head); text-align: right; }
  .gbox .score2 span { font: 400 13px var(--book); letter-spacing: 1px; text-transform: uppercase; }
  .gbox .g-by { display: block; margin-top: 6px; font: 400 12px var(--book); letter-spacing: .5px; opacity: .85; }
  a.gbox:hover .g-sub { text-decoration: underline; }

  /* Deux autres manchettes */
  .lead2 { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 22px; margin-bottom: 8px; }
  .story2 { background: var(--card); border-top: 3px solid var(--rule); padding: 14px 16px 16px; display: grid; grid-template-columns: 42% minmax(0,1fr); gap: 16px; align-items: start; }
  .story2 img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
  .story2 .kicker { color: var(--red); }
  .story2 h2 { font: 900 25px/1.02 var(--head); letter-spacing: -.5px; margin: 4px 0 8px; }
  .story2:hover h2 { color: var(--red); }
  .story2 p { margin: 0; font: 400 14.5px/1.45 var(--body); }

  /* Boule de cristal → « NOS CHOIX DE LA SEMAINE » */
  .crystal { background: var(--card); color: var(--ink); border-radius: 0; box-shadow: none; border-top: 6px solid var(--rule); padding: 18px 0 18px; margin: 30px 0 22px; }
  .crystal::after { display: none; }
  .crystal-h { padding: 0 4px; }
  .crystal-title { font: 900 52px/.92 var(--head); letter-spacing: -1.2px; color: var(--ink); background: none; -webkit-text-fill-color: currentColor; text-transform: uppercase; }
  .crystal-title i { display: block; font: 400 52px/.95 var(--book); letter-spacing: -1px; }
  .crystal-title .orb { display: none; }
  .crystal-sub { color: var(--muted); font: 400 15px var(--body); font-style: italic; }
  .crystal-count { color: var(--ink-2); font: 400 14px var(--book); letter-spacing: 1.5px; }
  .cnav { border-radius: 0; background: var(--block); border: 0; }
  .cnav:hover:not(:disabled) { background: var(--red); transform: none; }
  .crystal-dots button { border-radius: 0; background: var(--line); height: 6px; }
  .crystal-dots button.on { background: var(--red); }
  .takes { grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px 14px; padding: 0 4px; }
  .take { background: var(--card); border: 0; border-radius: 0; box-shadow: none; padding: 0; gap: 0; }
  .take::before { display: none; }
  .take:hover { transform: none; background: var(--card); }
  .take-who { display: block; position: relative; }
  .take-who .faces { display: flex; width: 100%; height: 150px; background: #e7e5e0; filter: grayscale(1) contrast(1.05); }
  .take:hover .take-who .faces { filter: none; }
  .take-who .face.lg { width: 100%; height: 150px; border-radius: 0; box-shadow: none; flex: 1; }
  .faces .face.lg + .face.lg { margin-left: 0; border-left: 2px solid #fff; }
  .take-who .face.lg b { font-size: 40px; }
  .take-id { background: var(--block); color: #fff; padding: 6px 10px 5px; }
  .take .who { font: 400 17px/1.05 var(--book); letter-spacing: .3px; color: #fff; }
  .take .show { font: italic 400 13px var(--body); color: #fff; opacity: .85; margin-top: 2px; }
  .take .show .sw { display: none; }
  .bubble { background: transparent; color: var(--ink); border-radius: 0; padding: 10px 2px 6px; margin: 0; border-bottom: 1px solid var(--line); }
  .bubble::before { display: none; }
  .bubble p { font: 400 16px/1.4 var(--body); }
  .take .src { color: var(--muted); font: 900 11.5px var(--head); padding: 6px 2px 0; }
  .take .src:hover { color: var(--red); }
  .takes.one { grid-template-columns: minmax(0,1fr); }
  .takes.one .bubble p { font-size: 18px; }

  /* Répliques */
  .qcard { border-radius: 0; box-shadow: none; border-top: 3px solid var(--c, var(--red)); }
  .qcard::before { font-family: var(--head); }
  .qcard blockquote { font: 400 22px/1.2 var(--book); }
  .qcard figcaption { font: 400 13px var(--body); font-style: italic; }
  .qcard figcaption b { font: 900 14px var(--head); font-style: normal; }
  .qcard.big { background: var(--gray-box); border-left: 0; border-top: 0; }
  .qcard.big blockquote { font-size: 32px; }
  .qcard.big::before { color: var(--yellow); }
  .src { font: 900 12px var(--head); letter-spacing: .4px; }

  /* Fil d'épisodes */
  .vcard { border-radius: 0; box-shadow: none; border-top: 3px solid var(--rule); }
  .vcard:hover { box-shadow: none; transform: none; }
  .vcard:hover .ttl { color: var(--red); }
  .vcard .ttl { font: 900 19px/1.05 var(--head); letter-spacing: -.3px; }
  .vcard .meta { font: 400 12px var(--ui); letter-spacing: .3px; }
  .vcard .kicker { color: var(--red) !important; }

  /* Classements (buzz, leaders) */
  .blist .nm, .leader .nm { font: 900 17px/1.1 var(--head); letter-spacing: -.2px; }
  .blist .meta, .leader .nm small { font: 400 12px var(--ui); }
  .blist .snip { font: 400 14px/1.4 var(--body); }
  .blist .bar i, .leader .bar i, .pcard .mbar .b i { background: var(--red); }
  .blist .bar, .leader .bar { border-radius: 0; height: 3px; }
  .bscore, .blist .rk, .leader .rk, .leader .val { font-family: var(--head); font-weight: 900; }
  .bscore small { font: 400 10px var(--book); letter-spacing: 1px; }
  .trend { font-family: var(--head); font-weight: 900; }
  .trend.new, .fire { border-radius: 0; font-family: var(--head); }
  .showlist a { font: 700 15px var(--body); }
  .showlist .n { font: 900 13px var(--head); }
  .showlist .sw { border-radius: 0; }

  /* Vestiaire du CH / radar */
  .vcardp { border-radius: 0; box-shadow: none; border-top: 0; }
  .vcardp:hover { box-shadow: none; transform: none; }
  .vcardp .top .nm { font: 900 22px/1 var(--head); letter-spacing: -.3px; }
  .vest .vcardp:first-child .top .nm { font-size: 38px; }
  .vcardp .top .rk { font: 900 38px/1 var(--head); font-style: normal; }
  .vcardp .top .num { font: 400 13px var(--book); letter-spacing: 1px; }
  .vcardp .ctx { font: 400 14px/1.45 var(--body); }
  .vcardp .op { border-radius: 0; background: var(--gray-lt); font: 400 13.5px/1.4 var(--body); }
  .vcardp .op b { font: 900 12px var(--head); }
  .vcardp .foot { font: 400 11.5px var(--book); letter-spacing: 1px; }

  /* Joueurs */
  .pcard { border-radius: 0; box-shadow: none; }
  .pcard:hover { box-shadow: none; transform: none; }
  .pcard:hover .nm { color: var(--red); }
  .pcard .nm { font: 900 18px/1.1 var(--head); letter-spacing: -.2px; }
