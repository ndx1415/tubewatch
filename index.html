    const kick = m => m.updated && (isNewSince(mAt(m)) || (H.mode === 'maj' && m.fresh && m.at && NOW - Date.parse(m.at) < 3 * 36e5)) ? `<div class="mh-kick"><i></i>Mis à jour ${esc(fmtAgo(mAt(m)))}</div>` : '';
    // Compact : titres seulement sur 2 colonnes, un clic déplie le texte et les sources
    // En vedette : les 2 nouvelles du Canadien les plus récentes (complétées par les autres s'il en manque);
    // « Les autres manchettes » : toutes les autres, la plus récente d'abord
    const recency = m => newest(m) || (m.at ? Date.parse(m.at) : 0); // date de la source la plus récente
    const byNew = (a, b) => recency(b) - recency(a);
    // Match du CH terminé : la manchette du résultat passe en 1re place (automatique LNH, ou celle des médias qui l'a remplacée),
    // illustrée par le tableau du pointage
    // … jusqu'à 11 h le lendemain (D.lastGame.postUntil, même moment que la fin du mode « après le match » de « Ce qu'ils ont dit »).
    // Ensuite : plus de tableau ni de 1re place forcée, la manchette automatique (LNH) disparaît, et les manchettes sur ce match
    // (« match »: « resultat:AAAA-MM-JJ ») restent dans « Les autres manchettes » — les 2 vedettes vont à d'autres nouvelles (CH d'abord).
    const LG = D.lastGame, gDay = LG?.day || H.board?.day;
    const spotOver = !!(LG?.postUntil && NOW >= Date.parse(LG.postUntil));
    const onGame = m => !!gDay && m.match === `resultat:${gDay}`;
    const B = spotOver ? null : H.board, resItem = B ? (H.result || H.items.find(onGame) || null) : null;
    const pool = H.items.filter(m => m !== resItem);
    const heroPool = spotOver ? pool.filter(m => !onGame(m)) : pool;
    const topCH = heroPool.filter(isCH).sort(byNew).slice(0, resItem ? 1 : 2);
    const top2 = [...new Set([...(resItem ? [resItem] : []), ...topCH, ...heroPool.slice().sort(byNew), ...pool.slice().sort(byNew)])].slice(0, 2); // pas assez d'autres nouvelles : les plus récentes
    const order = [...top2, ...pool.filter(m => !top2.includes(m)).sort(byNew)];
    const boardHtml = b => { const row = t => { const ch = t.abbrev === fT, win = t.score > (t === b.home ? b.away : b.home).score;
        return `<span class="rb-row${ch ? ' ch' : ''}${win ? ' win' : ''}">${t.logo ? `<img src="${esc(t.logo)}" alt="" onerror="this.remove()">` : ''}<b>${esc(t.common || t.abbrev)}</b><em>${esc(t.score)}</em></span>`; };
      return `<a class="mhc-hi rb" href="${esc(b.url)}" target="_blank" rel="noopener"><span class="rb-top">Final${b.last === 'OT' ? ' · prolongation' : b.last === 'SO' ? ' · tirs de barrage' : ''}</span>
        ${row(b.away)}${row(b.home)}<span class="rb-date">${esc(new Date(b.start).toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' }))}${b.home.sog != null ? ` · tirs ${esc(b.away.sog)}-${esc(b.home.sog)}` : ''}</span></a>`; };
    const nhlSrc = b => `<div class="mh-src"><b>Source</b><a href="${esc(b.url)}" target="_blank" rel="noopener">LNH ↗</a></div>`;
    const thumbOf = m => { const rec = picRec(m); return rec ? thumbTag(rec, 'mqdefault', 'loading="lazy"') : ''; };
    const srcLbl = m => { const r = (m.sources || [])[0]; if (!r) return ''; const rec = recOf(r); return `${esc((chByKey[r.key]?.label || r.label || r.key).replace(/^@/, ''))}${(m.sources || []).length > 1 ? ` +${m.sources.length - 1}` : ''}${newest(m) ? ` · ${esc(fmtAgo(new Date(newest(m))))}` : rec ? ` · ${esc(fmtAgo(dateOf(rec)))}` : ''}`; };
    const hrefOf = m => { if (manIdByTitle.has(m.titre)) return manHref(manIdByTitle.get(m.titre)); const rec = picRec(m); return rec ? epHref(rec) : (m.sources?.[0]?.url || '#'); }; // sa page (archive des manchettes), sinon la source
    const restItems = order.slice(2);
    // chroniques des experts (les 4 dernières) : dans leur propre bande, au-dessus des autres manchettes
    const chrUne = (D.chroniques?.une || []).map(id => chronById[id]).filter(Boolean);
    box.innerHTML = `<div class="mhc">
      <div class="mhc-head"><h2><a href="#/manchettes" title="Toutes les manchettes des 14 derniers jours">Manchettes</a></h2><span class="mh-ed">${H.mode === 'maj' ? `Mise à jour ${esc(fmtAgo(H.generatedAt))}` : H.slot ? `Édition de ${esc(H.slotLabel)} · ${esc(fmtAgo(H.generatedAt))}` : `Édition ${esc(fmtAgo(H.generatedAt))}`}</span><a class="mh-all" href="#/manchettes">Toutes les manchettes →</a></div>
      <div class="mhc-heroes v2">${order.slice(0, 2).map(m => { const rec = picRec(m);
        const tva = tvaRec(m);
        if (m === resItem && B) return `<article class="mhc-hero v2 ch res">${boardHtml(B)}
          <div class="mhc-hb"><h3><a href="${esc(m.auto ? B.url : hrefOf(m))}"${m.auto ? ' target="_blank" rel="noopener"' : ''}>${boldPlayers(esc(m.titre), m.joueurs)}</a></h3><p>${linkPlayers(esc(m.texte), m.joueurs)}</p></div></article>`;
        return `<article class="mhc-hero v2 ${isCH(m) ? 'ch' : ''}"><a class="mhc-hi" href="${esc(manIdByTitle.has(m.titre) || !tva ? hrefOf(m) : epHref(tva))}">${tva ? kbImg(tva) : rec ? thumbTag(rec, 'maxresdefault') : ''}${isCH(m) ? '<span class="mh-tagch">Canadien</span>' : ''}</a>
          <div class="mhc-hb">${kick(m)}<h3><a href="${esc(hrefOf(m))}">${boldPlayers(esc(m.titre), m.joueurs)}</a></h3><p>${linkPlayers(esc(m.texte), m.joueurs)}</p></div></article>`; }).join('')}</div>
      <div id="tkr" class="tkr" role="region" aria-label="En bref"></div>${box2 ? '</div>' : ''}
      ${box2 ? '<!--SPLIT-->' : ''}      ${restItems.length ? `<div class="mhs-h"><h3><a href="#/manchettes" title="Toutes les manchettes des 14 derniers jours">Les autres manchettes</a></h3>${sliderNav('mhSld')}</div>
      ${sliderHtml('mhSld', [...restItems.map(m => `<article class="mhs-card ${isCH(m) ? 'ch' : ''}">
          <a class="mhs-img" href="${esc(hrefOf(m))}" tabindex="-1" aria-hidden="true">${thumbOf(m)}${isCH(m) ? '<span class="mh-tagch">Canadien</span>' : ''}</a>
          ${kick(m)}<h4><a href="${esc(hrefOf(m))}">${boldPlayers(esc(m.titre), m.joueurs)}</a></h4>
          <p>${linkPlayers(esc(m.texte), m.joueurs)}</p></article>`)], 'Les autres manchettes')}` : ''}
      ${chrUne.length ? `<section class="chb" aria-label="Les chroniques"><div class="mhs-h"><h3>Les chroniques</h3><span class="chb-note">${CHRON_AI.replace('Chronique composée', 'Composées').replace('ses propos', 'leurs propos')}</span></div>
        <div class="chb-row">${chrUne.map(chronBandCard).join('')}</div></section>` : ''}${box2 ? '' : '</div>'}`;
    if (box2) { // la une : les vedettes restent en haut, les chroniques et « Les autres manchettes » passent après les opinions du jour
      const [a, b] = box.innerHTML.split('<!--SPLIT-->'); box.innerHTML = a; box2.innerHTML = b ? `<div class="mhc mhc-more">${b}</div>` : ''; }
    renderTicker(document.getElementById('tkr'), restItems.map(m => ({ titre: m.titre, href: hrefOf(m), at: mAt(m) })));
    bindSlider('mhSld');
  }
  function fitManchettes() {
    const list = document.getElementById('mhList'), heroes = list?.previousElementSibling;
    if (!list || !heroes || list.offsetParent === null) return;
    const items = [...list.children];
    items.forEach(it => { it.hidden = false; });
    list.classList.remove('fit');
    if (getComputedStyle(list.parentElement).gridTemplateColumns.split(' ').length < 2) return; // une seule colonne (mobile) : tout
    heroes.style.alignSelf = list.style.alignSelf = 'start'; // hauteurs naturelles (sans l'étirement de la grille)
    const target = heroes.offsetHeight;
    for (let i = items.length - 1; i > 0 && list.offsetHeight > target; i--) items[i].hidden = true;
    heroes.style.alignSelf = list.style.alignSelf = '';
    list.classList.add('fit');
  }
  let mhT; window.addEventListener('resize', () => { clearTimeout(mhT); mhT = setTimeout(fitManchettes, 120); });

  let takesPage = 0;
  // ─────────── Le pouls : joueurs en hausse, réplique, opinion d'expert, le débat (grands portraits) ───────────
  function pulseHtml() {
    const cards = [];
    const recentSum = feedVideos.filter(v => v.summary && dateOf(v) >= NOW - 2 * DAY);
    const sumPool = recentSum.length ? recentSum : feedVideos.filter(v => v.summary).slice(0, 6);
    const src = v => `${esc(chByKey[v.key].label.replace(/^@/, ''))} · ${esc(fmtAgo(dateOf(v)))}`;
    // portrait découpé : joueur (photo LNH) ou expert (personnes.json)
    const plFace = p => `<div class="pz-face pl">${p.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(p.number || initials(p.name))}</b></div>`;
    const exOf = id => expertById[id] || (PEOPLE[id] ? { id, ...PEOPLE[id] } : null);
    const exFace = e => cutout(e, 'pz-face ex');
    const exPill = e => `<span class="xc-name pz-pill">${esc(e.nom)}</span>`;
    const exRole = e => e.role ? `<span class="pz-role">${esc(e.role)}</span>` : '';
    const colorOf = e => expertById[e.id] ? expertColor(expertById[e.id]) : 'var(--red)';
    const teamColor = p => p.teamAbbrev === (D.focusTeam || 'MTL') ? '#AF1E2D' : p.teamAbbrev === 'LAV' ? '#00205B' : '#555';
    // 1-2. Joueurs en hausse (24 h vs 24 h d'avant) + ce qu'on dit d'eux
    const risers = ranking('1j').all.slice(0, 25).map(x => ({ ...x, t: trendOf(x.p, '1j') }))
      .filter(x => x.t && (x.t.k === 'up' || x.t.k === 'new') && latestContext(x.p))
      .sort((a, b) => (b.t.cur - b.t.prev) - (a.t.cur - a.t.prev)).slice(0, 2);
    // ce qu'on dit d'un joueur : contextes récents (résumés + manchettes), une phrase par source, sans doublon
    // (deux phrases qui partagent plus de la moitié de leurs mots = la même info → on n'en garde qu'une)
    const words = t => new Set(norm(t).split(/[^a-z0-9]+/).filter(w => w.length > 3));
    const same = (a, b) => { let n = 0; for (const w of a) if (b.has(w)) n++; return n / Math.max(1, Math.min(a.size, b.size)) > 0.5; };
    const contextsOf = (p, n = 3) => { const kept = []; for (const x of p.mentions.filter(m => m.contexte).map(m => ({ m, v: vidByKey[vidKey(m.key, m.videoId)] })).filter(x => x.v).sort((a, b) => dateOf(b.v) - dateOf(a.v))) {
        const w = words(x.m.contexte); if (kept.some(k => same(k.w, w))) continue; kept.push({ ...x, w }); if (kept.length >= n) break; } return kept; };
    for (const x of risers) {
      const [c, ...more] = contextsOf(x.p, 3);
      const nMed = showsInWin(x.p, '1j');
      cards.push(`<a class="pz-card" href="${plHref(x.p)}" style="--c:${teamColor(x.p)}"><span class="pz-k up">En hausse ${x.t.k === 'new' ? '· nouveau' : `▲ ${Math.round(x.t.r * 100)} %`}</span>
        <span class="pz-name">${esc(x.p.name)}</span><span class="pz-role">${x.p.number ? `#${esc(x.p.number)} · ` : ''}${esc(x.p.position || '')}${x.p.team ? ` · ${esc(x.p.team)}` : ''}</span>
        <span class="pz-stat"><b>${x.s}</b> pts · ${nMed} média${nMed > 1 ? 's' : ''} en 24 h</span>
        <span class="pz-t">${boldPlayers(esc(phrase(c.m.contexte)))}</span><span class="pz-s">${src(c.v)}</span>
        ${more.length ? `<span class="pz-more">${more.map(o => `<span><i>${boldPlayers(esc(phrase(o.m.contexte)))}</i><em>${src(o.v)}</em></span>`).join('')}</span>` : ''}
        ${plFace(x.p)}</a>`);
    }
    // 3. La réplique du jour (ailleurs que dans l'émission en vedette juste en dessous)
    const leadV = sumPool[0];
    const qs = sumPool.flatMap(v => (v.summary.citations || []).map(c => ({ c, v }))).filter(x => x.c.texte);
    const q = qs.find(x => x.v !== leadV && x.c.people?.length) || qs.find(x => x.v !== leadV) || qs[0];
    if (q) { const e = q.c.people?.[0] && exOf(q.c.people[0]);
      cards.push(`<a class="pz-card pz-hl" href="${epHref(q.v)}" style="--c:${e ? colorOf(e) : 'var(--red)'}"><span class="pz-k">La réplique du jour</span>
        <span class="pz-q">« ${esc(q.c.texte)} »</span><span class="pz-s"><b>${esc(whoName(q.c.people, q.c.auteur || 'En ondes'))}</b> · ${src(q.v)}</span>${e ? exFace(e) : ''}</a>`); }
    // Opinions identifiées (voix connues) sur un joueur, des 3 derniers jours
    const idOps = p => refItems(p, 'op').filter(o => o.item.people?.length && exOf(o.item.people[0]) && dateOf(o.v) >= NOW - 3 * DAY);
    const hotList = [...ranking('1j').all, ...ranking('3j').all];
    // 4. L'opinion qui fait jaser : style page Experts, sur le joueur le plus discuté
    const hot = hotList.find(x => idOps(x.p).length);
    const used = new Set();
    if (hot) { const o = idOps(hot.p)[0], e = exOf(o.item.people[0]); used.add(o.item);
      cards.push(`<a class="pz-card" href="${exHref(e.id)}" style="--c:${colorOf(e)}"><span class="pz-k">L’opinion qui fait jaser · ${esc(hot.p.name)}</span>
        ${exPill(e)}${exRole(e)}<span class="pz-t op">${boldPlayers(esc(o.item.opinion))}</span><span class="pz-s">${src(o.v)}</span>${exFace(e)}</a>`); }
    // 5. Le débat : deux voix différentes sur le même joueur (deux colonnes)
    const deb = hotList.map(x => { const seen = new Set(); const two = idOps(x.p).filter(o => !used.has(o.item) && !seen.has(o.item.people[0]) && seen.add(o.item.people[0])).slice(0, 2); return two.length === 2 ? { p: x.p, two } : null; }).find(Boolean);
    if (deb) cards.push(`<div class="pz-card pz-deb"><span class="pz-k">Le débat · <a href="${plHref(deb.p)}">${esc(deb.p.name)}</a></span><div class="pz-deb-g">${deb.two.map(o => { const e = exOf(o.item.people[0]);
        return `<a class="pz-side" href="${exHref(e.id)}" style="--c:${colorOf(e)}">${exPill(e)}${exRole(e)}<span class="pz-t op">${boldPlayers(esc(o.item.opinion))}</span><span class="pz-s">${src(o.v)}</span>${exFace(e)}</a>`; }).join('')}</div></div>`);
    if (!cards.length) return '';
    return `<section class="pulse"><div class="pz-h">Le <b>pouls</b><small>ce qui se dit en ce moment</small></div><div class="pz-grid">${cards.join('')}</div></section>`;
  }

  // ─────────── Les émissions résumées par l'IA (le gros du contenu, mis en vitrine) ───────────
  // Poids médiatique sur la une : une seule ligne, les 6 joueurs du CH dont on parle le plus (24 h), et le lien vers leur courbe
  function buzzLine() {
    const top = ranking().ch.slice(0, 6); if (!top.length) return '';
    const T = D.faveurHist?.ent?.team, f = T?.f?.filter(v => v != null) || [], now = f.at(-1), d = f.length > 7 ? now - f.at(-8) : null;
    return `<section class="bz1"><a class="bz1-h" href="#/players"><b>Poids médiatique</b><span>au CH · ${esc(winLabel())}</span></a>
      <ol>${top.map((x, i) => `<li><a href="${plHref(x.p)}"><i>${i + 1}</i>${esc(x.p.name.split(' ').slice(-1)[0])}<em>${x.s}</em></a></li>`).join('')}</ol>
      ${now != null ? `<a class="bz1-f" href="#/players" title="Faveur médiatique du CH (moyenne des opinions d’experts) — la courbe sur la page Joueurs">Faveur du CH <b>${now}</b>${d ? `<span class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '▲' : '▼'} ${Math.abs(d)}</span>` : ''} →</a>` : ''}</section>`;
  }

  // La une : la faveur médiatique en clair — définition, le CH en une phrase, qui monte, qui baisse, de qui on parle.
  // D.faveurHist : un point par jour (f = faveur 0-100, o = opinions notées ce jour-là). Variation = aujourd'hui − il y a 7 jours.
  function favHome() {
    const H = D.faveurHist, T = H?.ent?.team;
    if (!T?.f?.some(v => v != null)) return buzzLine();
    const lastI = a => { for (let i = (a || []).length - 1; i >= 0; i--) if (a[i] != null) return i; return -1; };
    const nowOf = e => { const i = lastI(e.f); return i < 0 ? null : e.f[i]; };
    const d7 = e => { const i = lastI(e.f); return i >= 7 && e.f[i - 7] != null ? e.f[i] - e.f[i - 7] : null; };
    const ops7 = e => (e.o || []).slice(-7).reduce((s, x) => s + (x || 0), 0);
    const P = Object.entries(H.ent).filter(([, e]) => e.k === 'p' && ops7(e) >= 2)
      .map(([id, e]) => ({ id, e, now: nowOf(e), d: d7(e), p: plByNhl[id] })).filter(x => x.now != null && x.d != null);
    const up = P.filter(x => x.d >= 2).sort((a, b) => b.d - a.d).slice(0, 3);
    const dn = P.filter(x => x.d <= -2).sort((a, b) => a.d - b.d).slice(0, 3);
    const now = nowOf(T), d = d7(T);
    const mood = now >= 60 ? 'plutôt élogieux' : now >= 53 ? 'un peu plus élogieux que critiques' : now > 47 ? 'partagés' : now > 40 ? 'un peu plus critiques qu’élogieux' : 'plutôt critiques';
    const dTxt = v => v == null ? '' : v === 0 ? 'stable' : `${v > 0 ? '+' : '−'}${Math.abs(v)}`;
    const row = x => { const name = x.p?.name || x.e.n; const href = x.p ? plHref(x.p) : '#/players';
      return `<li><a href="${href}"><span class="fvm-nm">${esc(name)}</span><b title="Faveur médiatique sur 100">${x.now}</b><span class="${x.d > 0 ? 'up' : 'dn'}" title="Variation sur 7 jours">${dTxt(x.d)}</span></a></li>`; };
    const list = (title, xs, empty) => `<div class="fvm-col"><h3>${title}</h3>${xs.length ? `<ol>${xs.map(row).join('')}</ol>` : `<p class="fvm-empty">${empty}</p>`}</div>`;
    const talk = ranking().ch.slice(0, 5);
    return `<section class="fvm" aria-labelledby="fvmH">
      <div class="fvm-lead">
        <h2 id="fvmH"><i>La</i> faveur médiatique</h2>
        <p class="fvm-def">Ce que les experts suivis pensent du jeu des joueurs du CH, de 0 (très critiques) à 100 (très élogieux). 50, c’est neutre.</p>
        <p class="fvm-team">Cette semaine, les experts sont ${mood} envers le CH : <b>${now}</b>&nbsp;sur&nbsp;100${d != null ? ` <span class="${d > 0 ? 'up' : d < 0 ? 'dn' : ''}">(${dTxt(d)} en 7&nbsp;jours)</span>` : ''}.</p>
        <p class="fvm-go"><a href="#/players">La courbe et tous les joueurs&nbsp;→</a><a href="#/methode/faveur">Comment c’est calculé</a></p>
      </div>
      ${list('En hausse · 7 jours', up, 'Personne n’a nettement monté cette semaine.')}
      ${list('En baisse · 7 jours', dn, 'Personne n’a nettement baissé cette semaine.')}
      ${talk.length ? `<div class="fvm-col"><h3>Les plus discutés · ${esc(winLabel())}</h3><ol class="fvm-rank">${talk.map((x, i) => `<li><a href="${plHref(x.p)}"><i>${i + 1}</i><span class="fvm-nm">${esc(x.p.name)}</span></a></li>`).join('')}</ol></div>` : ''}
    </section>`;
  }

  // Comment ça marche : sources, résumés, citations vérifiées, faveur et poids médiatique, lexique (LEX), crédits.
  // #/methode/<clé> fait défiler jusqu'à la définition (liens « ? » des pages Joueurs, Experts, fiches).
  function viewMethode(anchor) {
    const W = D.buzzWeights || {};
    const term = (id, name, body) => `<div class="mt-term" id="g-${id}"><dt>${name}</dt><dd>${body}</dd></div>`;
    const lexTerm = k => LEX[k] ? term(k, esc(LEX[k][0]), esc(LEX[k][2] || '')) : '';
    app.innerHTML = `${sband('Comment ça marche', { sub: 'Ce qu’on écoute, ce que fait l’IA, et comment on calcule la faveur' })}
      <article class="mt">
        <section><h2>Ce qu’on suit</h2>
          <p>${D.channels.length} sources, vérifiées aux 30&nbsp;minutes : émissions de radio et balados publiés sur YouTube, directs, chroniques et articles.</p>
          <p class="mt-src">${D.channels.map(c => esc(c.label)).join(' · ')}</p></section>
        <section><h2>Les résumés</h2>
          <p>Pour chaque émission, on récupère les sous-titres automatiques de YouTube. Une IA les lit en entier et écrit le résumé sujet par sujet, avec les opinions de chaque expert. Chaque résumé porte la mention « Écrit par l’IA ». Les sous-titres automatiques se trompent parfois, surtout sur les noms : on corrige les noms des joueurs avec les alignements de la LNH.</p></section>
        <section id="g-citations"><h2>Les citations</h2>
          <p>Une citation entre guillemets doit se retrouver dans la transcription, presque mot pour mot et dans l’ordre. Sinon, elle est retirée. Quand une opinion est résumée dans nos mots, elle est marquée « Paraphrase de l’IA ». Quand on l’a retrouvée dans le texte brut, elle est marquée « Retrouvé dans le texte brut ».</p></section>
        <section id="g-faveur"><h2>La faveur médiatique</h2>
          <p>Chaque opinion d’expert qui nomme un joueur du CH est notée une seule fois par une IA, de −2 (très critique) à +2 (très élogieuse). Les faits, les blessures, les décisions de l’entraîneur et les blagues comptent comme neutres.</p>
          <p>On fait la moyenne des opinions des 30 derniers jours (les plus récentes comptent plus), puis on la ramène sur 100 : <b>50, c’est neutre</b>. Un joueur dont on parle beaucoup voit l’effet amplifié; un joueur dont presque personne ne parle reste près de 50.</p></section>
        <section id="g-poids"><h2>Le poids médiatique</h2>

            ${term('ton', 'Ce qu’on en pense', 'Le ton moyen des opinions sur lui, de −2 (très critique) à +2 (très élogieux). C’est la matière première de la faveur médiatique.')}
            ${['severe', 'ctr', 'flip', 'yoyo', 'bascule', 'glace', 'appui', 'ci'].map(lexTerm).join('')}
            ${term('global', 'Global (Sa carte)', 'Une note de 40 à 99 façon jeu vidéo, calculée avec ses stats de la saison (MoneyPuck). La faveur médiatique y ajoute ou retire au plus 3 points.')}
            ${term('gsm', 'GS/M (Game Score par match)', 'Une note de sa contribution à chaque match : buts, passes, tirs, mises en échec, mises au jeu.')}
            ${term('xg', 'xG %', 'La part des chances de marquer (buts attendus) que son équipe obtient quand il est sur la glace, à 5 contre 5. 50 %, c’est égal.')}
            ${term('pdo', 'PDO', 'Le pourcentage d’arrêts plus le pourcentage de tirs réussis de l’équipe. Autour de 100, c’est normal; très au-dessus, la chance risque de tourner.')}
            ${term('gsax', 'GSAx', 'Les buts qu’un gardien a évités de plus que prévu, selon la qualité des tirs reçus. Plus c’est haut, mieux il a fait.')}
          </dl></section>
        <section><h2>Qui fait ça</h2>
          <p>TubeWatch Hockey est fait par des partisans du CH. Les émissions et les articles appartiennent à leurs auteurs : on n’en publie que de courts extraits, et chaque résumé renvoie à l’original. Stats : MoneyPuck, l’API de la LNH et DailyFaceoff pour les alignements.</p></section>

  // Les émissions résumées (la une) : une seule bande compacte, sans vedette — vignette, émission, titre, accroche sur 3 lignes

  // ─────────── Le fil des médias (48 h, chronologique, filtrable) ───────────
  let filFilter = 'all', filShown = 8; // la une reste courte : 8 contenus, puis « Voir plus »
  if (!['all', 'ia', 'vid', 'art'].includes(filFilter)) filFilter = 'all';
  const FIL_FILTERS = [['all', 'Tout'], ['ia', 'Résumé IA'], ['vid', 'Vidéos'], ['art', 'Articles']];

  const filTest = { all: () => true, ia: v => !!v.summary, vid: v => !isArt(v) || v.kind === 'balado', art: v => isArt(v) && v.kind !== 'balado' };
  const hhmm = d => d.toLocaleTimeString('fr-CA', { hour: 'numeric', minute: '2-digit' }).replace(':', ' h ').replace(/\s+/g, ' ');
  const dayLbl = d => { const t = new Date(NOW); t.setHours(0, 0, 0, 0); const x = new Date(d); x.setHours(0, 0, 0, 0); const k = Math.round((t - x) / DAY); return k === 0 ? 'Aujourd’hui' : k === 1 ? 'Hier' : x.toLocaleDateString('fr-CA', { weekday: 'long', day: 'numeric', month: 'long' }); };

  function viewHome() {

        return `Après la ${win ? 'victoire' : 'défaite'} ${Math.max(ch.score, op.score)}-${Math.min(ch.score, op.score)}${x} contre ${opN}`; }
      return allTakes.every(t => t.at >= NOW - 12 * 36e5) ? 'Les opinions du jour' : 'Les opinions les plus récentes'; })();
    const expr = recent.flatMap(v => (v.summary.expressions || []).map(x => ({ ...x, v })))[0];
    const rest = withSum.filter(v => !lead.includes(v)).slice(0, 6);
    // Le tour des émissions : le plus récent résumé de chaque autre émission (4 colonnes)

    // Modules du bandeau : colonne de gauche = les experts, colonne de droite = les joueurs (remplis dans renderBuzz)
    const teasers = `<div class="tslot" id="tExp"></div><div class="tslot" id="tPl"></div>`;
    const s = hero?.summary;

    // Ordre d'importance de la une : 1) les 2 manchettes en vedette (+ « En bref »), 2) les opinions du jour, 3) les autres manchettes
    // (avec la bande des chroniques), 4) les émissions résumées; puis le fil des médias, le vestiaire et le CH en chiffres.
    app.innerHTML = `<h1 class="sr-only">TubeWatch Hockey : ce que les experts disent du CH aujourd’hui</h1>
      ${D.headlines?.items?.length ? '<section class="manchettes" id="manch"></section>' : `${nextMatchBand()}`}

      ${allTakes.length ? `<section class="crystal">
        <div class="crystal-h">

    // Buzz (encadré jaune, encadrés gris, vestiaire, Buzz LNH) — re-rendu quand on change la période
    const week = sortedVideos.filter(v => dateOf(v) >= NOW - 7 * DAY);
    const lastOp = allTakes[0];
    void week; void lastOp; // (le vestiaire et « Le CH en chiffres » ont quitté la une : poids médiatique → une ligne, buzzLine)

      tkBox.outerHTML = sliderHtml('tkSld', allTakes.map(t => opCard(t, t.v)), 'Ce qu’ils ont dit', 'tk-sld');

  }

  // Médias : le fil des médias en haut (24 contenus, filtres, Voir plus), puis les sources suivies en liste compacte (une ligne chacune)

    app.innerHTML = `<div class="banner" style="background:linear-gradient(120deg, ${esc(c.color)} 0%, #111 140%)">
        <div class="kicker">${c.isArticles ? 'Articles' : c.isPlaylist ? 'Playlist' : c.tab === 'streams' ? 'Directs' : 'Chaîne YouTube'}${c.filter ? ` · filtre « ${esc(c.filter)} »` : ''}${c.aiFilter ? ' · tri IA : hockey seulement' : ''}</div>

  // ─────────── Apparition au défilement + compteurs + barre de lecture ───────────
  let revealObs = null;
  // icônes : un toucher montre la bulle (sans ouvrir la fiche du joueur)
  // bulle unique, posée au-dessus de toute la page (les cartes coupent ce qui dépasse)
  // Page d'épisode : clic sur la vignette → la vidéo joue dans la page (lecteur YouTube intégré).
  // YouTube exige de savoir quel site intègre la vidéo (en-tête Referer) : ouvert depuis un fichier local (file://), il n'y en a pas
  // → « Error 153 ». Dans ce cas, et avec Cmd/Ctrl-clic ou clic du milieu, on ouvre YouTube comme avant.
  // Si le lecteur signale une erreur (vidéo non intégrable, 150/153…), on remet la vignette avec « Regarder sur YouTube ».
  const canEmbedYt = /^https?:$/.test(location.protocol);
  document.addEventListener('click', e => {
    const a = e.target.closest?.('a.ep-photo[data-yt]');
    if (!a || !canEmbedYt || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    const id = encodeURIComponent(a.dataset.yt), back = a.cloneNode(true);
    const box = document.createElement('div'); box.className = 'ep-photo ep-embed';
    box.innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0&playsinline=1&enablejsapi=1&origin=${encodeURIComponent(location.origin)}" title="Lecteur vidéo YouTube" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
    a.replaceWith(box);
    const fr = box.querySelector('iframe');
    const onMsg = ev => { if (ev.source !== fr.contentWindow) return; let d = ev.data; try { if (typeof d === 'string') d = JSON.parse(d); } catch { return; }
      if (d?.event === 'onError') { removeEventListener('message', onMsg); back.removeAttribute('data-yt'); back.classList.add('yt-blocked');
        back.insertAdjacentHTML('beforeend', '<span class="yt-msg">Vidéo non disponible ici · Regarder sur YouTube ↗</span>'); box.replaceWith(back); } };
    addEventListener('message', onMsg);
    fr.addEventListener('load', () => { try { fr.contentWindow.postMessage(JSON.stringify({ event: 'listening', id: 1, channel: 'widget' }), '*'); } catch {} });
  });
  const tipBox = document.createElement('div'); tipBox.id = 'tipbox'; document.body.appendChild(tipBox);
  document.body.insertAdjacentHTML('beforeend', '<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs><linearGradient id="prGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b8860b"/><stop offset="1" stop-color="#f5c518"/></linearGradient></defs></svg>');
  let tipFor = null;
  const tipShow = el => { tipFor = el; tipBox.textContent = el.dataset.tip || ''; tipBox.classList.add('on');
    const r = el.getBoundingClientRect(), w = tipBox.offsetWidth, h = tipBox.offsetHeight, m = 8;
    let x = r.left + r.width / 2 - w / 2; x = Math.max(m, Math.min(innerWidth - w - m, x));
    let y = r.top - h - 8; if (y < m) y = r.bottom + 8;
    tipBox.style.left = `${x}px`; tipBox.style.top = `${y}px`; };
  const tipHide = () => { tipFor = null; tipBox.classList.remove('on'); };
  document.addEventListener('mouseover', e => { const ic = e.target.closest?.('.ic, .pr'); if (ic && ic !== tipFor) tipShow(ic); else if (!ic && tipFor && !tipFor.classList.contains('show')) tipHide(); });
  document.addEventListener('focusin', e => { const ic = e.target.closest?.('.ic, .pr'); if (ic) tipShow(ic); });
  document.addEventListener('focusout', e => { if (e.target.closest?.('.ic, .pr')) tipHide(); });
  window.addEventListener('scroll', () => { if (tipFor) tipHide(); document.querySelectorAll('.ic.show, .pr.show').forEach(x => x.classList.remove('show')); }, { passive: true });
  document.addEventListener('click', e => { const ic = e.target.closest('.ic, .pr'); document.querySelectorAll('.ic.show, .pr.show').forEach(x => x !== ic && x.classList.remove('show')); if (!ic) { tipHide(); return; } e.preventDefault(); e.stopPropagation(); ic.classList.toggle('show'); if (ic.classList.contains('show')) tipShow(ic); else tipHide(); }, true);
  function reveal(root = app) {
    if (revealObs) revealObs.disconnect();
    const els = root.querySelectorAll('.rv, .stats-t, [data-count]');
    if (!('IntersectionObserver' in window)) { els.forEach(e => e.classList.add('in')); return; }
    revealObs = new IntersectionObserver(entries => {
      for (const en of entries) {
        if (!en.isIntersecting) continue;
        const el = en.target; el.classList.add('in'); revealObs.unobserve(el);
        if (el.dataset.count) countUp(el);
      }
    }, { threshold: 0.12, rootMargin: '0px 0px -40px 0px' });
    els.forEach(e => revealObs.observe(e));
  }
  function countUp(el) {
    const to = +el.dataset.count, t0 = performance.now(), dur = 900;
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = to; return; }
    const tick = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - k, 3))); if (k < 1) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  }
  const readbar = document.getElementById('readbar');
  window.addEventListener('scroll', () => {
    if (!document.body.classList.contains('reading')) return;
    const h = document.documentElement.scrollHeight - innerHeight;
    readbar.style.width = (h > 0 ? Math.min(100, scrollY / h * 100) : 0) + '%';
  }, { passive: true });

  // Opinions et joueurs relevés par les manchettes (élément sans résumé IA)
  function liteBlock(v, c) {
    const L = v.lite; if (!L || !(L.opinions.length || L.joueurs.length)) return '';
    return `${L.opinions.length ? `<section class="crystal ep-said rv">
        <div class="crystal-h"><div><h2 class="crystal-title">Opinions relevées</h2>
          <div class="crystal-kick">Par l’IA des manchettes · ${L.opinions.length}</div></div></div>
        <div class="takes cols">${L.opinions.map(o => opCard(o, v)).join('')}</div>
      </section>` : ''}
      ${L.joueurs.length ? `<h2 class="ep-h2 rv"><i>Les joueurs</i> <b>en vedette</b><span class="n">selon les manchettes</span></h2>
        <div class="fs">${L.joueurs.map((j, i) => `<div class="fs-item rv" style="--i:${i % 2}"><span class="no">${i + 1}</span><p><b>${j.playerId ? `<a class="plink" href="#/player/${encodeURIComponent(j.playerId)}">${esc(j.nom)}</a>` : esc(j.nom)}</b> — ${linkPlayers(esc(phrase(j.contexte)))}</p></div>`).join('')}</div>` : ''}`;
  }

  // L'essentiel (page d'un épisode) : l'équipe nommée dans un point (son surnom, sa ville, ou quelques noms d'usage), et un pictogramme du sujet
  const ESS_TEAMS = (() => { const L = [];
    for (const t of TEAMS) { if (!t.logo) continue; const keys = new Set([norm(t.short)]);
      const city = (t.name.match(/ (?:de la|du|des|de|d')\s?(.+)$/) || [])[1]; if (city && !/^new york$/i.test(city)) keys.add(norm(city));
      for (const k of keys) if (k.length >= 3) L.push({ k, t }); }
    const ab = Object.fromEntries(TEAMS.map(t => [t.abbrev, t])), add = (k, a) => ab[a]?.logo && L.push({ k, t: ab[a] });
    add('habs', 'MTL'); add('canadien', 'MTL'); add('ch', 'MTL'); add('senators', 'OTT'); add('sens', 'OTT'); add('leafs', 'TOR'); add('canes', 'CAR'); add('pens', 'PIT'); add('blue jackets', 'CBJ'); add('red wings', 'DET');
    return L.map(x => ({ ...x, k: x.k.replace(/[^a-z0-9]+/g, ' ').trim() })); })();
  const essTeam = txt => { const s0 = ` ${norm(txt).replace(/[^a-z0-9]+/g, ' ')} `; let best = null;
    for (const { k, t } of ESS_TEAMS) { const j = s0.indexOf(` ${k} `); if (j >= 0 && (!best || j < best.at)) best = { t, at: j }; } return best; };
  const ESS_PICTOS = [ // [mots du sujet, dessin SVG 48×48 (traits)]
    [/bless|absent|infirmerie|commotion|operation|chirurg/, '<path d="M19 8h10v11h11v10H29v11H19V29H8V19h11z"/>'],
    [/echang|transaction|transig|acqui|contrat|prolong|signe|agent libre|ballottage|repechage/, '<path d="M8 17h28l-7-7M40 31H12l7 7"/>'],
    [/punition|penalit|arbitr|suspen|sifflet|avantage numerique|jeu de puissance|desavantage/, '<path d="M8 20h18a10 10 0 1 1-10 10V20"/><circle cx="26" cy="30" r="3"/><path d="M26 20v-6h10"/>'],
    [/gardien|arret|filet|blanchi|devant le but|buts contre/, '<path d="M6 40V14h36v26"/><path d="M6 14l8 8h20l8-8M14 22v18M34 22v18M14 31h20"/>'],
    [/partisan|foule|ambiance|amphitheatre|centre bell|spectacle|show/, '<path d="M8 20v8l22 9V11L8 20zM30 17a7 7 0 0 1 0 14M36 12a13 13 0 0 1 0 24"/>'],
    [/%|pourcent|statisti|corsi|attendu|classement|rang |\d+e de|moyenne|record/, '<path d="M8 40h34M12 40V26M22 40V16M32 40V22M42 40V10"/>'],
  ];
  const essPicto = txt => { const s0 = norm(txt), d = (ESS_PICTOS.find(([re]) => re.test(s0)) || [, '<ellipse cx="24" cy="20" rx="16" ry="6"/><path d="M8 20v8c0 3.3 7.2 6 16 6s16-2.7 16-6v-8"/>'])[1];
    return `<svg viewBox="0 0 48 48" fill="none" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">${d.replace(/<(path|circle|ellipse)/g, '<$1 pathLength="1"')}</svg>`; };
  // ─────────── Page d'un épisode (ou d'un article) : un article à lire de haut en bas, façon page Manchette ───────────
  // En-tête (émission · date · type, titre, animateurs) → bande de chiffres → vidéo → chapeau → L'essentiel → Le résumé →
  // Ce qu'ils en disent (regroupé par expert) → Le déroulement → Les répliques → Joueurs mentionnés (vestiaire + stats) → Lexique → Aussi dans…
  // Un sommaire collant à gauche permet de sauter aux sections (boutons : on ne touche pas au #/ de la page).
  function viewEpisode(key, id) {
    const v = vidByKey[vidKey(key, id)];
    if (!v) return notFound();
    const c = chByKey[key], s = v.summary, show = c.label.replace(/^@/, '');
    const mentions = (mentionsByVideo[vidKey(key, id)] || []).filter(x => x.m.count).sort((a, b) => b.m.count - a.m.count);
    const related = sortedVideos.filter(x => x.key === key && x !== v).slice(0, 4);
    const cs = s ? (s.citations?.length ? s.citations : (s.citation ? [{ texte: s.citation }] : [])) : [];
    const joueurs = s?.joueurs_mentionnes || v.lite?.joueurs || [];
    const type = isArt(v) ? (v.kind === 'balado' ? 'Balado' : 'Article') : v.live ? 'Direct' : 'Émission';
    const hostsTxt = isArt(v) && v.authors?.length && v.kind !== 'balado' ? v.authors.join(', ') : (s?.animateurs || []).join(', ');
    const paras = String(s?.resume || '').split(/\n+/).filter(Boolean);
    const secs = []; const sec = (id, kicker, title, n, body, cls = '') => { const sp = /’$/.test(kicker) ? '' : ' '; secs.push([id, `${kicker}${sp}${title}`.trim()]);
      return `<section class="epx-sec ${cls}" id="epx-${id}"><h2 class="ep-h2${cls.includes('red') ? ' red' : ''}"><span><i>${kicker}</i>${sp}<b>${title}</b></span>${n != null ? `<span class="n">${n}</span>` : ''}</h2>${body}</section>`; };

    // joueurs mentionnés : le vestiaire (ce qu'on en dit) + les stats (nombre de fois nommé), une seule liste
    const byId = new Map();
    for (const { p, m } of mentions) byId.set(p.id, { p, n: m.count, ctx: '' });
    for (const j of joueurs) { const p = playerById[j.playerId]; const k = p ? p.id : `x:${norm(j.nom)}`; const x = byId.get(k) || { p: p || null, nom: j.nom, eq: j.equipe, n: 0, ctx: '' }; x.ctx = j.contexte || x.ctx; byId.set(k, x); }
    const pls = [...byId.values()].sort((a, b) => b.n - a.n || (b.ctx ? 1 : 0) - (a.ctx ? 1 : 0));
    const maxN = Math.max(1, ...pls.map(x => x.n));
    // les joueurs qui comptent (ce qu'on en dit, ou nommés 2 fois et plus) en cartes; les autres en une ligne de noms
    const plCard = (x, i) => { const p = x.p, nm = p ? p.name : x.nom;
      return `<${p ? `a href="${plHref(p)}"` : 'div'} class="epx-pl rv" style="--i:${i % 4}"><span class="mpg-pl-f">${p?.image ? `<img src="${esc(p.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(p?.number || initials(nm))}</b>${x.n ? `<i class="epx-pl-n" title="nommé ${x.n} fois">${x.n}×</i>` : ''}</span>
        <span class="epx-pl-b"><span class="mpg-pl-n">${esc(nm)}</span><small>${esc([p?.position, p?.teamAbbrev || x.eq].filter(Boolean).join(' · '))}</small>
        ${x.n ? `<span class="epx-pl-bar"><i style="width:${Math.max(4, Math.round(x.n / maxN * 100))}%"></i></span>` : ''}${x.ctx ? `<span class="epx-pl-c">${esc(phrase(x.ctx))}</span>` : ''}</span></${p ? 'a' : 'div'}>`; };
    // L'essentiel : l'accroche (avant les deux-points) en gras, et le portrait du joueur dont parle le point
    const essPls = pls.filter(x => x.p).map(x => ({ p: x.p, keys: [norm(x.p.name), norm(x.p.name).split(' ').pop()].filter(w => w.length >= 3) }));
    const essItem = (k, i) => { const t = String(k || '').trim(), m = t.match(/^(.{3,70}?)\s?:\s+(.+)$/s);
      const lead = m ? m[1] : '', rest = m ? m[2] : t;
      // le joueur nommé dans l'accroche, sinon le premier joueur nommé dans le point
      const firstAt = txt => { const s0 = norm(txt); return essPls.map(x => ({ p: x.p, at: Math.min(...x.keys.map(w => { const j = s0.indexOf(w); return j < 0 ? 1e9 : j; })) })).filter(y => y.at < 1e9).sort((a, b) => a.at - b.at)[0] || null; };
      // repère du point : le joueur de l'accroche; sinon ce qui est nommé en premier (un joueur ou une équipe); sinon un pictogramme du sujet
      const pl0 = lead ? firstAt(lead) : null, pl1 = pl0 || firstAt(t), tm1 = essTeam(t);
      const hit = pl0 ? pl0.p : pl1 && (!tm1 || pl1.at <= tm1.at) ? pl1.p : null, team = !hit && tm1 ? tm1.t : null;
      const face = hit ? `<a class="epx-e-f${hit.image ? '' : ' none'}" href="${plHref(hit)}" tabindex="-1" aria-hidden="true">${hit.image ? `<img src="${esc(hit.image)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(hit.number || initials(hit.name))}</b></a>`
        : team ? `<span class="epx-e-f logo" title="${esc(team.name)}"><img src="${esc(team.logo)}" alt="" loading="lazy" onerror="this.remove()"><b>${esc(team.abbrev)}</b></span>`
        : `<span class="epx-e-f pic" aria-hidden="true">${essPicto(t)}</span>`;
      return `<li class="rv epx-e" style="--i:${i}">${face}<p>${lead ? `<strong class="epx-e-l">${linkPlayers(esc(lead))} :</strong> ` : ''}${linkPlayers(esc(rest))}</p></li>`; };
    const plW = x => x.n + (x.ctx ? 8 : 0); // les plus nommés d'abord, avec un coup de pouce à ceux dont on dit quelque chose
    const plTop = pls.filter(x => x.ctx || x.n >= 3).sort((a, b) => plW(b) - plW(a)).slice(0, 12).sort((a, b) => b.n - a.n), plRest = pls.filter(x => !plTop.includes(x));
    const plsHtml = `<div class="epx-pls">${plTop.map(plCard).join('')}</div>${plRest.length ? `<p class="epx-pl-more"><b>Aussi nommés</b>${plRest.map(x => x.p ? `<a href="${plHref(x.p)}">${esc(x.p.name)}${x.n ? ` <i>${x.n}×</i>` : ''}</a>` : `<span>${esc(x.nom)}</span>`).join('')}</p>` : ''}`;

    // les opinions, regroupées par expert : un portrait, son nom, puis toutes ses opinions de l'épisode
    const groups = []; const gBy = new Map();
    for (const o of s?.opinions || v.lite?.opinions || []) { const k = o.people?.[0] || `q:${norm(o.qui)}`; let g = gBy.get(k); if (!g) { g = { o, list: [] }; gBy.set(k, g); groups.push(g); } g.list.push(o); }
    const grp = g => { const w = opWho(g.o), name = esc(whoName(g.o.people, g.o.qui)), pic = opPic(w, g.o.qui);
      return `<article class="epx-g rv" style="--c:${esc(w.e ? expertColor(w.e) : c.color)}">
        <div class="epx-g-h">${w.href ? `<a class="mpg-op-f${w.p.isPlayer ? ' pl' : ''}" href="${w.href}" tabindex="-1" aria-hidden="true">${pic}</a>` : `<span class="mpg-op-f">${pic}</span>`}
          <div class="epx-g-id">${w.href ? `<a class="epx-g-n no-typo" href="${w.href}">${name}</a>` : `<span class="epx-g-n no-typo">${name}</span>`}${w.role ? `<small>${esc(w.role)}</small>` : ''}<em>${g.list.length} opinion${g.list.length > 1 ? 's' : ''}</em></div></div>
        <ol class="epx-g-l">${g.list.map(o => `<li>${o.contexte ? `<span class="epx-ctx">${esc(String(o.contexte).replace(/\.$/, ''))}</span>` : ''}<p>${linkPlayers(esc(o.opinion))}</p></li>`).join('')}</ol></article>`; };

    const nOps = s?.opinions?.length || 0;
    const stats = s ? `<div class="epx-nums">
        <span><b data-count="${nOps}">0</b><small>opinion${nOps > 1 ? 's' : ''}</small></span>
        <span><b data-count="${groups.length}">0</b><small>expert${groups.length > 1 ? 's' : ''}</small></span>
        <span><b data-count="${pls.length}">0</b><small>joueur${pls.length > 1 ? 's' : ''} mentionné${pls.length > 1 ? 's' : ''}</small></span>
        ${mentions[0] ? `<a href="${plHref(mentions[0].p)}"><b data-count="${mentions[0].m.count}">0</b><small>fois « ${esc(mentions[0].p.name)} »${isArt(v) ? '' : ' en ondes'}</small></a>` : ''}</div>` : '';

    const body = s ? [
      s.points_cles?.length ? sec('ess', 'L’', 'essentiel', `${s.points_cles.length} points`, `<ol class="epx-ess">${s.points_cles.map(essItem).join('')}</ol>`, 'red') : '',
      paras.length ? sec('res', 'Le', 'résumé', null, `<div class="chr-body epx-body">${paras.map(p => `<p>${linkPlayers(esc(p))}</p>`).join('')}</div><div class="chr-ai">Résumé écrit par l’IA à partir ${isArt(v) ? 'du texte' : 'des sous-titres'} · ${esc(show)}</div>`) : '',
      groups.length ? sec('ops', 'Ce qu’ils', 'en disent', `${nOps} opinion${nOps > 1 ? 's' : ''}`, `<div class="epx-gs">${groups.map(grp).join('')}</div>`) : '',
      s.sujets?.length ? sec('der', 'Le', 'déroulement', 'sujet par sujet', `<div class="tl">${s.sujets.map((x, i) => `<section class="tl-item rv l"><span class="dot">${i + 1}</span>
          <div class="bar">${i === 0 ? 'Ouverture' : i === s.sujets.length - 1 ? 'Pour finir' : `Sujet ${i + 1}`}</div><h3>${linkPlayers(esc(x.titre))}</h3>
          ${String(x.resume || '').split(/\n+/).filter(Boolean).map(t => `<p>${linkPlayers(esc(t))}</p>`).join('')}
          ${x.verdict ? `<div class="verdict"><b>Verdict</b><span>${linkPlayers(esc(x.verdict))}</span></div>` : ''}</section>`).join('')}</div>`) : '',
      // « Les répliques » retirées (novembre 2026) : la majorité des citations de l'IA étaient introuvables dans le sous-titre
      pls.length ? sec('pls', 'Joueurs', 'mentionnés', pls.length, plsHtml) : '',
      s.expressions?.length ? sec('lex', 'Le', 'lexique', s.expressions.length, `<table class="stats-t rv"><thead><tr><th>Expression</th><th>Ce que ça veut dire</th></tr></thead>
          <tbody>${s.expressions.map(x => `<tr><td class="ex">« ${esc(x.expression)} »</td><td>${linkPlayers(esc(x.contexte || ''))}</td></tr>`).join('')}</tbody></table>`) : '',
      s.qualite_transcription && s.qualite_transcription !== 'bonne' && s.note_transcription ? `<p class="ep-note">⚠️ Transcription ${esc(s.qualite_transcription)} : ${esc(s.note_transcription)}</p>` : '',
    ].join('') : `${groups.length ? sec('ops', 'Ce qu’ils', 'en disent', `${groups.reduce((t, g) => t + g.list.length, 0)} opinion${groups.reduce((t, g) => t + g.list.length, 0) > 1 ? 's' : ''}`, `<div class="epx-gs">${groups.map(grp).join('')}</div><div class="chr-ai">Opinions relevées par l’IA des manchettes (pas de résumé complet pour ${isArt(v) ? 'cet article' : 'cet épisode'}).</div>`) : ''}<div class="notice">${c.weightOnly ? `<b>Article lu pour le poids médiatique seulement.</b><br><span class="muted">Pas de résumé IA pour cette source : on y compte les joueurs mentionnés.</span>` : `<b>Pas de résumé IA pour ${isArt(v) ? 'cet article' : 'cet épisode'}.</b><br><span class="muted">Les résumés sont générés pour les nouveautés détectées et, à chaque lancement, pour la plus récente de chaque source.</span>`}</div>
      ${pls.length ? sec('pls', 'Joueurs', 'mentionnés', pls.length, plsHtml) : ''}`;

    const also = related.length ? `<section class="epx-also"><div class="mhs-h"><h3>Aussi dans <a href="${showHref(key)}">${esc(show)}</a></h3><a class="mh-all" href="${showHref(key)}">Tous les épisodes →</a></div>
      <div class="epx-also-g">${related.map(r => `<article class="mhs-card"><a class="mhs-img" href="${epHref(r)}" tabindex="-1" aria-hidden="true">${thumbTag(r, 'mqdefault', 'loading="lazy"')}</a>
        <span class="mhs-s">${esc(fmtAgo(dateOf(r)))}${r.summary ? ' · résumé IA' : ''}</span><h4><a href="${epHref(r)}">${esc(displayTitle(r))}</a></h4></article>`).join('')}</div></section>` : '';

    app.innerHTML = `
      <div class="ep-top"><span><b>TUBEWATCH</b> ${esc(type)}</span><span>${esc(fmtDate(dateOf(v)))}${shareBtn(`ep/${encodeURIComponent(v.key)}/${encodeURIComponent(v.videoId)}/`, displayTitle(v))}</span></div>
      <div class="epx">
        <nav class="epx-toc" aria-label="Sommaire"></nav>
        <article class="epx-main">
          <div class="mpg-kick epx-kick"><a class="epx-show" href="${showHref(key)}" style="--c:${esc(c.color)}">${esc(show)}</a><span>${esc(type)} · ${esc(fmtDate(dateOf(v)))}</span>${s?.ton ? `<span class="tone">${esc(s.ton)}</span>` : ''}</div>
          <h1 class="chr-h1 mpg-h1">${linkPlayers(esc(displayTitle(v)))}</h1>
          <div class="ep-byline epx-by">${v.hosts?.length ? faces(v.hosts, hostsTxt, 'sm') : ''}<span>${esc(hostsTxt || show)}</span>
            <span class="meta">${v.words ? `${v.words.toLocaleString('fr-CA')} mots${isArt(v) ? '' : ' transcrits'}` : ''}</span></div>

            ${isArt(v) ? `<span class="read">Lire ${v.kind === 'balado' ? 'la fiche du balado' : 'l’article'} ↗</span>` : `<span class="play"><span><svg width="34" height="34" viewBox="0 0 24 24" fill="#fff"><path d="M8 5v14l11-7z"/></svg></span></span>`}</a>
          <div class="epx-cap"><span>${isArt(v) ? 'Titre original' : 'Sur YouTube'} : <b>${esc(v.title)}</b></span>
            <span class="epx-act"><a href="${esc(v.url)}" target="_blank" rel="noopener">${isArt(v) ? 'Lire l’original ↗' : 'Regarder sur YouTube ↗'}</a>${v.discord ? `<button id="copyDiscord">Copier le JSON Discord${v.discord.length > 1 ? ` (${v.discord.length})` : ''}</button>` : ''}</span></div>
          ${s?.accroche ? `<p class="epx-lead">${linkPlayers(esc(s.accroche))}</p>` : ''}
          ${body}
          ${also}
        </article>
      </div>`;

    // sommaire : une entrée par section présente, la section à l'écran est surlignée
    const toc = app.querySelector('.epx-toc');
    if (toc && secs.length > 1) {
      toc.innerHTML = `<b>Dans ${isArt(v) ? 'cet article' : 'cet épisode'}</b>${secs.map(([id, t]) => `<button data-to="epx-${id}">${esc(t)}</button>`).join('')}`;
      toc.querySelectorAll('button').forEach(b => b.onclick = () => document.getElementById(b.dataset.to)?.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      if ('IntersectionObserver' in window) { const io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) toc.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.to === e.target.id)); }, { rootMargin: '-30% 0px -60% 0px' });
        app.querySelectorAll('.epx-sec').forEach(x => io.observe(x)); }
    } else if (toc) { toc.remove(); app.querySelector('.epx')?.classList.add('notoc'); }

    document.body.classList.add('reading');
    reveal();
    const btn = document.getElementById('copyDiscord');
    if (btn) btn.onclick = async () => {
      const txt = JSON.stringify(v.discord.length === 1 ? v.discord[0] : v.discord, null, 2);
      try { await navigator.clipboard.writeText(txt); toast('JSON Discord copié ✔'); }
      catch { const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); toast('JSON Discord copié ✔'); }
    };
  }

  const DIV_FR = { Atlantic: 'Atlantique', Metropolitan: 'Métropolitaine', Central: 'Centrale', Pacific: 'Pacifique' };
  let plState = { q: '', sort: 'roster', team: null, order: 'num', div: 'all', withCH: false };
  const plColor = p => p.teamAbbrev === (D.focusTeam || 'MTL') ? '#af1e2d' : p.teamAbbrev === 'LAV' ? '#00843d' : '#3b3c3e';
  const plRole = p => [p.number ? `#${p.number}` : null, p.position, p.teamAbbrev !== (D.focusTeam || 'MTL') ? (p.team || null) : null].filter(Boolean).map(esc).join(' · ');
  // Colonne « chroniqueur » d'un joueur (même gabarit que les experts)
  // Ses chiffres de la saison (MoneyPuck, saison courante) : patineur → PJ, B, A, PTS, Game Score; gardien → PJ, % d'arrêts, GSAx
  function seasonLine(p) {
    const S = window.TUBEWATCH_STATS, Z = S?.seasons?.[S.current]; if (!Z || !p.nhlId) return '';
    const ab = p.teamAbbrev; const sk = (Z.byTeam?.[ab]?.skaters || []).find(y => y.id === Number(p.nhlId));
    if (sk) return `<span class="pc-num" title="Saison ${esc(S.archLabels?.[S.current] || S.current)} · MoneyPuck"><span>${sk.gp} PJ</span><span>${sk.g} B</span><span>${sk.a} A</span><b>${sk.pts} PTS</b>${sk.gs != null ? `<span>GS ${fr(sk.gs)}</span>` : ''}${sk.xgPct != null ? `<span>xG ${fr(sk.xgPct, 0)} %</span>` : ''}</span>`;
    const g = (Z.goalies || []).find(y => y.id === Number(p.nhlId));
    if (g) return `<span class="pc-num" title="Saison ${esc(S.archLabels?.[S.current] || S.current)} · MoneyPuck"><span>${g.gp} PJ</span>${g.svPct != null ? `<span>${fr(g.svPct * 100, 1)} % arrêts</span>` : ''}${g.gsax != null ? `<b>GSAx ${sgn(g.gsax)}</b>` : ''}</span>`;
    return '';
  }
  // Colonne d'un joueur, en 3 niveaux : 1) qui (rang médiatique, photo, nom, rôle) 2) ce qu'on dit de lui 3) ses chiffres (poids médiatique, puis la saison)
  function plCol(p, rank, i = 0, fv = null) {
    const s = p.inRoster ? buzzOf(p) : 0, t = s ? trendOf(p) : null;
    return `<a class="xcol pcol rv ${p.videoCount ? '' : 'quiet'}" style="--c:${plColor(p)};--i:${i % 4}" href="${plHref(p)}">

  }
  // Le bas de la carte : la faveur médiatique (CH seulement) et le poids médiatique de la période, en grand; la courbe des 45 jours
  const winShort = () => buzzWin === 'tout' ? 'depuis le début' : winDays(buzzWin) === 1 ? '24 h' : `${winDays(buzzWin)} jours`;
  function pcMedia(p, s, t, fv) {
    return `<span class="pc-m">
      ${fv ? `<span class="pc-m-n"><small>Faveur</small><b>${fv.now}</b>${dTag(fv.d7)}</span>` : ''}
      ${fv ? '' : `<span class="pc-m-n"><small>Poids médiatique · ${esc(winShort())}</small><b>${s}</b>${t ? trendHtml(t) : ''}</span>`}
      ${fv ? `<span class="pc-m-c">${fvChart(fv.e, fv.days, { w: 300, h: 54, lo: 20, hi: 100 })}</span>` : ''}
      ${fv?.gap ? `<span class="fv-gap ${fv.gap[2]}" title="${esc(fv.gap[1])}">${fv.gap[0]}</span>` : ''}</span>`;
  }
  // « Ce qu'on dit » de la page Joueurs : le contexte le plus récent + l'avis d'un expert (aussi utilisé par la page Match)
  function plSay(p) {
    // l'avis d'un expert qui parle surtout de LUI (son nom dans les 70 premiers caractères), parmi les 8 plus récents; sinon le plus récent
    const ctx = latestContext(p), ops = refItems(p, 'op'), ln = norm(String(p.name).split(' ').slice(-1)[0]);
    const op = ops.slice(0, 8).find(x => norm(String(x.item.opinion || '').slice(0, 70)).includes(ln)) || ops[0];
    return `${ctx ? `<span class="xc-bar">Ce qu’on dit · ${esc(agoShort(dateOf(ctx.v)))}</span><span class="xc-op">${boldPlayers(esc(phrase(ctx.m.contexte)))}</span>`
            : op ? `<span class="xc-bar">L’avis d’un expert · ${esc(agoShort(dateOf(op.v)))}</span><span class="xc-op">${boldPlayers(esc(op.item.opinion))}</span>`
            : `<span class="xc-bar mute">${p.videoCount ? 'Mentionné en ondes' : 'Pas encore dans les conversations'}</span>`}
      ${ctx && op ? `<span class="pc-op"><b>${esc(whoName(op.item.people, op.item.qui))} :</b> « ${boldPlayers(esc(op.item.opinion))} »</span>` : ''}`;
  }
  const plMini = p => `<a class="pmini" href="${plHref(p)}" style="--c:${plColor(p)}">${headshot(p, 'sm')}<span><b>${esc(p.name)}</b><small>${plRole(p)}</small></span></a>`;

  // ─── Faveur médiatique dans le temps (page Joueurs) ───────────────────────────────────────────────
  // D.faveurHist (faveur.js → context/faveur.json → data.js) : un point par jour, pour l'équipe, chaque joueur du CH, St-Louis et Hughes.
  //   f = faveur médiatique 0-100 (50 = neutre)  ·  b = poids médiatique du jour  ·  o = opinions notées ce jour-là
  // Matchs sous l'axe : D.match.season (toute la saison, match.js), sinon les derniers matchs (D.match.schedule).
  let fvSort = 'fav'; // tri du vestiaire du CH : faveur (défaut), poids médiatique, variation 7 j
  const FV_DAYS = 45; // fenêtre affichée (jours)
  const fvGames = () => { const F = D.focusTeam || 'MTL'; const all = D.match?.season?.length ? D.match.season : (D.match?.schedule || []);
    return all.filter(g => ['OFF', 'FINAL'].includes(g.state) && g.home?.score != null).map(g => { const home = g.home.abbrev === F, me = home ? g.home : g.away, op = home ? g.away : g.home;
      return { day: g.date, win: me.score > op.score, ot: g.last && g.last !== 'REG', me: me.score, op: op.score, vs: op.abbrev, home }; }); };
  const fvSlice = H => { const n = H.days.length, a = Math.max(0, n - FV_DAYS); return { a, days: H.days.slice(a) }; };
  const delta = (f, k = 7) => { const v = f.filter(x => x != null); if (v.length < 2) return null; const last = v.at(-1); const i = f.length - 1 - k; const prev = i >= 0 ? f.slice(0, i + 1).filter(x => x != null).at(-1) : v[0]; return prev == null ? null : last - prev; };
  const dTag = d => d == null ? '' : `<span class="fv-d ${d > 0 ? 'up' : d < 0 ? 'dn' : ''}" title="Variation sur 7 jours">${d > 0 ? '▲' : d < 0 ? '▼' : '='} ${Math.abs(d)}</span>`;
  // courbe SVG : ligne de faveur (échelle lo-hi), ligne 50, barres de poids médiatique en fond, matchs sous l'axe
  function fvChart(e, days, { w = 1000, h = 240, lo = 30, hi = 90, games = [], big = false } = {}) {
    const f = e.f, b = e.b, n = days.length; if (!n) return '';
    const padB = games.length && big ? 40 : 6, padT = 8, H = h - padB - padT, x = i => (n === 1 ? w / 2 : i * (w - 2) / (n - 1)) + 1, y = v => padT + H * (1 - (Math.max(lo, Math.min(hi, v)) - lo) / (hi - lo));
    const bmax = Math.max(1, ...b), bw = Math.max(1.5, (w / n) * 0.62);
    const bars = b.map((v, i) => v ? `<rect class="fv-b" x="${(x(i) - bw / 2).toFixed(1)}" y="${(padT + H * (1 - v / bmax * 0.55)).toFixed(1)}" width="${bw.toFixed(1)}" height="${(H * v / bmax * 0.55).toFixed(1)}"><title>${esc(days[i])} · poids médiatique ${v}</title></rect>` : '').join('');
    let path = '', pen = false; f.forEach((v, i) => { if (v == null) { pen = false; return; } path += `${pen ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`; pen = true; });
    const last = f.reduce((a, v, i) => v != null ? i : a, -1);
    const dots = big ? f.map((v, i) => v == null ? '' : `<circle class="fv-p" cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="9"><title>${esc(days[i])} · faveur ${v}${e.o?.[i] ? ` · ${e.o[i]} opinion${e.o[i] > 1 ? 's' : ''}` : ''}</title></circle>`).join('') : '';
    const lines = [50, 70].filter(v => v > lo && v < hi);
    const gTitle = g => `${g.day} · ${g.win ? 'Victoire' : 'Défaite'} ${g.me}-${g.op}${g.ot ? ' (prol.)' : ''} ${g.home ? 'contre' : 'à'} ${g.vs}`;
    const gx = games.map(g => { const i = days.indexOf(g.day); if (i < 0) return ''; const X = x(i);
      return `<line class="fv-g ${g.win ? 'v' : 'd'}" x1="${X.toFixed(1)}" x2="${X.toFixed(1)}" y1="${padT}" y2="${padT + H}"/>`; }).join('');
    const pct = X => (X / w * 100).toFixed(2) + '%', top = Y => (Y / h * 100).toFixed(2) + '%';
    const over = !big ? '' : lines.map(v => `<span class="fv-ax" style="top:${top(y(v) - 16)}">${v === 50 ? '50 · neutre' : v}</span>`).join('')
      + games.map(g => { const i = days.indexOf(g.day); return i < 0 ? '' : `<span class="fv-gb ${g.win ? 'v' : 'd'}" style="left:${pct(x(i))};top:${top(h - padB + 8)}" title="${esc(gTitle(g))}"><b>${g.win ? 'V' : g.ot ? 'DP' : 'D'}</b><em>${esc(g.vs)}</em></span>`; }).join('');
    const grid = lines.map(v => `<line class="fv-grid ${v === 50 ? 'mid' : ''}" x1="0" x2="${w}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`).join('');
    const endDot = last >= 0 ? `<span class="fv-end" style="left:${pct(x(last))};top:${top(y(f[last]))}"></span>` : '';
    return `<div class="fv-cw${big ? ' big' : ''}"><svg class="fv-svg${big ? ' big' : ''}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img" aria-label="Faveur médiatique de ${esc(e.n)} sur ${n} jours">${grid}${bars}${gx}<path class="fv-l" d="${path}"/>${dots}</svg>${endDot}${over}</div>`;
  }
  // repère « surcoté / sous-coté » : rang de faveur au CH comparé au rang de Game Score par match (data-stats.js, saison en cours)
  function fvGap(ents) {
    const S = window.TUBEWATCH_STATS, Z = S?.seasons?.[S.current]; const sk = Z?.byTeam?.[D.focusTeam || 'MTL']?.skaters || []; if (!sk.length) return {};
    const gsm = id => { const x = sk.find(y => y.id === Number(id)); return x && x.gp >= 5 ? (x.gs || 0) / x.gp : null; };
    const rows = ents.filter(([id]) => !id.startsWith('staff') && id !== 'team').map(([id, e]) => ({ id, fav: e.f.filter(v => v != null).at(-1), gs: gsm(id) })).filter(r => r.fav != null && r.gs != null);
    const rk = (arr, k) => new Map([...arr].sort((a, b) => b[k] - a[k]).map((r, i) => [r.id, i + 1]));
    const rf = rk(rows, 'fav'), rg = rk(rows, 'gs'), out = {}; const n = rows.length;
    for (const r of rows) { const d = rg.get(r.id) - rf.get(r.id); if (Math.abs(d) >= Math.max(4, Math.round(n / 5))) out[r.id] = d > 0 ? ['Surcoté', 'Les médias l’aiment plus que ses chiffres', 'up'] : ['Sous-coté', 'Ses chiffres valent mieux que ce qu’on en dit', 'dn']; }
    return out;
  }
  // Courbe, faveur du jour, variation 7 j et Surcoté / Sous-coté de chaque joueur du CH, par nhlId (cartes du vestiaire)
  function fvIndex() {
    const H = D.faveurHist; if (!H?.days?.length) return new Map();
    const { a, days } = fvSlice(H);
    const ents = Object.entries(H.ent).filter(([id]) => id !== 'team' && !id.startsWith('staff:')).map(([id, e]) => [id, { ...e, f: e.f.slice(a), b: e.b.slice(a), o: (e.o || []).slice(a) }]);
    const gap = fvGap(ents), out = new Map();
    for (const [id, e] of ents) { const now = e.f.filter(v => v != null).at(-1); if (now == null) continue; out.set(id, { e, days, now, d7: delta(e.f), gap: gap[id] || null }); }
    return out;
  }
  function faveurSection() {
    const H = D.faveurHist; if (!H?.days?.length || !H.ent?.team) return '<p class="pm-empty">La faveur médiatique jour par jour arrive au prochain passage de npm start (faveur.js).</p>';
    const { a, days } = fvSlice(H), cut = e => ({ ...e, f: e.f.slice(a), b: e.b.slice(a), o: (e.o || []).slice(a) });
    const T = cut(H.ent.team), games = fvGames().filter(g => days.includes(g.day));
    const tNow = T.f.filter(v => v != null).at(-1), tD = delta(T.f);
    const vals = T.f.filter(v => v != null), lo = Math.max(0, Math.floor((Math.min(...vals) - 6) / 5) * 5), hi = Math.min(100, Math.ceil((Math.max(...vals) + 6) / 5) * 5);

    const staffCard = ([id, e]) => { const slug = id.slice(6), pe = D.people?.[slug], now = e.f.filter(v => v != null).at(-1), d = delta(e.f);
      return `<a class="fv-st" href="${RC?.staff?.[id] ? `#/staff/${esc(slug)}` : `#/expert/${esc(slug)}`}"><span class="fv-st-h"><b>${esc(e.n)}</b><em>${e.k === 'coach' ? 'Entraîneur-chef' : 'Directeur général'}</em></span>
        <span class="fv-num">${now ?? '—'}${dTag(d)}</span>${fvChart(e, days, { w: 400, h: 90, lo: 20, hi: 90, games })}
        <span class="fv-st-n">${e.o.reduce((t, v) => t + v, 0)} opinions notées sur ${days.length} jours</span></a>`; };

    return `<div class="fv-h"><h2><i>La</i> faveur médiatique <b>du CH</b></h2><span class="fv-sub">ce que les experts pensent des joueurs, jour par jour · ${days.length} derniers jours${rec ? ` · ${rec}` : ''}</span></div>
      <div class="fv-team"><div class="fv-team-n"><span class="fv-num xl">${tNow ?? '—'}</span>${dTag(tD)}<small>sur 100 · 50 = neutre</small></div>
        <div class="fv-team-c">${fvChart(T, days, { big: true, lo, hi, games })}
        <div class="fv-axis">${days.filter((d, i) => (i % 7 === 0 && i < days.length - 4) || i === days.length - 1).map(d => `<span style="left:${(days.indexOf(d) / Math.max(1, days.length - 1) * 100).toFixed(2)}%">${esc(new Date(d + 'T12:00:00').toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' }))}</span>`).join('')}</div></div></div>
      <p class="fv-why">La ligne : la moyenne des opinions d’experts sur les joueurs du CH (notées de −2 à +2 par l’IA, les 2 derniers jours pèsent le plus). Les barres : le poids médiatique du jour. Sous l’axe : les matchs (V, D, DP en prolongation).</p>
      <div class="fv-staff">${staffHtml}</div>`;
  }

  function viewPlayers(tab) {
    const FOCUS = D.focusTeam || 'MTL';
    const TAB = tab === 'analyses' ? 'analyses' : tab === 'ligue' ? 'ligue' : 'ch';
    if (!plState.team) plState.team = FOCUS;
    if (TAB === 'ch') { plState.team = FOCUS; plState.sort = 'roster'; plState.q = ''; }
    else if (TAB === 'ligue' && !plState.ligueSeen) { plState.ligueSeen = true; if (plState.team === FOCUS && plState.sort === 'roster') plState.sort = 'hot'; }

        const list = D.players.filter(p => match(p) && (q || p.videoCount)).sort((a, b) => b.videoCount - a.videoCount || b.totalMentions - a.totalMentions || a.name.localeCompare(b.name));

        html = `<div class="subbar"><span class="lbl">Division</span>${[['all', 'Toutes'], ...divs.map(d => [d, DIV_FR[d] || d])].map(([k, l]) => `<button class="chipf ${plState.div === k ? 'on' : ''}" data-div="${esc(k)}">${esc(l)}</button>`).join('')}

        const talked = scored.filter(x => x.s || x.p.videoCount), silent = scored.filter(x => !x.s && !x.p.videoCount).map(x => x.p);

          <div class="team-sub">${[t.league === 'AHL' ? 'LAH' : 'LNH', t.division ? `Division ${esc(DIV_FR[t.division] || t.division)}` : '', `${ps.length} joueurs`, talked.length ? `${talked.length} dans les conversations` : ''].filter(Boolean).join(' · ')}</div></div></div>`;
        const isF = t.abbrev === (D.focusTeam || 'MTL'), FV = isF ? fvIndex() : new Map(), fvOf = p => FV.get(String(p.nhlId)) || null;

        html += talked.length ? `<div class="vh"><div class="section-title"><i>Le</i> vestiaire <i>${isF && FV.size ? `· ${fvSort === 'fav' ? 'selon la faveur médiatique' : fvSort === 'd7' ? 'selon la variation de faveur sur 7 jours' : `selon le poids médiatique · ${esc(winLabel())}`}` : `selon le poids médiatique · ${esc(winLabel())}`}</i></div>${sortSeg}</div>

          : `<p class="pm-empty">Personne de cette équipe n’a fait jaser ${winLabel()}.${buzzWin !== 'tout' ? ' Essaie une période plus longue.' : ''}</p>`;

  // ─────────── Experts (personnes.json) ───────────
  const chFor = k => chByKey[k] || chByKey[k + '-streams'] || null;
  const EXPERTS = (() => {
    const map = new Map(Object.entries(PEOPLE).map(([id, p]) => [id, { id, ...p, opinions: [], quotes: [], eps: new Set(), last: null }]));
    const touch = (e, v) => { e.eps.add(v); const d = dateOf(v); if (!e.last || d > e.last) e.last = d; };
    for (const v of sortedVideos) {
      for (const o of v.lite?.opinions || []) for (const id of o.people || []) { const e = map.get(id); if (e) { e.opinions.push({ o, v }); touch(e, v); } }
      if (!v.summary) continue;
      for (const o of v.summary.opinions || []) for (const id of o.people || []) { const e = map.get(id); if (e) { e.opinions.push({ o, v }); touch(e, v); } }
      for (const q of v.summary.citations || []) for (const id of q.people || []) { const e = map.get(id); if (e) { e.quotes.push({ q, v }); touch(e, v); } }
      for (const id of v.hosts || []) { const e = map.get(id); if (e) touch(e, v); }
    }
    return [...map.values()].sort((a, b) => (b.last || 0) - (a.last || 0) || b.opinions.length - a.opinions.length || a.nom.localeCompare(b.nom));
  })();
  const expertById = Object.fromEntries(EXPERTS.map(e => [e.id, e]));
  const exHref = id => `#/expert/${encodeURIComponent(id)}`;
  const expertShows = e => {
    const keys = new Set([...(e.chaines || []).map(k => chFor(k)?.key).filter(Boolean), ...[...e.eps].map(v => v.key)]);
    return [...keys].map(k => chByKey[k]);

  function viewExperts() {
    const H24 = NOW - 24 * 36e5, D7 = NOW - 7 * DAY;
    const isPl = o => !!(o.people?.length && expertById[o.people[0]]?.isPlayer);
    const heard = EXPERTS.filter(e => !e.isPlayer && e.eps.size);
    const takes = buildTakes(t => !isPl(t));
    const recentOnly = takes.every(t => t.at >= H24);
    const locker = EXPERTS.filter(e => e.isPlayer && e.opinions[0] && dateOf(e.opinions[0].v) >= D7).sort((a, b) => dateOf(b.opinions[0].v) - dateOf(a.opinions[0].v)).slice(0, 12)
      .map(e => ({ ...e.opinions[0].o, people: [e.id], v: e.opinions[0].v }));
    const n24 = heard.filter(e => e.last && e.last >= H24).length;
    const row = (o, i) => xqRow(o, o.v, i);
    const head = (title, kick) => `<div class="crystal-h"><div><h2 class="crystal-title">${title}</h2><div class="crystal-kick">${kick}</div></div></div>`;

    app.innerHTML = `${sband('Experts', { sub: `Qui a dit quoi, qui est sévère, qui a changé d’idée · ${n24} voix entendue${n24 > 1 ? 's' : ''} dans les 24 h` })}

        <div class="xqs">${locker.map(row).join('')}</div></section>` : ''}`;
    bindVoixSel();
    reveal();
  }

  // ═════ Dossier (recits.js → D.recits) : même gabarit pour les pages Joueur et Expert ═════
  //   verdict + 4 chiffres · le yoyo (ton par période, intervalle 90 %, volume, matchs) · bascules / retournements avec preuves

  const RC = D.recits || null;
  const dsN = (x, d = 2) => x == null ? '—' : `${x > 0 ? '+' : x < 0 ? '−' : ''}${Math.abs(x).toFixed(d).replace('.', ',')}`;
  const dsF = (x, d = 1) => x == null ? '—' : Number(x).toFixed(d).replace('.', ',');
  const dsTone = m => m <= -1 ? 'la grogne' : m <= -0.35 ? 'les doutes' : m < 0.35 ? 'l’indifférence' : m < 1 ? 'la confiance' : 'l’emballement';
  const dsCol = m => m <= -0.35 ? 'var(--red-text)' : m < 0.35 ? 'var(--ink-2)' : 'var(--green-text)'; // couleurs de TEXTE (contraste AA)
  const dsHex = m => m <= -0.35 ? '#e3161e' : m < 0.35 ? '#6b6b6b' : '#1f5fbf';
  const dsDay = d => new Date(String(d).length === 10 ? d + 'T12:00:00' : d).toLocaleDateString('fr-CA', { day: 'numeric', month: 'short' });
  const expByName = new Map(EXPERTS.map(x => [norm(x.nom), x]));
  const dsByNhl = new Map(D.players.filter(x => x.nhlId).map(x => [String(x.nhlId), x]));
  const dsWho = q => { const x = expByName.get(norm(q)); return x ? `<a href="${exHref(x.id)}">${esc(q)}</a>` : `<b>${esc(q || '?')}</b>`; };
  const dsPl = (id, nom) => { const x = dsByNhl.get(String(id)); return x ? `<a href="${plHref(x)}">${esc(nom)}</a>` : `<span>${esc(nom)}</span>`; };
  const dsSrc = src => { const [k, id] = String(src || '').split('/'); const v = vidByKey[vidKey(k, id)]; return v ? `<a href="${epHref(v)}">${esc(chByKey[v.key]?.label?.replace(/^@/, '') || k)}</a>` : esc(chByKey[k]?.label || k || ''); };
  const dsQuote = (o, k) => !o ? '' : `<div class="ds-q" style="--k:${k}"><div class="who">${(x => cutout(x || { nom: o.qui || '?' }, 'mini'))(expByName.get(norm(o.qui)))}<span>${dsWho(o.qui)} · ${esc(dsDay(o.at))} · ${['très critique', 'critique', 'neutre', 'élogieux', 'très élogieux'][Math.max(0, Math.min(4, Math.round(o.note) + 2))] || ''}</span></div>
    ${String(o.texte || o.citation || '').trim() ? `<blockquote>« ${linkPlayers(esc(String(o.texte || o.citation).trim()))} »</blockquote>` : '<p class="ds-noq">Opinion notée, mais pas retranscrite.</p>'}
    <div class="proof">${o.citation ? `✔ Réplique : « ${esc(o.citation)} »` : o.extrait ? `✔ Retrouvé dans le texte brut : « ${esc(o.extrait.replace(/^…\s*|\s*…$/g, ''))} »` : '◌ Paraphrase de l’IA, passage non retrouvé'} · ${dsSrc(o.src)}</div></div>`;
  // courbe : barres = volume du jour, bandes = périodes de ton (moyenne + intervalle à 90 %), points = matchs, tirets = bascules
  function dsChart({ segs = [], vol = [], days = [], bascules = [], showTone = true }) {
    if (!days.length) return '';
    const mob = innerWidth < 700, w = mob ? Math.max(320, Math.min(420, innerWidth - 40)) : 760, h = mob ? 220 : 230, L = 30, R0 = 8;
    const t0 = Date.parse(days[0] + 'T12:00:00'), t1 = Date.parse(days.at(-1) + 'T12:00:00'), X = t => L + ((t - t0) / Math.max(1, t1 - t0)) * (w - L - R0);
    const top = 20, base = h - 26, Y = v => top + ((1.5 - v) / 3) * (base - 40 - top);
    const vmax = Math.max(1, ...vol.filter(x => x != null)), bw = Math.max(2, (w - L - R0) / days.length - 2);

    if (showTone) for (const v of [-1, 0, 1]) s += `<line x1="${L}" x2="${w - R0}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? '#e6e3dc' : '#a9a6a0'}"${v ? ' stroke-dasharray="3 3"' : ''}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="#888" font-family="var(--ui)">${v > 0 ? '+1' : v < 0 ? '−1' : '0'}</text>`;
    vol.forEach((b, i) => { if (!b) return; const bh = (b / vmax) * (showTone ? 34 : base - top - 10); s += `<rect x="${X(t0 + i * DAY) - bw / 2}" y="${base - bh}" width="${bw}" height="${bh}" fill="#d9d6cf"><title>${esc(dsDay(days[i]))} : ${b}</title></rect>`; });
    for (const g of fvGames().filter(g => g.day >= days[0])) s += `<circle cx="${X(Date.parse(g.day + 'T12:00:00'))}" cy="${base + 8}" r="${mob ? 2.6 : 3.2}" fill="${g.win ? '#1f5fbf' : '#e3161e'}"><title>${esc(dsDay(g.day))} · ${g.win ? 'victoire' : 'défaite'} ${g.me}-${g.op} ${g.home ? 'contre' : 'à'} ${esc(g.vs)}</title></circle>`;
    if (showTone) for (const g of segs) {
      const a = Math.max(L, X(Date.parse(g.du + 'T00:00:00'))), b = Math.min(w - R0, X(Date.parse(g.au + 'T23:59:00'))), c = dsHex(g.moy);
      s += `<rect x="${a}" y="${Y(g.ci[1])}" width="${Math.max(1, b - a)}" height="${Math.max(2, Y(g.ci[0]) - Y(g.ci[1]))}" fill="${c}" opacity=".14"/><line x1="${a}" x2="${b}" y1="${Y(g.moy)}" y2="${Y(g.moy)}" stroke="${c}" stroke-width="3.5"/>`;
      if (b - a > 70) s += `<text x="${(a + b) / 2}" y="${Y(g.ci[1]) - 5}" text-anchor="middle" font-size="${mob ? 10.5 : 12}" font-weight="900" fill="${c}" font-family="var(--head)">${esc(dsTone(g.moy).replace(/^(la |les |l’)/, '').toUpperCase())} ${dsN(g.moy)}</text>`;
    }
    for (const q of bascules) { const x = X(Date.parse(q.at + 'T00:00:00')); s += `<line x1="${x}" x2="${x}" y1="${top - 6}" y2="${base}" stroke="#141414" stroke-width="1.2" stroke-dasharray="4 3"/><text x="${Math.min(x + 4, w - 70)}" y="${top - 9}" font-size="10" font-weight="700" fill="#141414" font-family="var(--ui)">BASCULE · ${esc(dsDay(q.at))}</text>`; }
    [0, Math.floor(days.length / 2), days.length - 1].forEach((i, k) => { s += `<text x="${X(t0 + i * DAY)}" y="${h - 2}" text-anchor="${['start', 'middle', 'end'][k]}" font-size="10.5" fill="#888" font-family="var(--ui)">${esc(dsDay(days[i]))}</text>`; });

  // rangée « voix » : barre de −2 à +2 (centre = neutre) · option : point gris = consensus

    return `<div class="ds-vrow" style="--k:${k}">${label}<span class="ds-bar">${bar}</span><b>${right ?? dsN(v)}</b></div>`;
  };
  const dsBasHtml = b => `<article class="ds-bas rv" style="--k:${b.sens === 'hausse' ? 'var(--green)' : 'var(--red)'}"><div class="ds-when">${esc(dsDay(b.at))} · le ton ${b.sens === 'hausse' ? 'monte' : 'baisse'}${b.prouve ? '<span class="ds-pill">prouvée</span>' : ''}</div>

  const dsFlipHtml = (f, by) => `<article class="ds-bas rv" style="--k:var(--ink)"><div class="ds-when">${by === 'qui' ? dsWho(f.qui) : dsPl(f.id, f.joueur)} · ${f.de > 0 ? 'pour' : 'contre'} → ${f.a > 0 ? 'pour' : 'contre'}${f.prouve ? '<span class="ds-pill" style="background:var(--green)">prouvé</span>' : ''}</div>
    <h3>${esc(by === 'qui' ? f.qui : f.joueur.split(' ').slice(-1)[0])} : ${f.de > 0 ? 'de l’éloge à la démolition' : 'de la démolition à l’éloge'}${by === 'qui' ? ` de ${esc(f.joueur.split(' ').slice(-1)[0])}` : ''}</h3>
    <div class="ds-duo">${dsQuote(f.avant, f.de > 0 ? 'var(--green)' : 'var(--red)')}${dsQuote(f.apres, f.a > 0 ? 'var(--green)' : 'var(--red)')}</div></article>`;
  const glo = (k, label) => `<a class="gl" href="#/methode/${k}" title="Ce que ça veut dire">${label}</a>`;
  // rang d'un joueur du CH selon le poids médiatique des 7 derniers jours (faveurHist.b)
  const v7Rank = id => { const E = Object.entries(D.faveurHist?.ent || {}).filter(([, e]) => e.k === 'p').map(([k, e]) => [k, (e.b || []).slice(-7).reduce((a, b) => a + (b || 0), 0)]).sort((a, b) => b[1] - a[1]);
    const i = E.findIndex(([k]) => k === String(id)); return i < 0 ? null : [i + 1, E.length]; };
  const fvNow = e => { const f = e?.f || []; for (let i = f.length - 1; i >= 0; i--) if (f[i] != null) return [f[i], i >= 7 && f[i - 7] != null ? f[i] - f[i - 7] : null]; return [null, null]; };
  const dsKpis = list => `<div class="ds-lexrow">${lexSeg()}</div><div class="ds-kpis rv">${list.map(([h, b, sm, c]) => `<div class="ds-kpi"><div class="ds-kh">${h}</div><b${c ? ` style="color:${c}"` : ''}>${b}</b><small>${sm}</small></div>`).join('')}</div>`;

  function dossierPlayer(p) {

    const cur = rp.actuel, gl = RC.glace?.[String(p.nhlId)], rank = RC.yoyo.findIndex(x => String(x.id) === String(p.nhlId)) + 1, last = p.name.split(' ').slice(-1)[0];

    const gap = gl && gl.ptsSaison > 0.15 && gl.n5 >= 5 ? (gl.pts5 >= gl.ptsSaison * 1.5 && gl.ton5 < 0.35 ? ' Sur la glace, il produit plus que sa moyenne : <b>le micro est en retard sur la glace.</b>'
      : gl.pts5 <= gl.ptsSaison * 0.5 && gl.ton5 > 0.35 ? ' Il produit moins que d’habitude, mais le ton reste bon : <b>le micro est indulgent.</b>' : '') : '';

        [glo('yoyo', esc(lx('yoyo'))), rank ? `${rank}<sup>e</sup>` : '—', rank ? `au CH · ${rp.bascules.length} virage${rp.bascules.length > 1 ? 's' : ''} du ton` : 'aucun virage net du ton'],

      main: `<h2 class="ep-h2 red rv"><i>Le</i> <b>yoyo</b><span class="n">ton des médias, période par période</span></h2>

        ${rp.bascules.length ? `<h2 class="ep-h2 rv"><b>${esc(lx('bascule'))}</b></h2><p class="ds-sub">${esc(lxd('bascule'))}</p>${rp.bascules.slice().reverse().map(dsBasHtml).join('')}` : ''}
        ${RC.retournements.some(f => String(f.id) === String(p.nhlId)) ? `<h2 class="ep-h2 rv"><i>Ils ont changé</i> <b>leur fusil d’épaule</b><span class="n">même voix, opinion contraire</span></h2><p class="ds-sub">${esc(lxd('flip'))}</p>${RC.retournements.filter(f => String(f.id) === String(p.nhlId)).map(f => dsFlipHtml(f, 'qui')).join('')}` : ''}`,

  function dossierExpert(e) {
