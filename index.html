        <p class="ds-sub">Point de couleur = ce qu’il pense du joueur · point gris = ce qu’en pensent les autres voix, les mêmes jours · 4 opinions ou plus</p>
        <div class="ds-card rv">${mine.map(y => dsVrow(short(y), y.x.moy, { cons: Math.round((y.x.moy - y.x.ecart) * 100) / 100, right: dsN(y.x.ecart) })).join('')}</div>` : ''}
        ${flips.length ? `<h2 class="ep-h2 rv"><i>A changé</i> <b>son fusil d’épaule</b><span class="n">même joueur, opinion contraire</span></h2><p class="ds-sub">${esc(lxd('flip'))}</p>${flips.map(f => dsFlipHtml(f, 'joueur')).join('')}` : ''}
        ${v.vol?.some(Boolean) && D.faveurHist?.days?.length ? `<h2 class="ep-h2 rv"><i>Son</i> <b>volume</b><span class="n">opinions notées par jour</span></h2>
          <p class="ds-sub">Barres = ses opinions sur les joueurs du CH, jour par jour · points = matchs (bleu victoire, rouge défaite)</p>
          <div class="ds-card ds-chart rv">${dsChart({ vol: v.vol.slice(-FV_DAYS), days: D.faveurHist.days.slice(-FV_DAYS), showTone: false })}</div>` : ''}`,
      aside: `${(() => { const byMoy = mine.slice().sort((a, b) => b.x.moy - a.x.moy), ch = byMoy.filter(y => y.x.moy > 0).slice(0, 4), bn = byMoy.filter(y => y.x.moy < 0).slice(-4).reverse();
          return `${ch.length ? `<div class="rv"><div class="side-h">Ses <b>chouchous</b></div><p class="ds-sub">Les joueurs dont il dit le plus de bien (4 opinions et plus).</p><div class="ds-card">${ch.map(y => dsVrow(dsPl(y.id, y.nom), y.x.moy)).join('')}</div></div>` : ''}
          ${bn.length ? `<div class="rv"><div class="side-h">Ses <b>bêtes noires</b></div><p class="ds-sub">Les joueurs qu’il critique le plus.</p><div class="ds-card">${bn.map(y => dsVrow(dsPl(y.id, y.nom), y.x.moy)).join('')}</div></div>` : ''}
          ${v.vsStats ? `<div class="rv"><div class="side-h">Est-ce qu’il <b>voit juste ?</b></div><div class="ds-card"><p class="ds-gap" style="margin:0">${v.vsStats.r >= 0.6 ? 'Oui : ses opinions suivent de près les stats avancées.' : v.vsStats.r >= 0.3 ? 'À moitié : ses opinions suivent les stats avancées, mais pas toujours.' : 'Pas vraiment : ses opinions s’éloignent souvent des stats avancées.'}</p><p class="ds-sub" style="margin:6px 0 0">Comparé aux stats MoneyPuck sur ${v.vsStats.n} joueurs du CH.</p></div></div>` : ''}`; })()}`,
    };
  }

  // ═════ Pages Joueurs et Experts : graphiques héros (recits.js → D.recits) ═════
  // palette lisible pour les daltoniens : rouge (baisse, négatif) · gris · bleu (hausse, positif); familles : Okabe-Ito
  const HB = '#1f5fbf', HR = '#d7191c', HG = '#8a8780', OKI = ['#0072B2', '#E69F00', '#009E73', '#CC79A7', '#56B4E9', '#D55E00', '#B8A100', '#8c564b', '#999999', '#7f3c8d'];
  const hLast = n => String(n || '').split(' ').slice(-1)[0];
  // étiquettes sans chevauchement : à droite, à gauche, au-dessus, en dessous du point; sinon rien
  function hLabels(pts, w, h, fs) {
    const boxes = pts.map(p => [p.x - p.rr, p.y - p.rr, p.x + p.rr, p.y + p.rr]).filter(() => true), out = [];
    for (const p of pts.filter(p => p.t)) {
      const tw = p.t.length * fs * 0.56, th = fs + 2;
      for (const [x, y, a] of [[p.x + p.rr + 3, p.y + fs / 3, 'start'], [p.x - p.rr - 3, p.y + fs / 3, 'end'], [p.x, p.y - p.rr - 4, 'middle'], [p.x, p.y + p.rr + fs, 'middle']]) {
        const x0 = a === 'start' ? x : a === 'end' ? x - tw : x - tw / 2, bx = [x0, y - th + 2, x0 + tw, y + 2];
        if (bx[0] < 2 || bx[2] > w - 2 || bx[1] < 2 || bx[3] > h - 2) continue;
        const own = q => q[0] === p.x - p.rr && q[1] === p.y - p.rr;
        if (boxes.some(o => !own(o) && !(bx[2] < o[0] || bx[0] > o[2] || bx[3] < o[1] || bx[1] > o[3]))) continue;
        boxes.push(bx); out.push(`<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="${a}" font-size="${fs}" font-weight="700" fill="${p.c || 'currentColor'}">${esc(p.t)}</text>`); break;
      }
    }
    return out.join('');
  }
  const hSpread = (items, gap, lo, hi) => { items.sort((a, b) => a.y - b.y); for (let k = 0; k < 60; k++) { let mv = false; for (let i = 1; i < items.length; i++) if (items[i].y - items[i - 1].y < gap) { const d = (gap - (items[i].y - items[i - 1].y)) / 2; items[i].y += d; items[i - 1].y -= d; mv = true; } items.forEach(it => { it.y = Math.max(lo, Math.min(hi, it.y)); }); if (!mv) break; } return items; };

  // ── Essaim de visages : chaque joueur placé sur l'axe du ton (14 derniers jours), fantôme à sa position d'il y a 15-28 jours
  function faceSwarm(V, nm) {
    const mob = innerWidth < 700, W = Math.min(innerWidth - 32, 1148), S = mob ? 34 : 46, pad = S / 2 + 4;
    const all = V.flatMap(v => [v.avant.moy, v.maintenant.moy]), lo = Math.min(-0.5, Math.min(...all) - 0.15), hi = Math.max(0.5, Math.max(...all) + 0.15);
    const X = v => pad + ((v - lo) / (hi - lo)) * (W - 2 * pad);
    // placement sans chevauchement : les plus gros mouvements d'abord, au centre; les autres s'écartent vers le haut et le bas
    const order = V.slice().sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta)), placed = [];
    // chaque joueur qui bouge occupe aussi le trajet fantôme → flèche : rien d'autre ne se pose sur ce trajet (pas de flèche qui traverse un visage)
    const span = (v, x) => Math.abs(v.delta) >= 0.3 ? [Math.min(x, X(v.avant.moy)) - S / 2, Math.max(x, X(v.avant.moy)) + S / 2] : [x - S / 2, x + S / 2];
    for (const v of order) { const x = X(v.maintenant.moy), [a, b] = span(v, x); let y = 0;
      for (let k = 0; k < 60; k++) { const cand = k === 0 ? 0 : (k % 2 ? 1 : -1) * Math.ceil(k / 2) * (S + 10);
        if (placed.every(p => Math.abs(p.y - cand) >= S + 8 || p.b < a || p.a > b)) { y = cand; break; } }
      placed.push({ v, x, y, a, b }); }
    const ys = placed.map(p => p.y), top = Math.min(...ys) - S / 2 - 22, H = Math.max(...ys) - Math.min(...ys) + S + 64;
    const lab = new Set(order.slice(0, 3).map(v => v.id));
    let svg = '', faces = '';
    for (const p of placed) {
      const v = p.v, c = v.delta >= 0.3 ? HB : v.delta <= -0.3 ? HR : HG, y = p.y - top, x0 = X(v.avant.moy), pl = dsByNhl.get(String(v.id));
      if (Math.abs(v.delta) >= 0.3) { // fantôme + petite flèche jusqu'au bord du visage
        const dir = Math.sign(p.x - x0), x1 = p.x - dir * (S / 2 + 3);
        svg += `<circle cx="${x0.toFixed(1)}" cy="${y.toFixed(1)}" r="${(S / 2 - 3).toFixed(1)}" fill="${c}" opacity=".12" stroke="${c}" stroke-dasharray="3 3"/>`;
        if (Math.abs(x1 - x0) > 8) svg += `<path d="M${x0.toFixed(1)} ${y.toFixed(1)} L${x1.toFixed(1)} ${y.toFixed(1)}" stroke="${c}" stroke-width="1.6" opacity=".55" marker-end="url(#hxA${c === HB ? 'b' : 'r'})"/>`;
      }
      const label = `${v.nom} : ${dsN(v.avant.moy)} → ${dsN(v.maintenant.moy)} (${dsN(v.delta, 1)})`;
      faces += `<a class="hxf${lab.has(v.id) ? ' big' : ''}" href="${pl ? plHref(pl) : '#/players'}" style="left:${(p.x - S / 2).toFixed(1)}px;top:${(y - S / 2).toFixed(1)}px;--k:${c};--s:${S}px" title="${esc(label)}" aria-label="${esc(label)}">
        ${pl?.image ? `<img src="${esc(pl.image)}" alt="" width="${S}" height="${S}" loading="lazy" decoding="async">` : `<b>${esc(hLast(v.nom).slice(0, 2))}</b>`}
        ${lab.has(v.id) ? `<span class="hxf-l${p.x < 70 ? ' el' : p.x > W - 70 ? ' er' : ''}">${esc(nm(v.nom))} <em>${dsN(v.delta, 1)}</em></span>` : `<span class="hxf-t">${esc(nm(v.nom))} ${dsN(v.delta, 1)}</span>`}</a>`;
    }
    const axis = [-1, 0, 1].filter(v => v > lo && v < hi).map(v => `<line x1="${X(v)}" x2="${X(v)}" y1="0" y2="${H - 20}" stroke="${v ? 'var(--line)' : '#a9a6a0'}"${v ? ' stroke-dasharray="3 4"' : ''}/>`).join('');
    return `<div class="hxs" style="height:${H}px;width:${W}px">
      <svg width="${W}" height="${H}" aria-hidden="true"><defs>${[['b', HB], ['r', HR]].map(([k, c]) => `<marker id="hxA${k}" viewBox="0 0 6 6" refX="5" refY="3" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L6 3L0 6z" fill="${c}"/></marker>`).join('')}</defs>${axis}${svg}
      <text x="4" y="${H - 4}" font-size="11" font-weight="700" fill="${HR}" font-family="var(--ui)">← on le démolit</text><text x="${X(0)}" y="${H - 4}" text-anchor="middle" font-size="11" fill="var(--muted)" font-family="var(--ui)">neutre</text><text x="${W - 4}" y="${H - 4}" text-anchor="end" font-size="11" font-weight="700" fill="${HB}" font-family="var(--ui)">on l’aime →</text></svg>
      ${faces}</div>`;
  }
  // variante mobile : classement avec photo (rang actuel, ▲▼ places gagnées ou perdues)
  function faceRank(V, nm) {
    const now = V.slice().sort((a, b) => b.maintenant.moy - a.maintenant.moy), bef = V.slice().sort((a, b) => b.avant.moy - a.avant.moy);
    return `<ol class="hxr">${now.map((v, i) => { const d = bef.findIndex(x => x.id === v.id) - i, pl = dsByNhl.get(String(v.id)), c = v.delta >= 0.3 ? HB : v.delta <= -0.3 ? HR : HG;
      return `<li style="--k:${c}"><a href="${pl ? plHref(pl) : '#/players'}">${pl?.image ? `<img src="${esc(pl.image)}" alt="" width="36" height="36" loading="lazy" decoding="async">` : '<i></i>'}<span>${esc(nm(v.nom))}</span>
        <em class="mv">${d > 0 ? `▲${d}` : d < 0 ? `▼${-d}` : '='}</em><b>${dsN(v.maintenant.moy)}</b></a></li>`; }).join('')}</ol>`;
  }

  // ═════ Lexique central : chaque concept a un nom Simple (par défaut) et un nom Stats ═════
  // Pour changer un mot sur tout le site, c'est ici. [simple, stats, explication (simple), explication (stats)]
  const LEXM = 'simple'; // un seul langage sur le site : le simple (les noms « Stats » restent dans LEX, pour référence)
  const LEX = {
    severe: ['Plus sévère ou plus indulgent que la gang', 'Effet maison', 'Compare ce qu’il pense d’un joueur à ce qu’en pensent les autres voix, les mêmes jours. En rouge : plus sévère. En bleu : plus indulgent.', 'Écart moyen entre ses notes et celles des autres voix sur le même joueur (±3 jours), avec intervalle à 90 % par bootstrap.'],
    severeCol: ['Sévère ↔ indulgent', 'Effet maison'],
    ctr: ['À contre-courant', 'Contrarien', 'À quel point il s’éloigne de la gang, dans un sens comme dans l’autre. Plus c’est haut, plus il est souvent seul de son bord.', 'Écart absolu moyen au consensus des autres voix (±3 jours).'],
    flip: ['A changé son fusil d’épaule', 'Retournements de veste', 'Même voix, même joueur : nettement contre, puis nettement pour (ou l’inverse), à au moins une semaine d’intervalle.', 'Fenêtre de 14 jours ≤ −0,75 puis ≥ +0,75 (ou l’inverse), 2 notes et plus de chaque côté, 7 jours d’écart et plus.'],
    flipCol: ['Changé d’idée', 'Retourn.'],
    flipsRecent: ['Ils ont changé leur fusil d’épaule', 'Retournements récents', 'Des voix qui disent aujourd’hui le contraire de ce qu’elles disaient il y a quelques semaines, sur le même joueur. Parfois c’est le joueur qui a changé, parfois c’est la voix.', 'Retournements dont l’opinion la plus récente date de moins de 14 jours.'],
    flipsProved: ['Volte-face, preuve à l’appui', 'Retournements prouvés', 'Les deux opinions, l’avant et l’après, sont retrouvées mot à mot dans l’émission ou l’article. Pas de paraphrase : ils l’ont vraiment dit.', 'Les deux côtés ont une citation vérifiée (résumé) ou un passage retrouvé dans les sous-titres.'],
    yoyo: ['Les montagnes russes', 'Indice yoyo', 'Les joueurs sur qui les médias ont viré capot le plus souvent et le plus fort. Un seul gros virage, ou plusieurs allers-retours.', 'Somme des écarts des bascules retenues × (1 + changements de sens).'],
    glace: ['Sous-estimés et surestimés', 'La glace contre le micro', 'Sur ses 5 derniers matchs, il produit nettement plus (ou moins) que d’habitude, mais les médias ne suivent pas. Ceux à surveiller : le ton devrait bientôt changer.', 'Sous-coté : ≥ 1,4 × ses points par match de la saison, ton < +0,35. Surcoté : ≤ 0,6 ×, ton positif.'],
    sous: ['sous-estimé', 'sous-coté'], sur: ['surestimé', 'surcoté'],
    bascule: ['Le vent a tourné', 'Les bascules', 'Le ton des médias a changé pour de vrai, pas juste après une mauvaise soirée : l’écart est gros et la marge d’erreur ne se chevauche pas.', 'Rupture (PELT) avec écart ≥ 0,6 et intervalles à 90 % séparés.'],
    ton: ['Ce qu’on en pense', 'Ton moyen'], vol: ['Combien on en parle', 'Volume'],
    appui: ['La cote d’amour', 'Appui net', 'La part des opinions pour, moins la part des opinions contre. +100 : tout le monde l’appuie. −100 : tout le monde le critique.', '% positives − % négatives, 7 jours glissants (5 opinions et plus), intervalle à 90 % par bootstrap.'],
    ci: ['marge d’erreur', 'intervalle à 90 %'], proved: ['preuve à l’appui', 'prouvé'],
    pos: ['% pour', '% +'], neg: ['% contre', '% −'],
  };
  const lx = k => (LEX[k] || [k, k])[LEXM === 'stats' ? 1 : 0];
  const lxd = k => (LEX[k] || [])[LEXM === 'stats' ? 3 : 2] || '';
  const lexSeg = () => ''; const lexSegOld = () => `<div class="seg lexseg" role="group" aria-label="Niveau de langage"><button type="button" data-lex="simple" class="${LEXM === 'simple' ? 'on' : ''}" aria-pressed="${LEXM === 'simple'}">Simple</button><button type="button" data-lex="stats" class="${LEXM === 'stats' ? 'on' : ''}" aria-pressed="${LEXM === 'stats'}">Stats</button></div>`;
  document.addEventListener('click', e => { const b = e.target.closest('[data-lex]'); if (!b) return; /* bouton retiré */ return; try { localStorage.setItem('tw-lex', LEXM); } catch { /* navigation privée */ } const y = scrollY; route(); scrollTo(0, y); });
  const palCard = (k, body) => `<div class="ds-card"><h3>${esc(lx(k))}</h3><p class="hx-why">${esc(lxd(k))}</p><ol>${body}</ol></div>`;

  // ── Tableau des voix : préréglages de fan + tri par colonne
  const PRESETS = [
    ['severe', 'Les plus sévères', 'eff', 1, 'Les voix qui démolissent plus que la gang, sur les mêmes joueurs, les mêmes jours. En haut : le plus sévère.'],
    ['indulg', 'Les plus indulgents', 'eff', -1, 'Les voix qui voient le verre à moitié plein, plus que tout le monde. En haut : le plus indulgent.'],
    ['ctr', 'À contre-courant', 'ctr', -1, 'Ceux qui pensent souvent autrement que la gang, dans un sens comme dans l’autre.'],
    ['flip', 'Ont changé d’idée', 'rt', -1, 'Ceux qui ont changé leur fusil d’épaule sur au moins un joueur. Entre parenthèses : les volte-face prouvés.'],
    ['talk', 'Parlent le plus', 'n', -1, 'Ceux qu’on entend le plus : nombre d’opinions notées sur les joueurs du CH.'],
  ];
  let presetSel = 'severe';
  function expertsTable() {
    const V = (RC?.voix || []).filter(v => v.stats);
    if (!V.length) return '';
    const who = q => { const x = expByName.get(norm(q)); return x ? `<a href="${exHref(x.id)}">${esc(q)}</a>` : esc(q); };
    const pl = (o) => { if (!o) return '—'; const p = dsByNhl.get(String(o.id)); return `${p ? `<a href="${plHref(p)}">${esc(hLast(o.joueur))}</a>` : esc(hLast(o.joueur))} <small>${dsN(o.moy, 1)}</small>`; };
    const eff = v => { const k = x => 50 + Math.max(-0.7, Math.min(0.7, x)) / 0.7 * 50; return `<span class="xtb" title="${esc(lx('ci'))} : ${dsN(v.ci[0])} à ${dsN(v.ci[1])}${v.sur ? '' : ' (touche 0 : pas assez net)'}"><span class="xtb-b"><i class="ci" style="left:${k(v.ci[0])}%;width:${k(v.ci[1]) - k(v.ci[0])}%"></i><i class="${v.effet < 0 ? 'dn' : 'up'}" style="left:${Math.min(50, k(v.effet))}%;width:${Math.abs(k(v.effet) - 50)}%"></i></span><b class="${v.sur ? (v.effet < 0 ? 'dn' : 'up') : ''}">${dsN(v.effet)}</b></span>`; };
    const P = PRESETS.find(p => p[0] === presetSel) || PRESETS[0];
    const key = { eff: v => v.effet, ctr: v => v.contrarien, rt: v => v.stats.retournements * 10 + v.stats.prouves, n: v => v.stats.notes }[P[2]];
    const rows = V.slice().sort((a, b) => P[3] * (key(a) - key(b)) || b.stats.notes - a.stats.notes).map(v => { const s = v.stats;
      return `<tr class="${s.notes < 15 ? 'thin' : ''}"><td class="nm">${who(v.qui)}</td><td data-v="${s.notes}">${s.notes}</td><td data-v="${v.effet}">${eff(v)}</td><td data-v="${v.contrarien}">${dsF(v.contrarien, 2)}</td>
        <td data-v="${s.pos}">${s.pos} %</td><td data-v="${s.neg}">${s.neg} %</td><td data-v="${s.joueurs}">${s.joueurs}</td><td data-v="${s.chouchou?.moy ?? ''}">${pl(s.chouchou)}</td><td data-v="${s.beteNoire?.moy ?? ''}">${pl(s.beteNoire)}</td>
        <td data-v="${s.retournements * 10 + s.prouves}">${s.retournements}${s.prouves ? ` <small>(${s.prouves} ✔)</small>` : ''}</td>
        <td>${v.proches?.[0] ? `${who(v.proches[0].qui)}${LEXM === 'stats' ? ` <small>r ${dsF(v.proches[0].r, 2)}</small>` : ''}` : '—'}</td></tr>`; }).join('');
    const th = (k, l, t, d = '') => `<th data-k="${k}" scope="col" title="${esc(t)}"${d ? ` data-d="${d}"` : ''}>${l}</th>`;
    return `<h2 class="ep-h2 red rv"><i>Les voix</i> <b>en chiffres</b><span class="n">${V.length} voix avec assez d’opinions notées</span></h2>
      <p class="ds-sub">${esc(lx('severe'))} : ${esc(lxd('severe'))} · ${esc(lx('ctr'))} : ${esc(lxd('ctr'))} · lignes pâles : moins de 15 opinions. Touche un titre de colonne pour trier autrement.</p>
      <div class="sx-scroll xt-scroll"><table class="sx-t sortable xt" data-sid="experts-voix"><thead><tr>${th('nm', 'Voix', 'Nom de la voix', 'asc')}${th('n', 'Opinions', 'Opinions notées sur les joueurs du CH')}${th('eff', esc(lx('severeCol')), lxd('severe'), 'asc')}${th('ctr', esc(lx('ctr')), lxd('ctr'))}
        ${th('pos', lx('pos'), 'Part des opinions positives')}${th('neg', lx('neg'), 'Part des opinions négatives')}${th('j', 'Joueurs', 'Joueurs dont il a parlé')}${th('ch', 'Chouchou', 'Le joueur qu’il aime le plus (3 opinions et plus)')}${th('bn', 'Bête noire', 'Le joueur qu’il aime le moins (3 opinions et plus)', 'asc')}
        ${th('rt', esc(lx('flipCol')), lxd('flip'))}<th scope="col" title="La voix qui pense le plus comme lui (mêmes écarts à la gang)">Pense comme</th></tr></thead>
        <tbody>${rows}</tbody></table></div>${V.length > 20 ? `<button type="button" class="btn ghost fold-btn xt-more" onclick="this.previousElementSibling.classList.add('open');this.remove()">Voir toutes les voix (${V.length})</button>` : ''}`;
  }
  document.addEventListener('click', e => { const b = e.target.closest('[data-pre]'); if (!b) return; presetSel = b.dataset.pre; delete tableSorts['experts-voix']; const y = scrollY; route(); scrollTo(0, y); });

  // ═════ Pages St-Louis et Hughes : le baromètre de la cote d'amour (recits.js → D.recits.staff) ═════
  // courbe −100…+100 : séries { pts: [[jour, y]], c, dash, band: [[jour, lo, hi]], lbl }
  function dsLines(series, { h0 = 230 } = {}) {
    const all = series.flatMap(s => s.pts.map(p => p[0])).sort(); if (!all.length) return '';
    const mob = innerWidth < 700, w = mob ? 420 : 760, h = mob ? 210 : h0, L = 34, R0 = 10, top = 14, bot = h - 24;
    const t0 = Date.parse(all[0] + 'T12:00:00'), t1 = Date.parse(all.at(-1) + 'T12:00:00'), X = d => L + ((Date.parse(d + 'T12:00:00') - t0) / Math.max(DAY, t1 - t0)) * (w - L - R0), Y = v => top + ((100 - v) / 200) * (bot - top);
    let s = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map(x => x.lbl).join(', '))}" font-family="var(--ui)">`;
    for (const v of [-100, -50, 0, 50, 100]) s += `<line x1="${L}" x2="${w - R0}" y1="${Y(v)}" y2="${Y(v)}" stroke="${v ? 'var(--line)' : '#a9a6a0'}"${v ? ' stroke-dasharray="3 4"' : ''}/><text x="${L - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${v > 0 ? '+' + v : v < 0 ? '−' + -v : '0'}</text>`;
    for (const se of series) {

      // ce qu'on pense de lui (faveur du jour du match + 2 jours, 0-100) : petite ligne en haut
      if (fe?.f) { const pts = G.map((g, i) => { const k = H.days.indexOf(g.d); const v = k >= 0 ? (fe.f[Math.min(fe.f.length - 1, k + 2)] ?? fe.f[k]) : null; return v == null ? null : [X(i), 26 + (100 - v) / 100 * 40]; });
        const seg = pts.filter(Boolean); if (seg.length > 1) s += `<polyline points="${seg.map(p => p.map(x => x.toFixed(1)).join(',')).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="4 3" opacity=".6"/><text x="${w - R0}" y="24" text-anchor="end" font-size="10" fill="var(--muted)">ce qu’on en pense ↘</text>`; }
      s += `<text x="${L}" y="${h - 4}" font-size="10.5" fill="var(--muted)">${esc(dsDay(G[0].d))}</text><text x="${w - R0}" y="${h - 4}" text-anchor="end" font-size="10.5" fill="var(--muted)">${esc(dsDay(G.at(-1).d))}</text></svg>`;
      curve = `<h2 class="ep-h2 rv"><i>Match</i> <b>par match</b><span class="n">le tableau ou le jeu ?</span></h2>
        <p class="ds-sub">Barres bleues : les chances de marquer (xG) du CH quand il est sur la glace à 5 contre 5. Barres rouges : celles de l’adversaire. Chiffre en haut : ses points du match. Pointillé : ce qu’on pense de lui dans les jours qui suivent. Un match sans point avec une grosse barre bleue, c’est du bon hockey que la feuille de pointage ne montre pas.</p>
        <div class="ds-card ds-chart rv">${s}</div>`;
    }
    return {
      main: curve,
      aside: `<div class="rv jeu-zone"><div class="side-h">Sa <b>carte</b></div>${jeuNote(', comparées aux joueurs de la LNH à la même position')}${arch ? `<p class="ds-sub">Profil : <b>${esc(arch)}</b>.</p>` : ''}<div class="pst-card">${card}</div></div>${edge}${lines}
        <p class="ds-sub" style="margin-top:6px">Stats : MoneyPuck.com · NHL EDGE</p>`,
    };
  }

  // ── « Qui monte, qui plonge » en haltères : une rangée par joueur, gros visage, point pâle = avant, point plein = maintenant
  function faceDumbbell(V, nm) {
    const all = V.flatMap(v => [v.avant.moy, v.maintenant.moy]), lo = Math.min(-1, Math.floor(Math.min(...all) * 2) / 2), hi = Math.max(1, Math.ceil(Math.max(...all) * 2) / 2);
    const pc = v => ((v - lo) / (hi - lo)) * 100;
    const row = v => { const c = v.delta >= 0.3 ? HB : v.delta <= -0.3 ? HR : HG, pl = dsByNhl.get(String(v.id)), a = pc(v.avant.moy), b = pc(v.maintenant.moy);
      return `<a class="db-row" href="${pl ? plHref(pl) : '#/players'}" style="--k:${c}" aria-label="${esc(`${v.nom} : ${dsN(v.avant.moy)} → ${dsN(v.maintenant.moy)}`)}">
        <span class="db-face">${pl?.image ? `<img src="${esc(pl.image)}" alt="" width="80" height="80" loading="lazy" decoding="async">` : `<b>${esc(hLast(v.nom).slice(0, 2))}</b>`}</span>
        <span class="db-id"><b>${esc(nm(v.nom))}</b><em>${dsTone(v.avant.moy) === dsTone(v.maintenant.moy) ? dsTone(v.maintenant.moy) : `${dsTone(v.avant.moy)} → ${dsTone(v.maintenant.moy)}`}</em></span>
        <span class="db-track"><i class="db-zero" style="left:${pc(0)}%"></i><i class="db-bar" style="left:${Math.min(a, b)}%;width:${Math.abs(b - a)}%"></i><i class="db-a" style="left:${a}%"></i><i class="db-b" style="left:${b}%"></i></span></a>`; };
    const up = V.filter(v => v.delta >= 0.3).sort((x, y) => y.delta - x.delta), dn = V.filter(v => v.delta <= -0.3).sort((x, y) => x.delta - y.delta), st = V.filter(v => Math.abs(v.delta) < 0.3).sort((x, y) => y.maintenant.moy - x.maintenant.moy);
    const legend = `<div class="db-leg"><span>← on le démolit</span><span>neutre</span><span>on l’aime →</span></div>`;
    return `<div class="db-cols"><div class="db-col"><h3 style="color:${HB}">Ils montent</h3>${legend}${up.map(row).join('') || '<p class="ds-sub">Personne cette fois.</p>'}</div>
      <div class="db-col"><h3 style="color:${HR}">Ils plongent</h3>${legend}${dn.map(row).join('') || '<p class="ds-sub">Personne cette fois.</p>'}</div></div>
      ${st.length ? `<div class="db-stable"><h3>Stables</h3><div>${st.map(v => { const pl = dsByNhl.get(String(v.id)); return `<a href="${pl ? plHref(pl) : '#/players'}" title="${esc(`${v.nom} : ${dsN(v.maintenant.moy)}`)}">${pl?.image ? `<img src="${esc(pl.image)}" alt="" width="48" height="48" loading="lazy" decoding="async">` : ''}<span>${esc(nm(v.nom))}</span></a>`; }).join('')}</div></div>` : ''}`;
  }

  // ── Page Joueurs : la manchette du vestiaire + « Qui monte, qui plonge » (graphique pente) + palmarès
  function vestHero(mode = 'main') {
    if (!RC?.vestiaire) return '';
    const V = Object.entries(RC.vestiaire).filter(([id, v]) => v.fiable && v.delta != null && !id.startsWith('staff:')).map(([id, v]) => ({ id, ...v }));

      const type = k >= 1.4 && g.ton5 < 0.35 ? 'sous-coté' : k <= 0.6 && g.ton5 > 0 ? 'surcoté' : null; return { id, ...g, type, score: Math.abs(k - 1) * (1 + Math.abs(g.ton5)) }; })
      .filter(g => g.type).sort((a, b) => b.score - a.score).slice(0, 5);
    const flips = (RC.retournements || []).filter(f => f.apres && Date.parse(f.apres.at) >= NOW - 14 * DAY).slice(0, 5);
    const li = (href, name, small, val, k) => `<li style="--k:${k}"><span>${href ? `<a href="${href}">${esc(name)}</a>` : esc(name)}<small>${small}</small></span><em>${val}</em></li>`;

      ${palCard('glace', glace.map(g => li(pl(g.id), g.nom, `${dsF(g.pts5, 2)} pt/match (saison ${dsF(g.ptsSaison, 2)}) · ${esc(lx('ton').toLowerCase())} ${dsN(g.ton5)}`, esc(lx(g.type === 'sous-coté' ? 'sous' : 'sur')), g.type === 'sous-coté' ? HB : HR)).join('') || '<li>Personne ne détonne cette semaine.</li>')}

    const head = u ? `<div class="hx-une" style="--k:${k_}"><a class="hx-une-face" href="${up_ ? plHref(up_) : '#/players'}">${up_?.image ? `<img src="${esc(up_.image)}" alt="${esc(u.nom)}" width="220" height="220">` : ''}</a>
      <div class="hx-une-t"><div class="hx-kick">Le vestiaire en mouvement · 14 jours</div><h2 class="hx-h1">${esc(u.titre)}</h2>
      <div class="hx-une-move"><span><small>il y a 15 à 28 jours</small><b style="color:${dsCol(u.de)}" title="${esc(lx('ton'))} : ${dsN(u.de)} sur une échelle de −2 à +2">${dsTone(u.de)}</b></span><i aria-hidden="true">→</i><span><small>14 derniers jours</small><b style="color:${dsCol(u.a)}" title="${esc(lx('ton'))} : ${dsN(u.a)} sur une échelle de −2 à +2">${dsTone(u.a)}</b></span></div>
      <p class="ds-sub">Ce que les médias pensent de lui (${u.n[0]} puis ${u.n[1]} opinions). Personne d’autre au CH n’a autant bougé.</p></div></div>
      <div class="ds-duo">${dsQuote(u.avant, u.de > u.a ? HB : HR)}${dsQuote(u.apres, u.de > u.a ? HR : HB)}</div>` : '';
    if (mode === 'pal') return `<section class="hx rv"><h2 class="ep-h2 rv"><i>Les</i> <b>palmarès</b></h2>${pal}</section>`;
    return `<section class="hx rv">${head}
      <h2 class="ep-h2 rv"><i>Qui</i> <b>monte, qui plonge</b><span class="n">14 jours contre les 14 d’avant</span></h2>
      <p class="ds-sub">Ce qu’on pense de chaque joueur : point pâle = il y a 15 à 28 jours, point plein = les 14 derniers jours. Touche un joueur pour ouvrir son dossier.</p>

  }

  // ── Page Experts : la carte des affinités, les familles, « Qui pense comme… », palmarès

    const cards = CARDS.map(([t, k, L, val, why]) => `<div class="vx-card" style="--k:${k}"><h3>${t}</h3><p>${why}</p><ol>${L.map((v, i) => `<li class="${i ? '' : 'top'}">${face(v.qui)}<span>${who(v.qui)}</span><em>${val(v)}</em></li>`).join('')}</ol></div>`).join('');

      <div class="ds-card"><h3>Ceux qui voient juste</h3><p class="hx-why">Leurs opinions sur les joueurs du CH suivent de près les stats avancées (MoneyPuck) : quand ils aiment un joueur, ses stats sont bonnes aussi.</p><ol>${vs.slice(0, 5).map(v => li(v.qui, `${v.vsStats.n} joueurs comparés`, v.vsStats.r >= 0.7 ? 'très juste' : 'juste', HB)).join('') || '<li>—</li>'}</ol></div>
      <div class="ds-card"><h3>Ceux qui voient croche</h3><p class="hx-why">Leurs opinions s’éloignent le plus des stats avancées : ils jugent au cœur, au tableau ou à l’instinct plus qu’aux chiffres.</p><ol>${vs.slice(-5).reverse().map(v => li(v.qui, `${v.vsStats.n} joueurs comparés`, v.vsStats.r < 0.2 ? 'souvent croche' : 'parfois croche', HR)).join('') || '<li>—</li>'}</ol></div></div>`;

      <div class="vx-cards">${cards}</div>
      ${expertsTable()}
      <h2 class="ep-h2 rv"><i>Les</i> <b>palmarès</b></h2>${pal}</section>`;
  }
  const bindVoixSel = () => {};

  // Fiches : on montre le récent (moins de 7 jours : au moins 4, au plus 8), le reste derrière « Voir plus »
  const foldAttr = (list, vOf, label = '') => {
    const recent = list.filter(x => dateOf(vOf(x)) >= NOW - 7 * DAY).length;
    const k = label ? 0 : Math.max(4, Math.min(8, recent));
    return list.length - k > (label ? 0 : 2) ? ` data-fold="${k}"${label ? ` data-fold-label="${esc(label)}"` : ''}` : '';
  };
  function applyFolds(root = app) {
    root.querySelectorAll('[data-fold]').forEach(box => {
      const k = +box.dataset.fold, extra = [...box.children].slice(k);
      if (!extra.length) return;
      extra.forEach(x => { x.hidden = true; });
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'btn ghost fold-btn';
      b.textContent = `${box.dataset.foldLabel || 'Voir plus'} (${extra.length})`;
      b.onclick = () => { extra.forEach(x => { x.hidden = false; x.classList.add('in'); }); b.remove(); };
      box.after(b);
    });
  }

  // ─────────── Stats avancées (MoneyPuck.com + classement LNH) ───────────
  const ord = n => n == null ? '—' : n === 1 ? '1er' : `${n}e`;

      </div><div class="cs-cr">${MP_CREDIT}</div></section>`;

  // petite bande de points : où se situe le CH parmi les 32 équipes (à droite = mieux)
  function dotStrip(list, key, desc, focus) {
    const vals = list.map(t => t[key]).filter(v => v != null);
    if (!vals.length) return '';
    const min = Math.min(...vals), max = Math.max(...vals), avg = vals.reduce((a, b) => a + b, 0) / vals.length;

    return `<svg class="dots" viewBox="0 0 100 18" preserveAspectRatio="none"><line x1="2" y1="9" x2="98" y2="9"/><line class="avg" x1="${x(avg)}" y1="2" x2="${x(avg)}" y2="16"/>
      ${list.filter(t => t[key] != null && t.team !== focus).map(t => `<circle cx="${x(t[key])}" cy="9" r="1.6"><title>${esc(t.team)} : ${fr(t[key], 2)}</title></circle>`).join('')}

  let statsSeason = null, stScope = 'lnh', skSort = 'gs', skPos = 'all', stTeam = null;
  function viewStats() {
    const S = window.TUBEWATCH_STATS, F = S.focus || 'MTL';

    const small = (me.gp || 0) < 10;

    // A. Le CH sous la loupe
    const METRICS = [
      ['xgPct', 'Vrai niveau · xG% à 5 c. 5', v => `${fr(v)} %`, true, 'Part des bonnes chances de marquer (buts attendus) quand c’est 5 contre 5. Plus de 50 % : l’équipe contrôle le jeu.'],

        return uCard({ id: nid, name: pl.name, ab, p, big: uBig(pl.jersey, pl.number ?? p?.number ?? ''), role: esc(LU_POS[pl.pos] || ''), tags: autoTags(st, Z, ab, { kind: kd }), st, Z, kind: kd, icx: { gtd: pl.gtd, injury: pl.injury }, i: k++ }); }).join('')}</div></div>`; };
    const names = lst => lst.map(x => esc((plInTeam(x.name, ab)?.name || x.name).split(' ').slice(-1)[0])).join(' · ');
    // Les gardiens : même carte que les patineurs, mais leurs chiffres à eux (GSAx, % d'arrêts) au lieu des ratings.
    const gkUnit = (gs) => { if (!gs?.length) return ''; let j = 0;
      const cards = gs.slice(0, 2).map((pl) => { const p = plInTeam(pl.name, ab), nid = p?.nhlId || null;
        const g = nid ? (Z?.goalies || []).find(y => y.id === Number(nid)) : null;
        const nm = p?.name || pl.name, href = p ? plHref(p) : null, tag = href ? 'a' : 'div';
        const sv = g?.svPct != null ? `${fr(g.svPct * 100, 1)} %` : null, gsax = g?.gsax != null ? sgn(g.gsax, 1) : null;
        const rk = g?.gsax_rk ? `${g.gsax_rk}<sup>${g.gsax_rk === 1 ? 'er' : 'e'}</sup> de la LNH` : '';
        return `<${tag} class="xcol pcol mtc gkc rv" style="--c:${U_COL(ab)};--i:${j % 2}" ${href ? `href="${href}"` : ''}>
          <span class="col-top"><span class="pc-rk">${uBig(pl.jersey, pl.number ?? p?.number ?? '')}</span>${uFace(p?.image || (nid ? mugOf(nid, ab) : ''), p?.number || '')}</span>
          <span class="xc-name">${esc(nm)}</span><span class="xc-role">${pl.pos === 'g2' ? 'Gardien auxiliaire' : 'Gardien partant'}</span>
          <span class="ic-row">${iconsHtml(iconsOf(null, Z, ab, { gtd: pl.gtd, injury: pl.injury }))}</span>
          ${g ? `<span class="gk-num"><span><b>${g.gp}</b>PJ</span>${sv ? `<span><b>${sv}</b>arrêts</span>` : ''}${gsax ? `<span class="${g.gsax >= 0 ? 'up' : 'dn'}" title="Buts sauvés au-dessus des attentes${rk ? ` · ${rk.replace(/<[^>]+>/g, '')}` : ''}"><b>${gsax}</b>GSAx</span>` : ''}</span>`
            : '<span class="rt-none">Pas encore de match cette saison</span>'}
          <span class="xc-sayw">${uSay(p)}</span></${tag}>`; });
      return `<div class="mt-unit sx-unit mt-gk rv"><div class="mt-ul">Gardiens<span class="sxu-meta">${gs[0] ? `<em class="sxu-tag v2">${esc(String(plInTeam(gs[0].name, ab)?.name || gs[0].name).split(' ').slice(-1)[0])} part</em>` : ''}</span></div><div class="xgrid2 mt-ug n2">${cards.join('')}</div></div>`; };
    return `${legend ? iconLegend() : ''}${(L.forwards || []).map((x, i) => unit(x, `Trio ${i + 1}`, 'line', i)).join('')}${(L.defense || []).map((x, i) => unit(x, `Paire ${i + 1}`, 'pair')).join('')}${gkUnit(L.goalies)}
      <div class="lu-sp">${(L.pp || []).map((x, i) => `<div><span class="lu-lbl">Avantage ${i + 1}</span>${names(x)}</div>`).join('')}${(L.pk || []).map((x, i) => `<div><span class="lu-lbl">Désavantage ${i + 1}</span>${names(x)}</div>`).join('')}</div>
      ${L.injured?.length ? `<div class="lu-inj"><span class="lu-lbl">Infirmerie</span>${L.injured.map(x => `<span class="inj ${esc(x.injury || '')}">${esc(plInTeam(x.name, ab)?.name || x.name)} · ${esc(LU_INJ[x.injury] || x.injury || 'blessé')}</span>`).join('')}</div>` : ''}
      <p class="sx-why"><a href="${esc(L.url)}" target="_blank" rel="noopener">Alignement : DailyFaceoff ↗</a>${L.basis ? ` · ${esc(L.basis.replace('Last Game', 'dernier match'))}` : ''}${L.updatedAt ? ` · mis à jour ${esc(fmtAgo(L.updatedAt))}` : ''}</p>`; };

  // Gardien probable d'un côté (même choix sur la une et dans la page Match) :
  // le 1er gardien de l'alignement DailyFaceoff de cette équipe, sinon celui qui a joué le plus de matchs
  const probableGoalie = (M, side, lines) => { const l = M?.goalies?.[side]?.list || [], dn = lines?.goalies?.[0]?.name;
    return (dn && l.find(x => lastOf(x.name) === lastOf(dn))) || [...l].sort((a, b) => (b.gp || 0) - (a.gp || 0))[0] || null; };
  function nextMatchBand() {
    const M = D.match; if (!M?.game) return '';
    const g = M.game, ch = g.focusIsHome ? g.home : g.away, op = g.focusIsHome ? g.away : g.home, t = fmtGame(g.start);
    const gCh = probableGoalie(M, g.focusIsHome ? 'home' : 'away', M.lines)?.name;
    const gOp = probableGoalie(M, g.focusIsHome ? 'away' : 'home', M.oppLines)?.name;
    return `<a class="nmb" href="#/match"><span class="nmb-k">Prochain match</span>
      <span class="nmb-t">${teamLogo(g.away.abbrev, 'tlogo')}<b>${esc(g.away.common)}</b><i>@</i>${teamLogo(g.home.abbrev, 'tlogo')}<b>${esc(g.home.common)}</b></span>
      <span class="nmb-d">${esc(t.day)} · ${esc(t.time)}${g.venue ? ` · ${esc(g.venue)}` : ''}${g.tv?.length ? ` · ${esc(g.tv.join(', '))}` : ''}</span>
      ${gCh || gOp ? `<span class="nmb-g">Devant le filet : <b>${esc((g.focusIsHome ? gOp : gCh) || '?')}</b> contre <b>${esc((g.focusIsHome ? gCh : gOp) || '?')}</b></span>` : ''}
      <span class="nmb-go">Le face-à-face →</span></a>`;
  }

  function viewMatch() {
    sayUsed = new Set();
    const M = D.match;
    if (!M?.game) { app.innerHTML = `${sband('Match')}<div class="notice">Aucun match au calendrier pour l’instant (npm start va le chercher au prochain cycle).</div>`; return; }
    const S = window.TUBEWATCH_STATS, Z = S?.seasons?.[S.current] || null;
    const g = M.game, F = M.focus || 'MTL', chSide = g.focusIsHome ? 'home' : 'away', opSide = g.focusIsHome ? 'away' : 'home';
    const ch = g[chSide], op = g[opSide], t = fmtGame(g.start);
    const lg = id => { const r = Z?.league?.[id]; return r ? { team: r[0], gp: r[1], gs: r[2], xg: r[3], fin: r[4], toi: r[5], pts: r[6], name: r[7], pos: r[8] } : null; };
    const lgG = id => { const r = Z?.leagueGoalies?.[id]; return r ? { gp: r[1], gsax: r[2], sv: r[3], rk: r[4] } : null; };
    const CAT = { points: 'Points', goals: 'Buts', assists: 'Passes' };
    const colOf = ab => ab === F ? '#af1e2d' : '#3b3c3e';
    // joueur de notre base d'après un nom DailyFaceoff, dans une équipe donnée
    const findIn = (name, ab) => { const ln = lastOf(name), fi = norm(name)[0]; const c = D.players.filter(p => p.teamAbbrev === ab && lastOf(p.name) === ln); return c.find(p => norm(p.name)[0] === fi) || c[0] || (ab === F ? chPlayer(name) : null); };
    // portrait sans fond (même gabarit que la page Joueurs)
    const face = (src, label) => `<div class="hs col-face">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(label || '')}</b></div>`;
    // carte façon page Joueurs : gros chiffre + portrait, nom, rôle, stats, ce qu'on dit
    const pcard = ({ id, name, headshot, ab, big, role, extra = '', p = null, i = 0, tags = [], slot = null }) => {
      p = p || plByNhl[String(id)] || null; const nid = p?.nhlId || id; const st = stOfId(Z, ab, nid, p?.name || name);
      return uCard({ id: nid, name, headshot, ab, big, role, tags, st, Z, p, i, extra, kind: kindOf(Z, ab, st, slot) });
    };

    // ── En-tête façon page Joueurs : bandeau rouge + 2 encadrés d'équipes + encadré jaune « face à face »
    // la LNH donne awayTeam / homeTeam
    const l10 = { away: M.last10?.awayTeam || M.last10?.away, home: M.last10?.homeTeam || M.last10?.home }, ts = { away: M.teamStats?.awayTeam || {}, home: M.teamStats?.homeTeam || {} };
    const teamTeaser = (tm, side) => { const L = l10[side] || {}; return `<div class="teaser mt-team-t${tm.abbrev === ch.abbrev ? ' ch' : ''}"><div class="t-h">${side === 'home' ? 'Reçoit' : 'Visiteur'}</div>
      <div class="mt-tt">${teamLogo(tm.abbrev, 'tlogo lg')}<div><div class="t-y">${esc(tm.common)}</div><p>Fiche ${esc(tm.record || '—')}${L.streakType ? ` · séquence ${esc(L.streakType)}${L.streak || ''}` : ''}</p>
      ${(L.pastGameResults || []).length ? `<p class="mt-res">${L.pastGameResults.slice(0, 5).map(r => `<span class="${/W/.test(r.gameResult) ? 'w' : /OT/.test(r.gameResult) ? 'o' : 'l'}">${esc(r.gameResult === 'W' ? 'V' : r.gameResult === 'L' ? 'D' : r.gameResult === 'OTL' ? 'DP' : r.gameResult === 'OTW' ? 'VP' : r.gameResult)}<small>${esc(r.opponentAbbrev)}</small></span>`).join('')}</p>` : ''}</div></div></div>`; };
    const row = (lbl, a, b, fmt, better = 'hi', ra, rb) => { if (a == null && b == null) return ''; const aw = better === 'hi' ? a > b : a < b, bw = better === 'hi' ? b > a : b < a;
      return `<tr><td class="nm">${lbl}</td><td class="v ${aw ? 'win' : ''}">${fmt(a)}${ra ? `<small> ${ord(ra)}</small>` : ''}</td><td class="v ${bw ? 'win' : ''}">${fmt(b)}${rb ? `<small> ${ord(rb)}</small>` : ''}</td></tr>`; };
    const pc = x => x == null ? '—' : fr(x * 100, 1) + ' %', two = x => x == null ? '—' : fr(x, 2);
    const A = ts.away || {}, B = ts.home || {};
    const teamCH = Z?.teams?.find(x => x.team === g.away.abbrev), teamOP = Z?.teams?.find(x => x.team === g.home.abbrev);
    const aside = `<aside class="standings"><div class="standings-h"><b>FACE À FACE<i>///</i>${esc(g.away.abbrev)} @ ${esc(g.home.abbrev)}</b><small>cette saison · rang LNH</small></div>
      <table><thead><tr><th></th><th>${esc(g.away.abbrev)}</th><th>${esc(g.home.abbrev)}</th></tr></thead><tbody>
        ${row('Buts pour /m', A.goalsForPerGamePlayed, B.goalsForPerGamePlayed, two, 'hi', A.goalsForPerGamePlayedRank, B.goalsForPerGamePlayedRank)}
        ${row('Buts contre /m', A.goalsAgainstPerGamePlayed, B.goalsAgainstPerGamePlayed, two, 'lo', A.goalsAgainstPerGamePlayedRank, B.goalsAgainstPerGamePlayedRank)}
        ${row('Avantage num.', A.ppPctg, B.ppPctg, pc, 'hi', A.ppPctgRank, B.ppPctgRank)}
        ${row('Désavantage num.', A.pkPctg, B.pkPctg, pc, 'hi', A.pkPctgRank, B.pkPctgRank)}
        ${row('Mises en jeu', A.faceoffWinningPctg, B.faceoffWinningPctg, pc, 'hi', A.faceoffWinningPctgRank, B.faceoffWinningPctgRank)}
        ${teamCH && teamOP ? row('xG% à 5 c. 5', teamCH.xgPct, teamOP.xgPct, x => x == null ? '—' : fr(x) + ' %', 'hi', teamCH.xgPct_rk, teamOP.xgPct_rk) : ''}
        ${teamCH && teamOP ? row('PDO (chance)', teamCH.pdo, teamOP.pdo, x => x == null ? '—' : fr(x), 'hi') : ''}
      </tbody></table><div class="foot">En gras : l’avantage. Stats avancées : ${MP_CREDIT}</div></aside>`;

    // ── Duels des meneurs
    const duelCards = []; let di = 0;
    for (const l of M.leaders || []) { if (!CAT[l.category]) continue;
      const pair = [['away', g.away], ['home', g.home]].map(([side, tm]) => { const x = l[side]; return x ? pcard({ id: x.id, name: x.name, headshot: x.headshot, ab: tm.abbrev, big: x.value ?? '—', role: `${esc(CAT[l.category])} · ${esc(tm.common)}`, i: di++ }) : '<div class="xcol"></div>'; });
      duelCards.push(`<div class="mt-unit"><div class="mt-ul">${esc(CAT[l.category])}</div><div class="xgrid2 mt-ug n2">${pair.join('')}</div></div>`); }

    // ── Gardiens probables
    const gl = M.goalies || {};
    const pickG = (side, lines) => probableGoalie(M, side, lines);
    // anneaux du gardien (% d'arrêts, GSAx) d'après MoneyPuck
    const gRings = x => { const g = (Z?.goalies || []).find(y => Number(y.id) === Number(x.id)); return g ? pcRings({ ...g, id: Number(g.id) }, Z, true) : ''; };
    // Gardien contre gardien : face-à-face en papillon (barres qui partent du centre, le meilleur en couleur)
    const goalieDuel = (A, tA, linesA, B, tB, linesB) => {
      if (!A && !B) return '';
      const side = (x, tm, lines) => { if (!x) return '<div class="gd-p"></div>'; const p = plByNhl[String(x.id)];
        const starter = lines?.goalies?.[0] && lastOf(lines.goalies[0].name) === lastOf(x.name);
        return `<div class="gd-p">${face(p?.image || x.headshot || mugOf(x.id, tm.abbrev), p?.number || '')}
          <span class="gd-team">${teamLogo(tm.abbrev, 'tlogo')}${esc(tm.common)}</span>
          <${p ? `a href="${plHref(p)}"` : 'span'} class="gd-n">${esc(p?.name || x.name)}</${p ? 'a' : 'span'}>
          <span class="gd-s">${starter ? 'Partant probable' : 'Gardien n° 1'} · ${esc(x.record || '—')}</span>${gRings(x)}</div>`; };
      const a = A && lgG(A.id), b = B && lgG(B.id);
      const rows = [
        ['% d’arrêts', A?.svPct, B?.svPct, v => v == null ? '—' : fr(v * 100, 1) + ' %', 'hi', [.86, .94]],
        ['Moyenne de buts', A?.gaa, B?.gaa, v => v == null ? '—' : fr(v, 2), 'lo', [1.5, 4.5]],
        ['Buts sauvés vs attendus (GSAx)', a?.gsax, b?.gsax, v => v == null ? '—' : sgn(v), 'hi', [-6, 6]],
        ['Matchs joués', A?.gp, B?.gp, v => v == null ? '—' : String(v), 'hi', [0, Math.max(5, A?.gp || 0, B?.gp || 0)]],
      ].filter(r => r[1] != null || r[2] != null);
      const w = (v, [lo, hi], dir) => { if (v == null) return 0; let r = (v - lo) / (hi - lo); if (dir === 'lo') r = 1 - r; return Math.round(Math.max(.06, Math.min(1, r)) * 100); };
      return `<div class="gd rv">${side(A, tA, linesA)}<div class="gd-mid">${rows.map(([lbl, x, y, f, dir, rg]) => { const xw = (dir === 'hi' ? x > y : x < y), yw = (dir === 'hi' ? y > x : y < x);
          return `<div class="gd-row"><span class="gd-v ${xw ? 'win' : ''}">${f(x)}</span><span class="gd-bar l ${xw ? 'win' : ''}"><i style="--w:${w(x, rg, dir)}%"></i></span><span class="gd-lbl">${lbl}</span><span class="gd-bar r ${yw ? 'win' : ''}"><i style="--w:${w(y, rg, dir)}%"></i></span><span class="gd-v ${yw ? 'win' : ''}">${f(y)}</span></div>`; }).join('')}
        <p class="gd-why">GSAx : buts qu’un gardien moyen aurait accordés sur les mêmes tirs, moins ceux qu’il a accordés. En couleur : l’avantage.</p></div>${side(B, tB, linesB)}</div>`;
    };

    // ── Alignements (DailyFaceoff) : une rangée par trio / paire, cartes façon page Joueurs
    const lineup = (L, tm, legend = true) => uLineup(L, tm.abbrev, Z, legend);

    // ── À surveiller chez l'adversaire : ses meneurs (+ meilleurs Game Score de son équipe)
    const watch = [], seen = new Set();
    for (const l of M.leaders || []) { const x = l[opSide]; if (!x) continue; const w = watch.find(y => y.id === x.id);
      const tag = `${x.value} ${CAT[l.category] ? CAT[l.category].toLowerCase() : ''}`;
      if (w) w.tags.push(tag); else { seen.add(x.id); watch.push({ ...x, tags: [tag], lead: true }); } }
    if (watch.length < 4 && Z?.league) for (const [id, r] of Object.entries(Z.league).filter(([, r]) => r[0] === op.abbrev && r[8] !== 'G').sort((a, b) => (b[1][2] || 0) - (a[1][2] || 0))) { if (watch.length >= 4) break; if (!seen.has(Number(id))) { seen.add(Number(id)); watch.push({ id: Number(id), name: r[7], tags: [`${r[6] ?? 0} points`] }); } }

    const chG = pickG(chSide, M.lines), opG = pickG(opSide, M.oppLines);
    // l'équipe qui reçoit est toujours nommée en dernier (visiteur @ hôte)
    const teasers = teamTeaser(g.away, 'away') + teamTeaser(g.home, 'home');
    app.innerHTML = `${sband(`${esc(g.away.abbrev)} @ ${esc(g.home.abbrev)}`, { sub: `${esc(t.day)} · ${esc(t.time)}${g.venue ? ` · ${esc(g.venue)}` : ''}${g.tv?.length ? ` · ${esc(g.tv.join(', '))}` : ''}`, teasers, right: aside })}

      <div class="jeu-zone jeu-lead">${jeuNote(' : chaque carte de joueur de cette page')}</div>
      <div class="section-title"><i>À surveiller</i> chez les ${esc(op.common)}</div>
      ${watch.length ? `<div class="mt-lu"><div class="mt-unit rv"><div class="xgrid2 mt-ug n4">${watch.slice(0, 4).map((x, i) => { const pl = [...(M.oppLines?.forwards || []).flat(), ...(M.oppLines?.defense || []).flat()].find(y => lastOf(y.name) === lastOf(x.name));
          const auto = autoTags(stOfId(Z, op.abbrev, x.id, x.name), Z, op.abbrev).filter(t => t.k === 'up' || t.k === 'dn');
          return pcard({ id: x.id, name: x.name, headshot: x.headshot, ab: op.abbrev, big: uBig(pl?.jersey, pl?.number ?? x.number ?? ''),
            role: '', tags: [...(x.lead ? [{ t: 'Meneur', k: 'lead' }] : []), ...x.tags, ...auto].slice(0, 4), i }); }).join('')}</div></div></div>` : ''}

      ${chG || opG ? `<div class="section-title"><i>Gardien</i> contre <i>gardien</i></div><div class="mt-lu">${g.focusIsHome ? goalieDuel(opG, op, M.oppLines, chG, ch, M.lines) : goalieDuel(chG, ch, M.lines, opG, op, M.oppLines)}</div>` : ''}

      ${M.lines ? `<div class="section-title"><i>L’alignement</i> du CH</div><div class="mt-lu">${lineup(M.lines, ch)}</div>` : ''}

      ${M.oppLines ? `<div class="section-title"><i>L’alignement</i> des ${esc(op.common)}</div><div class="mt-lu">${lineup(M.oppLines, op, false)}</div>` : '<p class="sx-why">L’alignement de l’adversaire arrive au prochain cycle de npm start.</p>'}

      <p class="sx-credit">Match, meneurs et stats d’équipe : LNH. Alignements : <a href="https://www.dailyfaceoff.com" target="_blank" rel="noopener">DailyFaceoff</a>. Stats avancées : ${MP_CREDIT}.</p>`;
    benchify();
    reveal();
  }

  const jeuNote = (txt = '') => `<p class="jeu-note"><span class="jeu-slug">Le jeu</span><span>Cotes de 40 à 99 façon jeu vidéo, tirées des stats avancées (MoneyPuck)${txt}. Ce n’est pas l’avis des experts : ça, c’est la <a href="#/methode/faveur">faveur médiatique</a>.</span></p>`;

  // rangée de navigation qui défile (téléphone) : on amène la page courante au centre, et le fondu de bord indique la suite
  const navEl = document.querySelector('.nav');
  function navInView() {
    if (!navEl) return;
    const a = navEl.querySelector('a.active');
    if (a && navEl.scrollWidth > navEl.clientWidth + 2) navEl.scrollLeft = a.offsetLeft - (navEl.clientWidth - a.offsetWidth) / 2;
    navEdges();
  }
  function navEdges() {
    if (!navEl) return;
    const over = navEl.scrollWidth > navEl.clientWidth + 2;
    navEl.classList.toggle('fade-r', over && navEl.scrollLeft + navEl.clientWidth < navEl.scrollWidth - 4);
    navEl.classList.toggle('fade-l', over && navEl.scrollLeft > 4);
  }
  navEl?.addEventListener('scroll', navEdges, { passive: true });
  addEventListener('resize', navEdges, { passive: true });

  function notFound() {
    app.innerHTML = '<div class="notice">Page introuvable. <a href="#/" style="color:var(--red);font-weight:700">Retour à la une</a></div>';
  }

  // ─────────── Recherche globale ───────────
  const q = document.getElementById('q'), sr = document.getElementById('sr');
  q.addEventListener('input', () => {
    const t = norm(q.value.trim());
    if (t.length < 2) { sr.classList.remove('open'); return; }
    const ps = D.players.filter(p => norm(p.name).includes(t)).sort((a, b) => b.videoCount - a.videoCount).slice(0, 5);
    const vs = sortedVideos.filter(v => norm(v.title + ' ' + (v.summary?.titre_court || '') + ' ' + (v.summary?.resume || '')).includes(t)).slice(0, 8);
    const xs = EXPERTS.filter(e => !e.isPlayer && (norm(e.nom).includes(t) || norm(e.role || '').includes(t))).sort((a, b) => (b.eps?.size || 0) - (a.eps?.size || 0)).slice(0, 5);
    sr.innerHTML = (xs.length ? `<div class="sr-group">Experts</div>` + xs.map(e => `<a class="sr-item" href="${exHref(e.id)}"><span class="sr-face" style="--c:${esc(expertColor(e))}">${cutout(e)}</span><div><div class="t">${esc(e.nom)}</div><div class="s">${esc(e.role || 'Expert')}${e.eps?.size ? ` · ${e.eps.size} épisode${e.eps.size > 1 ? 's' : ''}` : ''}</div></div></a>`).join('') : '') +
      (ps.length ? `<div class="sr-group">Joueurs</div>` + ps.map(p => `<a class="sr-item" href="${plHref(p)}">${jersey(p)}<div><div class="t">${esc(p.name)}</div><div class="s">${esc(p.team)} · ${p.videoCount} épisodes</div></div></a>`).join('') : '') +
      (vs.length ? `<div class="sr-group">Épisodes</div>` + vs.map(v => `<a class="sr-item" href="${epHref(v)}"><img src="${vthumb(v, 'default')}" alt=""><div><div class="t">${esc(displayTitle(v))}</div><div class="s">${esc(chByKey[v.key].label)}</div></div></a>`).join('') : '') ||
      `<div class="sr-empty"><b>Rien pour « ${esc(q.value.trim())} ».</b> Essaie un nom de famille (Suzuki), une émission (JiC) ou un expert (Gonzalez).</div>`;

  };
  const freshRoute = () => checkVersion().then(stale => { if (stale) location.reload(); });
  window.addEventListener('hashchange', () => { route(); freshRoute(); });
  // cliquer sur la section où l'on est déjà (ex. « À la une » sur la une) : redessine et vérifie aussi
  document.addEventListener('click', e => { const a = e.target.closest('a[href^="#"]'); if (!a) return;
    const want = (a.getAttribute('href') || '').replace(/^#\/?/, ''), cur = location.hash.replace(/^#\/?/, '');
    if (want === cur) { e.preventDefault(); verAt = 0; checkVersion().then(stale => { if (stale) location.reload(); else { route(); scrollTo(0, 0); } }); } });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkVersion().then(stale => {
    if (stale && (scrollY < 300 || /^#?\/?(manchettes)?$/.test(location.hash))) location.reload(); else if (stale) verAt = 0; }); });
  route();
  // précharge les détails quand la page est calme (navigation instantanée ensuite)
  setTimeout(() => (window.requestIdleCallback || setTimeout)(() => loadDetails()), 2500);
})();
</script>
</body>
