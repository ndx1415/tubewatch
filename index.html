    //     puis un chouchou revient au plus tôt après 6 autres cartes. Seuls les chouchous reviennent plusieurs fois.
    const TAKES_H = 12, TAKES_MIN = 8, FAV_MAX = 4, FAV_OPEN = 3, FAV_GAP = 6;
    const takeKey = t => t.people?.[0] || `${norm(t.qui || '')}|${t.v.key}`;
    const nVoices = ts => new Set(ts.map(takeKey)).size;
    const padTo = pool => { const keys = new Set(); let i = 0; for (; i < pool.length && keys.size < TAKES_MIN; i++) keys.add(takeKey(pool[i])); return pool.slice(0, i); };
    // Lendemain d'un match du CH (D.lastGame, build-ui.js) :
    //   · de la fin du match jusqu'à 11 h le lendemain : « après le match » — 12 h glissantes, jamais avant la fin du match
    //   · jusqu'à minuit le lendemain : les sources PARUES avant la fin du match sont exclues (même résumées après coup, même en complément)
    //   · moins de 3 voix d'après-match : mode normal (juste après le match, avant que les réactions arrivent)
    // Les autres jours (et après 11 h) : 12 h glissantes; moins de 8 voix : on complète avec les plus récentes d'avant.
    const LG = D.lastGame, lgEnd = LG ? Date.parse(LG.end) : 0;
    const postTakes = LG && NOW >= lgEnd && NOW < Date.parse(LG.until) ? everyTake.filter(t => +dateOf(t.v) >= lgEnd) : [];
    const noPre = nVoices(postTakes) >= 3; // avant-match exclu
    const postGame = noPre && NOW < Date.parse(LG.postUntil || LG.until); // mode « après le match » (jusqu'à 11 h)
    const pool = noPre ? postTakes : everyTake;
    const freshTakes = pool.filter(t => t.at >= (postGame ? Math.max(NOW - TAKES_H * 36e5, lgEnd) : NOW - TAKES_H * 36e5));
    const rawTakes = nVoices(freshTakes) >= TAKES_MIN ? freshTakes : padTo(pool); // journée calme : on remonte dans le temps (8 voix)
    const isFav = t => !!(t.people?.length && D.people?.[t.people[0]]?.chouchou);
    const ordered = (() => {
      const groups = new Map();
      for (const t of rawTakes) { const k = takeKey(t); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(t); } // déjà du plus récent au plus ancien
      const favQ = [...groups.values()].filter(g => isFav(g[0])).map(g => g.slice(0, FAV_MAX)).sort((a, b) => b[0].at - a[0].at);
      const others = [...groups.values()].filter(g => !isFav(g[0])).map(g => g[0]).sort((a, b) => b.at - a.at);
      const out = [], last = new Map(); // chouchou → position de sa dernière carte
      const put = t => { last.set(takeKey(t), out.length); out.push(t); };
      // ouverture : la plus récente opinion des 3 chouchous les plus récents
      for (const q of favQ.slice(0, FAV_OPEN)) put(q.shift());
      // les autres chouchous entrent à leur rang de récence, comme tout le monde
      const rest = [...others, ...favQ.slice(FAV_OPEN).map(q => q.shift())].sort((a, b) => b.at - a.at);
      // jamais 2 retours de chouchous collés : au moins une autre carte entre deux retours (sinon ils arrivent en paquet)
      let lastReturn = -Infinity;
      const ready = (spaced = true) => favQ.filter(q => q.length && last.has(takeKey(q[0])) && out.length - last.get(takeKey(q[0])) > FAV_GAP
        && (!spaced || out.length - lastReturn > 1)).sort((a, b) => b[0].at - a[0].at)[0];
      while (rest.length) { const q = ready(); if (q) { lastReturn = out.length; put(q.shift()); } else put(rest.shift()); }
      // fin du bloc : les retours de chouchous encore possibles (toujours 6 cartes d'écart)
      for (let q = ready(false); q; q = ready(false)) put(q.shift());
      return out;
    })();
    ordered.postGame = postGame ? LG : null; // titre du slider : « Après la défaite 5-2 contre les Predators »
    return ordered;

  function bindSlider(id) {

        ${plFace(x.p)}</a>`);
    }
    // 3. La réplique du jour (ailleurs que dans l'émission en vedette juste en dessous)
    const leadV = sumPool[0];
    const qs = sumPool.flatMap(v => (v.summary.citations || []).map(c => ({ c, v }))).filter(x => x.c.texte);
    const q = qs.find(x => x.v !== leadV && x.c.people?.length) || qs.find(x => x.v !== leadV) || qs[0];

    // Opinions identifiées (voix connues) sur un joueur, des 3 derniers jours
    const idOps = p => refItems(p, 'op').filter(o => o.item.people?.length && exOf(o.item.people[0]) && dateOf(o.v) >= NOW - 3 * DAY);
    const hotList = [...ranking('1j').all, ...ranking('3j').all];
    // 4. L'opinion qui fait jaser : style page Experts, sur le joueur le plus discuté
    const hot = hotList.find(x => idOps(x.p).length);
    const used = new Set();
    if (hot) { const o = idOps(hot.p)[0], e = exOf(o.item.people[0]); used.add(o.item);
      cards.push(`<a class="pz-card" href="${exHref(e.id)}" style="--c:${colorOf(e)}"><span class="pz-k">L’opinion qui fait jaser · ${esc(hot.p.name)}</span>

    // 5. Le débat : deux voix différentes sur le même joueur (deux colonnes)
    const deb = hotList.map(x => { const seen = new Set(); const two = idOps(x.p).filter(o => !used.has(o.item) && !seen.has(o.item.people[0]) && seen.add(o.item.people[0])).slice(0, 2); return two.length === 2 ? { p: x.p, two } : null; }).find(Boolean);
    if (deb) cards.push(`<div class="pz-card pz-deb"><span class="pz-k">Le débat · <a href="${plHref(deb.p)}">${esc(deb.p.name)}</a></span><div class="pz-deb-g">${deb.two.map(o => { const e = exOf(o.item.people[0]);

    if (!cards.length) return '';
    return `<section class="pulse"><div class="pz-h">Le <b>pouls</b><small>ce qui se dit en ce moment</small></div><div class="pz-grid">${cards.join('')}</div></section>`;
  }

  // YouTube exige de savoir quel site intègre la vidéo (en-tête Referer) : ouvert depuis un fichier local (file://), il n'y en a pas

  // Si le lecteur signale une erreur (vidéo non intégrable, 150/153…), on remet la vignette avec « Regarder sur YouTube ».
  const canEmbedYt = /^https?:$/.test(location.protocol);
  document.addEventListener('click', e => {
    const a = e.target.closest?.('a.ep-photo[data-yt]');

    a.replaceWith(box);
    const fr = box.querySelector('iframe');
    const onMsg = ev => { if (ev.source !== fr.contentWindow) return; let d = ev.data; try { if (typeof d === 'string') d = JSON.parse(d); } catch { return; }

  const tipShow = el => { tipFor = el; tipBox.textContent = el.dataset.tip || ''; tipBox.classList.add('on');

  // ─────────── Experts (personnes.json) ───────────
  const chFor = k => chByKey[k] || chByKey[k + '-streams'] || null;
  const EXPERTS = (() => {
    const map = new Map(Object.entries(PEOPLE).map(([id, p]) => [id, { id, ...p, opinions: [], quotes: [], eps: new Set(), last: null }]));
    const touch = (e, v) => { e.eps.add(v); const d = dateOf(v); if (!e.last || d > e.last) e.last = d; };
    for (const v of sortedVideos) {
      for (const o of v.lite?.opinions || []) for (const id of o.people || []) { const e = map.get(id); if (e) { e.opinions.push({ o, v }); touch(e, v); } }
      if (!v.summary) continue;
      for (const o of v.summary.opinions || []) for (const id of o.people || []) { const e = map.get(id); if (e) { e.opinions.push({ o, v }); touch(e, v); } }
      for (const q of v.summary.citations || []) for (const id of q.people || []) { const e = map.get(id); if (e) { e.quotes.push({ q, v }); touch(e, v); } }
      for (const id of v.hosts || []) { const e = map.get(id); if (e) touch(e, v); }
    }
    return [...map.values()].sort((a, b) => (b.last || 0) - (a.last || 0) || b.opinions.length - a.opinions.length || a.nom.localeCompare(b.nom));
  })();
  const expertById = Object.fromEntries(EXPERTS.map(e => [e.id, e]));
  const exHref = id => `#/expert/${encodeURIComponent(id)}`;
  const expertShows = e => {
    const keys = new Set([...(e.chaines || []).map(k => chFor(k)?.key).filter(Boolean), ...[...e.eps].map(v => v.key)]);
    return [...keys].map(k => chByKey[k]);
  };
  const expertColor = e => expertShows(e)[0]?.color || '#5b4bd6';

  function viewExperts() {
    const H24 = NOW - 24 * 36e5, D7 = NOW - 7 * DAY;
    const isPl = o => !!(o.people?.length && expertById[o.people[0]]?.isPlayer);
    const heard = EXPERTS.filter(e => !e.isPlayer && e.eps.size);
    const takes = buildTakes(t => !isPl(t));
    const recentOnly = takes.every(t => t.at >= H24);
    const locker = EXPERTS.filter(e => e.isPlayer && e.opinions[0] && dateOf(e.opinions[0].v) >= D7).sort((a, b) => dateOf(b.opinions[0].v) - dateOf(a.opinions[0].v)).slice(0, 12)
      .map(e => ({ ...e.opinions[0].o, people: [e.id], v: e.opinions[0].v }));
    const n24 = heard.filter(e => e.last && e.last >= H24).length;
    const row = (o, i) => xqRow(o, o.v, i);
    const head = (title, kick) => `<div class="crystal-h"><div><div class="crystal-title">${title}</div><div class="crystal-kick">${kick}</div></div></div>`;

    app.innerHTML = `${sband('Experts', { sub: `${n24} voix entendue${n24 > 1 ? 's' : ''} dans les 24 h · ${heard.length} au total` })}

        <div class="xqs">${takes.map(row).join('')}</div></section>` : ''}
      ${locker.length ? `<section class="crystal xp-sec no-sld">${head('Dans le vestiaire', 'Joueurs et entraîneurs cités cette semaine')}
        <div class="xqs">${locker.map(row).join('')}</div></section>` : ''}`;
    reveal();
  }

          <div class="rv"><div class="side-h">Ses <b>épisodes</b></div><ul class="also">${eps.slice(0, 12).map(v => `<li><a href="${epHref(v)}">${thumbTag(v, 'mqdefault', 'loading="lazy"')}<span><b>${esc(displayTitle(v))}</b><small>${esc(chByKey[v.key].label)} · ${fmtAgo(dateOf(v))}</small></span></a></li>`).join('') || '<li class="ep-note">—</li>'}</ul></div>

        </aside>

    applyFolds();
    reveal();
  }

  // Fiches : on montre le récent (moins de 7 jours : au moins 4, au plus 8), le reste derrière « Voir plus »
  const foldAttr = (list, vOf, label = '') => {
    const recent = list.filter(x => dateOf(vOf(x)) >= NOW - 7 * DAY).length;

  };
  function applyFolds(root = app) {

  }

  // ─────────── Stats avancées (MoneyPuck.com + classement LNH) ───────────
  const ord = n => n == null ? '—' : n === 1 ? '1er' : `${n}e`;
  const fr = (x, d = 1) => x == null ? '—' : Number(x).toLocaleString('fr-CA', { minimumFractionDigits: d, maximumFractionDigits: d });
  const sgn = (x, d = 1) => x == null ? '—' : `${x > 0 ? '+' : x < 0 ? '−' : ''}${fr(Math.abs(x), d)}`;
  const tone = (rk, n) => rk == null ? '' : rk <= Math.ceil(n / 4) ? 'good' : rk > n - Math.ceil(n / 4) ? 'bad' : 'mid';
  const plByNhl = Object.fromEntries(D.players.filter(p => p.nhlId).map(p => [String(p.nhlId), p]));
  // nom de notre fiche quand on la trouve (accents corrects : « Slafkovský »), sinon celui de MoneyPuck
  const plLink = (id, name) => { const p = plByNhl[String(id)]; return p ? `<a href="${plHref(p)}">${esc(p.name)}</a>` : esc(name); };
  const mugOf = (id, team = 'MTL', y = null) => plByNhl[String(id)]?.image || `https://assets.nhle.com/mugs/nhl/${y || (window.TUBEWATCH_STATS?.current ?? new Date().getFullYear())}${(y || (window.TUBEWATCH_STATS?.current ?? new Date().getFullYear())) + 1}/${team}/${id}.png`;

  const lastNames = n => String(n || '').split('-').join(' · ');
  const MP_CREDIT = '<a href="https://moneypuck.com" target="_blank" rel="noopener">Données : MoneyPuck.com</a>';

  // « Le CH en chiffres » (une)
  function chStatsHtml() {
    const m = D.statsMini; if (!m) return '';
    const n = m.teamsN || 32;
    const tile = (k, big, small, rk) => `<div class="cs-t ${rk ? tone(rk, n) : ''}"><span class="cs-k">${k}</span><b>${big}</b><small>${small}</small></div>`;
    const st = m.standing;
    return `<section class="cs"><div class="cs-h"><h2>Le CH <b>en chiffres</b></h2><span class="cs-sub">${esc(m.season)} · ${m.gp} match${m.gp > 1 ? 's' : ''}${m.gp < 10 ? ' · petit échantillon' : ''}</span><a class="cs-all" href="#/stats">Toutes les stats →</a></div>
      <div class="cs-g">
        ${st ? tile('Classement', `${st.pts} pts`, `${ord(st.divRank)} dans l’${esc(st.div === 'Atlantic' ? 'Atlantique' : st.div)} · ${st.w}-${st.l}-${st.otl}`, null) : ''}

        ${m.ppXgf60_rk ? tile('Avantage numérique', ord(m.ppXgf60_rk), `sur ${n} pour les chances créées`, m.ppXgf60_rk) : ''}
        ${m.goalie ? tile(`Gardien · ${esc(m.goalie.name)}`, sgn(m.goalie.gsax), `buts sauvés au-dessus des attentes${m.goalie.gsax_rk ? ` · ${ord(m.goalie.gsax_rk)}` : ''}`, m.goalie.gsax_rk && m.goalie.gsax_rk) : ''}
      </div><div class="cs-cr">${MP_CREDIT}</div></section>`;
  }

  // petite bande de points : où se situe le CH parmi les 32 équipes (à droite = mieux)
  function dotStrip(list, key, desc, focus) {
    const vals = list.map(t => t[key]).filter(v => v != null);
    if (!vals.length) return '';
    const min = Math.min(...vals), max = Math.max(...vals), avg = vals.reduce((a, b) => a + b, 0) / vals.length;
    const x = v => { const r = max === min ? .5 : (v - min) / (max - min); return 4 + (desc === false ? 1 - r : r) * 92; };
    return `<svg class="dots" viewBox="0 0 100 18" preserveAspectRatio="none"><line x1="2" y1="9" x2="98" y2="9"/><line class="avg" x1="${x(avg)}" y1="2" x2="${x(avg)}" y2="16"/>
      ${list.filter(t => t[key] != null && t.team !== focus).map(t => `<circle cx="${x(t[key])}" cy="9" r="1.6"><title>${esc(t.team)} : ${fr(t[key], 2)}</title></circle>`).join('')}
      ${list.filter(t => t.team === focus && t[key] != null).map(t => `<circle class="me" cx="${x(t[key])}" cy="9" r="3.4"><title>${esc(t.team)} : ${fr(t[key], 2)}</title></circle>`).join('')}</svg>
      <div class="dots-l"><span>${desc === null ? 'bas' : 'pire'}</span><span>moyenne LNH</span><span>${desc === null ? 'haut' : 'meilleur'}</span></div>`;
  }

  let statsSeason = null, stScope = 'lnh', skSort = 'gs', skPos = 'all', stTeam = null;
  function viewStats() {
    const S = window.TUBEWATCH_STATS, F = S.focus || 'MTL';
    sayUsed = new Set();
    const years = Object.keys(S.seasons).map(Number).sort((a, b) => b - a);
    if (!statsSeason || !S.seasons[statsSeason]) statsSeason = S.current in S.seasons ? S.current : years[0];
    const Z = S.seasons[statsSeason], isCur = statsSeason === S.current;
    if (!stTeam || !Z.teams.some(t => t.team === stTeam)) stTeam = Z.teams.some(t => t.team === F) ? F : Z.teams[0]?.team;
    const T = stTeam, isF = T === F;
    const teams = Z.teams, n = teams.length, me = teams.find(t => t.team === T) || {};
    const stOf = ab => isCur ? S.standings.find(x => x.team === ab) : null;
    const tname = ab => (stOf(ab)?.short) || teamByAb[ab]?.short || ab;
    const TN = isF ? 'le CH' : `les ${tname(T)}`, TNc = isF ? 'Le CH' : `Les ${tname(T)}`;
    // données de l'équipe choisie (byTeam; anciennes données : CH seulement)
    const TB = Z.byTeam?.[T] || (isF ? { skaters: Z.skaters || [], lines: Z.lines || [], pairs: Z.pairs || [] } : { skaters: [], lines: [], pairs: [], missing: true });
    const small = (me.gp || 0) < 10;

    // A. Le CH sous la loupe
    const METRICS = [
      ['xgPct', 'Vrai niveau · xG% à 5 c. 5', v => `${fr(v)} %`, true, 'Part des bonnes chances de marquer (buts attendus) quand c’est 5 contre 5. Plus de 50 % : l’équipe contrôle le jeu.'],
      ['cfPct', 'Possession · Corsi à 5 c. 5', v => `${fr(v)} %`, true, 'Part de toutes les tentatives de tir. Qui a la rondelle le plus souvent.'],
      ['hdf60', 'Chances de haut danger créées', v => `${fr(v)} /60`, true, 'Tirs de l’enclave (près du filet) par 60 minutes à 5 c. 5.'],
      ['hda60', 'Chances de haut danger accordées', v => `${fr(v)} /60`, false, 'Tirs de l’enclave accordés par 60 minutes à 5 c. 5. Moins, c’est mieux.'],
      ['ppXgf60', 'Avantage numérique', v => `${fr(v, 2)} xG/60`, true, 'Buts attendus créés par 60 minutes à 5 contre 4 : la qualité des chances, pas juste les buts.'],
      ['pkXga60', 'Désavantage numérique', v => `${fr(v, 2)} xG/60`, false, 'Buts attendus accordés par 60 minutes à 4 contre 5. Moins, c’est mieux.'],
      ['finish', 'Finition', v => `${sgn(v)} buts`, true, 'Buts marqués moins buts attendus (toutes situations). Positif : l’équipe marque plus que la qualité de ses chances le prédit.'],
      ['saveAbove', 'Gardiens', v => `${sgn(v)} buts`, true, 'Buts attendus contre moins buts accordés. Positif : les gardiens volent des buts.'],
      ['pdo', 'Indice de chance · PDO', v => fr(v), null, '% de tirs + % d’arrêts à 5 c. 5. Autour de 100 : normal. Bien au-dessus : la chance risque de tourner. Bien en dessous : ça devrait s’améliorer.'],
    ];
    const pdoTxt = v => v == null ? '' : v >= 101.5 ? 'Chanceux' : v <= 98.5 ? 'Malchanceux' : 'Normal';
    // Anneau de rang : un segment par équipe, rempli jusqu'au rang (1er = plein), se remplit à l'apparition
    const RC = 2 * Math.PI * 50;
    const ring = (frac, center, sub, cls, idx) => { const seg = RC / n;
      return `<span class="rg ${cls}"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><mask id="rgm${idx}"><circle cx="60" cy="60" r="50" class="rg-m" style="--rc:${RC.toFixed(1)};--off:${(RC * (1 - frac)).toFixed(1)}" /></mask></defs>
        <circle cx="60" cy="60" r="50" class="rg-t" stroke-dasharray="${(seg - 1.6).toFixed(2)} 1.6" />
        <circle cx="60" cy="60" r="50" class="rg-f" stroke-dasharray="${(seg - 1.6).toFixed(2)} 1.6" mask="url(#rgm${idx})" /></svg>
        <span class="rg-c">${teamLogo(T, 'rg-logo')}<b>${center}</b><small>${sub}</small></span></span>`; };
    let rgi = 0;
    const metricCard = ([k, lbl, f, desc, why]) => { if (me[k] == null) return '';
      const rk = me[`${k}_rk`], i = rgi++;
      const tn = desc === null ? (me[k] >= 101.5 ? 'luck' : me[k] <= 98.5 ? 'unluck' : 'mid') : tone(rk, n);
      const frac = desc === null ? Math.max(.04, Math.min(1, (me[k] - 96) / 8)) : Math.max(.04, (n - rk + 1) / n);
      const center = desc === null ? fr(me[k]) : `${rk}<sup>${rk === 1 ? 'er' : 'e'}</sup>`;
      return `<article class="mx rgx rv ${tn}" style="--i:${i % 3}">${ring(frac, center, desc === null ? 'PDO' : `sur ${n}`, tn, i)}
        <span class="rgx-b"><span class="rgx-l">${lbl}</span><b class="mx-v">${f(me[k])}</b>${desc === null ? `<em class="pill">${pdoTxt(me[k])}</em>` : `<em class="pill">${rk <= 3 ? 'Élite' : rk <= Math.ceil(n / 4) ? 'Haut de la LNH' : rk > n - Math.ceil(n / 4) ? 'Bas de la LNH' : 'Milieu de peloton'}</em>`}<p>${why}</p></span></article>`; };

    // B. Classement et vrai niveau
    const meSt = stOf(T);
    const scopes = [['lnh', 'LNH'], ['conf', meSt ? (meSt.conf === 'Eastern' ? 'Est' : 'Ouest') : 'Conférence'], ['div', meSt ? (meSt.div === 'Atlantic' ? 'Atlantique' : meSt.div) : 'Division']];
    const inScope = ab => { if (stScope === 'lnh' || !meSt) return true; const x = stOf(ab); return stScope === 'conf' ? x?.conf === meSt.conf : x?.div === meSt.div; };
    let rows = teams.filter(t => inScope(t.team)).map(t => ({ t, st: stOf(t.team) }));
    rows.sort((a, b) => isCur && a.st && b.st ? (b.st.pts - a.st.pts) || (b.st.pPct - a.st.pPct) || (a.st.leagueRank - b.st.leagueRank) : (b.t.xgPct - a.t.xgPct));
    const byXg = [...rows].sort((a, b) => b.t.xgPct - a.t.xgPct).map(x => x.t.team);
    const best = byXg[0] && rows.find(x => x.t.team === byXg[0]);
    const lucky = [...rows].sort((a, b) => (b.t.pdo ?? 0) - (a.t.pdo ?? 0))[0], unlucky = [...rows].sort((a, b) => (a.t.pdo ?? 999) - (b.t.pdo ?? 999))[0];
    // barre centrée sur 50 % (vert à droite = mieux, rouge à gauche = moins bien) + valeur à côté
    const xgBar = v => v == null ? '—' : `<span class="xb"><span class="xb-b"><span class="xb-f ${v >= 50 ? 'up' : 'dn'}" style="${v >= 50 ? `left:50%;width:${Math.min(50, (v - 50) * 4)}%` : `right:50%;width:${Math.min(50, (50 - v) * 4)}%`}"></span></span><i class="${v >= 50 ? 'up' : 'dn'}">${fr(v)} %</i></span>`;
    const standRows = rows.map((x, i) => { const real = byXg.indexOf(x.t.team) + 1, d = (i + 1) - real;
      return `<tr class="${x.t.team === T ? 'me' : ''}"><td class="rk">${i + 1}</td><td class="tm">${teamLogo(x.t.team, 'tlogo')}<span>${esc(tname(x.t.team))}</span></td>
        ${isCur ? `<td>${x.st?.gp ?? x.t.gp}</td><td><b>${x.st?.pts ?? '—'}</b></td><td>${x.st ? fr(x.st.pPct * 100, 0) + ' %' : '—'}</td><td>${x.st ? sgn(x.st.diff, 0) : '—'}</td>` : `<td>${x.t.gp}</td><td>${x.t.gf}-${x.t.ga}</td>`}
        <td class="xg">${xgBar(x.t.xgPct)}</td>
        <td class="real">${ord(real)}${isCur && d ? ` <em class="${d > 0 ? 'up' : 'dn'}" title="${d > 0 ? 'Joue mieux que son classement' : 'Classement plus beau que son jeu'}">${d > 0 ? '▲' : '▼'}${Math.abs(d)}</em>` : ''}</td>
        <td><span class="chip-l ${x.t.pdo >= 101.5 ? 'luck' : x.t.pdo <= 98.5 ? 'unluck' : ''}">${fr(x.t.pdo)}</span></td></tr>`; }).join('');

    // C. Joueurs du CH
    const sk = TB.skaters.filter(p => skPos === 'all' || (skPos === 'D' ? p.pos === 'D' : p.pos !== 'D'));
    const SORTS = { gs: (a, b) => (b.gs ?? -99) - (a.gs ?? -99), xg: (a, b) => (b.xgPct ?? -1) - (a.xgPct ?? -1), finish: (a, b) => (b.finish ?? -99) - (a.finish ?? -99), toi: (a, b) => (b.toi ?? 0) - (a.toi ?? 0), pts: (a, b) => (b.pts ?? 0) - (a.pts ?? 0) };
    sk.sort(SORTS[skSort]);
    const pool = TB.skaters.filter(p => (p.gp || 0) >= Math.max(1, Math.round((me.gp || 1) * 0.3)));
    const pick = (f, cmp) => [...pool].filter(f).sort(cmp)[0];
    const useful = pick(() => true, SORTS.gs), hot = pick(p => p.finish != null, SORTS.finish), cold = pick(p => p.finish != null, (a, b) => a.finish - b.finish), drive = pick(p => p.relXg != null, (a, b) => b.relXg - a.relXg);
    const maxGs = Math.max(1, ...TB.skaters.map(p => p.gs || 0));
    const callout = (k, p, big, txt) => p ? `<div class="co co-pl">${mugTag(p.id, 'co-mug', T)}<span class="co-k">${k}</span><b>${plLink(p.id, p.name)}</b><em>${big}</em><small>${txt}</small></div>` : '';
    const skRows = sk.map(p => `<tr><td class="nm"><span class="nm-w">${mugTag(p.id, 'sk-mug', T)}${plLink(p.id, p.name)}</span></td><td>${esc(p.pos)}</td><td>${p.gp}</td><td>${fr(p.toi)}</td><td><b>${p.pts}</b> <small>(${p.g}-${p.a})</small></td>
      <td class="gs"><span class="gsb"><span style="width:${Math.max(0, (p.gs || 0) / maxGs * 100)}%"></span></span>${fr(p.gs)}</td>
      <td class="xg">${xgBar(p.xgPct)}</td>
      <td class="fin ${p.finish > 0.5 ? 'up' : p.finish < -0.5 ? 'dn' : ''}">${sgn(p.finish)} <small>${p.g} B / ${fr(p.xg)} att.</small></td></tr>`).join('');

    // D. Trios et paires
    const accentFix = n => String(n || '').split('-').map(last => { const sk = TB.skaters.find(x => x.name.split(' ').slice(-1)[0] === last); const p = sk && plByNhl[String(sk.id)]; return p ? p.name.split(' ').slice(-1)[0] : last; }).join('-');
    const lnName = l => (l.ids || []).length && l.ids.every(Boolean) ? l.ids.map(id => { const p = plByNhl[String(id)], sk = TB.skaters.find(x => x.id === Number(id)); return String(p?.name || sk?.name || '').split(' ').slice(-1)[0]; }).join(' · ') : lastNames(accentFix(l.name));
    const lineList = (L, kind) => L.length ? `<div class="ln-col"><h3>${kind}</h3>${L.map(l => { const v = verdictOf(idxOf(l)); return `<div class="ln"><span class="ln-n">${esc(lnName(l))}${v ? ` <em class="sxu-tag ${v[2]}">${v[1]}</em>` : ''}</span><span class="ln-t">${fr(l.toi, 0)} min</span>${uIdxBar(idxOf(l))}<span class="ln-s ${l.gf > l.ga ? 'up' : l.gf < l.ga ? 'dn' : ''}">${l.gf}-${l.ga}</span></div>`; }).join('')}</div>` : '';

    // D2. Trios et paires : mêmes entêtes et mêmes cartes que la page Match
    let ci = 0;
    const unitBox = (l, lbl, kind) => {
      const names = String(l.name || '').split('-'), ids = (l.ids || []).map(x => x == null ? null : Number(x));
      const n0 = Math.max(ids.length, names.length);
      const cards = Array.from({ length: n0 }, (_, j) => { const id = ids[j] || null, sk = id && TB.skaters.find(x => x.id === id), p = id ? plByNhl[String(id)] : null;
        const nm = p?.name || sk?.name || names[j] || '', dfo = dfoOf(T, nm);
        return uCard({ id, name: nm, ab: T, p, big: uBig(dfo?.jersey, dfo?.number ?? p?.number ?? ''), role: esc(POSF[sk?.pos] || ''), tags: autoTags(stFromSkater(sk), Z, T), st: stFromSkater(sk), Z, icx: { gtd: dfo?.gtd, injury: dfo?.injury }, i: ci++ }); }).join('');
      return `<div class="mt-unit sx-unit rv">${unitHead(lbl, l, unitTags(Z, T, l, kind))}<div class="xgrid2 mt-ug n${Math.min(3, Math.max(2, n0))}">${cards}</div></div>`;
    };
    const POSF = { C: 'Centre', L: 'Ailier gauche', R: 'Ailier droit', D: 'Défenseur' };
    const LU = isCur ? dfoLinesOf(T) : null;
    const unitsHtml = LU ? `<div class="mt-lu">${uLineup(LU, T, Z)}</div>` : TB.missing ? `<p class="sx-why">Les trios des autres équipes arrivent à la prochaine mise à jour des stats (npm run stats).</p>`

    const moreL = LU ? TB.lines : TB.lines.slice(4), moreP = LU ? TB.pairs : TB.pairs.slice(3);

    // E. Gardiens

    return `<span class="prs">${prRing({ pc: pgs, val: gsv == null ? '' : fr(gsv, 2), lbl: 'GS/m', small, gp, prev: prev?.gsPg != null ? fr(prev.gsPg, 2) : null,
        tip: `Game Score par match : ${fr(gsv, 2)} (buts, passes, tirs, mises en jeu, punitions… en une seule note; total ${fr(st.gs, 1)}). Mieux que ${pgs} % ${who}.${note}` })}
      ${prRing({ pc: pxg, val: xgv == null ? '' : fr(xgv, Number.isInteger(xgv) ? 0 : 1), lbl: 'xG%', small, gp, prev: prev?.xgPct != null ? `${fr(prev.xgPct, Number.isInteger(prev.xgPct) ? 0 : 1)} %` : null,
        tip: `xG% à 5 c. 5 : ${fr(xgv, Number.isInteger(xgv) ? 0 : 1)} %. La part des chances de qualité (buts attendus) pour son équipe quand il est sur la glace. 50 % = égal. Mieux que ${pxg} % ${who}.${note}` })}</span>`;
  };
  const uCard = ({ id, name, headshot, ab, big = '', role = '', tags = [], st = null, Z = null, p = null, i = 0, extra = '', kind = null, icx = {} }) => {
    kind = kind || kindOf(Z, ab, st);
    p = p || plByNhl[String(id)] || null;
    const nm = p?.name || name, href = p ? plHref(p) : null, tag = href ? 'a' : 'div';
    return `<${tag} class="xcol pcol mtc rv" style="--c:${U_COL(ab)};--i:${i % 4}" ${href ? `href="${href}"` : ''}>
      <span class="col-top"><span class="pc-rk">${big}</span>${uFace(p?.image || headshot || (id ? mugOf(id, ab) : ''), p?.number || '')}</span>
      <span class="xc-name">${esc(nm)}</span><span class="xc-role">${role || ''}</span>
      <span class="ic-row">${iconsHtml(iconsOf(st, Z, ab, icx))}</span><span class="tg-row">${tagsHtml(keepTags(tags))}</span>${pcRings(st, Z)}
      ${rtBlock(st)}<span class="xc-stats">${extra || ''}</span><span class="xc-sayw">${uSay(p)}</span></${tag}>`;
  };
  // Verdict d'un trio / d'une paire (xG% à 5 c. 5), 7 nuances
  const VERDICTS = [[60, 'Fait la loi', 'v3'], [55, 'Mène le bal', 'v2'], [52, 'A le dessus', 'v1'], [48.0001, 'Égal', 'v0'], [45, 'Tient le fort', 'n1'], [40.0001, 'Se fait brasser', 'n2'], [-1, 'Se fait planter', 'n3']];
  const verdictOf = xg => xg == null ? null : VERDICTS.find(([min]) => xg >= min);
  // trouve le trio / la paire MoneyPuck qui correspond à un groupe de joueurs (ids NHL)
  const sameIds = (a, b) => a.length && a.length === b.length && [...a].sort().join() === [...b].sort().join();
  const mpUnitOf = (Z, ab, ids, kind) => { const TB = Z?.byTeam?.[ab]; if (!TB || ids.some(x => !x)) return null; return (kind === 'pair' ? TB.pairs : TB.lines).find(l => sameIds((l.ids || []).map(Number), ids.map(Number))) || null; };
  // rectangles de l'unité
  const unitTags = (Z, ab, mp, kind, isNewOk = false) => {
    const TB = Z?.byTeam?.[ab], list = TB ? (kind === 'pair' ? TB.pairs : TB.lines) : [];
    const t = [];
    if (!mp) { if (isNewOk && TB) t.push({ t: kind === 'pair' ? 'Nouvelle paire' : 'Nouveau trio', k: 'lead' }); return t; }
    if (list[0] === mp) t.push({ t: 'Le plus utilisé', k: '' });
    const ok = list.filter(l => (l.toi || 0) >= 50);
    if (ok.length > 1 && (mp.toi || 0) >= 50 && Math.max(...ok.map(l => idxOf(l) ?? -1)) === idxOf(mp)) t.push({ t: 'Meilleure unité de l’équipe', k: 'up' });
    if ((mp.toi || 0) < 50) t.push({ t: 'Petit échantillon', k: 'mute' });
    return t;
  };
  // entête d'unité : « Trio 1 » + verdict + barre xG% + buts + minutes + rectangles
  // indice de domination (stats.js : chances, enclave, possession, rondelle, ramené vers 50 si peu de minutes); vieux fichiers : xG%
  const idxOf = l => l?.idx ?? l?.xgPct ?? null;
  const uIdxBar = v => v == null ? '' : `<span class="xb" title="Indice de domination : 50 = égal"><span class="xb-b"><span class="xb-f ${v >= 50 ? 'up' : 'dn'}" style="${v >= 50 ? `left:50%;width:${Math.min(50, (v - 50) * 4)}%` : `right:50%;width:${Math.min(50, (50 - v) * 4)}%`}"></span></span><i class="${v >= 50 ? 'up' : 'dn'}">${fr(v, 0)}<small>/100</small></i></span>`;
  // mini-bilan : le « pourquoi » du verdict
  const unitBilan = mp => { if (!mp) return '';
    const c = (lbl, val, good, title) => `<span class="sxb ${good == null ? '' : good ? 'up' : 'dn'}" title="${esc(title)}"><b>${lbl}</b>${val}</span>`;
    const pp = mp.puckPlus;
    return `<div class="sxu-bil">
      ${c('Chances', `${fr(mp.xgPct, 0)} %`, mp.xgPct === 50 ? null : mp.xgPct > 50, 'Part des buts attendus (xG%) à 5 c. 5 : la qualité des chances, pour et contre')}
      ${mp.hdf != null ? c('Enclave', `${mp.hdf}-${mp.hda}`, mp.hdf === mp.hda ? null : mp.hdf > mp.hda, 'Tirs de haut danger (près du filet) pour et contre') : ''}
      ${c('Possession', `${fr(mp.cfPct, 0)} %`, mp.cfPct === 50 ? null : mp.cfPct > 50, 'Part de toutes les tentatives de tir (Corsi)')}
      ${pp != null ? c('Rondelle', pp > 0 ? `+${pp}` : String(pp), pp === 0 ? null : pp > 0, 'Revirements provoqués et revirements adverses, moins revirements donnés (ceux en zone D comptent double)') : ''}
      ${c('Buts', `${mp.gf}-${mp.ga}`, null, 'Buts pour et contre : affichés, mais hors de l’indice (trop de chance là-dedans)')}
    </div>`; };
  const unitHead = (lbl, mp, tags = []) => { const ix = idxOf(mp), v = mp ? verdictOf(ix) : null;
    return `<div class="mt-ul">${esc(lbl)}<span class="sxu-meta">${v ? `<em class="sxu-tag ${v[2]}">${v[1]}</em>` : ''}${mp ? `${uIdxBar(ix)}<span><b>${fr(mp.toi, 0)}</b> min ensemble</span>` : ''}${tags.map(t => `<span class="mt-tag ${t.k || ''}">${esc(t.t)}</span>`).join('')}</span></div>${unitBilan(mp)}`; };
  // chandail DailyFaceoff d'un joueur (si son équipe est dans le prochain match)
  const dfoLinesOf = ab => { const M = D.match, F = M?.focus || 'MTL', g = M?.game;
    if (M?.game && ab === F && M.lines) return M.lines;
    if (M?.game && ab === (g.focusIsHome ? g.away : g.home)?.abbrev && M.oppLines) return M.oppLines;
    return window.TUBEWATCH_STATS?.lineups?.teams?.[ab] || null; };
  const dfoOf = (ab, name) => { const L = dfoLinesOf(ab); if (!L) return null;
    return [...(L.forwards || []).flat(), ...(L.defense || []).flat(), ...(L.goalies || [])].find(y => lastOf(y.name) === lastOf(name)) || null; };


  // ─────────── Alignement DailyFaceoff commun (Match et Stats) : trios, paires, unités spéciales, infirmerie ───────────
  const LU_POS = { lw: 'Ailier gauche', c: 'Centre', rw: 'Ailier droit', ld: 'Défenseur gauche', rd: 'Défenseur droit' };
  const LU_INJ = { out: 'Absent', dtd: 'Incertain', ir: 'Blessé (LT)' };
  // joueur de notre base d'après un nom DailyFaceoff, dans une équipe donnée
  const plInTeam = (name, ab) => { const ln = lastOf(name), fi = norm(name)[0]; const c = D.players.filter(p => p.teamAbbrev === ab && lastOf(p.name) === ln); return c.find(p => norm(p.name)[0] === fi) || c[0] || (ab === (D.focusTeam || 'MTL') ? chPlayer(name) : null); };
  const skInTeam = (Z, ab, name) => { const sk = Z?.byTeam?.[ab]?.skaters || [], ln = lastOf(name), fi = norm(name)[0]; let c = sk.filter(y => lastOf(y.name) === ln);
    if (!c.length && ln.length >= 5) c = sk.filter(y => { const l = lastOf(y.name); return l.length >= 5 && (l.startsWith(ln) || ln.startsWith(l)); }); // noms abîmés (« Slafkovsk »)
    return c.find(y => norm(y.name)[0] === fi) || (c.length === 1 ? c[0] : null); };
  const uLineup = (L, ab, Z, legend = true) => { if (!L) return ''; let k = 0;
    const unit = (lst, lbl, kind, slot = null) => { k = 0;
      const has = id => (Z?.byTeam?.[ab]?.skaters || []).some(y => y.id === Number(id));
      const ps = lst.map(pl => plInTeam(pl.name, ab)), ids = lst.map((pl, j) => { const a = ps[j]?.nhlId; return a && has(a) ? a : skInTeam(Z, ab, ps[j]?.name || pl.name)?.id || a || null; });
      const mp = mpUnitOf(Z, ab, ids, kind);
      return `<div class="mt-unit sx-unit rv">${unitHead(lbl, mp, unitTags(Z, ab, mp, kind, true))}<div class="xgrid2 mt-ug n${lst.length}">${lst.map((pl, j) => { const p = ps[j], nid = ids[j];
        const st = stOfId(Z, ab, nid, p?.name || pl.name), kd = kindOf(Z, ab, st, kind === 'line' ? slot : null);
        return uCard({ id: nid, name: pl.name, ab, p, big: uBig(pl.jersey, pl.number ?? p?.number ?? ''), role: esc(LU_POS[pl.pos] || ''), tags: autoTags(st, Z, ab, { kind: kd }), st, Z, kind: kd, icx: { gtd: pl.gtd, injury: pl.injury }, i: k++ }); }).join('')}</div></div>`; };
    const names = lst => lst.map(x => esc((plInTeam(x.name, ab)?.name || x.name).split(' ').slice(-1)[0])).join(' · ');
    return `${legend ? iconLegend() : ''}${(L.forwards || []).map((x, i) => unit(x, `Trio ${i + 1}`, 'line', i)).join('')}${(L.defense || []).map((x, i) => unit(x, `Paire ${i + 1}`, 'pair')).join('')}
      <div class="lu-sp">${(L.pp || []).map((x, i) => `<div><span class="lu-lbl">Avantage ${i + 1}</span>${names(x)}</div>`).join('')}${(L.pk || []).map((x, i) => `<div><span class="lu-lbl">Désavantage ${i + 1}</span>${names(x)}</div>`).join('')}</div>
      ${L.injured?.length ? `<div class="lu-inj"><span class="lu-lbl">Infirmerie</span>${L.injured.map(x => `<span class="inj ${esc(x.injury || '')}">${esc(plInTeam(x.name, ab)?.name || x.name)} · ${esc(LU_INJ[x.injury] || x.injury || 'blessé')}</span>`).join('')}</div>` : ''}
      <p class="sx-why"><a href="${esc(L.url)}" target="_blank" rel="noopener">Alignement : DailyFaceoff ↗</a>${L.basis ? ` · ${esc(L.basis.replace('Last Game', 'dernier match'))}` : ''}${L.updatedAt ? ` · mis à jour ${esc(fmtAgo(L.updatedAt))}` : ''}</p>`; };

  // Gardien probable d'un côté (même choix sur la une et dans la page Match) :
  // le 1er gardien de l'alignement DailyFaceoff de cette équipe, sinon celui qui a joué le plus de matchs
  const probableGoalie = (M, side, lines) => { const l = M?.goalies?.[side]?.list || [], dn = lines?.goalies?.[0]?.name;
    return (dn && l.find(x => lastOf(x.name) === lastOf(dn))) || [...l].sort((a, b) => (b.gp || 0) - (a.gp || 0))[0] || null; };
  function nextMatchBand() {
    const M = D.match; if (!M?.game) return '';
    const g = M.game, ch = g.focusIsHome ? g.home : g.away, op = g.focusIsHome ? g.away : g.home, t = fmtGame(g.start);
    const gCh = probableGoalie(M, g.focusIsHome ? 'home' : 'away', M.lines)?.name;
    const gOp = probableGoalie(M, g.focusIsHome ? 'away' : 'home', M.oppLines)?.name;
    return `<a class="nmb" href="#/match"><span class="nmb-k">Prochain match</span>
      <span class="nmb-t">${teamLogo(g.away.abbrev, 'tlogo')}<b>${esc(g.away.common)}</b><i>@</i>${teamLogo(g.home.abbrev, 'tlogo')}<b>${esc(g.home.common)}</b></span>
      <span class="nmb-d">${esc(t.day)} · ${esc(t.time)}${g.venue ? ` · ${esc(g.venue)}` : ''}${g.tv?.length ? ` · ${esc(g.tv.join(', '))}` : ''}</span>
      ${gCh || gOp ? `<span class="nmb-g">Devant le filet : <b>${esc((g.focusIsHome ? gOp : gCh) || '?')}</b> contre <b>${esc((g.focusIsHome ? gCh : gOp) || '?')}</b></span>` : ''}
      <span class="nmb-go">Le face-à-face →</span></a>`;
  }

  function viewMatch() {
    sayUsed = new Set();
    const M = D.match;
    if (!M?.game) { app.innerHTML = `${sband('Match')}<div class="notice">Aucun match au calendrier pour l’instant (npm start va le chercher au prochain cycle).</div>`; return; }
    const S = window.TUBEWATCH_STATS, Z = S?.seasons?.[S.current] || null;
    const g = M.game, F = M.focus || 'MTL', chSide = g.focusIsHome ? 'home' : 'away', opSide = g.focusIsHome ? 'away' : 'home';
    const ch = g[chSide], op = g[opSide], t = fmtGame(g.start);
    const lg = id => { const r = Z?.league?.[id]; return r ? { team: r[0], gp: r[1], gs: r[2], xg: r[3], fin: r[4], toi: r[5], pts: r[6], name: r[7], pos: r[8] } : null; };
    const lgG = id => { const r = Z?.leagueGoalies?.[id]; return r ? { gp: r[1], gsax: r[2], sv: r[3], rk: r[4] } : null; };
    const CAT = { points: 'Points', goals: 'Buts', assists: 'Passes' };
    const colOf = ab => ab === F ? '#af1e2d' : '#3b3c3e';
    // joueur de notre base d'après un nom DailyFaceoff, dans une équipe donnée
    const findIn = (name, ab) => { const ln = lastOf(name), fi = norm(name)[0]; const c = D.players.filter(p => p.teamAbbrev === ab && lastOf(p.name) === ln); return c.find(p => norm(p.name)[0] === fi) || c[0] || (ab === F ? chPlayer(name) : null); };
    // portrait sans fond (même gabarit que la page Joueurs)
    const face = (src, label) => `<div class="hs col-face">${src ? `<img src="${esc(src)}" alt="" loading="lazy" onerror="this.remove()">` : ''}<b>${esc(label || '')}</b></div>`;
    // carte façon page Joueurs : gros chiffre + portrait, nom, rôle, stats, ce qu'on dit
    const pcard = ({ id, name, headshot, ab, big, role, extra = '', p = null, i = 0, tags = [], slot = null }) => {
      p = p || plByNhl[String(id)] || null; const nid = p?.nhlId || id; const st = stOfId(Z, ab, nid, p?.name || name);
      return uCard({ id: nid, name, headshot, ab, big, role, tags, st, Z, p, i, extra, kind: kindOf(Z, ab, st, slot) });
    };

    // ── En-tête façon page Joueurs : bandeau rouge + 2 encadrés d'équipes + encadré jaune « face à face »
    // la LNH donne awayTeam / homeTeam
    const l10 = { away: M.last10?.awayTeam || M.last10?.away, home: M.last10?.homeTeam || M.last10?.home }, ts = { away: M.teamStats?.awayTeam || {}, home: M.teamStats?.homeTeam || {} };
    const teamTeaser = (tm, side) => { const L = l10[side] || {}; return `<div class="teaser mt-team-t"><div class="t-h">${side === 'home' ? 'Reçoit' : 'Visiteur'}</div>
      <div class="mt-tt">${teamLogo(tm.abbrev, 'tlogo lg')}<div><div class="t-y">${esc(tm.common)}</div><p>Fiche ${esc(tm.record || '—')}${L.streakType ? ` · séquence ${esc(L.streakType)}${L.streak || ''}` : ''}</p>
      ${(L.pastGameResults || []).length ? `<p class="mt-res">${L.pastGameResults.slice(0, 5).map(r => `<span class="${/W/.test(r.gameResult) ? 'w' : /OT/.test(r.gameResult) ? 'o' : 'l'}">${esc(r.gameResult === 'W' ? 'V' : r.gameResult === 'L' ? 'D' : r.gameResult === 'OTL' ? 'DP' : r.gameResult === 'OTW' ? 'VP' : r.gameResult)}<small>${esc(r.opponentAbbrev)}</small></span>`).join('')}</p>` : ''}</div></div></div>`; };
    const row = (lbl, a, b, fmt, better = 'hi', ra, rb) => { if (a == null && b == null) return ''; const aw = better === 'hi' ? a > b : a < b, bw = better === 'hi' ? b > a : b < a;
      return `<tr><td class="nm">${lbl}</td><td class="v ${aw ? 'win' : ''}">${fmt(a)}${ra ? `<small> ${ord(ra)}</small>` : ''}</td><td class="v ${bw ? 'win' : ''}">${fmt(b)}${rb ? `<small> ${ord(rb)}</small>` : ''}</td></tr>`; };
    const pc = x => x == null ? '—' : fr(x * 100, 1) + ' %', two = x => x == null ? '—' : fr(x, 2);
    const A = ts.away || {}, B = ts.home || {};
    const teamCH = Z?.teams?.find(x => x.team === g.away.abbrev), teamOP = Z?.teams?.find(x => x.team === g.home.abbrev);
    const aside = `<aside class="standings"><div class="standings-h"><b>FACE À FACE<i>///</i>${esc(g.away.abbrev)} @ ${esc(g.home.abbrev)}</b><small>cette saison · rang LNH</small></div>
      <table><thead><tr><th></th><th>${esc(g.away.abbrev)}</th><th>${esc(g.home.abbrev)}</th></tr></thead><tbody>
        ${row('Buts pour /m', A.goalsForPerGamePlayed, B.goalsForPerGamePlayed, two, 'hi', A.goalsForPerGamePlayedRank, B.goalsForPerGamePlayedRank)}
        ${row('Buts contre /m', A.goalsAgainstPerGamePlayed, B.goalsAgainstPerGamePlayed, two, 'lo', A.goalsAgainstPerGamePlayedRank, B.goalsAgainstPerGamePlayedRank)}
        ${row('Avantage num.', A.ppPctg, B.ppPctg, pc, 'hi', A.ppPctgRank, B.ppPctgRank)}
        ${row('Désavantage num.', A.pkPctg, B.pkPctg, pc, 'hi', A.pkPctgRank, B.pkPctgRank)}
        ${row('Mises en jeu', A.faceoffWinningPctg, B.faceoffWinningPctg, pc, 'hi', A.faceoffWinningPctgRank, B.faceoffWinningPctgRank)}
        ${teamCH && teamOP ? row('xG% à 5 c. 5', teamCH.xgPct, teamOP.xgPct, x => x == null ? '—' : fr(x) + ' %', 'hi', teamCH.xgPct_rk, teamOP.xgPct_rk) : ''}
        ${teamCH && teamOP ? row('PDO (chance)', teamCH.pdo, teamOP.pdo, x => x == null ? '—' : fr(x), 'hi') : ''}
      </tbody></table><div class="foot">En gras : l’avantage. Stats avancées : ${MP_CREDIT}</div></aside>`;

    // ── Duels des meneurs
    const duelCards = []; let di = 0;
    for (const l of M.leaders || []) { if (!CAT[l.category]) continue;
      const pair = [['away', g.away], ['home', g.home]].map(([side, tm]) => { const x = l[side]; return x ? pcard({ id: x.id, name: x.name, headshot: x.headshot, ab: tm.abbrev, big: x.value ?? '—', role: `${esc(CAT[l.category])} · ${esc(tm.common)}`, i: di++ }) : '<div class="xcol"></div>'; });
      duelCards.push(`<div class="mt-unit"><div class="mt-ul">${esc(CAT[l.category])}</div><div class="xgrid2 mt-ug n2">${pair.join('')}</div></div>`); }

    // ── Gardiens probables
    const gl = M.goalies || {};
    const pickG = (side, lines) => probableGoalie(M, side, lines);
    // anneaux du gardien (% d'arrêts, GSAx) d'après MoneyPuck
    const gRings = x => { const g = (Z?.goalies || []).find(y => Number(y.id) === Number(x.id)); return g ? pcRings({ ...g, id: Number(g.id) }, Z, true) : ''; };
    // Gardien contre gardien : face-à-face en papillon (barres qui partent du centre, le meilleur en couleur)
    const goalieDuel = (A, tA, linesA, B, tB, linesB) => {
      if (!A && !B) return '';
      const side = (x, tm, lines) => { if (!x) return '<div class="gd-p"></div>'; const p = plByNhl[String(x.id)];
        const starter = lines?.goalies?.[0] && lastOf(lines.goalies[0].name) === lastOf(x.name);
        return `<div class="gd-p">${face(p?.image || x.headshot || mugOf(x.id, tm.abbrev), p?.number || '')}
          <span class="gd-team">${teamLogo(tm.abbrev, 'tlogo')}${esc(tm.common)}</span>
          <${p ? `a href="${plHref(p)}"` : 'span'} class="gd-n">${esc(p?.name || x.name)}</${p ? 'a' : 'span'}>
          <span class="gd-s">${starter ? 'Partant probable' : 'Gardien n° 1'} · ${esc(x.record || '—')}</span>${gRings(x)}</div>`; };
      const a = A && lgG(A.id), b = B && lgG(B.id);
      const rows = [
        ['% d’arrêts', A?.svPct, B?.svPct, v => v == null ? '—' : fr(v * 100, 1) + ' %', 'hi', [.86, .94]],
        ['Moyenne de buts', A?.gaa, B?.gaa, v => v == null ? '—' : fr(v, 2), 'lo', [1.5, 4.5]],
        ['Buts sauvés vs attendus (GSAx)', a?.gsax, b?.gsax, v => v == null ? '—' : sgn(v), 'hi', [-6, 6]],
        ['Matchs joués', A?.gp, B?.gp, v => v == null ? '—' : String(v), 'hi', [0, Math.max(5, A?.gp || 0, B?.gp || 0)]],
      ].filter(r => r[1] != null || r[2] != null);
      const w = (v, [lo, hi], dir) => { if (v == null) return 0; let r = (v - lo) / (hi - lo); if (dir === 'lo') r = 1 - r; return Math.round(Math.max(.06, Math.min(1, r)) * 100); };
      return `<div class="gd rv">${side(A, tA, linesA)}<div class="gd-mid">${rows.map(([lbl, x, y, f, dir, rg]) => { const xw = (dir === 'hi' ? x > y : x < y), yw = (dir === 'hi' ? y > x : y < x);
          return `<div class="gd-row"><span class="gd-v ${xw ? 'win' : ''}">${f(x)}</span><span class="gd-bar l ${xw ? 'win' : ''}"><i style="--w:${w(x, rg, dir)}%"></i></span><span class="gd-lbl">${lbl}</span><span class="gd-bar r ${yw ? 'win' : ''}"><i style="--w:${w(y, rg, dir)}%"></i></span><span class="gd-v ${yw ? 'win' : ''}">${f(y)}</span></div>`; }).join('')}
        <p class="gd-why">GSAx : buts qu’un gardien moyen aurait accordés sur les mêmes tirs, moins ceux qu’il a accordés. En couleur : l’avantage.</p></div>${side(B, tB, linesB)}</div>`;
    };

    // ── Alignements (DailyFaceoff) : une rangée par trio / paire, cartes façon page Joueurs
    const lineup = (L, tm, legend = true) => uLineup(L, tm.abbrev, Z, legend);

    // ── À surveiller chez l'adversaire : ses meneurs (+ meilleurs Game Score de son équipe)
    const watch = [], seen = new Set();
    for (const l of M.leaders || []) { const x = l[opSide]; if (!x) continue; const w = watch.find(y => y.id === x.id);
      const tag = `${x.value} ${CAT[l.category] ? CAT[l.category].toLowerCase() : ''}`;
      if (w) w.tags.push(tag); else { seen.add(x.id); watch.push({ ...x, tags: [tag], lead: true }); } }
    if (watch.length < 4 && Z?.league) for (const [id, r] of Object.entries(Z.league).filter(([, r]) => r[0] === op.abbrev && r[8] !== 'G').sort((a, b) => (b[1][2] || 0) - (a[1][2] || 0))) { if (watch.length >= 4) break; if (!seen.has(Number(id))) { seen.add(Number(id)); watch.push({ id: Number(id), name: r[7], tags: [`${r[6] ?? 0} points`] }); } }

    const chG = pickG(chSide, M.lines), opG = pickG(opSide, M.oppLines);
    // l'équipe qui reçoit est toujours nommée en dernier (visiteur @ hôte)
    const teasers = teamTeaser(g.away, 'away') + teamTeaser(g.home, 'home');
    app.innerHTML = `${sband(`${esc(g.away.abbrev)} @ ${esc(g.home.abbrev)}`, { sub: `${esc(t.day)} · ${esc(t.time)}${g.venue ? ` · ${esc(g.venue)}` : ''}${g.tv?.length ? ` · ${esc(g.tv.join(', '))}` : ''}`, teasers, right: aside })}

      <div class="section-title"><i>À surveiller</i> chez les ${esc(op.common)}</div>
      ${watch.length ? `<div class="mt-lu"><div class="mt-unit rv"><div class="xgrid2 mt-ug n4">${watch.slice(0, 4).map((x, i) => { const pl = [...(M.oppLines?.forwards || []).flat(), ...(M.oppLines?.defense || []).flat()].find(y => lastOf(y.name) === lastOf(x.name));
          const auto = autoTags(stOfId(Z, op.abbrev, x.id, x.name), Z, op.abbrev).filter(t => t.k === 'up' || t.k === 'dn');
          return pcard({ id: x.id, name: x.name, headshot: x.headshot, ab: op.abbrev, big: uBig(pl?.jersey, pl?.number ?? x.number ?? ''),
            role: '', tags: [...(x.lead ? [{ t: 'Meneur', k: 'lead' }] : []), ...x.tags, ...auto].slice(0, 4), i }); }).join('')}</div></div></div>` : ''}

      ${chG || opG ? `<div class="section-title"><i>Gardien</i> contre <i>gardien</i></div><div class="mt-lu">${g.focusIsHome ? goalieDuel(opG, op, M.oppLines, chG, ch, M.lines) : goalieDuel(chG, ch, M.lines, opG, op, M.oppLines)}</div>` : ''}

      ${M.lines ? `<div class="section-title"><i>L’alignement</i> du CH</div><div class="mt-lu">${lineup(M.lines, ch)}</div>` : ''}

      ${M.oppLines ? `<div class="section-title"><i>L’alignement</i> des ${esc(op.common)}</div><div class="mt-lu">${lineup(M.oppLines, op, false)}</div>` : '<p class="sx-why">L’alignement de l’adversaire arrive au prochain cycle de npm start.</p>'}

      <p class="sx-credit">Match, meneurs et stats d’équipe : LNH. Alignements : <a href="https://www.dailyfaceoff.com" target="_blank" rel="noopener">DailyFaceoff</a>. Stats avancées : ${MP_CREDIT}.</p>`;
    reveal();
  }

  function notFound() {
    app.innerHTML = '<div class="notice">Page introuvable. <a href="#/" style="color:var(--red);font-weight:700">Retour à la une</a></div>';
  }

  // ─────────── Recherche globale ───────────
  const q = document.getElementById('q'), sr = document.getElementById('sr');
  q.addEventListener('input', () => {
    const t = norm(q.value.trim());
    if (t.length < 2) { sr.classList.remove('open'); return; }
    const ps = D.players.filter(p => norm(p.name).includes(t)).sort((a, b) => b.videoCount - a.videoCount).slice(0, 5);
    const vs = sortedVideos.filter(v => norm(v.title + ' ' + (v.summary?.titre_court || '') + ' ' + (v.summary?.resume || '')).includes(t)).slice(0, 8);
    sr.innerHTML = (ps.length ? `<div class="sr-group">Joueurs</div>` + ps.map(p => `<a class="sr-item" href="${plHref(p)}">${jersey(p)}<div><div class="t">${esc(p.name)}</div><div class="s">${esc(p.team)} · ${p.videoCount} épisodes</div></div></a>`).join('') : '') +
      (vs.length ? `<div class="sr-group">Épisodes</div>` + vs.map(v => `<a class="sr-item" href="${epHref(v)}"><img src="${vthumb(v, 'default')}" alt=""><div><div class="t">${esc(displayTitle(v))}</div><div class="s">${esc(chByKey[v.key].label)}</div></div></a>`).join('') : '') ||
      '<div class="empty" style="padding:16px">Aucun résultat</div>';
    sr.classList.add('open');
  });
  document.addEventListener('click', e => { if (!e.target.closest('.search')) sr.classList.remove('open'); });
  sr.addEventListener('click', () => { sr.classList.remove('open'); q.value = ''; });

  // ─────────── Routeur ───────────
  let statsTried = false;
  function route() {
    document.body.classList.remove('reading'); readbar.style.width = '0';
    const parts = location.hash.replace(/^#\/?/, '').split('/').map(decodeURIComponent);
    const [page, a, b] = parts;
    const nav = page === 'stats' ? 'stats' : page === 'match' ? 'match' : page === 'players' || page === 'player' ? 'players' : page === 'shows' || page === 'show' ? 'shows' : page === 'experts' || page === 'expert' || page === 'chronique' ? 'experts' : page === 'ep' ? '' : 'home';
    document.querySelectorAll('[data-nav]').forEach(el => el.classList.toggle('active', el.dataset.nav === nav));
    // Manchettes : seulement à la une
    // Bandeau des derniers médias : seulement à la une
    const stripBox = document.querySelector('.scorestrip');
    if (stripBox) stripBox.hidden = true; // remplacé par « Le fil des médias » à la une
    // Épisode, joueur, expert : on attend les détails (une fraction de seconde, une seule fois)
    if (!detailsReady && (page === 'ep' || page === 'player' || page === 'expert')) {
      const h = location.hash;
      app.innerHTML = '<div class="loading" style="padding:80px 0;text-align:center">Chargement…</div>';
      loadDetails().then(() => { if (location.hash === h) route(); });
      return;
    }
    if (page === 'stats' || page === 'match') {
      if (!window.TUBEWATCH_STATS && !statsTried) {
        statsTried = true;
        const h = location.hash;
        app.innerHTML = '<div class="loading" style="padding:80px 0;text-align:center">Chargement des stats…</div>';
        const sc = document.createElement('script');
        sc.src = 'data-stats.js?v=' + encodeURIComponent(D.generatedAt || '');
        sc.onload = () => { if (location.hash === h) route(); };
        sc.onerror = () => { if (location.hash === h) route(); };
        document.head.appendChild(sc);
        return;
      }
      if (page === 'match') viewMatch();
      else if (window.TUBEWATCH_STATS) viewStats();
      else app.innerHTML = '<div class="notice">Les stats avancées ne sont pas encore disponibles (npm start les télécharge au prochain cycle).</div>';
      window.scrollTo(0, 0); return;
    }
    if (page === 'shows') viewShows();
    else if (page === 'show') viewShow(a);
    else if (page === 'ep') viewEpisode(a, b);
    else if (page === 'experts') viewExperts();
    else if (page === 'expert') viewExpert(a);
    else if (page === 'chronique') viewChronique(a);
    else if (page === 'players') viewPlayers();
    else if (page === 'player') viewPlayer(a);
    else viewHome();
    window.scrollTo(0, 0);
    if (page !== 'ep') reveal();
  }
  window.addEventListener('hashchange', route);
  route();
  // précharge les détails quand la page est calme (navigation instantanée ensuite)
  setTimeout(() => (window.requestIdleCallback || setTimeout)(() => loadDetails()), 2500);
})();
</script>
</body>
</html>
